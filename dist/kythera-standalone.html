/* KYTHERA · MANDAT · Vorfälle, Verantwortungsregister, Druck, Vertrauen des Kuratoriums, Grundsätze */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data;
  const SIM = KY.sim;
  const I = (KY.incidents = {});

  const strict = () => (SIM.S && SIM.TRUSTEE[SIM.contract('trustee')] || { strict: 1 }).strict;
  const PHYSICAL = k => !(D.INCIDENTS[k] && D.INCIDENTS[k].noHarm);

  /* Vertrauen des Kuratoriums ändern (mit Schwellen-Briefen) */
  SIM.g_trust = function (dv) {
    const g = SIM.S.g;
    const before = g.trust;
    g.trust = U.clamp(g.trust + dv, 0, 100);
    [40, 25, 12].forEach(th => { if (before >= th && g.trust < th) KY.bus.emit('trustlow', th); });
  };

  I.byId = id => SIM.S.incidents.find(i => i.id === id);
  I.open = () => SIM.S.incidents.filter(i => i.status === 'offen');

  /* Kosten einer angemessenen Entschädigung (Mrd. ¤) */
  I.compCost = function (inc) {
    const n = inc.n >= 0 ? SIM.S.nations[inc.n] : { dev: 0.5 };
    const k = 0.35 + n.dev * 1.3;
    return Math.max(0.002, (inc.dead * 0.0016 + inc.injured * 0.00018 + inc.displaced * 0.000025) * k + inc.dmg * 0.15);
  };
  I.respCost = function (inc, rid) {
    const p = KY.projects.byId(inc.proj);
    switch (rid) {
      case 'comp': return Math.max(0, I.compCost(inc) - (inc.fundPaid || 0));
      case 'inquiry': return 0.02 + inc.sev * 0.015;
      case 'retrofit': return p && !p.retrofit ? Math.max(0.01, p.cost * 0.08) : 0;
      case 'statement': return 0.004;
      default: return 0;
    }
  };
  I.respAvailable = function (inc, rid) {
    const p = KY.projects.byId(inc.proj);
    const active = p && KY.projects.ACTIVE[p.phase];
    if (rid === 'retrofit') return active && !p.retrofit && PHYSICAL(inc.rid);
    if (rid === 'pause') return active && p.phase !== 'pausiert' && p.phase !== 'antrag';
    if (rid === 'shutdown') return active;
    if (rid === 'comp') return PHYSICAL(inc.rid) && (inc.dead + inc.injured + inc.displaced > 0);
    return true;
  };

  /* ---------- Neuer Vorfall ---------- */
  I.create = function (p, r, extra) {
    const S = SIM.S, A = D.ACT[p.act], T = D.INCIDENTS[r.id];
    if (!T) return null;
    extra = extra || {};
    const safety = p.o.safety || 'std';
    let sev = r.sev[0] + Math.floor(Math.pow(Math.random(), 1.8) * (r.sev[1] - r.sev[0] + 1));
    if (safety === 'max' && Math.random() < 0.5) sev = Math.max(r.sev[0], sev - 1);
    if (safety === 'min' && Math.random() < 0.3) sev = Math.min(r.sev[1], sev + 1);
    if (p.retrofit && Math.random() < 0.4) sev = Math.max(r.sev[0], sev - 1);
    sev = U.clamp(sev, 1, 5);
    const n = p.n >= 0 ? S.nations[p.n] : null;
    const devK = n ? 1.45 - n.dev * 0.7 : 1;
    const safK = safety === 'max' ? 0.7 : safety === 'min' ? 1.3 : 1;
    let popK = 1;
    if (T.scalePop) {
      const down = p.c >= 0 ? S.cities[p.c].pop : 1;
      popK = U.clamp(0.45 + down / 2.5, 0.5, 3);
    }
    const dead = PHYSICAL(r.id) ? Math.round(SIM.rangeRoll(T.dead[sev - 1], 1.5) * devK * safK * popK) : 0;
    const injured = PHYSICAL(r.id) ? Math.round(SIM.rangeRoll(T.inj[sev - 1], 1.3) * devK * popK) : 0;
    const displaced = T.disp ? Math.round(SIM.rangeRoll(T.disp[sev - 1], 1.3) * popK) : 0;
    const dmg = extra.loss !== undefined ? extra.loss : p.cost * T.dmg[sev - 1];
    const vars = SIM.vars({ n: p.n, c: p.c, c2: p.c2, extra: { proj: A.name, mag: U.n(3.2 + sev * 0.45, 1) } });
    const descIdx = T.nuclear ? Math.min(T.d.length - 1, Math.max(0, sev - 2)) : Math.floor(Math.random() * T.d.length);
    const inc = {
      id: 'i' + (++S.seq.inc), day: S.day, proj: p.id, act: p.act, projName: p.name, n: p.n, c: p.c, front: p.front, rid: r.id, kind: T.kind, name: T.n, icon: T.icon,
      sev, title: U.fill(T.d[descIdx], vars), cause: U.pick(T.cause), causeKnown: false, dead, deadNow: sev >= 3 ? Math.round(dead * 0.3) : dead,
      injured, displaced, dmg, heat: 0, status: 'offen', deadline: S.day + (+SIM.contract('deadline') || 7), responses: [], decidedAt: -1,
      versaeumt: false, fundPaid: 0, comp: 0, noHarm: !PHYSICAL(r.id), lon: p.lon, lat: p.lat, phase: p.phase, safety, lossFin: extra.loss || 0,
    };
    inc.heat = U.clamp((inc.noHarm ? sev * 4 : sev * sev * 3.4 + Math.sqrt(dead) * 1.7 + (displaced > 10000 ? 8 : 0)) * (T.nuclear ? 1.5 : 1) * Math.pow(Math.max(1, p.vis) / 5, 0.3), 2, 160);
    S.incidents.unshift(inc);
    p.incidents.push(inc.id);
    // Bilanz der Verantwortung
    S.g.deaths += inc.deadNow; S.g.injured += injured; S.g.displaced += displaced;
    // Folgen für das Vorhaben
    const T2 = T.delay[sev - 1];
    if (p.phase === 'bau' && T2 > 0) { p.prog = Math.max(0, p.prog - T2 / p.days); }
    if (!inc.noHarm || r.id === 'kostenexplosion') p.cost += r.id === 'kostenexplosion' ? dmg : dmg * 0.5;
    const destroys = (r.id === 'dammbruch' && sev >= 3) || (r.id === 'stoerfall' && sev >= 4) || (r.id === 'einsturz' && sev >= 4) || (r.id === 'deichbruch' && sev >= 4) || (r.id === 'hafenbrand' && sev >= 5);
    if (destroys && p.phase === 'betrieb') { KY.projects.shutdown(p, 'zerstört'); p.destroyed = true; }
    if (p.c >= 0 && !inc.noHarm) {
      const c = S.cities[p.c];
      c.sent = U.clamp(c.sent - inc.heat * 0.45, -100, 100);
      c.dmg = U.clamp(c.dmg + sev * 0.04 + (displaced > 50000 ? 0.2 : 0), 0, 1);
    }
    if (n) {
      SIM.opImpulse(p.n, [-1, -1, -1.1, -1, -1], inc.heat * 0.07, { aware: inc.heat * 0.15 });
      if (!inc.noHarm) { SIM.shock(p.n, 'happy', -(sev - 1) * 1.4, 120); SIM.shock(p.n, 'unrest', sev * 1.2, 120); }
      if (T.env) SIM.shock(p.n, 'env', -sev * 2.4, 720);
      if (dead > 0) n.pop = Math.max(0.01, n.pop - dead / 1e6);
      n.fear[p.act] = Math.min(2, (n.fear[p.act] || 0) + sev * 0.09 + (dead > 20 ? 0.2 : 0));
    }
    S.g.fear[p.act] = Math.min(1.5, (S.g.fear[p.act] || 0) + sev * 0.04 + (dead > 100 ? 0.25 : 0));
    // Nachbarstaaten bei Strahlung oder Dammbruch flussabwärts
    if (r.id === 'stoerfall' && sev >= 4 && p.n >= 0) SIM.W.nations[p.n].neighbors.forEach(b => { SIM.relAdd(p.n, b, -10, 'stoerfall'); SIM.opImpulse(b, -0.6, sev * 1.2, { aware: 6 }); });
    if (r.id === 'dammbruch' && p.down >= 0) SIM.relAdd(p.n, p.down, -15, 'dammbruch');
    // Vertrauen
    SIM.g_trust(-(inc.noHarm ? sev * 0.7 : sev * 1.5 + Math.sqrt(dead) * 0.22) * strict());
    // Spuren: große Vorfälle ziehen Recherchen nach sich
    KY.cover.onIncident(inc, T);
    // Entschädigungsfonds zahlt sofort Soforthilfe
    if (!inc.noHarm && S.fin.fund > 0 && (dead + injured + displaced) > 0) {
      const want = I.compCost(inc) * 0.5;
      const pay = Math.min(S.fin.fund, want);
      S.fin.fund -= pay; inc.fundPaid = pay; S.fin.y.comp += pay;
      inc.heat *= +SIM.contract('fund') >= 3 ? 0.62 : 0.8;
    }
    // Medien
    const key = inc.noHarm ? null : dead >= 40 || sev >= 4 ? 'incident_major' : dead > 0 ? 'incident_deaths' : 'incident_minor';
    const mv = { n: p.n, c: p.c, extra: { proj: A.name, dead: U.n(inc.deadNow), front: KY.projects.frontName(p) } };
    if (key) KY.media.story(key, mv, { tone: -0.8, heat: inc.heat, about: true, proj: p.id, inc: inc.id, sub: inc.title });
    else KY.media.story(null, mv, { h: inc.title, tone: -0.35, heat: inc.heat, about: true, proj: p.id, inc: inc.id, key: 'incident_fin' });
    SIM.chron('vorfall', inc.name + ': ' + inc.title + (dead ? ' ' + U.n(inc.deadNow) + ' Tote.' : ''), { inc: inc.id, proj: p.id });
    SIM.msg('haddad', (sev >= 3 ? 'DRINGEND · ' : '') + inc.name + ' · ' + p.name,
      [inc.title, dead ? 'Erste Meldungen sprechen von ' + U.n(inc.deadNow) + ' Toten und ' + U.n(injured) + ' Verletzten.' : injured ? U.n(injured) + ' Menschen wurden verletzt.' : 'Nach ersten Erkenntnissen gibt es keine Verletzten.',
        'Gemäß Krisenprotokoll brauche ich Ihre Entscheidung bis ' + U.dateStr(inc.deadline, true) + '.'],
      { kind: 'crisis', prio: sev, acts: [{ l: 'Krisenstab öffnen', a: 'inc', p: { id: inc.id } }], ref: { inc: inc.id } });
    KY.bus.emit('incident', inc);
    return inc;
  };

  /* ---------- Entscheidung des Krisenstabs ---------- */
  I.respond = function (incId, ids) {
    const S = SIM.S, inc = I.byId(incId);
    if (!inc || inc.status !== 'offen') return { ok: false, err: 'Vorfall bereits entschieden.' };
    ids = ids.filter(id => I.respAvailable(inc, id) || id === 'silence' || id === 'statement' || id === 'inquiry');
    if (!ids.length) ids = ['silence'];
    if (ids.indexOf('silence') >= 0 && ids.length > 1) ids = ids.filter(i => i !== 'silence');
    const cost = U.sum(ids.map(id => I.respCost(inc, id)));
    if (cost > KY.finance.avail()) return { ok: false, err: 'Nicht genügend liquide Mittel (' + U.money(cost) + ').' };
    const p = KY.projects.byId(inc.proj);
    const late = S.day > inc.deadline;
    const mv = { n: inc.n, c: inc.c, extra: { proj: D.ACT[inc.act].name, front: p ? KY.projects.frontName(p) : 'Betreiber' } };
    const strictK = strict();
    let heatK = 1;
    ids.forEach(id => {
      const R = D.RESPONSES.find(r => r.id === id);
      const c = I.respCost(inc, id);
      if (c > 0) KY.finance.spend(c, R.n + ' · ' + inc.projName);
      SIM.g_trust(R.trust * (late ? 0.5 : 1) * (R.trust < 0 ? strictK : 1));
      if (inc.n >= 0) SIM.opImpulse(inc.n, 1, R.op * (0.4 + inc.sev * 0.25));
      if (inc.c >= 0) S.cities[inc.c].sent = U.clamp(S.cities[inc.c].sent + R.op * 1.6, -100, 100);
      if (R.trace && p) KY.cover.addTrace(p.front, R.trace);
      switch (id) {
        case 'comp': inc.comp = c; S.fin.y.comp += c; heatK *= 0.55; KY.media.story('followup_comp', mv, { tone: 0.3, heat: inc.heat * 0.4, about: true, proj: inc.proj }); break;
        case 'inquiry': heatK *= 0.72; inc.inquiryAt = S.day + 60 + Math.floor(Math.random() * 60); KY.media.story('followup_inquiry', mv, { tone: 0.15, heat: inc.heat * 0.3, about: true, proj: inc.proj }); break;
        case 'retrofit': if (p) KY.projects.retrofit(p); heatK *= 0.8; KY.media.story('followup_retrofit', mv, { tone: 0.15, heat: inc.heat * 0.25, about: true, proj: inc.proj }); break;
        case 'pause': if (p) KY.projects.pause(p, 90); heatK *= 0.75; break;
        case 'shutdown': if (p) KY.projects.shutdown(p, 'nach Vorfall'); heatK *= 0.45; KY.media.story('followup_shutdown', mv, { tone: 0.2, heat: inc.heat * 0.35, about: true, proj: inc.proj }); break;
        case 'statement': {
          const face = S.g.face;
          heatK *= face ? 0.72 : 0.86;
          if (face) face.cred = Math.max(0, face.cred - inc.sev * 2);
          KY.media.story('followup_apology', mv, { tone: 0.15, heat: inc.heat * 0.3, about: true, proj: inc.proj });
          break;
        }
        case 'silence': inc.silent = true; inc.silentNews = S.day + 4; break;
      }
    });
    inc.heat *= heatK;
    inc.responses = ids; inc.status = 'bearbeitet'; inc.decidedAt = S.day; inc.late = late;
    SIM.chron('verantwortung', 'Entscheidung zu „' + inc.name + ' · ' + inc.projName + '“: ' + ids.map(id => D.RESPONSES.find(r => r.id === id).n).join(', ') + (late ? ' (nach Fristablauf)' : '') + '.', { inc: inc.id });
    KY.bus.emit('responded', inc);
    return { ok: true, cost };
  };

  /* ---------- Grundsätze ---------- */
  I.principleBreak = function (b, p) {
    const S = SIM.S;
    const e = { id: b.id, n: b.n, day: S.day, proj: p ? p.id : null, projName: p ? p.name : '' };
    S.g.breaks.push(e);
    SIM.g_trust(-7 * strict());
    SIM.chron('grundsatz', 'Grundsatzbruch: „' + b.n + '“' + (p ? ' durch ' + p.name : '') + '.', { proj: p ? p.id : null });
    SIM.msg('kuratorium', 'Grundsatzbruch · ' + b.n, ['Das Kuratorium hat zur Kenntnis genommen, dass Sie gegen Ihren eigenen Grundsatz „' + b.n + '“ gehandelt haben' + (p ? ' (' + p.name + ')' : '') + '.', 'Ihre Grundsätze waren freiwillig. Gerade deshalb wiegt ihr Bruch schwer. Der Vorgang wurde gemäß Grundsatzerklärung KY-M/2027/08 protokolliert.'], { kind: 'letter' });
    if (strict() > 1.2) SIM.msg('trustee', 'Bedenken der Treuhand', ['Wir führen Ihre Weisung aus. Erlauben Sie mir dennoch den Hinweis, dass unser Haus Grundsatzbrüche nicht leichtnimmt. Bei Wiederholung behalten wir uns vor, einzelne Zahlungen bis zu 30 Tage zurückzuhalten.'], { kind: 'warn' });
    const f = p ? S.fronts.find(z => z.id === p.front) : null;
    if (f && (f.trace > 55 || f.exposed || S.g.exposed)) KY.media.story('principle_break', { n: p.n, extra: { proj: D.ACT[p.act].name } }, { tone: -0.6, heat: 30, about: true, proj: p.id });
    KY.bus.emit('break', e);
  };

  /* ---------- Täglich: Opferzahlen, Fristen, Druck ---------- */
  I.daily = function () {
    const S = SIM.S, g = S.g;
    let P = 0;
    for (const inc of S.incidents) {
      if (inc.deadNow < inc.dead) {
        const add = Math.max(1, Math.round((inc.dead - inc.deadNow) * 0.42));
        const before = inc.deadNow;
        inc.deadNow = Math.min(inc.dead, inc.deadNow + add);
        g.deaths += inc.deadNow - before;
        if (inc.deadNow === inc.dead && inc.dead >= 10 && inc.dead > before * 1.25) {
          const A = D.ACT[inc.act];
          KY.media.story('incident_deaths', { n: inc.n, c: inc.c, extra: { proj: A.name, dead: U.n(inc.dead) } }, { tone: -0.7, heat: inc.heat * 0.6, about: true, proj: inc.proj, inc: inc.id });
        }
      }
      if (inc.status === 'offen') {
        const over = S.day > inc.deadline;
        if (S.day === inc.deadline - 1 && !inc.reminded) {
          inc.reminded = true;
          SIM.msg('haddad', 'Frist läuft ab · ' + inc.projName, ['Morgen endet die Frist für Ihre Entscheidung zum Vorfall „' + inc.name + '“. Die Öffentlichkeit wartet auf eine Reaktion.'], { kind: 'crisis', acts: [{ l: 'Krisenstab öffnen', a: 'inc', p: { id: inc.id } }], ref: { inc: inc.id } });
        }
        if (over && !inc.versaeumt) {
          inc.versaeumt = true; g.versaeumt++;
          SIM.g_trust(-7 * strict());
          inc.heat = Math.min(180, inc.heat * 1.35);
          const p = KY.projects.byId(inc.proj);
          KY.media.story('followup_silence', { n: inc.n, c: inc.c, extra: { proj: D.ACT[inc.act].name, front: p ? KY.projects.frontName(p) : 'Betreiber' } }, { tone: -0.6, heat: inc.heat * 0.5, about: true, proj: inc.proj });
          SIM.chron('verantwortung', 'Versäumnis: Frist zum Vorfall „' + inc.name + ' · ' + inc.projName + '“ verstrichen.', { inc: inc.id });
          SIM.msg('kuratorium', 'Versäumnis gemäß Krisenprotokoll', ['Die Frist zur Entscheidung über den Vorfall „' + inc.name + '“ (' + inc.projName + ') ist ohne Entscheidung verstrichen.', 'Das Kuratorium erinnert an Ihre Verpflichtung aus KY-M/2027/06. Das Versäumnis wurde im Verantwortungsregister vermerkt.'], { kind: 'letter', ref: { inc: inc.id } });
        }
        if (inc.heat > 20) inc.heat *= 1.002;
        P += inc.heat * (over ? 1.5 : 1);
      } else {
        inc.heat *= inc.silent ? 0.994 : 0.985;
        P += inc.heat * (inc.silent ? 0.7 : 0.35);
        if (inc.silent && inc.silentNews && S.day >= inc.silentNews) {
          inc.silentNews = 0;
          const p = KY.projects.byId(inc.proj);
          if (inc.sev >= 2) KY.media.story('followup_silence', { n: inc.n, c: inc.c, extra: { proj: D.ACT[inc.act].name, front: p ? KY.projects.frontName(p) : 'Betreiber' } }, { tone: -0.5, heat: inc.heat * 0.4, about: true, proj: inc.proj });
          if (inc.n >= 0) SIM.opImpulse(inc.n, -1, inc.sev * 0.9);
        }
        if (inc.inquiryAt && S.day >= inc.inquiryAt) inquiryResult(inc);
      }
    }
    // Proteste gegen eigene Vorhaben
    S.cities.forEach(c => { if (c.protest) P += (c.protest.stage + 1) * (c.protest.stage + 1) * 1.6; });
    // Medienklima, Vertrauen, Enttarnung, Grundsatzbrüche
    g.mediaNeg = (g.mediaNeg || 0) * 0.97;
    P += g.mediaNeg * 0.6;
    P += (100 - g.trust) * 0.14;
    if (g.exposure > 60) P += (g.exposure - 60) * 0.4;
    P += g.breaks.filter(b => S.day - b.day < 180).length * 4;
    const target = U.clamp(P * 0.55, 0, 100);
    g.pressure += (target - g.pressure) * 0.08;
    if (g.pressure > 78) { if (g.highSince < 0) g.highSince = S.day; } else g.highSince = -1;
    if (S.day - g.lastHearing > 240 && ((g.highSince >= 0 && S.day - g.highSince > 20) || g.trust < 25) && !g.hearing) I.callHearing();
    if (g.auflagen && S.day >= g.auflagen.until) {
      SIM.chron('kuratorium', 'Die Auflagen des Kuratoriums sind ausgelaufen.', null);
      SIM.msg('kuratorium', 'Auflagen aufgehoben', ['Die befristeten Auflagen sind ausgelaufen. Das Kuratorium vertraut darauf, dass Sie die Lehren daraus beherzigen.'], { kind: 'letter' });
      g.auflagen = null;
    }
  };

  function inquiryResult(inc) {
    const S = SIM.S;
    inc.inquiryAt = 0; inc.causeKnown = true;
    const p = KY.projects.byId(inc.proj);
    let verdict = 'Die Untersuchung nennt als Ursache ' + inc.cause + '.';
    if (inc.safety === 'min') { verdict += ' Die Kommission kritisiert ausdrücklich, dass beim Sicherheitsstandard gespart wurde.'; SIM.g_trust(-5 * strict()); if (inc.n >= 0) SIM.opImpulse(inc.n, -1, 3); }
    else if (inc.safety === 'max') { verdict += ' Die Kommission bescheinigt dem Betreiber vorbildliche Sicherheitsstandards.'; SIM.g_trust(3); }
    inc.verdict = verdict;
    SIM.chron('verantwortung', 'Untersuchungsbericht zu „' + inc.name + ' · ' + inc.projName + '“: ' + verdict, { inc: inc.id });
    SIM.msg('haddad', 'Untersuchungsbericht liegt vor · ' + inc.projName, [verdict], { kind: 'info', ref: { inc: inc.id } });
    if (p) KY.cover.addTrace(p.front, 4);
  }

  /* ---------- Anhörung vor dem Kuratorium ---------- */
  I.callHearing = function () {
    const S = SIM.S, g = S.g;
    const qs = [];
    const deadSum = g.deaths, lives = Math.round(g.lives);
    qs.push({
      q: 'In Ihrer Verantwortung sind bisher ' + U.n(deadSum) + ' Menschen ums Leben gekommen. Nach unseren Schätzungen haben Ihre Vorhaben ' + U.n(lives) + ' Leben gerettet. Wie bewerten Sie diese Bilanz?',
      a: [
        { t: 'Jedes einzelne Opfer ist eines zu viel. Ich lasse alle laufenden Anlagen auf den höchsten Standard prüfen.', trust: 7, fx: 'safety' },
        { t: 'Die Bilanz ist eindeutig positiv. Großprojekte bergen Risiken, das war allen bewusst.', trust: lives > deadSum * 20 ? 3 : -5 },
        { t: 'Die Partner vor Ort haben versagt. Wir ziehen Konsequenzen bei der Auswahl.', trust: -3, fx: 'access' },
      ],
    });
    const open = I.open().length;
    qs.push({
      q: open ? 'Es sind ' + open + ' Vorfälle ohne Entscheidung. Warum lassen Sie die Betroffenen warten?' : 'Die Öffentlichkeit fühlt sich von Ihnen nicht ausreichend informiert. Wie wollen Sie damit umgehen?',
      a: [
        { t: 'Ich werde jede offene Entscheidung binnen einer Woche treffen und Entschädigungen großzügig bemessen.', trust: 5, fx: 'fund' },
        { t: 'Gründlichkeit geht vor Schnelligkeit. Ich entscheide, wenn alle Fakten vorliegen.', trust: open ? -2 : 1 },
        { t: 'Das Mandat gibt mir freies Ermessen. Ich bitte um Ihr Vertrauen.', trust: -4 },
      ],
    });
    qs.push({
      q: 'Journalisten kommen Ihren Strukturen näher. Was geschieht, wenn Ihre Rolle bekannt wird?',
      a: [
        { t: 'Dann stehe ich über das öffentliche Gesicht zu jedem Vorhaben. Ich habe nichts zu verbergen außer meinem Namen.', trust: 4 },
        { t: 'Das wird nicht geschehen. Ich verstärke die Tarnung.', trust: -1, fx: 'trace' },
        { t: 'Ich würde das Mandat vorübergehend ruhen lassen.', trust: 1 },
      ],
    });
    g.hearing = { day: S.day, qs, answers: [] };
    g.lastHearing = S.day;
    SIM.chron('kuratorium', 'Das Kuratorium lädt zu einer Anhörung.', null);
    SIM.msg('kuratorium', 'Einladung zur Anhörung', ['Angesichts der jüngsten Entwicklungen bittet das Kuratorium Sie zu einer vertraulichen Anhörung. Die Sitzung findet über den verschlüsselten Kanal statt.', 'Bitte bereiten Sie sich auf Fragen zu Ihrer Verantwortung, zu offenen Vorfällen und zur Geheimhaltung vor.'], { kind: 'letter', prio: 3, acts: [{ l: 'Zur Anhörung', a: 'hearing', p: {} }] });
    KY.bus.emit('hearing', g.hearing);
  };
  I.answerHearing = function (answers) {
    const S = SIM.S, g = S.g, H = g.hearing;
    if (!H) return;
    let dt = 0;
    answers.forEach((ai, qi) => {
      const a = H.qs[qi].a[ai];
      dt += a.trust;
      if (a.fx === 'safety') { g.auflagen = { kind: 'safety', until: S.day + 180, self: true }; }
      if (a.fx === 'access') S.nations.forEach(n => { n.access *= 0.94; });
      if (a.fx === 'trace') S.fronts.forEach(f => { f.trace = Math.max(0, f.trace - 4); });
    });
    SIM.g_trust(dt);
    g.hearings.push({ day: H.day, answers, dt });
    g.hearing = null;
    SIM.chron('kuratorium', 'Anhörung vor dem Kuratorium beendet (Vertrauen ' + U.sgn(dt, 0) + ').', null);
    SIM.msg('kuratorium', 'Ergebnis der Anhörung', [dt >= 6 ? 'Das Kuratorium dankt Ihnen für Ihre offenen Worte. Wir sehen, dass Sie die Last dieses Mandats ernst nehmen.' : dt >= 0 ? 'Das Kuratorium hat Ihre Antworten zur Kenntnis genommen. Wir werden die Entwicklung aufmerksam verfolgen.' : 'Ihre Antworten haben das Kuratorium nicht überzeugt. Wir behalten uns weitere Schritte gemäß Mandatsvertrag vor.'].concat(g.auflagen && g.auflagen.self ? ['Ihre Selbstverpflichtung zum höchsten Sicherheitsstandard gilt für 180 Tage.'] : []), { kind: 'letter' });
  };

  KY.bus.on('trustlow', th => {
    const S = SIM.S;
    if (!S) return;
    if (th === 40) SIM.msg('kuratorium', 'Sorge des Kuratoriums', ['Das Vertrauen des Kuratoriums in Ihre Mandatsführung hat spürbar gelitten.', 'Wir bitten Sie, die Folgen Ihrer Entscheidungen sorgfältiger abzuwägen und offene Vorfälle zeitnah zu entscheiden.'], { kind: 'letter' });
    if (th === 25) SIM.msg('kuratorium', 'Ernste Bedenken', ['Das Kuratorium hat ernste Bedenken. Sollte sich die Lage nicht bessern, werden wir von unserem Recht auf Auflagen Gebrauch machen.'], { kind: 'letter', prio: 2 });
    if (th === 12 && !S.g.auflagen) {
      const kind = Math.random() < 0.5 ? 'safety' : 'freeze';
      S.g.auflagen = { kind, until: S.day + 180 };
      if (kind === 'freeze') KY.finance.freeze(0.15, 180);
      SIM.chron('kuratorium', 'Das Kuratorium verhängt Auflagen: ' + (kind === 'safety' ? 'nur höchster Sicherheitsstandard' : '15 % des Vermögens eingefroren') + ' für 180 Tage.', null);
      SIM.msg('kuratorium', 'Auflagen gemäß Mandatsvertrag', [kind === 'safety' ? 'Mit sofortiger Wirkung dürfen neue Vorhaben für 180 Tage nur noch mit dem höchsten Sicherheitsstandard angeordnet werden.' : 'Mit sofortiger Wirkung werden 15 % des Vermögens für 180 Tage auf einem Sperrkonto verwahrt.', 'Das Mandat bleibt bestehen. Das Kuratorium hofft, dass diese Maßnahme nur vorübergehend nötig ist.'], { kind: 'letter', prio: 3 });
    }
  });

  /* Meilensteine geretteter Leben */
  I.monthly = function () {
    const S = SIM.S, g = S.g;
    [1000, 10000, 100000, 1000000, 10000000].forEach(m => {
      if (g.lives >= m && !g.milestones['l' + m]) {
        g.milestones['l' + m] = S.day;
        SIM.g_trust(3);
        if (SIM.worldAware() > 15) KY.media.story('milestone_lives', { extra: { n: U.count(m) } }, { tone: 0.6, heat: 30, about: true, global: true });
        SIM.chron('bilanz', 'Meilenstein: Ihre Vorhaben haben schätzungsweise ' + U.count(m) + ' Menschenleben gerettet.', null);
        SIM.msg('kuratorium', 'Ein Meilenstein', ['Nach unseren Berechnungen haben Ihre Vorhaben inzwischen mehr als ' + U.count(m) + ' Menschen das Leben gerettet.', 'Das Kuratorium möchte Ihnen dafür ausdrücklich danken.'], { kind: 'letter' });
      }
    });
    // Vertrauen erholt sich langsam, Druck zehrt daran
    const target = 62;
    g.trust += (target - g.trust) * 0.02;
    if (g.pressure > 60) SIM.g_trust(-0.6);
    U.push(g.pressHist, Math.round(g.pressure), 240);
    // Angst vor Vorhabentypen verblasst
    for (const k in g.fear) g.fear[k] *= 0.97;
    S.nations.forEach(n => { for (const k in n.fear) n.fear[k] *= 0.975; });
  };
})();


/* ===== js/sim/events.js ===== */
/* KYTHERA · MANDAT · Naturereignisse und Katastrophenhilfe */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data;
  const SIM = KY.sim;
  const E = (KY.events = {});

  E.active = () => SIM.S.events.filter(e => e.phase !== 'vorbei');
  E.byId = id => SIM.S.events.find(e => e.id === id);
  const SCALE = 0.8;

  /* Gebirgsnähe je Stadt (einmalig) */
  let mtn = null;
  function mountains() {
    if (mtn) return mtn;
    const W = SIM.W;
    mtn = W.cities.map(c => {
      let m = 0;
      for (let dj = -4; dj <= 4; dj++) for (let di = -4; di <= 4; di++) {
        const j = c.j + dj; if (j < 0 || j >= W.GH) continue;
        const k = j * W.GW + ((c.i + di + W.GW) % W.GW);
        m = Math.max(m, W.elev[k]);
      }
      return m;
    });
    return mtn;
  }
  E.reset = function () { mtn = null; };

  function pickCity(f) {
    const W = SIM.W;
    return U.weighted(W.cities, f);
  }
  function pickNation(f) {
    const W = SIM.W;
    return U.weighted(W.nations, f);
  }
  function locate(T) {
    const W = SIM.W, S = SIM.S;
    const M = mountains();
    const temp = c => W.temp[c.cell];
    switch (T.where) {
      case 'fault': return pickCity(c => (M[c.id] > 2200 ? 4 : M[c.id] > 1300 ? 1.6 : M[c.id] > 700 ? 0.4 : 0.03) * Math.sqrt(c.pop + 0.3));
      case 'tropic-coast': return pickCity(c => (c.coastal && Math.abs(c.lat) > 6 && Math.abs(c.lat) < 32 ? 1 : 0) * Math.sqrt(c.pop + 0.2));
      case 'river': return pickCity(c => (c.river ? 1 : 0.05) * Math.sqrt(c.pop + 0.2) * (W.moist[c.cell] + 0.3));
      case 'forest-hot': return pickCity(c => ([5, 10, 8, 4].indexOf(c.biome) >= 0 ? 1 : 0.05) * U.clamp((temp(c) - 4) / 20, 0.05, 1.4) * (1.2 - W.moist[c.cell]));
      case 'ridge': return pickCity(c => (M[c.id] > 2400 ? 1 : 0));
      case 'dry': { const n = pickNation(w => (w.share.desert + w.share.grass * 0.6 + w.share.jungle * 0.1 + 0.05) * (Math.abs(w.lat) < 42 ? 1 : 0.15) * Math.sqrt(w.pop)); return n ? W.cities[n.capital] : null; }
      case 'dense': { const n = pickNation(w => w.pop * (100 - S.nations[w.id].health) / 50); return n ? W.cities[n.capital] : null; }
      case 'hot': { const n = pickNation(w => (Math.abs(w.lat) < 38 ? 1 : 0.05) * Math.sqrt(w.pop)); return n ? W.cities[n.capital] : null; }
      case 'cold': { const n = pickNation(w => (Math.abs(w.lat) > 40 ? 1 : 0) * Math.sqrt(w.pop)); return n ? W.cities[n.capital] : null; }
    }
    return null;
  }

  /* ---------- Neues Ereignis ---------- */
  E.spawn = function (type, opts) {
    const S = SIM.S, W = SIM.W, T = D.EVENTS[type];
    opts = opts || {};
    const city = opts.city !== undefined ? W.cities[opts.city] : locate(T);
    if (!city) return null;
    const nid = city.nation, n = S.nations[nid];
    const sev = opts.sev || 1 + U.weighted([0, 1, 2, 3, 4], i => T.sev[i]);
    let k = 1;
    if (T.devFactor !== false) k *= 1.7 - n.dev * 1.1;
    k *= 1.3 - n.health / 200;
    if (S.g.warn && ['storm', 'fire', 'flood', 'heat', 'drought', 'volcano'].indexOf(type) >= 0) k *= 0.72;
    const tm = { quake: 'quakeMult', storm: 'stormMult', fire: 'stormMult', heat: 'stormMult', epidemic: 'epiMult', drought: 'droughtMult' }[type];
    if (tm) k *= SIM.techFx(tm);
    if (type === 'epidemic') k *= 1 - 0.4 * Math.min(1, (n.fx.epiShield || 0));
    if (type === 'drought') k *= 1 - 0.4 * Math.min(1.5, (n.fx.droughtShield || 0));
    const sc = S.cities[city.id];
    let deich = null;
    if ((type === 'storm' || type === 'flood') && sc.fac.flood) {
      k *= 0.25;
      deich = S.projects.find(p => p.act === 'DEICH' && p.c === city.id && p.phase === 'betrieb');
    }
    if (T.energyFactor) k *= 1.4 - n.energy / 160;
    const dead = Math.round(SIM.rangeRoll(T.dead[sev - 1], 1.25) * k * (opts.k || 1));
    const displaced = Math.round(SIM.rangeRoll(T.displaced[sev - 1], 1.2) * (sc.fac.flood && type === 'storm' ? 0.3 : 1));
    const dur = Math.round(T.dur[0] + Math.random() * (T.dur[1] - T.dur[0]));
    const jitter = T.nationwide ? 0 : 1;
    const ev = {
      id: 'e' + (++S.seq.ev), type, name: T.n + (T.nationwide ? ' in ' + W.nations[nid].short : ' bei ' + city.name), n: nid, c: city.id,
      lon: city.lon + (Math.random() - 0.5) * 2 * jitter, lat: city.lat + (Math.random() - 0.5) * 1.6 * jitter, sev, start: S.day, dur, end: S.day + dur,
      dead, deadNow: 0, displaced, phase: 'akut', helped: {}, saved: 0, radius: T.radius ? T.radius[0] + (T.radius[1] - T.radius[0]) * (sev - 1) / 4 : 0,
      dmg: T.dmg[sev - 1] * (1.4 - n.dev * 0.5), nationwide: !!T.nationwide, relNone: false, breakChecked: false,
      text: U.fill(U.pick(T.text), { city: city.name, nation: W.nations[nid].short, mag: T.mag ? U.n(T.mag[sev - 1] + Math.random() * 0.6, 1) : '', cat: T.cat ? T.cat[sev - 1] : '' }),
    };
    if (T.track) { const a = Math.random() * Math.PI * 2; ev.from = { lon: ev.lon + Math.cos(a) * 9, lat: ev.lat + Math.sin(a) * 4 }; }
    S.events.unshift(ev);
    if (S.events.length > 160) S.events.length = 160;
    // Folgen
    n.gdp *= 1 - ev.dmg / 100;
    SIM.shock(nid, 'happy', -sev * 1.8, 150); SIM.shock(nid, 'unrest', sev * 1.6, 150); SIM.shock(nid, 'infra', -sev * 0.9, 365);
    SIM.shock(nid, 'growth', -ev.dmg * 0.35, 220);
    if (type === 'epidemic') SIM.shock(nid, 'health', -sev * 2.2, ev.dur + 60);
    if (type === 'drought') SIM.shock(nid, 'poverty', sev * 1.6, ev.dur + 200);
    if (!T.nationwide) sc.dmg = U.clamp(sc.dmg + sev * 0.11, 0, 1);
    else SIM.citiesOf(nid).forEach(c => { S.cities[c.id].dmg = U.clamp(S.cities[c.id].dmg + sev * 0.03, 0, 1); });
    n.events++;
    // Medien und Krisenstab
    KY.media.story('disaster', { n: nid, c: city.id, extra: { kind: T.n } }, { tone: -0.5, heat: 12 + sev * sev * 3 + W.nations[nid].pop / 20, ev: ev.id, sub: ev.text });
    SIM.chron('katastrophe', ev.name + ': ' + ev.text, { ev: ev.id });
    if (sev >= 3 || dead > 200) {
      SIM.msg('haddad', T.n + ' · ' + W.nations[nid].short, [ev.text, 'Schätzungen gehen von ' + (dead > 0 ? 'bis zu ' + U.n(dead) + ' Toten' : 'großen Schäden') + (displaced ? ' und ' + U.count(displaced) + ' Obdachlosen' : '') + ' aus. Je früher Hilfe ankommt, desto mehr Menschen können wir retten.'],
        { kind: 'suggest', prio: sev - 1, acts: [{ l: 'Luftbrücke vorbereiten', a: 'act', p: { id: 'LUFTBRUECKE', ev: ev.id } }, { l: 'Zur Karte', a: 'focus', p: { lon: ev.lon, lat: ev.lat } }], ref: { ev: ev.id } });
    }
    // Deich hält oder bricht
    if (deich && sev >= 4 && Math.random() < 0.18 * KY.projects.riskMult(D.ACT.DEICH, deich.o, 'deichbruch', KY.projects.liteCtx(deich))) {
      KY.incidents.create(deich, { id: 'deichbruch', sev: [sev - 2, sev] });
    } else if (deich && sev >= 3) {
      KY.media.story(null, { c: city.id, n: nid }, { h: 'Der neue Deich hält: ' + city.name + ' bleibt verschont', tone: 0.5, heat: 18, about: true, proj: deich.id });
      SIM.opImpulse(nid, D.REACT.DEICH, 2.5, { aware: 4 });
      S.g.lives += dead * 2; deich.acc.lives = (deich.acc.lives || 0) + dead * 2;
    }
    KY.bus.emit('event', ev);
    return ev;
  };

  /* Verlauf: Opfer pro Tag nach Ereignistyp */
  function curve(type, t) {
    if (type === 'quake' || type === 'volcano') return 1 - Math.exp(-t * 2.2);
    if (type === 'storm' || type === 'flood' || type === 'fire' || type === 'heat' || type === 'cold') return 1 - Math.exp(-t * 0.5);
    return U.smooth(Math.min(1, t / 1));
  }

  E.daily = function () {
    const S = SIM.S;
    // Neue Ereignisse
    for (const type in D.EVENTS) {
      const T = D.EVENTS[type];
      if (Math.random() < T.rate / 365 * SCALE) {
        if (S.g.warn && ['storm', 'drought', 'fire', 'heat'].indexOf(type) >= 0 && Math.random() < 0.85) forecast(type);
        else E.spawn(type);
      }
    }
    // Vorhersagen werden Wirklichkeit
    (S.forecasts || []).filter(f => f.day <= S.day).forEach(f => { E.spawn(f.type, { city: f.city, sev: f.sev, k: f.prepared ? 0.75 : 1 }); });
    if (S.forecasts) S.forecasts = S.forecasts.filter(f => f.day > S.day);
    // Weltweite Finanzkrise als seltene Systemkrise
    if (Math.random() < (0.12 + (S.g.crashRisk || 0)) / 365 && (!S.g.lastCrash || S.day - S.g.lastCrash > 900)) KY.nations.globalCrash();
    // Laufende Ereignisse
    for (const ev of S.events) {
      if (ev.phase === 'vorbei') continue;
      const t = (S.day - ev.start) / Math.max(1, ev.dur);
      const want = Math.round(ev.dead * curve(ev.type, t * (ev.type === 'quake' ? 4 : 1.6)));
      if (want > ev.deadNow) {
        const d = want - ev.deadNow;
        ev.deadNow = want;
        const n = S.nations[ev.n];
        n.pop = Math.max(0.01, n.pop - d / 1e6);
        if (ev.deadNow >= 50 && !ev.deathNews) {
          ev.deathNews = true;
          KY.media.story('disaster_deaths', { n: ev.n, extra: { kind: D.EVENTS[ev.type].n, dead: U.n(ev.deadNow) } }, { tone: -0.6, heat: 20 + Math.sqrt(ev.deadNow) * 0.8, ev: ev.id });
        }
      }
      const age = S.day - ev.start;
      if (age === 10 && ev.sev >= 3 && !Object.keys(ev.helped).length && !ev.relNone && Math.random() < 0.6) {
        ev.relNone = true;
        KY.media.story('relief_none', { n: ev.n }, { tone: -0.4, heat: 22, ev: ev.id });
      }
      // Grundsatz „Hilfe bei jeder Katastrophe mit Todesopfern“
      if (!ev.breakChecked && age >= 14) {
        ev.breakChecked = true;
        if (SIM.hasPrinciple('relief') && ev.deadNow >= 25 && ev.sev >= 2 && !Object.keys(ev.helped).length) KY.incidents.principleBreak({ id: 'relief', n: 'Hilfe bei jeder Katastrophe mit Todesopfern' }, null);
      }
      // Epidemien können übergreifen
      if (ev.type === 'epidemic' && age === 30 && !ev.helped.LAZARETT && ev.sev >= 3 && Math.random() < 0.35) {
        const nb = SIM.W.nations[ev.n].neighbors;
        if (nb.length) { const b = U.pick(nb); E.spawn('epidemic', { city: SIM.W.nations[b].capital, sev: ev.sev - 1 }); }
      }
      // Dürre kann zur Missernte führen
      if (ev.type === 'drought' && age === Math.round(ev.dur * 0.7) && ev.sev >= 3 && Math.random() < 0.5 - Math.min(0.4, (S.nations[ev.n].fx.droughtShield || 0) * 0.3)) {
        SIM.shock(ev.n, 'poverty', ev.sev * 2, 300); SIM.shock(ev.n, 'happy', -ev.sev * 1.5, 240);
        KY.media.story('crop_fail', { n: ev.n }, { tone: -0.5, heat: 24, ev: ev.id });
      }
      if (S.day >= ev.end) {
        ev.phase = 'vorbei';
        ev.deadNow = ev.dead;
        SIM.chron('katastrophe', ev.name + ' vorüber: ' + U.n(ev.dead) + ' Tote' + (ev.saved > 0 ? ', durch Ihre Hilfe schätzungsweise ' + U.n(Math.round(ev.saved)) + ' gerettet' : '') + '.', { ev: ev.id });
      }
    }
  };

  function forecast(type) {
    const S = SIM.S, T = D.EVENTS[type];
    const city = locate(T);
    if (!city) return;
    const sev = 1 + U.weighted([0, 1, 2, 3, 4], i => T.sev[i]);
    const lead = 4 + Math.floor(Math.random() * 9);
    S.forecasts = S.forecasts || [];
    const f = { type, city: city.id, sev, day: S.day + lead, made: S.day, prepared: false };
    S.forecasts.push(f);
    if (sev >= 3) SIM.msg('haddad', 'Satellitenwarnung · ' + T.n + ' ' + (T.nationwide ? 'in ' + SIM.nName(city.nation) : 'bei ' + city.name), ['Unser Satellitennetz meldet: Ein Ereignis der Stufe ' + sev + ' trifft voraussichtlich in ' + lead + ' Tagen ein.', 'Die Behörden vor Ort sind gewarnt. Wenn Sie Hilfe vorab bereitstellen, wird sie sofort wirksam.'], { kind: 'suggest', acts: [{ l: 'Hilfe vorab bereitstellen', a: 'prepare', p: { day: f.day, city: f.city } }] });
  }
  E.prepare = function (city, day) {
    const S = SIM.S;
    const f = (S.forecasts || []).find(z => z.city === city && z.day === day);
    if (!f || f.prepared) return false;
    const cost = 0.15 + f.sev * 0.08;
    if (KY.finance.avail() < cost) return false;
    KY.finance.spend(cost, 'Vorsorge vor ' + D.EVENTS[f.type].n);
    f.prepared = true;
    SIM.chron('hilfe', 'Hilfsgüter vorsorglich bereitgestellt (' + D.EVENTS[f.type].n + ' bei ' + SIM.cName(city) + ').', null);
    SIM.opImpulse(SIM.W.cities[city].nation, D.REACT.LUFTBRUECKE, 1.2, { aware: 2 });
    return true;
  };

  /* ---------- Hilfe ---------- */
  E.relief = function (p) {
    const S = SIM.S, A = D.ACT[p.act];
    const ev = E.byId(p.ev);
    if (!ev) return;
    const R = A.relief || {};
    const eff = (SIM.contract('envoy') === 'okonkwo' ? 1.3 : 1) * (ev.phase === 'vorbei' ? 0.2 : 1);
    ev.helped[A.id] = S.day;
    const rem = Math.max(0, ev.dead - ev.deadNow);
    let saved = 0;
    if (R.lives) {
      saved = Math.round(rem * Math.min(0.85, R.lives * eff));
      ev.dead -= saved; ev.saved += saved;
      S.g.lives += saved; S.g.livesRelief += saved;
      p.acc.lives = saved;
    }
    const sc = S.cities[ev.c];
    if (R.damage) {
      sc.dmg = Math.max(0, sc.dmg * (1 - R.damage));
      sc.rebuild = S.day + 365;
      SIM.citiesOf(ev.n).forEach(c => { S.cities[c.id].dmg *= 1 - R.damage * 0.5; });
    }
    if (R.health) SIM.shock(ev.n, 'health', R.health * 2, 200);
    if (R.infra) { const n = S.nations[ev.n]; n.fx.infra = (n.fx.infra || 0) + R.infra; }
    const n = S.nations[ev.n];
    n.access = U.clamp(n.access + 5, 0, 100);
    SIM.opImpulse(ev.n, D.REACT[A.id] || 0.8, 1.6 + ev.sev * 1.1, { aware: 6 });
    sc.sent = U.clamp(sc.sent + 10 + ev.sev * 3, -100, 100);
    SIM.g_trust(1.5);
    const h = A.news && A.news.done && A.news.done.length ? U.pick(A.news.done) : null;
    KY.media.story(h ? null : 'relief_arrive', { n: ev.n, c: ev.c }, { h: h ? U.fill(h, SIM.vars({ n: ev.n, c: ev.c })) : null, tone: 0.6, heat: 14 + ev.sev * 4, about: true, proj: p.id, key: 'relief_arrive', ev: ev.id });
    SIM.chron('hilfe', A.name + ' für „' + ev.name + '“' + (saved ? ': schätzungsweise ' + U.n(saved) + ' Menschen gerettet.' : '.'), { ev: ev.id, proj: p.id });
  };
})();

/* KYTHERA · MANDAT · Tarnung: Tarnstrukturen, Spuren, Recherchen, Enttarnung */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data;
  const SIM = KY.sim;
  const C = (KY.cover = {});

  const jur = () => SIM.JUR[SIM.contract('jurisdiction')] || SIM.JUR.holmvik;
  const tru = () => SIM.TRUSTEE[SIM.contract('trustee')] || SIM.TRUSTEE.halvorsen;
  C.fit = (f, A) => (D.FRONT_FIT[f.kind] || []).indexOf(A.cat) >= 0;

  /* Erwarteter Spurenzuwachs für eine Tarnstruktur */
  C.traceGain = function (A, o, x, front, vis) {
    const S = SIM.S;
    if (S.g.exposed) return 0;
    front = front || S.fronts.find(f => !f.exposed);
    if (!front) return 0;
    const cost = A.cost ? 1 : 0;
    let g = (vis || 0) * 1.35 + cost * 0.4;
    g *= jur().trace * tru().trace;
    g *= C.fit(front, A) ? 0.72 : 1.3;
    g *= 1 + front.projects.length * 0.1;
    if (S.day < S.g.chainUntil) g *= 0.6;
    if (x && x.nid >= 0) g *= 0.6 + S.nations[x.nid].press / 120;
    return Math.round(g * 10) / 10;
  };

  C.onOrder = function (p, q) {
    const S = SIM.S;
    const f = S.fronts.find(z => z.id === p.front);
    if (!f || f.exposed) return;
    const g = C.traceGain(q.A, q.o, q.x, f, q.vis);
    f.trace = Math.min(100, f.trace + g);
    f.spent += q.cost;
    S.g.ky += g * 0.04;
  };
  C.addTrace = function (fid, v) {
    const f = SIM.S.fronts.find(z => z.id === fid);
    if (f && !f.exposed) f.trace = U.clamp(f.trace + v * jur().trace, 0, 100);
  };
  C.onIncident = function (inc, T) {
    const S = SIM.S;
    const f = S.fronts.find(z => z.id === inc.front);
    if (!f || f.exposed) return;
    const add = (T.trace || 0) + (inc.sev >= 3 ? 5 + inc.sev * 2 : inc.sev) + Math.sqrt(inc.dead) * 0.3;
    C.addTrace(f.id, add);
    if (inc.sev >= 3 && !f.inv) startInv(f, inc.n);
  };

  function startInv(f, nid) {
    const S = SIM.S;
    const ch = U.weighted(D.CHANNELS, c => c.bias.crit * c.bias.crit);
    f.inv = { ch: ch.id, start: S.day, prog: 0, n: nid >= 0 ? nid : -1, reporter: U.pick(ch.reporters || ['eine Reporterin']) };
    SIM.msg('dobrev', 'Recherche gegen ' + f.name, [ch.name + ' recherchiert zur Eigentümerstruktur von ' + f.name + '. Federführend: ' + f.inv.reporter + '.', 'Die Recherche wird Spuren freilegen. Wir können die Kette verlängern oder Vorhaben auf andere Strukturen verteilen. Druck auf Journalisten ist nach dem Mandat ausgeschlossen.'], { kind: 'warn', acts: [{ l: 'Tarnung öffnen', a: 'panel', p: { id: 'tarnung' } }] });
  }

  C.daily = function () {
    const S = SIM.S, g = S.g;
    if (g.exposed) return;
    const chain = S.day < g.chainUntil ? 0.6 : 1;
    let expo = 0;
    for (const f of S.fronts) {
      if (f.exposed) continue;
      let act = 0, press = 0;
      f.projects.forEach(pid => {
        const p = KY.projects.byId(pid);
        if (!p || !KY.projects.ACTIVE[p.phase]) return;
        act += p.vis || 0;
        press += p.n >= 0 ? S.nations[p.n].press : 50;
      });
      if (act > 0) {
        const pr = press / Math.max(1, f.projects.length) / 60;
        f.trace += act * 0.0026 * pr * jur().trace * tru().trace * chain;
      } else f.trace = Math.max(0, f.trace - 0.02);
      if (!f.inv && f.trace > 35 && Math.random() < 0.004 * (f.trace / 50)) startInv(f, -1);
      if (f.inv) {
        f.inv.prog += 0.006 * (1 + f.trace / 100) * chain;
        if (f.inv.prog >= 1) {
          f.trace = Math.min(100, f.trace + 18 + Math.random() * 10);
          const ch = D.CHANNELS.find(c => c.id === f.inv.ch);
          KY.media.story('trace_investigation', { n: f.inv.n, extra: { front: f.name } }, { tone: -0.3, heat: 26, about: true, ch: ch ? ch.id : null, front: f.id });
          if (f.inv.n >= 0) KY.media.story('trace_rumor', { n: f.inv.n, extra: { front: f.name } }, { tone: -0.2, heat: 14, about: true, front: f.id });
          SIM.chron('tarnung', 'Recherche von ' + (ch ? ch.name : 'Journalisten') + ' zu ' + f.name + ' veröffentlicht.', { front: f.id });
          f.inv = null;
        }
      }
      if (f.trace >= 50 && !f.warn50) { f.warn50 = true; SIM.msg('dobrev', f.name + ': Spuren über 50 %', ['Die Spuren zu ' + f.name + ' verdichten sich. Weitere Vorhaben über diese Struktur erhöhen das Risiko einer Enttarnung.'], { kind: 'warn' }); }
      if (f.trace >= 82 && !f.warn80) { f.warn80 = true; SIM.msg('dobrev', 'Akute Gefahr: ' + f.name, ['Die Enttarnung von ' + f.name + ' steht unmittelbar bevor. Empfehlung: Struktur auflösen oder Treuhandkette verlängern.'], { kind: 'crisis', acts: [{ l: 'Tarnung öffnen', a: 'panel', p: { id: 'tarnung' } }] }); }
      if (f.trace >= 100) C.expose(f);
      if (f.trace > 55) expo += (f.trace - 55) * 0.0007;
    }
    expo *= g.face ? 0.5 : 1;
    g.exposure = U.clamp(g.exposure + expo + g.ky * 0.0004, 0, 100);
    if (g.face) {
      g.face.cred = Math.min(95, g.face.cred + 0.01);
      if (g.face.cred < 22) faceQuits();
    }
    if (g.exposure >= 50 && !g.warnE50) { g.warnE50 = true; SIM.msg('dobrev', 'Enttarnungsgrad 50 %', ['Mehrere Redaktionen vermuten inzwischen einen einzelnen Geldgeber hinter den Vorhaben. Noch fehlt ihnen die Verbindung.'], { kind: 'warn' }); }
    if (g.exposure >= 85 && !g.warnE85) { g.warnE85 = true; SIM.msg('dobrev', 'Enttarnung steht bevor', ['Es ist nur noch eine Frage von Wochen. Bereiten Sie sich auf die öffentliche Phase vor: Ihre Bilanz wird dann alles sein, was zählt.'], { kind: 'crisis' }); }
    if (g.exposure >= 100) C.globalExposure();
  };

  C.expose = function (f) {
    const S = SIM.S, g = S.g;
    if (f.exposed) return;
    f.exposed = true; f.trace = 100; f.exposedAt = S.day; f.inv = null;
    const nats = new Set();
    f.projects.forEach(pid => { const p = KY.projects.byId(pid); if (p && p.n >= 0) nats.add(p.n); });
    nats.forEach(nid => SIM.opImpulse(nid, [-0.4, -0.3, -0.5, -0.2, -0.6], 3, { aware: 14 }));
    g.exposure = Math.min(100, g.exposure + 8 + f.projects.length * 0.8);
    if (g.face) g.face.cred -= 8;
    SIM.g_trust(-4);
    KY.media.story('front_exposed', { extra: { front: f.name } }, { tone: -0.5, heat: 46, about: true, global: true, front: f.id });
    SIM.chron('tarnung', f.name + ' ist als Tarnstruktur enttarnt. ' + f.projects.length + ' Vorhaben werden nun öffentlich einem unbekannten Geldgeber zugeschrieben.', { front: f.id });
    SIM.msg('dobrev', 'Enttarnt: ' + f.name, [f.name + ' ist aufgeflogen. Die Medien wissen jetzt, dass ' + f.projects.length + ' Vorhaben aus derselben Quelle finanziert werden.', 'Ihr Name ist weiterhin unbekannt. Neue Vorhaben sollten über andere Strukturen laufen.'], { kind: 'crisis' });
    KY.bus.emit('frontexposed', f);
  };

  /* Die große Enthüllung: die Welt weiß, dass eine einzelne Person dahintersteht. Der Name bleibt versiegelt. */
  C.globalExposure = function () {
    const S = SIM.S, g = S.g;
    if (g.exposed) return;
    g.exposed = true; g.exposure = 100; g.exposedAt = S.day;
    const net = (g.lives - g.deaths * 4) / (g.lives + g.deaths * 4 + 2000);
    S.nations.forEach((n, id) => {
      n.aware = Math.max(n.aware, 72);
      SIM.opImpulse(id, [0.8, 0.6, 0.5, 0.7, 0.3], net * 14, { direct: true });
      SIM.opImpulse(id, [-0.2, -0.3, -0.4, -0.1, -0.6], 4, { direct: true });
    });
    S.fronts.forEach(f => { f.exposed = true; });
    KY.finance.freeze(0.2, 365);
    SIM.g_trust(-10);
    KY.media.story('exposure_global', { extra: {} }, { tone: net > 0 ? 0.1 : -0.6, heat: 100, about: true, global: true, breaking: true });
    SIM.chron('tarnung', 'Enttarnung: Die Welt weiß nun, dass eine einzelne Person hinter allen Vorhaben steht. Bekannt ist nur der Deckname „' + S.codename + '“. Die Identität bleibt versiegelt.', null);
    SIM.msg('kuratorium', 'Eintritt der öffentlichen Phase', ['Gemäß § 6 der Geheimhaltungsvereinbarung (KY-M/2027/02) tritt das Mandat in die öffentliche Phase ein. Ihr Name bleibt versiegelt; bekannt ist allein der Deckname „' + S.codename + '“.', 'Das Kuratorium verwahrt 20 % des Vermögens für ein Jahr auf einem Sperrkonto, um rechtliche Risiken abzudecken.', 'Ab heute wird jede Ihrer Entscheidungen öffentlich Ihnen zugeschrieben.'], { kind: 'letter', prio: 3 });
    KY.bus.emit('exposed', null);
  };

  function faceQuits() {
    const S = SIM.S, g = S.g;
    const name = g.face.name;
    KY.media.story(null, {}, { h: name + ' legt das Amt als Gesicht der Stiftung nieder', tone: -0.3, heat: 28, about: true, global: true, key: 'face_quit' });
    SIM.chron('tarnung', name + ' tritt als öffentliches Gesicht zurück. Glaubwürdigkeit aufgebraucht.', null);
    SIM.msg('dobrev', 'Rücktritt: ' + name, [name + ' hat das Amt niedergelegt. Ohne Gesicht wächst die Spekulation über den eigentlichen Geldgeber wieder schneller.'], { kind: 'warn' });
    g.face = null;
  }

  /* ---------- Handlungen der Tarnung ---------- */
  C.newFront = function (kind, seat, name) {
    const S = SIM.S;
    const cost = 0.3;
    if (KY.finance.avail() < cost) return { ok: false, err: 'Nicht genügend liquide Mittel.' };
    KY.finance.spend(cost, 'Gründung Tarnstruktur');
    const f = SIM.makeFront(S, kind, seat, name);
    f.trace = S.g.exposed ? 100 : 1 + Math.random() * 3;
    if (S.g.exposed) f.exposed = true;
    SIM.chron('tarnung', 'Neue Tarnstruktur gegründet: ' + f.name + ' (' + f.seat + ').', { front: f.id });
    return { ok: true, f };
  };
  C.dissolve = function (fid, targetId) {
    const S = SIM.S;
    const f = S.fronts.find(z => z.id === fid), t = S.fronts.find(z => z.id === targetId);
    if (!f || !t || f === t) return { ok: false, err: 'Ungültige Auswahl.' };
    const alive = S.fronts.filter(z => !z.dissolved);
    if (alive.length <= 1) return { ok: false, err: 'Die letzte Struktur kann nicht aufgelöst werden.' };
    const cost = 0.1 + f.projects.length * 0.02;
    if (KY.finance.avail() < cost) return { ok: false, err: 'Nicht genügend liquide Mittel.' };
    KY.finance.spend(cost, 'Auflösung ' + f.name);
    f.projects.forEach(pid => { const p = KY.projects.byId(pid); if (p) p.front = t.id; t.projects.push(pid); });
    if (!t.exposed) t.trace = Math.min(100, t.trace + f.trace * 0.25 + (f.inv ? 10 : 0));
    f.projects = []; f.dissolved = true; f.trace = 0; f.inv = null;
    S.fronts = S.fronts.filter(z => z !== f);
    S.g.ky += 0.5;
    SIM.chron('tarnung', f.name + ' aufgelöst. Vorhaben gehen auf ' + t.name + ' über.', { front: t.id });
    return { ok: true, cost };
  };
  C.finish = function (p) {
    const S = SIM.S, A = D.ACT[p.act];
    if (A.cover === 'chain') {
      S.fronts.forEach(f => { if (!f.exposed) { f.trace = Math.max(0, f.trace - 22); f.warn50 = f.trace >= 50; f.warn80 = f.trace >= 82; } });
      S.g.exposure = Math.max(0, S.g.exposure - 6);
      S.g.chainUntil = S.day + 365;
      SIM.chron('tarnung', 'Treuhandkette verlängert: Spuren aller Strukturen deutlich gesenkt, neue Spuren gedämpft für ein Jahr.', null);
    } else if (A.cover === 'face') {
      const F = D.FACES.find(f => f.id === p.o.face) || D.FACES[0];
      S.g.face = { id: F.id, name: F.name, role: F.role, cred: F.cred, since: S.day };
      KY.media.story(null, {}, { h: F.name + ' wird Gesicht einer großen Stiftung: „Ich stehe für diese Projekte ein“', tone: 0.3, heat: 30, about: true, global: true, key: 'face_new' });
      SIM.chron('tarnung', F.name + ' tritt als öffentliches Gesicht Ihrer Vorhaben auf.', null);
    }
  };
  C.chainCost = () => 0.8;
})();


/* ===== js/sim/media.js ===== */
/* KYTHERA · MANDAT · Medien: Meldungen, Sender, soziale Netze, Märkte im Laufband */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data;
  const SIM = KY.sim;
  const M = (KY.media = {});

  const CAT = k => {
    if (!k) return 'Welt';
    if (/^(disaster|relief|crop)/.test(k)) return 'Katastrophen';
    if (/^(econ|blackout|strike)/.test(k)) return 'Wirtschaft';
    if (/^(election|gov_|scandal|unrest)/.test(k)) return 'Politik';
    if (/^(tension|trade|mediation|summit)/.test(k)) return 'Diplomatie';
    if (/^research/.test(k)) return 'Wissenschaft';
    if (/^poll/.test(k)) return 'Umfragen';
    return 'Welt';
  };
  const DRAMA = /^(incident|disaster|protest|front_exposed|exposure|followup_silence|tension_crisis|econ_crash|blackout|unrest|scandal|gov_fall)/;
  const ECON = /^(econ|blackout|strike|crop|trade|approval|project)/;
  const SOCIALK = /^(protest|relief|project|poll|donor|milestone|incident|unrest)/;

  function fill(tpl, vars) {
    const S = SIM.S;
    let s = U.fill(tpl, vars);
    if (S && S.codename && S.codename !== 'N. N.') s = s.replace(/N\. N\./g, S.codename);
    return s;
  }
  const open = s => /\{\w+\}/.test(s);

  function pickTpl(arr, vars) {
    if (!arr || !arr.length) return null;
    const order = U.shuffle(arr);
    for (const t of order) { const s = fill(t, vars); if (!open(s)) return s; }
    return null;
  }

  function quotes(o, vars, nid) {
    const out = [];
    const cul = nid >= 0 ? SIM.W.nations[nid].culture : 'lat';
    const r = Math.random;
    const who = role => ({ name: KY.names.person(r, cul), role });
    const city = vars.city || vars.nation || 'der Region';
    const Q = D.QUOTES;
    const add = (key, role) => { const t = pickTpl(Q[key], vars); if (t) out.push(Object.assign(who(role), { text: t })); };
    if (o.inc) { add('victim', 'Angehörige eines Opfers'); add(Math.random() < 0.5 ? 'expert_neg' : 'resident_contra', Math.random() < 0.5 ? 'Institut für Anlagensicherheit' : 'lebt in ' + city); }
    else if (o.about && o.tone > 0.15) { add(Math.random() < 0.5 ? 'resident_pro' : 'official_pos', Math.random() < 0.5 ? 'lebt in ' + city : 'Regierung von ' + (vars.nation || 'der Region')); if (o.heat > 20) add('expert_pos', 'Zentrum für Entwicklungsforschung'); }
    else if (o.about && o.tone < -0.15) { add(Math.random() < 0.5 ? 'resident_contra' : 'expert_neg', Math.random() < 0.5 ? 'Bürgerinitiative ' + city : 'Institut für Governance-Studien'); if (o.heat > 20) add('official_neg', 'Opposition in ' + (vars.nation || 'der Region')); }
    return out;
  }

  /* Neue Meldung. key: Vorlagenschlüssel oder null (dann opts.h als Schlagzeile) */
  M.story = function (key, v, opts) {
    const S = SIM.S;
    if (!S) return null;
    opts = opts || {};
    v = v || {};
    const vars = SIM.vars(v);
    vars.codename = S.codename;
    let h = opts.h ? fill(opts.h, vars) : pickTpl(D.NEWS[key], vars);
    if (!h) return null;
    if (open(h)) h = h.replace(/\{\w+\}/g, '…');
    const leadArr = key && D.NEWS_LEADS && D.NEWS_LEADS[key];
    let lead = leadArr ? pickTpl(leadArr, vars) : null;
    if (opts.sub) lead = lead ? opts.sub + ' ' + lead : opts.sub;
    const tone = opts.tone || 0, heat = opts.heat || 10;
    const k = key || opts.key || 'misc';
    // Welche Sender greifen das Thema auf?
    const sc = D.CHANNELS.map(ch => {
      const b = ch.bias;
      let s = heat * (0.6 + (DRAMA.test(k) ? b.sens * 0.9 : 0) + (ECON.test(k) ? b.biz * 0.8 : 0) + (SOCIALK.test(k) ? b.social * 0.5 : 0) +
        (opts.about ? (tone < 0 ? b.crit * 1.1 : 0.2 + (1 - b.crit) * 0.4) : 0));
      s *= 0.7 + Math.random() * 0.6;
      if (opts.ch === ch.id) s += 40;
      return { id: ch.id, s };
    }).sort((a, b) => b.s - a.s);
    const chs = sc.filter((x, i) => i === 0 || x.s > 14).map(x => x.id);
    const a = {
      id: ++S.seq.news, day: S.day, key: k, h, lead, n: v.n !== undefined ? v.n : -1, n2: v.n2 !== undefined ? v.n2 : -1, c: v.c !== undefined ? v.c : -1,
      proj: opts.proj || null, inc: opts.inc || null, ev: opts.ev || null, front: opts.front || null, tone, heat, about: !!opts.about,
      cat: opts.about ? 'Mandat' : CAT(k), chs, ch: chs[0], breaking: !!opts.breaking || heat >= 55, global: !!opts.global,
      quotes: heat >= 12 ? quotes(opts, vars, v.n !== undefined ? v.n : -1) : [], read: false,
    };
    S.news.unshift(a);
    if (S.news.length > 420) S.news.length = 420;
    // Wirkung auf die öffentliche Meinung
    if (a.about) {
      const crit = D.CHANNELS.find(c => c.id === a.ch).bias.crit;
      S.g.mediaNeg = (S.g.mediaNeg || 0) + Math.max(0, -tone) * heat * 0.35;
      const amp = tone < 0 ? 0.8 + crit * 0.6 : 1.1 - crit * 0.4;
      if (a.n >= 0) { SIM.opImpulse(a.n, tone, heat * 0.02 * amp, { aware: heat * 0.04 }); }
      if (a.global || heat >= 40) S.nations.forEach((n, id) => { if (id !== a.n) SIM.opImpulse(id, tone, heat * 0.004 * amp, { aware: heat * 0.012 }); });
    }
    // Soziale Netze reagieren
    if (heat >= 9) {
      const cnt = Math.min(4, 1 + Math.floor(heat / 22));
      for (let i = 0; i < cnt; i++) M.post(socialKind(k, a), { n: a.n, c: a.c, proj: opts.proj, front: opts.front }, heat);
    }
    KY.bus.emit('news', a);
    return a;
  };

  function socialKind(k, a) {
    if (/^incident/.test(k)) return Math.random() < 0.55 ? 'incident' : 'grief';
    if (/^disaster/.test(k)) return Math.random() < 0.6 ? 'grief' : 'neutral';
    if (/^protest/.test(k)) return 'protest';
    if (/^relief/.test(k)) return 'relief';
    if (/^(front_exposed|exposure)/.test(k)) return Math.random() < 0.6 ? 'exposed' : 'speculation';
    if (/^(trace|donor_speculation)/.test(k)) return 'speculation';
    if (a.about && a.tone > 0.15) return Math.random() < 0.85 ? 'pos' : 'joke';
    if (a.about && a.tone < -0.15) return 'neg';
    return Math.random() < 0.8 ? 'neutral' : 'joke';
  }

  /* Ein Beitrag in den sozialen Netzen */
  M.post = function (kind, ctx, heat) {
    const S = SIM.S, W = SIM.W;
    const arr = D.SOCIAL[kind];
    if (!arr) return null;
    ctx = ctx || {};
    let nid = ctx.n !== undefined ? ctx.n : -1, cid = ctx.c !== undefined ? ctx.c : -1;
    if (nid < 0 && cid >= 0) nid = W.cities[cid].nation;
    if (nid < 0) nid = U.weighted(S.nations, n => n.pop * (0.1 + n.aware / 50)).id;
    if (cid < 0) { const cs = SIM.citiesOf(nid); cid = cs.length ? U.pick(cs).id : W.nations[nid].capital; }
    const p = ctx.proj ? KY.projects.byId(ctx.proj) : S.projects.find(z => z.n === nid && KY.projects.ACTIVE[z.phase]);
    const f = ctx.front ? S.fronts.find(z => z.id === ctx.front) : (p ? S.fronts.find(z => z.id === p.front) : S.fronts[0]);
    const vars = { city: W.cities[cid].name, nation: W.nations[nid].short, proj: p ? D.ACT[p.act].name : 'das neue Großprojekt', front: f ? f.name : 'die Stiftung' };
    const text = pickTpl(arr, vars);
    if (!text) return null;
    const i = Math.floor(Math.random() * D.SOCIAL_HANDLES.length);
    const base = Math.pow(10, 1 + Math.random() * 2.2) * (1 + (heat || 5) / 12);
    const tone = { pos: 0.6, relief: 0.7, neg: -0.6, incident: -0.8, grief: -0.4, protest: -0.5, exposed: -0.2, speculation: 0, neutral: 0, joke: 0.1 }[kind] || 0;
    const post = { id: ++S.seq.post, day: S.day, handle: D.SOCIAL_HANDLES[i], name: D.SOCIAL_NAMES[i % D.SOCIAL_NAMES.length], text, kind, tone, n: nid, likes: Math.round(base * (1.5 + Math.random() * 6)), shares: Math.round(base * (0.2 + Math.random())), replies: Math.round(base * 0.3 * Math.random()) };
    S.social.unshift(post);
    if (S.social.length > 300) S.social.length = 300;
    return post;
  };

  /* Trends der letzten zwei Wochen */
  M.trends = function () {
    const S = SIM.S;
    const t = {};
    S.social.filter(p => S.day - p.day <= 14).forEach(p => {
      const tags = p.text.match(/#[\wÄÖÜäöüß-]+/g) || [];
      tags.forEach(x => { t[x] = (t[x] || 0) + p.likes; });
      const key = '#' + SIM.nName(p.n).replace(/\s+/g, '');
      t[key] = (t[key] || 0) + p.likes * 0.4;
    });
    return Object.keys(t).map(k => ({ tag: k, v: t[k] })).sort((a, b) => b.v - a.v).slice(0, 8);
  };

  M.forChannel = function (chId, limit) {
    return SIM.S.news.filter(a => a.chs.indexOf(chId) >= 0).slice(0, limit || 30);
  };

  /* ---------- Märkte für das Laufband ---------- */
  M.initMarkets = function () {
    const S = SIM.S;
    if (S.mkt) return;
    S.mkt = { idx: {}, com: {} };
    D.TICKER.indices.forEach(x => { S.mkt.idx[x.id] = { v: x.base, prev: x.base }; });
    D.TICKER.commodities.forEach((x, i) => { S.mkt.com[i] = { v: x.base, prev: x.base }; });
  };
  M.daily = function () {
    const S = SIM.S;
    M.initMarkets();
    const mk = (S.g.market || 0) / 100 / 365 * 3;
    for (const id in S.mkt.idx) {
      const o = S.mkt.idx[id];
      o.prev = o.v;
      o.v *= 1 + 0.0002 + mk * 0.6 + U.gauss() * 0.009;
    }
    for (const i in S.mkt.com) {
      const o = S.mkt.com[i];
      o.prev = o.v;
      o.v *= 1 + U.gauss() * 0.012 - mk * 0.3;
      o.v = Math.max(D.TICKER.commodities[i].base * 0.3, Math.min(D.TICKER.commodities[i].base * 3, o.v));
    }
    // Hintergrundrauschen der sozialen Netze
    if (Math.random() < 0.32) {
      const aw = SIM.worldAware();
      const kind = aw > 12 && Math.random() < 0.35 ? (Math.random() < 0.6 ? 'speculation' : SIM.worldOp() > 5 ? 'pos' : SIM.worldOp() < -5 ? 'neg' : 'neutral') : Math.random() < 0.75 ? 'neutral' : 'joke';
      M.post(kind, {}, 4);
    }
    // Gelegentliche Einordnungen über den unbekannten Geldgeber
    if (Math.random() < 0.012 && SIM.worldAware() > 18) {
      const op = SIM.worldOp();
      const k = op > 8 ? 'donor_praise' : op < -8 ? 'donor_critic' : 'donor_speculation';
      const nid = U.weighted(S.nations, n => n.aware * n.pop).id;
      M.story(k, { n: nid }, { tone: op > 8 ? 0.4 : op < -8 ? -0.4 : 0, heat: 16, about: true });
    }
  };
})();


/* ===== js/sim/finance.js ===== */
/* KYTHERA · MANDAT · Vermögen, Rendite, Gebühren, Sperrkonto */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U;
  const SIM = KY.sim;
  const F = (KY.finance = {});

  F.avail = () => Math.max(0, SIM.S.fin.cash - (SIM.S.day < SIM.S.fin.frozenUntil ? SIM.S.fin.frozen : 0));
  F.spend = function (amount, label, silent) {
    const S = SIM.S, f = S.fin;
    if (!(amount > 0)) return;
    f.cash -= amount; f.y.spent += amount; S.g.spent += amount;
    if (label && !silent) { f.log = f.log || []; f.log.unshift({ day: S.day, t: label, v: -amount }); if (f.log.length > 240) f.log.length = 240; }
  };
  F.income = function (amount, label) {
    const S = SIM.S, f = S.fin;
    if (!(amount > 0)) return;
    f.cash += amount; f.y.inc += amount;
    if (label) { f.log = f.log || []; f.log.unshift({ day: S.day, t: label, v: amount }); if (f.log.length > 240) f.log.length = 240; }
  };
  F.freeze = function (frac, days) {
    const S = SIM.S, f = S.fin;
    f.frozen = f.cash * frac; f.frozenUntil = S.day + days;
    SIM.chron('finanzen', U.money(f.frozen) + ' auf dem Sperrkonto des Kuratoriums (' + U.days(days) + ').', null);
  };
  F.strategy = () => SIM.STRAT[SIM.contract('strategy')] || SIM.STRAT.bal;
  F.fees = () => (SIM.JUR[SIM.contract('jurisdiction')] || SIM.JUR.holmvik).fee + (SIM.TRUSTEE[SIM.contract('trustee')] || SIM.TRUSTEE.halvorsen).fee;

  F.daily = function () {
    const S = SIM.S, f = S.fin;
    const st = F.strategy();
    const r = st.mu / 365 + st.sd / Math.sqrt(365) * U.gauss() + (S.g.market || 0) / 100 / 365 * st.beta * 3;
    const invested = Math.max(0, f.cash * 0.9);
    const ret = invested * r;
    f.cash += ret; f.y.ret += ret;
    f.idx *= 1 + r;
    const fee = Math.max(0, f.cash) * F.fees() / 365;
    f.cash -= fee; f.y.fees += fee;
    if (S.res && S.res.lic) F.income(S.res.lic / 365);
    f.peak = Math.max(f.peak, f.cash);
    if (S.day >= f.frozenUntil && f.frozen > 0) {
      f.frozen = 0;
      SIM.chron('finanzen', 'Das Sperrkonto des Kuratoriums ist wieder freigegeben.', null);
    }
    if (f.cash < 20 && !f.lowWarn) {
      f.lowWarn = true;
      SIM.msg('trustee', 'Liquidität knapp', ['Das liquide Vermögen ist unter ' + U.money(20) + ' gefallen. Laufende Bauvorhaben könnten ins Stocken geraten.'], { kind: 'warn' });
    }
    if (f.cash > 60) f.lowWarn = false;
  };
  F.monthly = function () {
    const S = SIM.S, f = S.fin;
    U.push(f.hist, { d: S.day, c: Math.round(f.cash * 10) / 10, i: Math.round(f.idx * 100) / 100 }, 360);
  };
  F.yearly = function () {
    const f = SIM.S.fin;
    f.ly = f.y;
    f.y = { ret: 0, inc: 0, spent: 0, fees: 0, comp: 0 };
  };
  F.crash = function (depth) {
    const S = SIM.S, f = S.fin;
    const st = F.strategy();
    const loss = f.cash * 0.9 * depth * st.beta;
    f.cash -= loss; f.y.ret -= loss; f.idx *= 1 - depth * st.beta;
    SIM.msg('trustee', 'Kurssturz an den Weltbörsen', ['Der KX 500 ist eingebrochen. Ihr Portfolio hat ' + U.money(loss) + ' an Wert verloren.', 'Wir empfehlen, nicht zu verkaufen. Märkte haben sich bislang immer erholt, aber wann, kann niemand sagen.'], { kind: 'warn' });
  };
  /* Zugesagte, noch nicht bezahlte Summen laufender Vorhaben */
  F.commitments = function () {
    return SIM.S.projects.reduce((s, p) => s + (KY.projects.ACTIVE[p.phase] && p.phase !== 'betrieb' ? Math.max(0, p.cost - p.paid) : 0), 0);
  };
})();


/* ===== js/sim/research.js ===== */
/* KYTHERA · MANDAT · Forschungsprogramme */
(function () {
  'use strict';
  const KY = window.KY;
  const D = KY.data;
  const SIM = KY.sim;
  const R = (KY.research = {});
  R.MAX = 3;

  R.state = function (id) {
    const res = SIM.S.res;
    if (res.done[id]) return 'done';
    if (res.active.some(a => a.id === id)) return 'active';
    const T = D.TECH_BY[id];
    if (T.req.some(r => !res.done[r])) return 'locked';
    return 'open';
  };
  R.start = function (id, mode) {
    const S = SIM.S, T = D.TECH_BY[id];
    if (R.state(id) !== 'open') return { ok: false, err: 'Nicht verfügbar.' };
    if (S.res.active.length >= R.MAX) return { ok: false, err: 'Es laufen bereits ' + R.MAX + ' Programme.' };
    const down = T.cost * 0.25;
    if (KY.finance.avail() < down) return { ok: false, err: 'Nicht genügend liquide Mittel.' };
    KY.finance.spend(down, 'Forschung: ' + T.n);
    S.res.active.push({ id, prog: 0, start: S.day, mode: mode === 'excl' ? 'excl' : 'open', paid: down });
    SIM.chron('forschung', 'Forschungsprogramm gestartet: ' + T.n + (mode === 'excl' ? ' (exklusiv)' : ' (offen für alle)') + '.', null);
    return { ok: true };
  };
  R.daily = function () {
    const S = SIM.S;
    for (const a of S.res.active.slice()) {
      const T = D.TECH_BY[a.id];
      const pay = T.cost * 0.75 / T.days;
      if (KY.finance.avail() < pay) continue;
      KY.finance.spend(pay, null, true); a.paid += pay;
      a.prog += 1 / T.days;
      if (a.prog >= 1) finish(a);
    }
  };
  function finish(a) {
    const S = SIM.S, T = D.TECH_BY[a.id];
    S.res.active = S.res.active.filter(x => x !== a);
    S.res.done[a.id] = { day: S.day, mode: a.mode };
    const fx = T.fx;
    for (const k in fx) {
      if (k === 'unlock') { S.g.unlock = S.g.unlock || {}; S.g.unlock[fx.unlock] = true; }
      else S.g.techFx[k] = fx[k];
    }
    if (a.mode === 'open') {
      S.g.globalTech = (S.g.globalTech || 0) + 0.08;
      S.nations.forEach((n, id) => SIM.opImpulse(id, [0.5, 0.2, 0.1, 0.6, 0.1], 0.6, { aware: 0.5 }));
      SIM.g_trust(2);
    } else {
      S.res.lic = (S.res.lic || 0) + T.cost * 0.04;
    }
    KY.media.story('research_done', { extra: { tech: T.n } }, { tone: 0.4, heat: 18 + T.cost, global: true });
    SIM.chron('forschung', 'Durchbruch: ' + T.n + '. ' + T.text, null);
    SIM.msg('brennan', 'Forschungsdurchbruch: ' + T.n, [T.text, a.mode === 'open' ? 'Die Ergebnisse stehen allen Staaten frei zur Verfügung. Die Resonanz ist enorm.' : 'Die Lizenzrechte liegen exklusiv bei Ihren Strukturen und bringen laufende Einnahmen.'], { kind: 'info' });
  }
})();

    ], { acts: tense.length ? [{ l: 'Vermittlung vorbereiten', a: 'act', p: { id: 'VERMITTLUNG', n: tense[0][0], n2: tense[0][1] } }] : [] });

          'Am positivsten: ' + best + '.' + (worst ? ' Am kritischsten: ' + worst + '.' : ''),

        ], { kind: 'info' });
      }
    }
    if (m % 3 === 0) {
      const f = S.fin;
      SIM.msg('trustee', 'Quartalsbericht der Treuhand', [
        'Liquides Vermögen: ' + U.money(f.cash) + (f.frozen > 0 && S.day < f.frozenUntil ? ' (davon ' + U.money(f.frozen) + ' gesperrt)' : '') + '.',
        'Kapitalerträge seit Jahresbeginn: ' + U.money(f.y.ret) + ' · Einnahmen aus Vorhaben: ' + U.money(f.y.inc) + ' · Ausgaben: ' + U.money(f.y.spent) + '.',
        'Zugesagte, noch offene Zahlungen laufender Vorhaben: ' + U.money(KY.finance.commitments()) + '.',
      ], { kind: 'info' });

  function suggest() {
    const S = SIM.S;
    if (S.g.lastSuggest && S.day - S.g.lastSuggest < 75) return;
    const r = Math.random();
    if (r > 0.55) return;
    const nat = S.nations.map((n, id) => ({ n, id }));
    const cands = [];
    nat.forEach(({ n, id }) => {
      if (n.energy < 38) cands.push({ w: 38 - n.energy, from: 'trustee', id, t: 'Energiemangel in ' + SIM.nName(id), b: ['Die Stromversorgung in ' + SIM.nName(id) + ' ist instabil (' + U.pct(n.energy, 0) + '). Stromausfälle drohen.', 'Ein Solar- oder Windpark könnte helfen und würde sich rechnen.'], act: 'SOLAR' });
      if (n.health < 40) cands.push({ w: 40 - n.health, from: 'haddad', id, t: 'Gesundheitsversorgung in ' + SIM.nName(id), b: ['Die Gesundheitsversorgung in ' + SIM.nName(id) + ' ist kritisch. Jedes Jahr sterben Menschen an vermeidbaren Krankheiten.', 'Eine Impfkampagne oder ein Wasserprogramm würde viele Leben retten.'], act: 'IMPF', pl: { n: id } });
      if (n.poverty > 40) cands.push({ w: (n.poverty - 40) * 0.8, from: 'envoy', id, t: 'Armut in ' + SIM.nName(id), b: ['Fast ' + U.pct(n.poverty, 0) + ' der Menschen in ' + SIM.nName(id) + ' leben in Armut.', 'Mikrokredite und Agrarprogramme wirken direkt bei den Ärmsten.'], act: 'MIKRO', pl: { n: id } });
    });
    S.g.sugg = S.g.sugg || {};
    const fresh = cands.filter(x => !S.g.sugg[x.act + ':' + x.id] || S.day - S.g.sugg[x.act + ':' + x.id] > 540);
    if (!fresh.length) return;
    const c = U.weighted(fresh, x => x.w);
    S.g.sugg[c.act + ':' + c.id] = S.day;
    S.g.lastSuggest = S.day;
    SIM.msg(c.from, c.t, c.b, { kind: 'suggest', acts: [{ l: D.ACT[c.act].name + ' prüfen', a: 'act', p: Object.assign({ id: c.act }, c.pl || {}) }, { l: 'Staat ansehen', a: 'nation', p: { id: c.id } }], ref: { n: c.id } });
  }

  /* ---------- Jahresbericht ---------- */
  A.yearly = function () {
    const S = SIM.S, g = S.g, sn = S.year.snap || {};

      year: S.year.n, day: S.day, lives: Math.round(g.lives - (sn.lives || 0)), deaths: g.deaths - (sn.deaths || 0), versaeumt: g.versaeumt - (sn.versaeumt || 0),
      breaks: g.breaks.length - (sn.breaks || 0), op: SIM.worldOp() - (sn.op || 0), spent: g.spent - (sn.spent || 0), done: S.projects.filter(p => p.doneAt >= 0).length - (sn.done || 0),
      inc: S.incidents.length - (sn.inc || 0), cash: S.fin.cash, trust: g.trust, exposure: g.exposure, ret: S.fin.y.ret,
    };
    let score = 0;
    score += Math.min(4, Math.log10(1 + d.lives) - 1.5);
    score -= Math.min(4, Math.log10(1 + d.deaths) * 0.9);
    score -= d.versaeumt * 0.8 + d.breaks * 0.7;
    score += d.op / 6 + Math.min(2, d.done * 0.2);
    const grade = score > 3 ? 'herausragend' : score > 1.5 ? 'überzeugend' : score > 0 ? 'solide' : score > -1.5 ? 'durchwachsen' : 'enttäuschend';
    d.score = score; d.grade = grade;
    S.reports = S.reports || [];
    S.reports.push(d);
    const dt = U.clamp(score * 1.5, -8, 8);
    SIM.g_trust(dt);
    const lines = [
      'Das Kuratorium hat Ihren ' + d.year + '. Jahresbericht geprüft und bewertet Ihr Mandatsjahr als ' + grade + '.',
      'Ihre Vorhaben haben in diesem Jahr schätzungsweise ' + U.n(d.lives) + ' Menschen das Leben gerettet. ' + (d.deaths ? U.n(d.deaths) + ' Menschen sind bei Vorfällen in Ihrer Verantwortung ums Leben gekommen.' : 'Kein Mensch ist bei Vorfällen in Ihrer Verantwortung ums Leben gekommen.'),
      'Fertiggestellt: ' + d.done + ' Vorhaben · Ausgaben ' + U.money(d.spent) + ' · Kapitalerträge ' + U.money(d.ret) + '.',
    ];
    if (d.versaeumt) lines.push('Mit Sorge stellen wir ' + d.versaeumt + ' Versäumnis' + (d.versaeumt > 1 ? 'se' : '') + ' gemäß Krisenprotokoll fest.');
    if (d.breaks) lines.push('Sie haben ' + d.breaks + '-mal gegen Ihre eigenen Grundsätze gehandelt.');
    lines.push(score > 0 ? 'Wir danken Ihnen für Ihre Arbeit und sehen dem kommenden Jahr mit Zuversicht entgegen.' : 'Wir erwarten im kommenden Jahr eine sorgfältigere Mandatsführung.');
    SIM.msg('kuratorium', 'Jahresbericht ' + d.year + ' · Bewertung: ' + grade, lines, { kind: 'letter', prio: 2, acts: [{ l: 'Bilanz öffnen', a: 'panel', p: { id: 'verantwortung' } }] });
    SIM.chron('kuratorium', 'Jahresbericht ' + d.year + ': Das Kuratorium bewertet das Mandatsjahr als ' + grade + '.', null);
    S.year.n++;
    A.snapYear();
    KY.bus.emit('report', d);
  };
})();

/* KYTHERA · MANDAT · Taktgeber der Simulation */
(function () {
  'use strict';
  const KY = window.KY;
  const SIM = KY.sim;
  const E = (KY.engine = {});
  E.SPEEDS = [0, 1, 4, 12, 30];
  E.SPEED_NAMES = ['Pause', '1 Tag/s', '4 Tage/s', '12 Tage/s', '30 Tage/s'];
  let acc = 0;

  E.start = function (S, W, isNew) {
    SIM.bind(S, W);
    KY.events.reset();
    KY.nations.init();
    KY.media.initMarkets();
    if (isNew) KY.advisors.welcome();
  };

  E.stepDay = function () {
    const S = SIM.S;
    S.day++;
    KY.finance.daily();
    KY.projects.daily();
    KY.incidents.daily();
    KY.events.daily();
    KY.nations.daily();
    KY.cover.daily();
    KY.research.daily();
    KY.media.daily();
    if (S.day % 30 === 0) {
      KY.nations.monthly();
      KY.finance.monthly();
      KY.incidents.monthly();
      KY.advisors.monthly();
      KY.bus.emit('month', S.day);
    }
    if (S.day % 365 === 0) {
      KY.advisors.yearly();
      KY.finance.yearly();
    }
    KY.bus.emit('day', S.day);
  };

  /* dt in Sekunden Echtzeit; liefert Anzahl simulierter Tage */
  E.tick = function (dt) {
    const S = SIM.S;
    if (!S || S.paused) { acc = 0; return 0; }
    acc += Math.min(0.25, dt) * E.SPEEDS[S.speed];
    let n = 0;
    while (acc >= 1 && n < 12) {
      acc -= 1;
      E.stepDay();
      n++;
      if (S.paused) { acc = 0; break; }
    }
    return n;
  };
  E.setSpeed = function (s) {
    const S = SIM.S;
    if (!S) return;
    if (s === 0) { S.paused = true; }
    else { S.speed = s; S.paused = false; }
    KY.bus.emit('speed', { speed: S.speed, paused: S.paused });
  };
  E.toggle = function () {
    const S = SIM.S;
    if (!S) return;
    S.paused = !S.paused;
    KY.bus.emit('speed', { speed: S.speed, paused: S.paused });
  };
  E.pause = function (why) {
    const S = SIM.S;
    if (!S || S.paused) return;
    S.paused = true;
    KY.bus.emit('speed', { speed: S.speed, paused: true, why });
  };
})();

(function () {

  const FC = ['#1f3c88', '#c8102e', '#f4f1e8', '#0b6b3a', '#f2b705', '#16181d', '#5aa0d8', '#7a1f3d', '#e06c1f', '#2b7a78', '#6b4c9a', '#d9d2b6'];
  function emblem(e, cx, cy, r, col) {
    switch (e) {
      case 1: { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1); } return `<path d="${d}Z" fill="${col}"/>`; }
      case 2: return `<circle cx="${cx}" cy="${cy}" r="${r * 0.8}" fill="${col}"/>`;
      case 3: return `<circle cx="${cx}" cy="${cy}" r="${r * 0.75}" fill="none" stroke="${col}" stroke-width="${r * 0.3}"/>`;
      case 4: return `<path d="M${cx} ${cy - r}L${cx + r * 0.75} ${cy}L${cx} ${cy + r}L${cx - r * 0.75} ${cy}Z" fill="${col}"/>`;

    let [a, b, c] = f.c.map(i => FC[i % FC.length]);
    if (a === b) b = FC[(f.c[1] + 4) % FC.length];
    if (c === a || c === b) c = FC[(f.c[2] + 7) % FC.length];
    const W = 36, H = 24;
    let s = '';
    switch (f.type) {
      case 0: s = `<rect width="36" height="8" fill="${a}"/><rect y="8" width="36" height="8" fill="${b}"/><rect y="16" width="36" height="8" fill="${c}"/>`; break;
      case 1: s = `<rect width="12" height="24" fill="${a}"/><rect x="12" width="12" height="24" fill="${b}"/><rect x="24" width="12" height="24" fill="${c}"/>`; break;
      case 2: s = `<rect width="36" height="24" fill="${a}"/><rect x="10" width="6" height="24" fill="${b}"/><rect y="9" width="36" height="6" fill="${b}"/><rect x="11.5" width="3" height="24" fill="${c}"/><rect y="10.5" width="36" height="3" fill="${c}"/>`; break;
      case 3: s = `<rect width="36" height="24" fill="${a}"/><path d="M0 24L36 0V24Z" fill="${b}"/><path d="M0 22L33 0H36V2L3 24H0Z" fill="${c}"/>`; break;
      case 4: s = `<rect width="36" height="24" fill="${a}"/><rect y="12" width="36" height="12" fill="${b}"/><rect width="15" height="12" fill="${c}"/>${emblem(f.e || 1, 7.5, 6, 3.6, a)}`; break;
      case 5: s = `<rect width="36" height="24" fill="${a}"/>${emblem(2, 18, 12, 7.5, b)}${emblem(f.e, 18, 12, 4, c)}`; break;
      case 6: s = `<rect width="36" height="12" fill="${a}"/><rect y="12" width="36" height="12" fill="${b}"/><path d="M0 0L15 12L0 24Z" fill="${c}"/>${emblem(f.e, 5, 12, 3, a)}`; break;
      default: s = `<rect width="36" height="24" fill="${a}"/><rect y="6" width="36" height="12" fill="${b}"/>${emblem(f.e || 1, 18, 12, 4.5, c)}`;
    }
    return `<span class="flag" style="width:${w}px;height:${h}px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg></span>`;
  };

  /* ---------- Markenzeichen ---------- */
  KY.sealSvg = function (size) {
    const ticks = Array.from({ length: 24 }, (_, i) => { const a = i * Math.PI / 12; const r1 = 21, r2 = i % 6 === 0 ? 17.5 : 19.2; return `<line x1="${(24 + Math.cos(a) * r1).toFixed(2)}" y1="${(24 + Math.sin(a) * r1).toFixed(2)}" x2="${(24 + Math.cos(a) * r2).toFixed(2)}" y2="${(24 + Math.sin(a) * r2).toFixed(2)}"/>`; }).join('');
    return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="24" r="22.5"/><circle cx="24" cy="24" r="15.5" stroke-width="1"/>${ticks}<path d="M19 15.5v17M19 24.5l8.5-9M21.8 21.6l6.4 10.9" stroke-width="1.8"/><circle cx="31" cy="15.7" r="1.2" fill="currentColor" stroke="none"/></svg>`;
  };

  /* Wachssiegel für die Vertragsmappe */
  KY.waxSeal = function (text, mono, col) {
    col = col || '#8e1b1b';
    const id = 'ws' + Math.floor(Math.random() * 1e6);
    let blob = '';
    for (let i = 0; i <= 28; i++) {
      const a = i / 28 * Math.PI * 2;
      const r = 58 + Math.sin(i * 2.7) * 2.6 + Math.cos(i * 1.3) * 1.8;
      blob += (i ? 'L' : 'M') + (62 + Math.cos(a) * r).toFixed(1) + ' ' + (62 + Math.sin(a) * r).toFixed(1);
    }
    return `<svg viewBox="0 0 124 124" width="124" height="124" aria-hidden="true">
      <defs><radialGradient id="${id}g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#c0392b"/><stop offset="0.55" stop-color="${col}"/><stop offset="1" stop-color="#4a0d0d"/></radialGradient>
      <path id="${id}p" d="M62 62m-40 0a40 40 0 1 1 80 0a40 40 0 1 1 -80 0"/></defs>

      <circle cx="62" cy="62" r="47" fill="none" stroke="rgba(255,220,200,0.35)" stroke-width="1.2"/>
      <circle cx="62" cy="62" r="31" fill="none" stroke="rgba(255,220,200,0.3)" stroke-width="1"/>
