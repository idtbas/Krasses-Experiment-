  A.pPause = async b => { const p = KY.projects.byId(b.dataset.id); if (await ui.confirm('90 Tage ruhen lassen?', 'Während der Pause gibt es keine Wirkung und keine Einnahmen. Beim Bau steht der Fortschritt still.', 'Ruhen lassen')) { KY.projects.pause(p, 90); ui.renderInsp(true); KY.map.redraw(); } };
  A.pHand = async b => { const p = KY.projects.byId(b.dataset.id); if (await ui.confirm('An den Staat übergeben?', 'Die Anlage geht entschädigungslos an ' + esc(SIM.nName(p.n)) + ' über. Ihre Wirkung bleibt, Einnahmen und künftige Verantwortung enden. Ihr Zugang zur Regierung wächst.', 'Übergeben')) { KY.projects.handover(p); ui.renderInsp(true); KY.map.redraw(); } };
  A.pResub = b => { const p = KY.projects.byId(b.dataset.id); if (KY.projects.resubmit(p)) ui.toast({ t: 'Neuer Antrag gestellt', d: p.name, icon: 'doc', kind: 'good' }); ui.renderInsp(true); };
  A.pStop = async b => {
    const p = KY.projects.byId(b.dataset.id);
    const ant = p.phase === 'antrag';
    if (await ui.confirm(ant ? 'Antrag zurückziehen?' : 'Endgültig stilllegen?', ant ? 'Das Vorhaben wird nicht weiterverfolgt.' : 'Die bisherige Investition von ' + U.money(p.paid) + ' ist verloren. Wirkung und Einnahmen enden. Das lässt sich nicht rückgängig machen.', ant ? 'Zurückziehen' : 'Stilllegen', true)) { KY.projects.shutdown(p, 'auf Anordnung'); ui.renderInsp(true); KY.map.redraw(); }
  };

  /* ---------- Katastrophe ---------- */
  INS.ev = function (id) {
    const S = SIM.S;
    const ev = KY.events.byId(id);
    if (!ev) return null;
    const T = D.EVENTS[ev.type];
    const head = `<div class="row"><div class="ic-c" style="width:40px;height:40px;border-radius:10px;background:rgba(236,131,90,.15);color:var(--serious);display:flex;align-items:center;justify-content:center">${ic(T.icon, 22)}</div><div><div class="lbl">${esc(T.kind)} · Stufe ${ev.sev} von 5</div><h2 style="font-size:18px">${esc(ev.name)}</h2></div></div><div class="sub">${ev.phase === 'vorbei' ? 'Vorüber seit ' + U.dateStr(ev.end, true) : 'Seit ' + U.dateStr(ev.start, true) + ' · noch etwa ' + U.days(ev.end - S.day)}</div>`;
    let b = `<p class="note" style="font-size:13px;margin:0 0 12px">${esc(ev.text)}</p><div class="grid2">${stat('Todesopfer', U.n(ev.deadNow), ev.phase === 'vorbei' ? 'endgültig' : 'bisher')}${stat('Obdachlos', ev.displaced ? U.count(ev.displaced) : '—')}${stat('Durch Ihre Hilfe gerettet', ev.saved ? '<span class="good">' + U.n(Math.round(ev.saved)) + '</span>' : '—')}${stat('Wirtschaftsschaden', U.pct(ev.dmg, 1) + ' BIP')}</div>`;
    b += `<div class="h3">Krisenhilfe</div>` + ['LUFTBRUECKE', 'LAZARETT', 'WIEDERAUFBAU'].map(aid => {
      const Ac = D.ACT[aid];
      if (ev.helped[aid]) return `<div class="okbox" style="margin-bottom:6px">${ic('check', 15)}<div><b>${esc(Ac.name)}</b> angeordnet am ${U.dateStr(ev.helped[aid], true)}</div></div>`;
      const pend = S.projects.find(p => p.act === aid && p.ev === ev.id && KY.projects.ACTIVE[p.phase]);
      if (pend) return `<div class="warnbox" style="margin-bottom:6px">${ic('clock', 15)}<div><b>${esc(Ac.name)}</b> unterwegs</div></div>`;
      return `<div class="card click" data-a="order" data-id="${aid}" data-pl='${JSON.stringify({ ev: ev.id })}'><div class="row">${ic(Ac.icon, 18)}<div style="flex:1"><b>${esc(Ac.name)}</b><div class="dim" style="font-size:12px">${esc(Ac.short)}</div></div>${ic('chevR', 14)}</div></div>`;
    }).join('');
    if (ev.phase !== 'vorbei' && !Object.keys(ev.helped).length) b += `<div class="note" style="margin-top:8px">Je früher Hilfe eintrifft, desto mehr Menschen überleben. Bereits Verstorbene kann niemand retten.</div>`;
    b += `<div class="row" style="margin-top:12px"><button class="btn xs ghost" data-a="nation" data-id="${ev.n}">${esc(SIM.nName(ev.n))}</button></div>`;
    return { head, body: b };
  };

  /* ---------- Tarnstruktur ---------- */
  INS.front = function (id) {
    const S = SIM.S;
    const f = S.fronts.find(z => z.id === id);
    if (!f) return null;
    const K = D.FRONT_KINDS.find(k => k.id === f.kind);
    const head = `<div class="lbl">${esc(K.n)} · Sitz ${esc(f.seat)}</div><h2 style="font-size:19px">${esc(f.name)}</h2><div class="sub">gegründet ${U.dateStr(f.created, true)}${f.exposed ? ' · <span class="bad">enttarnt</span>' : ''}</div>`;
    let b = f.exposed ? '<div class="errbox">' + ic('eye', 15) + '<div>Diese Struktur ist enttarnt. Ihre Vorhaben werden öffentlich einem einzigen Geldgeber zugeschrieben.</div></div>' : `<div class="card"><div class="row sb"><b>Spuren</b><b>${Math.round(f.trace)} %</b></div>${ui.meter(f.trace, f.trace > 80 ? 'var(--crit)' : f.trace > 50 ? 'var(--warn)' : 'var(--blue)')}</div>`;
    b += `<div class="note" style="margin-top:8px">${esc(K.note)}. Passende Bereiche: ${(D.FRONT_FIT[f.kind] || []).map(c => D.CATS.find(x => x.id === c).n).join(', ')}.</div>`;
    b += `<div class="h3">Vorhaben<span class="r dim">${f.projects.length}</span></div>` + (f.projects.length ? '<div class="list">' + f.projects.map(pid => KY.projects.byId(pid)).filter(Boolean).reverse().map(ui.projRow).join('') + '</div>' : '<div class="empty">Keine Vorhaben.</div>');
    const others = S.fronts.filter(z => z.id !== f.id);
    if (others.length && !f.exposed) b += `<div class="h3">Auflösen</div><div class="note" style="margin-bottom:8px">Die Vorhaben gehen auf eine andere Struktur über, ein Teil der Spuren wandert mit.</div><div class="row" style="flex-wrap:wrap;gap:6px">${others.map(o => `<button class="btn xs" data-a="dissolve" data-f="${f.id}" data-t="${o.id}">→ ${esc(o.name)}</button>`).join('')}</div>`;
    return { head, body: b };
  };
  A.dissolve = async b => {
    if (!(await ui.confirm('Struktur auflösen?', 'Die Vorhaben werden übertragen. Laufende Recherchen können der Spur folgen.', 'Auflösen', true))) return;
    const r = KY.cover.dissolve(b.dataset.f, b.dataset.t);
    if (!r.ok) ui.toast({ t: 'Nicht möglich', d: r.err, icon: 'x', kind: 'warn' });
    else { ui.toast({ t: 'Struktur aufgelöst', icon: 'trash', kind: 'good' }); ui.closeInsp(); ui.renderPanel(true); }
  };
})();


/* ===== js/ui/order.js ===== */
/* KYTHERA · MANDAT · Anordnen: Standortwahl auf der Karte und Vorhabenbogen */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data, SIM = KY.sim;
  const ui = KY.ui;
  const ic = (n, s) => KY.icon(n, s || 16);
  const esc = U.esc;
  const O = (KY.order = {});
  const P = () => KY.projects;

  const KIND = { 'city': 'city', 'city-big': 'city', 'city-coast': 'city', 'nation': 'nation', 'two-nations': 'two', 'land': 'point', 'land-or-sea': 'point', 'land-high': 'point', 'land-water': 'point', 'river': 'point', 'coast-equator': 'point', 'line-land': 'line', 'line-sea': 'line', 'line-sea-long': 'line', 'area-land': 'area', 'area-sea': 'area', 'area-desert': 'area', 'event': 'event', 'global': 'none', 'front': 'front' };
  const HINT = {
    city: 'Klicken Sie auf eine hervorgehobene Stadt.', nation: 'Klicken Sie auf einen Staat.', two: 'Wählen Sie nacheinander zwei Staaten.',
    point: 'Klicken Sie auf einen geeigneten Standort.', line: 'Wählen Sie die erste Stadt, dann die zweite.', area: 'Halten Sie das Trackpad gedrückt und ziehen Sie ein Gebiet auf.', event: 'Klicken Sie auf eine laufende Katastrophe.',
  };

  O.start = function (actId, preset) {
    const A = D.ACT[actId];
    if (!A) return;
    if (A.research) { ui.panel('forschung', { keep: true }); return; }
    if (A.place === 'front') { O.newFrontDialog(); return; }
    O.cancel(true);
    const kind = KIND[A.place];
    if (preset && Object.keys(preset).length) { O.sheet(actId, preset); return; }
    if (kind === 'none') { O.sheet(actId, {}); return; }
    if (kind === 'event' && !KY.events.active().length) { ui.toast({ t: 'Keine laufende Katastrophe', d: 'Krisenhilfe ist nur bei akuten Ereignissen möglich.', icon: 'info' }); return; }
    // Voraussetzungen vorab prüfen
    const pre = P().ctx(A, null, P().defaults(A));
    const hard = pre.errs.find(e => /Erfordert/.test(e));
    if (hard) { ui.toast({ t: A.name, d: hard, icon: 'lock', kind: 'warn' }); return; }
    if (ui.cur === 'handeln' || ui.cur === 'staaten') ui.closePanel();
    begin(A, kind);
  };

  function hint(A, txt, err) {
    const h = U.$('#placehint');
    h.innerHTML = `<div class="ic-c" style="color:var(--gold2)">${ic(A.icon, 20)}</div><div class="t"><b>${esc(A.name)}</b><div>${esc(txt)}</div>${err ? '<div class="err">' + esc(err) + '</div>' : ''}</div><button class="btn sm ghost" data-a="cancelPlace">Abbrechen <span class="kbd">esc</span></button>`;
    h.classList.add('on');
  }
  KY.A.cancelPlace = () => O.cancel();
  O.cancel = function (silent) {
    if (!KY.map.placing) return;
    KY.map.cancelPlace();
    document.body.classList.remove('placing');
    U.$('#placehint').classList.remove('on');
    if (!silent) ui.toast({ t: 'Platzierung abgebrochen', icon: 'x', ms: 1600 });
  };

  function begin(A, kind) {
    const defs = P().defaults(A);
    const cityOk = c => {
      if (A.place === 'city-big') return SIM.S.cities[c.id].pop >= 1.2;
      if (A.place === 'city-coast' || A.place === 'line-sea' || A.place === 'line-sea-long') return c.coastal;
      return true;
    };
    const done = pl => { O.cancel(true); O.sheet(A.id, pl); };
    let throttle = 0;
    const pl = { kind };
    if (kind === 'city') {
      pl.cityFilter = cityOk;
      pl.onClick = h => { if (h.type === 'city' && cityOk(SIM.W.cities[h.id])) done({ c: h.id }); else hint(A, HINT.city, 'Hier nicht möglich.'); };
    } else if (kind === 'nation') {
      pl.onClick = h => { const id = h.type === 'nation' ? h.id : h.type === 'city' ? SIM.W.cities[h.id].nation : -1; if (id >= 0) done({ n: id }); };
    } else if (kind === 'two') {
      pl.onClick = h => {
        const id = h.type === 'nation' ? h.id : h.type === 'city' ? SIM.W.cities[h.id].nation : -1;
        if (id < 0) return;
        if (pl.first < 0) { pl.first = id; hint(A, 'Erster Staat: ' + SIM.nName(id) + '. Wählen Sie jetzt den zweiten Staat.'); }
        else if (id !== pl.first) done({ n: pl.first, n2: id });
      };
    } else if (kind === 'point') {
      pl.onMove = (x, y) => {
        const now = performance.now(); if (now - throttle < 60) return; throttle = now;
        const ll = KY.map.toLonLat(x, y);
        const c = P().ctx(A, { lon: ll.lon, lat: ll.lat }, defs);
        pl.valid = !c.errs.length;
        hint(A, HINT.point + (pl.valid && c.cid >= 0 ? ' Nächste Stadt: ' + SIM.cName(c.cid) + '.' : ''), c.errs[0]);
      };
      pl.onClick = (h, x, y) => {
        const ll = KY.map.toLonLat(x, y);
        const c = P().ctx(A, { lon: ll.lon, lat: ll.lat }, defs);
        if (c.errs.length) { hint(A, HINT.point, c.errs[0]); KY.audio.play('err'); return; }
        done({ lon: ll.lon, lat: ll.lat });
      };
    } else if (kind === 'line') {
      pl.cityFilter = c => cityOk(c) && c.id !== pl.first;
      pl.onMove = (x, y) => {
        if (pl.first < 0) return;
        const h = KY.map.placing && hover(x, y);
        if (h && h.type === 'city') {
          const c = P().ctx(A, { c: pl.first, c2: h.id }, defs);
          pl.valid = !c.errs.length; pl.km = c.km;
          hint(A, 'Von ' + SIM.cName(pl.first) + ' nach ' + SIM.cName(h.id) + ' · ' + U.n(c.km) + ' km', c.errs[0]);
        } else { pl.valid = undefined; pl.km = 0; }
      };
      pl.onClick = h => {
        if (h.type !== 'city' || !cityOk(SIM.W.cities[h.id])) return;
        if (pl.first < 0) { pl.first = h.id; hint(A, 'Start: ' + SIM.cName(h.id) + '. Wählen Sie jetzt die Zielstadt.'); return; }
        if (h.id === pl.first) return;
        const c = P().ctx(A, { c: pl.first, c2: h.id }, defs);
        if (c.errs.length) { hint(A, 'Von ' + SIM.cName(pl.first) + ' nach ' + SIM.cName(h.id), c.errs[0]); KY.audio.play('err'); return; }
        done({ c: pl.first, c2: h.id });
      };
    } else if (kind === 'area') {
      pl.onArea = (dr, fin) => {
        const a = KY.map.toLonLat(dr[0], dr[1]), b = KY.map.toLonLat(dr[2], dr[3]);
        const q = { lon0: a.lon, lat0: a.lat, lon1: b.lon, lat1: b.lat };
        const c = P().ctx(A, q, defs);
        pl.valid = !c.errs.length;
        pl.areaTxt = U.count(c.area) + ' km² geeignet' + (c.nid >= 0 ? ' · ' + SIM.nName(c.nid) : '');
        hint(A, HINT.area, c.errs[0]);
        if (fin) { if (c.errs.length) { KY.audio.play('err'); pl.drag = null; return; } done(q); }
      };
    } else if (kind === 'event') {
      pl.onClick = h => { if (h.type === 'ev') { const ev = KY.events.byId(h.id); if (ev && ev.phase !== 'vorbei') done({ ev: h.id }); } };
    }
    KY.map.place(pl);
    document.body.classList.add('placing');
    hint(A, HINT[kind]);
    KY.audio.play('nav');
  }
  // Treffer an der Mausposition (über die Karte)
  function hover(x, y) {
    const W = SIM.W;
    let best = null, bd = 14;
    W.cities.forEach(c => { const p = KY.map.llScreen(c.lon, c.lat); const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = c; } });
    return best ? { type: 'city', id: best.id } : null;
  }

  /* ---------- Vorhabenbogen ---------- */
  O.sheet = function (actId, pl) {
    const A = D.ACT[actId];
    const S = SIM.S;
    const o = P().defaults(A);
    if (S.g.auflagen && S.day < S.g.auflagen.until && S.g.auflagen.kind === 'safety' && o.safety) o.safety = 'max';
    const noFront = A.cat === 'cover';
    const fronts = S.fronts.filter(f => !f.dissolved);
    let front = (fronts.filter(f => !f.exposed).sort((a, b) => (KY.cover.fit(b, A) - KY.cover.fit(a, A)) || (a.trace - b.trace))[0] || fronts[0] || {}).id;
    const no = 'KY-V/' + U.year(S.day) + '/' + U.pad(S.seq.proj + 1, 4);
    const m = ui.modal({
      cls: 'w900', html: `<div class="mh"><div class="ic-c" style="width:44px;height:44px;border-radius:11px;background:rgba(201,162,79,.12);color:var(--gold2);display:flex;align-items:center;justify-content:center;flex:none">${ic(A.icon, 24)}</div><div class="tt" style="flex:1;min-width:0"><div class="lbl">Vorhabenbogen ${no} · ${esc(D.CATS.find(c => c.id === A.cat).n)}</div><h2>${esc(A.name)}</h2><div class="sub dim" id="sh-loc" style="font-size:12px;margin-top:2px"></div></div><button class="iconbtn" data-a="mclose">${ic('close', 18)}</button></div>
        <div class="sheet"><div class="opts" id="sh-opts"></div><div class="sum" id="sh-sum"></div></div>
        <div class="mf"><span class="l" id="sh-foot"></span><button class="btn ghost" data-a="mclose">Abbrechen</button><button class="btn primary hold" id="sh-ok"><span class="fill"></span><span id="sh-okl">Anordnen</span></button></div>`,
      onKey: e => { if (e.key === 'Enter') { e.preventDefault(); confirm(); } },
    });
    let q = null;
    const render = () => {
      q = P().quote(actId, pl, o);
      const x = q.x;
      U.$('#sh-loc', m.el).innerHTML = locText(A, x);
      // Optionen
      let h = `<p class="note" style="font-size:13px;margin:0 0 16px">${esc(A.text)}</p>`;
      P().optionGroups(A).forEach(g => {
        h += `<div class="og"><div class="ol">${esc(g.label)}</div><div class="choices">${g.choices.map(c => `<button class="choice ${o[g.id] === c.v ? 'on' : ''}" data-g="${g.id}" data-v="${c.v}"><div class="l">${esc(c.l)}</div>${c.note ? '<div class="n">' + esc(c.note) + '</div>' : ''}</button>`).join('')}</div></div>`;
      });
      if (!noFront) {
        h += `<div class="og"><div class="ol">Träger (Tarnstruktur)</div><div class="choices">${fronts.map(f => { const fit = KY.cover.fit(f, A); return `<button class="choice ${front === f.id ? 'on' : ''}" data-front="${f.id}"><div class="l">${esc(f.name)}</div><div class="n">${f.exposed ? '<span class="bad">enttarnt</span>' : 'Spuren ' + Math.round(f.trace) + ' %'} · ${fit ? '<span class="good">passend</span>' : 'unpassend'} · ${f.projects.length} Vorhaben</div></button>`; }).join('')}</div></div>`;
      }
      U.$('#sh-opts', m.el).innerHTML = h;
      // Zusammenfassung
      let s = '';
      if (q.errs.length) s += q.errs.map(e => `<div class="errbox" style="margin-bottom:8px">${ic('x', 15)}<div>${esc(e)}</div></div>`).join('');
      if (q.cost !== undefined) {
        const fr = S.fronts.find(f => f.id === front);
        const tg = noFront ? 0 : KY.cover.traceGain(A, o, x, fr, q.vis);
        s += `<div class="lbl">Kosten</div><div class="bigsum">${U.money(q.cost)}</div><div class="dim" style="font-size:12px">${A.instant ? 'sofort fällig' : '15 % bei Baubeginn, Rest über die Bauzeit'} · verfügbar ${U.money(KY.finance.avail())}</div>
          <div style="margin-top:12px">
          <div class="kv"><span>${A.instant ? 'Dauer bis Wirkung' : A.program ? 'Laufzeit' : 'Bauzeit'}</span><span>${U.days(q.days)}</span></div>
          ${q.approval ? `<div class="kv"><span>Genehmigungsaussicht</span><span class="${q.chance < 40 ? 'bad' : q.chance > 70 ? 'good' : 'warnc'}">${q.chance} %</span></div>` : '<div class="kv"><span>Genehmigung</span><span>nicht erforderlich</span></div>'}
          ${A.diplo ? `<div class="kv"><span>Erfolgschance</span><span>${Math.round(x.chance * 100)} %</span></div>` : ''}
          ${q.income ? `<div class="kv"><span>Einnahmen</span><span>${U.money(q.income)}/Jahr</span></div>` : ''}

          ${!noFront ? `<div class="kv"><span>Neue Spuren</span><span class="${tg > 10 ? 'warnc' : ''}">+${U.n(tg, 1)} %</span></div>` : ''}
          <div class="kv"><span>Sichtbarkeit</span><span>${q.vis >= 7 ? 'sehr hoch' : q.vis >= 4 ? 'hoch' : q.vis >= 2 ? 'mittel' : 'gering'}</span></div></div>`;
        if (q.describe && q.describe.length) s += `<div class="h3">Erwartete Wirkung</div>` + q.describe.map(d => `<div style="font-size:12.5px;padding:3px 0;display:flex;gap:6px">${ic('arrowR', 12)}<span>${esc(d)}</span></div>`).join('');
        if (q.risks && q.risks.length) s += `<div class="h3">Risiken pro Jahr</div>` + q.risks.map(r => `<div class="kv"><span>${esc(r.n)} <span class="mute">(${r.phase === 'bau' ? 'Bau' : 'Betrieb'})</span></span><span class="${r.py > 0.08 ? 'bad' : r.py > 0.03 ? 'warnc' : ''}">${U.pct(r.py * 100, 1)}</span></div>`).join('') + '<div class="dim" style="font-size:11px;margin-top:4px">Schwere reicht von Stufe ' + Math.min.apply(null, q.risks.map(r => r.sev[0])) + ' bis ' + Math.max.apply(null, q.risks.map(r => r.sev[1])) + '.</div>';
        if (A.opposeWho) s += `<div class="h3">Öffentliche Reaktion</div><div style="font-size:12px"><div><span class="good">Dafür:</span> ${esc(A.supportWho || '—')}</div><div style="margin-top:3px"><span class="bad">Dagegen:</span> ${esc(A.opposeWho)}</div></div>`;
        const R = D.REACT[A.id];
        if (R) s += '<div class="bars" style="margin-top:8px">' + D.MILIEUS.map((ml, i) => `<div class="b"><span>${esc(ml.n)}</span>${ui.dmeter(R[i] * 100)}<span>${R[i] > 0.15 ? '+' : R[i] < -0.15 ? '−' : '○'}</span></div>`).join('') + '</div>';
        if (q.warns.length) s += '<div style="margin-top:12px">' + q.warns.map(w => `<div class="warnbox" style="margin-bottom:6px">${ic('alert', 15)}<div>${esc(w)}</div></div>`).join('') + '</div>';
        if (q.principles.length) s += '<div style="margin-top:6px">' + q.principles.map(b => `<div class="errbox" style="margin-bottom:6px">${ic('scale', 15)}<div><b>Grundsatzbruch:</b> ${esc(b.n)}</div></div>`).join('') + '</div>';
      }
      U.$('#sh-sum', m.el).innerHTML = s;
      const ok = U.$('#sh-ok', m.el);
      ok.classList.toggle('disabled', !q.ok);
      ok.classList.toggle('danger', q.principles.length > 0);
      ok.classList.toggle('primary', !q.principles.length);
      U.$('#sh-okl', m.el).textContent = q.principles.length ? 'Trotzdem anordnen' : q.approval ? 'Antrag stellen' : 'Anordnen';
      U.$('#sh-foot', m.el).innerHTML = q.ok ? 'Gedrückt halten zum Zeichnen · <span class="kbd">↵</span>' : '';
    };
    m.el.addEventListener('click', e => {
      const c = e.target.closest('.choice');
      if (!c) return;
      if (c.dataset.front) front = c.dataset.front;
      else o[c.dataset.g] = c.dataset.v;
      KY.audio.play('click');
      render();
    });
    // Gedrückt halten zum Zeichnen
    const ok = U.$('#sh-ok', m.el);
    let hold = null;
    const fill = U.$('.fill', ok);
    ok.addEventListener('pointerdown', e => {
      if (!q || !q.ok) return;
      e.preventDefault();
      const t0 = performance.now();
      const step = () => {
        const f = Math.min(1, (performance.now() - t0) / 650);
        fill.style.width = (f * 100) + '%';
        if (f >= 1) { hold = null; confirm(); return; }
        hold = requestAnimationFrame(step);
      };
      hold = requestAnimationFrame(step);
    });
    const release = () => { if (hold) cancelAnimationFrame(hold); hold = null; fill.style.width = '0'; };
    ok.addEventListener('pointerup', release);
    ok.addEventListener('pointerleave', release);
    function confirm() {
      if (!q || !q.ok || m.closed) return;
      const r = P().order(q, front);
      if (!r.ok) { ui.toast({ t: 'Nicht möglich', d: r.err, icon: 'x', kind: 'crit' }); return; }
      m.close();
      KY.audio.play('grant');
      ui.toast({ t: A.approval ? 'Antrag gestellt' : 'Angeordnet', d: r.p.name, icon: A.icon, kind: 'good', onClick: () => ui.inspect('proj', r.p.id) });
      if (A.place !== 'global') ui.inspect('proj', r.p.id);
      KY.map.dataChanged(1);
      ui.refresh();
    }
    render();
  };

  function locText(A, x) {
    const out = [];
    if (x.cid >= 0 && x.c) out.push(ic('pin', 12) + ' ' + esc(x.c.name));
    if (x.c2id >= 0 && x.c2 && A.place.indexOf('line') === 0) out.push('→ ' + esc(x.c2.name) + ' · ' + U.n(x.km) + ' km' + (x.seaKm ? ' (davon ' + U.n(x.seaKm) + ' km über Wasser)' : ''));
    if (x.nid >= 0) out.push(KY.flag(SIM.W.nations[x.nid], 12) + ' ' + esc(SIM.nName(x.nid)));
    if (x.n2id >= 0 && A.place === 'two-nations') { const R = SIM.rel(x.nid, x.n2id); out.push('und ' + KY.flag(SIM.W.nations[x.n2id], 12) + ' ' + esc(SIM.nName(x.n2id)) + ' · ' + SIM.REL_NAMES[R.state] + ' (' + Math.round(R.v) + ')'); }
    if (x.area) out.push(U.count(x.area) + ' km²');
    if (x.ev) out.push(esc(x.ev.name));
    if (A.place === 'land' || A.place === 'land-or-sea') out.push(x.sea ? 'vor der Küste' : esc(KY.geo.biomeName(x.biome)));
    if (A.id === 'SOLAR') out.push('Sonne ' + Math.round(x.sun * 100) + ' %');
    if (A.id === 'WIND') out.push('Wind ' + Math.round(x.windQ * 100) + ' %');
    if (A.place === 'global') out.push('weltweit');
    return out.join(' · ');
  }

/* KYTHERA · MANDAT · Krisenstab, Anruf, Anhörung, Enttarnung, Jahresbericht */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data, SIM = KY.sim;
  const ui = KY.ui;
  const ic = (n, s) => KY.icon(n, s || 16);
  const esc = U.esc;
  const C = (KY.crisis = {});

  /* ---------- Eingehender Anruf ---------- */
  let callEl = null;
  C.call = function (inc) {
    if (callEl) callEl.remove();
    const a = SIM.adv('haddad');
    callEl = U.el(`<div class="call"><div class="avatar" style="background:${a.color}">${a.init}</div><div style="flex:1;min-width:0"><div class="lbl" style="color:#ff9f94">Eingehender Anruf · Krisenstab</div><b>${esc(a.name)}</b><div class="dim ell" style="font-size:12px">${esc(inc.name)} · ${esc(inc.projName)}</div></div><div class="col" style="gap:6px"><button class="btn sm danger" id="call-ok">${ic('phone', 14)} Annehmen</button><button class="btn xs ghost" id="call-no">Später</button></div></div>`);
    U.$('#game').appendChild(callEl);
    KY.audio.play('alert');
    const ring = setInterval(() => KY.audio.play('alert'), 2600);
    const end = () => { clearInterval(ring); if (callEl) { callEl.remove(); callEl = null; } };
    U.$('#call-ok', callEl).addEventListener('click', () => { end(); C.open(inc.id); });
    U.$('#call-no', callEl).addEventListener('click', () => { end(); ui.toast({ t: 'Der Krisenstab wartet', d: 'Frist bis ' + U.dateStr(inc.deadline, true) + ' · Taste E öffnet den Krisenstab.', icon: 'clock', kind: 'warn' }); });
    setTimeout(() => { if (callEl) end(); }, 14000);
  };

  /* ---------- Krisenstab ---------- */
  C.open = function (incId) {
    const S = SIM.S;
    const inc = KY.incidents.byId(incId);
    if (!inc) return;
    KY.engine.pause('krisenstab');
    const open = inc.status === 'offen';
    const sel = new Set();
    const m = ui.modal({
      cls: 'w900 crisis', dismiss: true,
      html: `<div class="mh"><div class="siren">${ic('siren', 24)}</div><div class="tt" style="flex:1;min-width:0"><div class="lbl" style="color:#ff9f94">Krisenstab · ${esc(SIM.adv('haddad').name)} · ${open ? 'Entscheidung erforderlich' : 'Entschieden am ' + U.dateStr(inc.decidedAt, true)}</div><h2>${esc(inc.name)} · ${esc(inc.projName)}</h2><div class="dim" style="font-size:12px;margin-top:3px">${ic('pin', 12)} ${inc.c >= 0 ? esc(SIM.cName(inc.c)) + ', ' : ''}${esc(SIM.nName(inc.n))} · ${U.dateStr(inc.day)} · Stufe ${inc.sev} von 5</div></div><button class="iconbtn" data-a="mclose">${ic('close', 18)}</button></div>
        <div class="mb" id="cr-b"></div>
        <div class="mf" id="cr-f"></div>`,
    });
    const draw = () => {
      const left = inc.deadline - S.day;
      const news = S.news.filter(a => a.inc === inc.id || (a.proj === inc.proj && a.day >= inc.day)).slice(0, 3);
      const posts = S.social.filter(p => p.n === inc.n && (p.kind === 'incident' || p.kind === 'grief') && p.day >= inc.day).slice(0, 2);
      const p = KY.projects.byId(inc.proj);
      const f = p ? S.fronts.find(z => z.id === p.front) : null;
      let h = `<p style="font:16px/1.55 var(--serif);color:#efe7da;margin:0">${esc(inc.title)}</p>
        <div class="casualty">
          <div class="stat dead"><div class="k">Todesopfer</div><div class="v">${U.n(inc.deadNow)}</div><div class="s">${inc.deadNow < inc.dead ? '<span class="bad">Zahl steigt</span>' : inc.dead ? 'bestätigt' : 'keine'}</div></div>
          <div class="stat"><div class="k">Verletzte</div><div class="v">${U.n(inc.injured)}</div></div>
          <div class="stat"><div class="k">Evakuiert / obdachlos</div><div class="v">${U.count(inc.displaced)}</div></div>
          <div class="stat"><div class="k">Schaden</div><div class="v">${U.money(inc.dmg || inc.lossFin)}</div></div></div>`;
      if (inc.dead > 0) h += `<div class="memorial" style="margin-bottom:10px">${ic('candle', 15)} Jedes dieser Leben hatte einen Namen. Das Register vergisst keinen davon.</div>`;
      h += `<div class="grid2" style="gap:14px;align-items:start"><div>`;
      h += `<div class="h3">Lagebeurteilung</div><div class="card"><div class="row top">${ui.advAvatar('haddad', 30)}<div class="note" style="font-size:12.5px">${assessment(inc, p, f)}</div></div></div>`;
      if (inc.fundPaid) h += `<div class="okbox" style="margin-top:8px">${ic('heart', 15)}<div>Der Entschädigungsfonds hat Betroffenen bereits ${U.money(inc.fundPaid)} Soforthilfe gezahlt.</div></div>`;
      if (inc.verdict) h += `<div class="card" style="margin-top:8px"><div class="lbl">Untersuchungsbericht</div><div class="note" style="margin-top:4px">${esc(inc.verdict)}</div></div>`;
      h += `</div><div><div class="h3">Was die Welt sieht</div>` + (news.map(a => `<div class="art" data-a="article" data-id="${a.id}" style="padding:8px 0"><div class="meta">${esc((D.CHANNELS.find(c => c.id === a.ch) || {}).name || '')}</div><div class="h" style="font-size:14px">${esc(a.h)}</div></div>`).join('') || '<div class="dim" style="font-size:12px">Noch keine Berichte.</div>') + posts.map(po => `<div class="post" style="padding:7px 0"><div style="min-width:0"><div class="nm" style="font-size:11.5px">${esc(po.name)} <span>${esc(po.handle)}</span></div><div class="tx" style="font-size:12px">${esc(po.text)}</div></div></div>`).join('') + `</div></div>`;
      if (open) {
        h += `<div class="h3">Ihre Entscheidung <span class="r deadline">${left < 0 ? 'Frist seit ' + U.days(-left) + ' überschritten' : left === 0 ? 'Frist endet heute' : 'Frist: ' + U.dateStr(inc.deadline, true) + ' (noch ' + U.days(left) + ')'}</span></div><div class="resp">`;
        D.RESPONSES.forEach(R => {
          const av = KY.incidents.respAvailable(inc, R.id) || R.id === 'silence' || R.id === 'statement' || R.id === 'inquiry';
          if (!av) return;
          const cost = KY.incidents.respCost(inc, R.id);
          const label = R.id === 'statement' && S.g.face ? 'Erklärung durch ' + S.g.face.name : R.n;
          h += `<button class="choice ${sel.has(R.id) ? 'on' : ''} ${R.id === 'silence' ? 'silence' : ''}" data-r="${R.id}"><span class="ic-c">${ic(R.icon, 18)}</span><span><div class="l">${esc(label)}</div><div class="n">${esc(R.text)}</div><div class="cost">${cost > 0 ? U.money(cost) : 'keine Kosten'}</div></span></button>`;
        });
        h += '</div>';
      } else {
        h += `<div class="h3">Ihre Entscheidung</div><div class="row" style="gap:6px;flex-wrap:wrap">${inc.responses.map(r => `<span class="chip ${r === 'silence' ? 'red' : 'green'}">${esc(D.RESPONSES.find(x => x.id === r).n)}</span>`).join('')}${inc.late ? '<span class="chip amber">nach Fristablauf</span>' : ''}${inc.versaeumt ? '<span class="stamp">Versäumnis</span>' : ''}</div>`;
      }
      U.$('#cr-b', m.el).innerHTML = h;
      const tot = Array.from(sel).reduce((s, r) => s + KY.incidents.respCost(inc, r), 0);
      U.$('#cr-f', m.el).innerHTML = open
        ? `<span class="l">${sel.size ? 'Gesamtkosten ' + U.money(tot) : 'Wählen Sie eine oder mehrere Maßnahmen'}</span><button class="btn ghost" data-a="mclose">Später entscheiden</button><button class="btn ${sel.has('silence') ? 'danger' : 'primary'} hold" id="cr-ok" ${sel.size ? '' : 'disabled'}><span class="fill"></span><span>${sel.has('silence') ? 'Schweigen' : 'Entscheidung zeichnen'}</span></button>`
        : `<button class="btn ghost" data-a="proj" data-id="${inc.proj}">Vorhaben ansehen</button><button class="btn primary" data-a="mclose">Schließen</button>`;
      const ok = U.$('#cr-ok', m.el);
      if (ok) holdBtn(ok, () => {
        const r = KY.incidents.respond(inc.id, Array.from(sel));
        if (!r.ok) { ui.toast({ t: 'Nicht möglich', d: r.err, icon: 'x', kind: 'crit' }); return; }
        KY.audio.play(sel.has('silence') ? 'deny' : 'gavel');
        m.close();
        ui.toast({ t: 'Entscheidung gezeichnet', d: inc.name + ' · ' + inc.projName, icon: 'pen', kind: sel.has('silence') ? 'warn' : 'good' });
        ui.refresh(); KY.map.redraw();
      });
    };
    m.el.addEventListener('click', e => {
      const c = e.target.closest('.choice[data-r]');
      if (c) {
        const r = c.dataset.r;
        if (r === 'silence') { sel.clear(); sel.add('silence'); }
        else { sel.delete('silence'); if (sel.has(r)) sel.delete(r); else sel.add(r); if (r === 'shutdown') sel.delete('pause'); if (r === 'pause') sel.delete('shutdown'); }
        KY.audio.play('click');
        draw();
        return;
      }
      const t = e.target.closest('[data-a]');
      if (t && t.dataset.a !== 'mclose') setTimeout(() => m.close(), 0);
    });
    draw();
  };
  function assessment(inc, p, f) {
    const S = SIM.S;
    const out = [];
    if (inc.noHarm) out.push('Es gibt keine Verletzten, aber der Vorfall kostet Geld und Glaubwürdigkeit.');
    else if (inc.dead >= 50) out.push('Das ist eine Katastrophe. Die Bilder gehen um die Welt, und die Menschen vor Ort wollen wissen, wer dafür einsteht.');
    else if (inc.dead > 0) out.push('Menschen sind gestorben. Die Angehörigen und die Öffentlichkeit erwarten eine Antwort.');
    else out.push('Glücklicherweise ist niemand ums Leben gekommen. Trotzdem wird genau beobachtet, wie der Betreiber reagiert.');
    if (inc.safety === 'min') out.push('Wir haben beim Sicherheitsstandard gespart. Eine Untersuchung wird das wahrscheinlich zutage fördern.');
    if (f && !f.exposed && f.trace > 50) out.push('Achtung: ' + f.name + ' steht bereits unter Beobachtung. Eine Untersuchung und öffentliche Erklärungen erzeugen weitere Spuren.');
    if (S.g.pressure > 60) out.push('Der Druck auf Sie ist schon jetzt hoch.');
    if (p && KY.projects.ACTIVE[p.phase] && inc.sev >= 3 && !p.retrofit) out.push('Ohne Nachrüstung kann es wieder passieren.');
    out.push('Die Entscheidung liegt bei Ihnen.');
    return out.map(esc).join(' ');
  }
  function holdBtn(btn, done) {
    const fill = U.$('.fill', btn);
    let raf = null;
    btn.addEventListener('pointerdown', e => {
      if (btn.disabled) return;
      e.preventDefault();
      const t0 = performance.now();
      const step = () => { const f = Math.min(1, (performance.now() - t0) / 700); fill.style.width = f * 100 + '%'; if (f >= 1) { raf = null; done(); return; } raf = requestAnimationFrame(step); };
      raf = requestAnimationFrame(step);
    });
    const rel = () => { if (raf) cancelAnimationFrame(raf); raf = null; fill.style.width = '0'; };
    btn.addEventListener('pointerup', rel); btn.addEventListener('pointerleave', rel);
  }
  C.holdBtn = holdBtn;

  /* ---------- Anhörung ---------- */
  C.hearing = function () {
    const S = SIM.S, H = S.g.hearing;

    KY.engine.pause('anhoerung');

    const m = ui.modal({
      cls: 'w900', dismiss: false,
      html: `<div class="mh"><div class="siren" style="background:rgba(201,162,79,.16);color:var(--gold2);animation:none">${ic('gavel', 24)}</div><div class="tt"><div class="lbl">Kuratorium des Stiftungsverbunds Kythera · vertrauliche Sitzung</div><h2>Anhörung der Mandatsperson „${esc(S.codename)}“</h2></div></div><div class="mb" id="hr-b"></div><div class="mf" id="hr-f"></div>`,
    });
    const draw = () => {
      if (qi >= H.qs.length) {
        U.$('#hr-b', m.el).innerHTML = `<div class="letter"><div class="lh"><span>PROTOKOLL DER ANHÖRUNG</span><span>${U.dateStr(S.day, true).toUpperCase()}</span></div><p>Die Mandatsperson hat alle Fragen des Kuratoriums beantwortet. Das Kuratorium zieht sich zur Beratung zurück.</p><div class="sig">Dr. h. c. Ingeborg Lindqvist<br><span style="font-size:12px">Vorsitzende des Kuratoriums</span></div></div>`;
        U.$('#hr-f', m.el).innerHTML = '<button class="btn primary" id="hr-done">Sitzung beenden</button>';

        return;
      }
      const Q = H.qs[qi];
      U.$('#hr-b', m.el).innerHTML = `<div class="row" style="gap:14px;align-items:flex-start;margin-bottom:16px">${ui.advAvatar('kuratorium', 40)}<div><div class="lbl">Frage ${qi + 1} von ${H.qs.length} · Dr. h. c. Ingeborg Lindqvist</div><p style="font:18px/1.5 var(--serif);color:#f0e8d8;margin:6px 0 0">„${esc(Q.q)}“</p></div></div><div class="col">${Q.a.map((a, i) => `<button class="choice" data-i="${i}" style="padding:12px 14px"><div class="l" style="font-weight:500;font-size:13.5px">${esc(a.t)}</div></button>`).join('')}</div>`;
      U.$('#hr-f', m.el).innerHTML = '<span class="l">Ihre Antwort wird protokolliert.</span>';
    };
    m.el.addEventListener('click', e => {
      const c = e.target.closest('.choice[data-i]');
      if (!c) return;
      ans.push(+c.dataset.i); qi++;
      KY.audio.play('click');
      draw();
    });
    draw();
  };

  C.reveal = function () {

    const el = U.el(`<div class="reveal"><div class="in"><div class="stamp" style="font-size:12px">Öffentliche Phase</div>
      <h1>„Hinter allem steht ein einziger Mensch.“</h1>

      <p style="font-size:13px;color:#8d97a3">Ihre Identität bleibt nach § 6 der Geheimhaltungsvereinbarung versiegelt. Ab heute wird jede Entscheidung öffentlich Ihnen zugeschrieben: ${U.count(Math.round(g.lives))} gerettete Leben, ${U.n(g.deaths)} Todesopfer.</p>

  /* ---------- Jahresbericht ---------- */
  C.report = function (d, readOnly) {
    const m = ui.modal({
      cls: 'w560', html: `<div class="mb" style="padding:22px"><div class="letter"><div class="lh"><span>KURATORIUM · JAHRESBERICHT ${d.year}</span><span>${U.dateStr(d.day, true).toUpperCase()}</span></div>

/* ===== js/ui/contracts.js ===== */
/* KYTHERA · MANDAT · Vertragsmappe: acht Urkunden, Paraphen, Unterschrift, Siegel */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data;
  const ic = (n, s) => KY.icon(n, s || 16);
  const esc = U.esc;
  const K = (KY.contracts = {});

  const initialsOf = cn => {
    const w = String(cn || 'N. N.').replace(/[^A-Za-zÄÖÜäöüß. -]/g, '').split(/[\s.-]+/).filter(Boolean);
    return (w.length ? w.slice(0, 3).map(x => x[0].toUpperCase()).join('.') : 'N.N') + '.';
  };
  K.initialsOf = initialsOf;
  const fillTxt = (t, st) => esc(U.fill(t, { codename: st.vals.codename || 'N. N.', aktenzeichen: st.akz }));
  const isDone = (c, st) => {
    const fOk = c.fields.every(f => f.type === 'multi' || (st.vals[f.id] !== undefined && String(st.vals[f.id]).trim() !== ''));
    const iOk = c.initials.every(i => st.ini[c.id] && st.ini[c.id][i.id]);
    return { fOk, iOk, sOk: !!st.sigs[c.id], all: fOk && iOk && !!st.sigs[c.id] };
  };

  /* Papierdarstellung einer Urkunde */
  function paper(c, st, o) {
    o = o || {};
    const ro = !!o.readonly;
    const cn = st.vals.codename || 'N. N.';
    let h = `<div class="paper" id="paper-${c.id}"><div class="conf"><span>Streng vertraulich · Ausfertigung für die Mandatsperson</span><span>${esc(c.no)}</span></div>
      <div class="head"><div class="no">AKTENZEICHEN ${esc(st.akz)} · URKUNDE ${D.CONTRACTS.indexOf(c) + 1} VON ${D.CONTRACTS.length}</div><h1>${esc(c.title)}</h1><div class="sub">${esc(c.sub)}</div></div>
      <div class="parties"><div class="p"><b>${esc(c.party)}</b>vertreten durch ${esc(c.signer)}</div><div class="and">und</div><div class="p"><b>die Mandatsperson „<span class="cn">${esc(cn)}</span>“</b>nachfolgend „Mandatsperson“</div></div>
      <div class="summary"><b>KURZFASSUNG DES NOTARIATS</b>${esc(c.summary)}</div>`;
    c.sections.forEach(s => { h += `<h4>${esc(s.h)}</h4>` + s.p.map(p => `<p>${fillTxt(p, st)}</p>`).join(''); });
    // Festlegungen
    c.fields.forEach(f => {
      h += `<div class="cf"><div class="fl">Festlegung · ${esc(f.label)}</div>${f.hint ? '<div class="fh">' + esc(f.hint) + '</div>' : ''}`;
      if (f.type === 'text') h += ro ? `<div style="font:italic 22px var(--serif)">${esc(st.vals[f.id] || '')}</div>` : `<input class="pin" data-f="${f.id}" maxlength="${f.max || 24}" value="${esc(st.vals[f.id] !== undefined ? st.vals[f.id] : f.def || '')}" autocomplete="off" spellcheck="false">`;
      else {
        const multi = f.type === 'multi';
        const cur = st.vals[f.id];
        h += '<div class="opts">' + f.choices.map(ch => {
          const on = multi ? (cur || []).indexOf(ch.v) >= 0 : cur === ch.v;
          return `<button class="opt ${multi ? 'multi' : ''} ${on ? 'on' : ''}" data-f="${f.id}" data-v="${esc(ch.v)}" ${ro ? 'disabled' : ''}><span class="bx"></span><span><b>${esc(ch.l)}</b>${ch.note ? '<span>' + esc(ch.note) + '</span>' : ''}</span></button>`;
        }).join('') + '</div>';
      }
      h += '</div>';
    });
    // Paraphen
    if (c.initials.length) {
      h += `<h4>Paraphen der Mandatsperson</h4>`;
      c.initials.forEach(i => {
        const done = st.ini[c.id] && st.ini[c.id][i.id];
        h += `<div class="ini"><div class="tx">${fillTxt(i.text, st)}</div><div class="box ${done ? 'done' : ''}" data-ini="${i.id}">${done ? esc(initialsOf(cn)) : 'PARAPHE'}</div></div>`;
      });
    }
    // Unterschriften
    const sig = st.sigs[c.id];
    h += `<div class="place">Holmvik, den 1. März 2027</div>
      <div class="sigarea"><div class="sigblk"><div class="ln"><span class="party ${sig || ro ? 'on' : ''}">${esc(c.signer.replace(/^Für das Treuhandhaus: |^Annahme durch die gewählte leitende Person/, '') || c.signer)}</span></div><div class="cap">für <b>${esc(c.party)}</b><br>${esc(c.signer)}, ${esc(c.signerRole)}</div></div>
      <div class="sigblk"><div class="ln" id="sigln-${c.id}">${sig ? `<img src="${sig}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">` : ro ? '' : '<canvas></canvas><div class="ph2">Hier unterschreiben</div>'}</div><div class="cap"><b>Mandatsperson „<span class="cn">${esc(cn)}</span>“</b><br>eigenhändig</div>
      ${ro || sig ? '' : `<div class="sigtools"><button class="btn" data-sig="clear">Löschen</button>${st.master ? '<button class="btn" data-sig="reuse">Unterschrift übernehmen</button>' : ''}</div>`}</div></div>
      <div class="seal ${o.sealed ? 'on' : ''}">${KY.waxSeal((c.seal || 'KURATORIUM · KYTHERA · SIEGEL').toUpperCase() + ' · ', 'KY')}</div>
      <div class="meta"><span>Notariat Penrose · Holmvik</span><span>${esc(c.no)}</span><span>Seite 1 von 1</span></div></div>`;
    return h;
  }

  /* Unterschriftenfeld mit druckabhängiger Linienstärke */
  function sigPad(host, onDone) {
    const cv = U.$('canvas', host);
    if (!cv) return;
    const ph = U.$('.ph2', host);
    const r = host.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1f3c8a';
    let last = null, len = 0, lw = 2.2, drawing = false;
    const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top, performance.now()]; };
    cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); if (ph) ph.style.display = 'none'; });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = pos(e);
      const d = Math.hypot(p[0] - last[0], p[1] - last[1]);
      if (d < 0.8) return;
      const v = d / Math.max(1, p[2] - last[2]);
      const target = U.clamp(3.1 - v * 1.1, 1.1, 3.2) * (e.pressure && e.pointerType === 'pen' ? 0.6 + e.pressure : 1);
      lw = lw * 0.7 + target * 0.3;
      g.lineWidth = lw;
      g.beginPath(); g.moveTo(last[0], last[1]);
      g.quadraticCurveTo(last[0], last[1], (last[0] + p[0]) / 2, (last[1] + p[1]) / 2);
      g.lineTo(p[0], p[1]); g.stroke();
      len += d; last = p;
      if (Math.random() < 0.06) KY.audio.play('type');
    });
    const end = () => { if (!drawing) return; drawing = false; if (len > 60) onDone(cv.toDataURL('image/png')); };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    return { clear() { g.clearRect(0, 0, cv.width, cv.height); len = 0; if (ph) ph.style.display = ''; } };
  }

  /* ---------- Ablauf ---------- */
  K.run = function (opts) {
    const root = U.$('#contracts');
    root.classList.remove('hidden');
    const st = { cur: 0, vals: {}, ini: {}, sigs: {}, master: null, signed: {}, akz: opts.akz || String(opts.seed), seed: opts.seed, speech: D.NOTARY.lines.welcome.slice() };
    D.CONTRACTS.forEach(c => c.fields.forEach(f => { st.vals[f.id] = f.type === 'multi' ? (f.def || []).slice() : f.def; }));
    root.innerHTML = `<aside class="idx" id="ct-idx"></aside><main class="desk" id="ct-desk"></main><aside class="side" id="ct-side"></aside>`;
    let pad = null;
    const idx = () => {
      U.$('#ct-idx').innerHTML = `<div class="hd">NOTARIAT PENROSE · HOLMVIK</div><h3>Vertragsmappe des Mandats Kythera</h3>` +
        D.CONTRACTS.map((c, i) => `<button class="it ${st.signed[c.id] ? 'done' : ''} ${i === st.cur ? 'cur' : ''} ${i > st.cur && !st.signed[c.id] ? 'locked' : ''}" data-go="${i}"><span class="no">${String(i + 1).padStart(2, '0')}</span><span class="tl">${esc(c.title)}</span><span class="st">${st.signed[c.id] ? ic('check', 11) : ''}</span></button>`).join('') +
        `<button class="it ${st.cur === D.CONTRACTS.length ? 'cur' : ''} ${Object.keys(st.signed).length < D.CONTRACTS.length ? 'locked' : ''}" data-go="${D.CONTRACTS.length}"><span class="no">${ic('seal', 13)}</span><span class="tl">Versiegelung</span><span class="st"></span></button>` +
        `<div class="foot">Datum 1. März 2027<br>Aktenzeichen ${esc(st.akz)}<br>Alle Personen und Orte sind frei erfunden.</div>`;
    };
    const side = () => {
      const c = D.CONTRACTS[st.cur];
      let chk = '';
      if (c) {
        const d = isDone(c, st);
        const nIni = c.initials.filter(i => st.ini[c.id] && st.ini[c.id][i.id]).length;
        chk = `<div class="lbl" style="color:#9a8e78">Urkunde ${st.cur + 1} von ${D.CONTRACTS.length}</div><div class="checklist">${c.fields.length ? `<div class="ck ${d.fOk ? 'on' : ''}"><i>${d.fOk ? ic('check', 10) : ''}</i>Festlegungen getroffen</div>` : ''}<div class="ck ${d.iOk ? 'on' : ''}"><i>${d.iOk ? ic('check', 10) : ''}</i>Paraphen gesetzt (${nIni}/${c.initials.length})</div><div class="ck ${d.sOk ? 'on' : ''}"><i>${d.sOk ? ic('check', 10) : ''}</i>Unterschrift geleistet</div></div>
          <button class="btn primary block" id="ct-sign" ${d.all && !st.signed[c.id] ? '' : 'disabled'}>${ic('seal', 15)} Unterzeichnen und siegeln</button>
          ${st.signed[c.id] ? '<button class="btn block" id="ct-next">' + (st.cur < D.CONTRACTS.length - 1 ? 'Nächste Urkunde' : 'Zur Versiegelung') + ' ' + ic('arrowR', 14) + '</button>' : ''}`;
      }
      U.$('#ct-side').innerHTML = `<div class="notary"><div class="avatar">MP</div><div><b>${esc(D.NOTARY.name)}</b><span>${esc(D.NOTARY.role)} · ${esc(D.NOTARY.office)}</span></div></div><div class="speech">${st.speech.map(p => '<p>„' + esc(p) + '“</p>').join('')}</div>${chk}<div class="note" style="color:#7d705a;font-size:11px;margin-top:auto">Tipp: Mit dem Trackpad gedrückt halten und ziehen, um zu unterschreiben. Ein Klick auf ein Paraphenfeld setzt Ihr Kürzel.</div>`;
      const sb = U.$('#ct-sign'); if (sb) sb.addEventListener('click', sign);
      const nb = U.$('#ct-next'); if (nb) nb.addEventListener('click', () => go(st.cur + 1));
    };
    const desk = () => {
      const deskEl = U.$('#ct-desk');
      if (st.cur >= D.CONTRACTS.length) { final(); return; }
      const c = D.CONTRACTS[st.cur];
      deskEl.innerHTML = paper(c, st, { sealed: !!st.signed[c.id], readonly: !!st.signed[c.id] });
      deskEl.scrollTop = 0;
      const ln = U.$('#sigln-' + c.id);
      if (ln && !st.sigs[c.id] && !st.signed[c.id]) pad = sigPad(ln, url => { st.sigs[c.id] = url; if (!st.master) st.master = url; KY.audio.play('ok'); refresh(); });
    };
    const refresh = () => { idx(); side(); desk(); };
    const go = i => {
      if (i > st.cur && !(st.signed[D.CONTRACTS[st.cur] && D.CONTRACTS[st.cur].id] || i <= Object.keys(st.signed).length)) return;
      st.cur = i;
      const c = D.CONTRACTS[i];
      st.speech = c ? (st.signed[c.id] ? ['Diese Urkunde ist bereits gesiegelt.'] : (i === 0 ? D.NOTARY.lines.welcome.slice(-2) : [U.pick(D.NOTARY.lines.between)]).concat(c.notary)) : D.NOTARY.lines.done.slice();
      KY.audio.play('nav');
      refresh();
    };
    function sign() {
      const c = D.CONTRACTS[st.cur];
      if (!isDone(c, st).all) return;
      st.signed[c.id] = Date.now();
      KY.audio.play('gavel');
      const pEl = U.$('#paper-' + c.id);
      if (pEl) { const ps = U.$('.party', pEl); if (ps) ps.classList.add('on'); const s = U.$('.seal', pEl); if (s) s.classList.add('on'); }
      st.speech = [U.pick(['Gesiegelt. Danke.', 'Damit ist diese Urkunde rechtskräftig.', 'Das Siegel ist gesetzt.'])];
      idx(); side();
      setTimeout(() => { if (st.cur < D.CONTRACTS.length && st.signed[c.id]) go(st.cur + 1); }, 1500);
    }
    function final() {
      const v = st.vals;
      const val = (cid, fid) => { const c = D.CONTRACTS.find(x => x.id === cid); const f = c.fields.find(x => x.id === fid); if (f.type === 'multi') return (v[fid] || []).map(x => (f.choices.find(ch => ch.v === x) || {}).l).join(', ') || 'keine'; return (f.choices ? (f.choices.find(ch => ch.v === v[fid]) || {}).l : v[fid]) || '—'; };
      U.$('#ct-desk').innerHTML = `<div class="paper"><div class="conf"><span>Streng vertraulich</span><span>KY-M/2027/SIEGEL</span></div>
        <div class="head"><div class="no">AKTENZEICHEN ${esc(st.akz)}</div><h1>Versiegelung der Vertragsmappe</h1><div class="sub">Niederschrift der Notarin über die Unterzeichnung</div></div>
        <p>Heute, am 1. März 2027, erschien vor mir, der Notarin Dr. Morwenna Penrose in Holmvik, die Mandatsperson mit dem Decknamen „${esc(v.codename || 'N. N.')}“. Die Mandatsperson hat die nachstehenden acht Urkunden gelesen, paraphiert und eigenhändig unterzeichnet. Die Identität der Mandatsperson wurde festgestellt und in einem gesonderten, versiegelten Umschlag verwahrt.</p>
        <h4>Festlegungen der Mandatsperson</h4>
        <p style="text-align:left">Rechtsordnung: ${esc(val('K02', 'jurisdiction'))}<br>Treuhandhaus: ${esc(val('K03', 'trustee'))}<br>Anlagestrategie: ${esc(val('K04', 'strategy'))}<br>Reaktionsfrist: ${esc(val('K06', 'deadline'))} · Entschädigungsfonds: ${esc(val('K06', 'fund'))}<br>Leitende Gesandtschaft: ${esc(val('K07', 'envoy'))}<br>Freiwillige Grundsätze: ${esc(val('K08', 'principles'))}</p>
        <h4>Identität</h4><p style="text-align:left">Name der Mandatsperson: <span class="redact">██████████████████</span><br>Verwahrung: Notariat Penrose, Tresor II, Fach ${(st.seed % 97) + 3}</p>
        <div class="cf"><div class="fl">Aktenzeichen der Welt</div><div class="fh">Bestimmt die Welt, in der Ihr Mandat beginnt. Mit demselben Aktenzeichen entsteht dieselbe Welt.</div><input class="pin" id="ct-akz" value="${esc(String(st.seed))}" maxlength="10" inputmode="numeric"></div>
        <div class="row" style="justify-content:center;gap:20px;margin-top:20px">${D.CONTRACTS.map(c => `<div style="width:54px;height:54px;opacity:.9">${KY.waxSeal(' ', String(D.CONTRACTS.indexOf(c) + 1), '#8e1b1b').replace('width="124" height="124"', 'width="54" height="54"')}</div>`).join('')}</div>
        <div style="text-align:center;margin-top:28px"><button class="btn primary" id="ct-go" style="height:46px;padding:0 26px;font-size:14px">${ic('seal', 16)} Mandat antreten</button></div>
        <div class="meta"><span>Notariat Penrose · Holmvik</span><span>Urkundenrolle 2027/0301</span><span>Ende der Niederschrift</span></div></div>`;
      U.$('#ct-go').addEventListener('click', () => {
        const ak = parseInt(String(U.$('#ct-akz').value).replace(/\D/g, ''), 10);
        const seed = isFinite(ak) && ak > 0 ? ak % 2147483647 : st.seed;
        KY.audio.play('deep');
        root.classList.add('hidden');
        opts.done({ vals: Object.assign({}, st.vals), sig: st.master, initials: st.ini, seed });
      });
    }
    // Eingaben auf dem Papier
    root.onclick = e => {
      const go2 = e.target.closest('[data-go]');
      if (go2) { go(+go2.dataset.go); return; }
      const c = D.CONTRACTS[st.cur];
      if (!c || st.signed[c.id]) return;
      const opt = e.target.closest('.opt[data-f]');
      if (opt) {
        const f = c.fields.find(x => x.id === opt.dataset.f);
        if (f.type === 'multi') { const a = st.vals[f.id] || []; const i = a.indexOf(opt.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(opt.dataset.v); st.vals[f.id] = a; }
        else st.vals[f.id] = opt.dataset.v;
        KY.audio.play('click');
        U.$$('.opt[data-f="' + f.id + '"]').forEach(b => b.classList.toggle('on', f.type === 'multi' ? st.vals[f.id].indexOf(b.dataset.v) >= 0 : st.vals[f.id] === b.dataset.v));
        side(); return;
      }
      const box = e.target.closest('.box[data-ini]');
      if (box) {
        st.ini[c.id] = st.ini[c.id] || {};
        st.ini[c.id][box.dataset.ini] = !st.ini[c.id][box.dataset.ini];
        box.classList.toggle('done', st.ini[c.id][box.dataset.ini]);
        box.textContent = st.ini[c.id][box.dataset.ini] ? initialsOf(st.vals.codename) : 'PARAPHE';
        KY.audio.play('key');
        side(); return;
      }
      const sb = e.target.closest('[data-sig]');
      if (sb) {
        if (sb.dataset.sig === 'clear') { if (pad) pad.clear(); delete st.sigs[c.id]; side(); }
        if (sb.dataset.sig === 'reuse' && st.master) { st.sigs[c.id] = st.master; KY.audio.play('ok'); refresh(); }
      }
    };
    root.oninput = e => {
      const inp = e.target.closest('input.pin[data-f]');
      if (!inp) return;
      st.vals[inp.dataset.f] = inp.value.slice(0, 18);
      if (inp.dataset.f === 'codename') {
        U.$$('.cn', root).forEach(s => { s.textContent = inp.value || 'N. N.'; });
        U.$$('.box.done', root).forEach(b => { b.textContent = initialsOf(inp.value); });
      }
      side();
    };
    root.onkeydown = e => { if (e.key === 'Enter' && e.target.matches('input.pin')) e.target.blur(); };
    refresh();
  };

  /* Ansicht einer gesiegelten Urkunde (Akten) */
  K.view = function (cid) {
    const S = KY.sim.S;
    const c = D.CONTRACTS.find(x => x.id === cid);
    if (!c) return;
    const st = { vals: Object.assign({ codename: S.codename }, S.contracts.vals), ini: S.contracts.initials || {}, sigs: {}, akz: String(S.seed) };
    st.sigs[c.id] = S.contracts.sig;
    c.initials.forEach(i => { st.ini[c.id] = st.ini[c.id] || {}; st.ini[c.id][i.id] = true; });
    KY.ui.modal({ cls: 'w900', html: `<div class="mh"><div class="tt"><div class="lbl">Akte · ${esc(c.no)}</div><h2>${esc(c.title)}</h2></div><button class="iconbtn" data-a="mclose">${ic('close', 18)}</button></div><div class="mb" style="background:#0d0b08">${paper(c, st, { readonly: true, sealed: true })}</div>` });
  };
})();

      <p>Ein Vermögen, das größer ist als die Wirtschaft ganzer Staaten. Eine Welt voller Menschen, denen Sie nie begegnen werden. Niemand kennt Ihren Namen – und jede Ihrer Entscheidungen hat Folgen.</p></div>
      <div class="menu"><button class="btn primary" id="t-new">Neues Mandat <span>${ic('arrowR', 16)}</span></button>
      ${slots.length ? `<div class="lbl" style="margin-top:10px">Mandat fortsetzen</div><div class="slots">${slots.map(x => `<button class="slot" data-slot="${x.s}"><span><b>${esc(x.m.codename)}</b><br><span class="dim" style="font-size:12px">${x.s === 'auto' ? 'Automatische Sicherung' : 'Speicherplatz ' + x.s} · ${U.dateStr(x.m.day, true)}</span></span><span class="dim" style="font-size:11px;text-align:right">${x.m.projects} Vorhaben${x.m.exposed ? '<br><span class="bad">öffentlich</span>' : ''}</span></button>`).join('')}</div>` : ''}
      <button class="btn ghost" id="t-imp" style="margin-top:4px">${ic('upload', 14)} Spielstand importieren</button></div></div>
      <div class="foot"><span>Für iPad im Querformat mit Magic Keyboard</span><span><span class="kbd">⌘</span> <span class="kbd">K</span> Suche</span><span><span class="kbd">Leertaste</span> Zeit</span><span>Fiktives Rollenspiel</span></div>`;
    // Hintergrund: eine zufällige, unscharfe Welt
    setTimeout(async () => {
      const cv = U.$('#t-bg');
      if (!cv) return;
      const w = await KY.gen.generate(1000 + Math.floor(Math.random() * 90000));
      const px = KY.paint.paint(w, 800, 400);
      cv.width = 800; cv.height = 400;
      cv.getContext('2d').putImageData(new ImageData(px, 800, 400), 0, 0);
    }, 60);
    U.$('#t-new').addEventListener('click', () => { KY.audio.unlock(); KY.audio.play('boot'); B.newMandate(); });
    U.$$('.slot', t).forEach(b => b.addEventListener('click', () => { KY.audio.unlock(); B.loadSlot(b.dataset.slot); }));
    U.$('#t-imp').addEventListener('click', () => {
      KY.audio.unlock();
      const txt = window.prompt('Exportierten Spielstand einfügen:');
      if (!txt) return;
      const S = SIM.importSave(txt);
      if (S) B.startLoaded(S); else window.alert('Ungültiger Spielstand.');
    });
  };
  B.toTitle = function () { if (KY.ui) KY.ui.running = false; B.title(); };

  /* ---------- Neues Mandat ---------- */
  B.newMandate = function () {
    if (KY.ui) KY.ui.running = false;
    show('#contracts');
    const seed = 10000 + Math.floor(Math.random() * 899999);
    KY.contracts.run({ seed, akz: 'KY-' + seed, done: r => build(r.seed, (W) => SIM.newGame(W, r.vals, { sig: r.sig, initials: r.initials }), true) });
  };

  /* ---------- Weltaufbau ---------- */
  async function build(seed, makeState, isNew) {
    show('#build');
    const b = U.$('#build');
    b.innerHTML = `<div class="box"><div class="seal">${KY.sealSvg(54)}</div><h2>${isNew ? 'Die Welt wird übergeben' : 'Das Mandat wird wieder aufgenommen'}</h2><div class="dim">Aktenzeichen ${seed}</div><div class="bar2"><i id="bd-bar"></i></div><div class="log" id="bd-log"></div></div>`;
    const log = (t) => { const l = U.$('#bd-log'); if (!l) return; l.insertAdjacentHTML('beforeend', '<div>› ' + esc(t) + '</div>'); while (l.children.length > 7) l.firstElementChild.remove(); };
    const bar = f => { const e = U.$('#bd-bar'); if (e) e.style.width = Math.round(f * 100) + '%'; };
    let lastMsg = '';
    const prog = (base, span) => (f, msg) => { bar(base + f * span); if (msg && msg !== lastMsg) { lastMsg = msg; log(msg); } };
    await new Promise(r => setTimeout(r, 60));
    world = await KY.gen.generate(seed, prog(0, 0.55));
    await KY.map.prepare(world, prog(0.55, 0.35));
    log('Staaten, Regierungen und Medien werden eingerichtet');
    bar(0.95);
    await new Promise(r => setTimeout(r, 30));
    const S = makeState(world);
    log('Verschlüsselter Kanal steht');
    bar(1);
    await new Promise(r => setTimeout(r, 350));
    start(S, world, isNew);
  }

  function start(S, W, isNew) {
    show('#game');
    KY.engine.start(S, W, isNew);
    if (!uiReady) { KY.ui.init(); uiReady = true; }
    KY.map.init(U.$('#map'), W);
    KY.audio.setOn(S.ui.sound !== false);
    KY.ui.closePanel(); KY.ui.closeInsp();
    KY.ui.start();
    if (isNew) {
      KY.ui.save('auto');
      setTimeout(briefing, 500);
    } else {
      KY.ui.toast({ t: 'Willkommen zurück', d: S.codename + ' · ' + U.dateStr(S.day), icon: 'seal', kind: 'good' });
    }
  }

  function briefing() {
    const S = SIM.S;
    const m = KY.ui.modal({
      cls: 'w560', html: `<div class="mh">${KY.ui.advAvatar('haddad', 40)}<div class="tt"><div class="lbl">Erster Mandatstag · ${U.dateStr(0)}</div><h2>Willkommen, ${esc(S.codename)}.</h2></div></div>
      <div class="mb"><p class="note" style="font-size:13.5px">Ich bin Leila Haddad und leite Ihren Krisenstab. Ab heute verwalten Sie ${U.money(S.fin.cash)}. Die Zeit steht still, bis Sie sie mit der <span class="kbd">Leertaste</span> in Gang setzen.</p>
      <div class="col" style="margin-top:12px">
        <div class="row">${ic('globe', 18)}<div class="note"><b style="color:var(--text)">Sehen Sie sich die Welt an.</b> Wischen Sie mit zwei Fingern, zoomen Sie mit Zusammenziehen. Ein Klick auf einen Staat zeigt, wie es den Menschen dort geht.</div></div>
        <div class="row">${ic('plus', 18)}<div class="note"><b style="color:var(--text)">Handeln Sie.</b> Der Katalog (<span class="kbd">A</span>) enthält ${KY.data.ACTIONS.length} Handlungen – vom Krankenhaus bis zur Vermittlung zwischen verfeindeten Staaten.</div></div>
        <div class="row">${ic('scale', 18)}<div class="note"><b style="color:var(--text)">Tragen Sie die Folgen.</b> Wenn etwas geschieht, rufe ich Sie an. Dann brauchen wir Ihre Entscheidung, nicht Ihre Ausreden.</div></div>
        <div class="row">${ic('inbox', 18)}<div class="note"><b style="color:var(--text)">Lesen Sie den Kanal.</b> Ihr Stab hat Ihnen bereits geschrieben (<span class="kbd">K</span>).</div></div>
      </div></div><div class="mf"><button class="btn ghost" data-a="mclose" id="br-help">Einweisung lesen</button><button class="btn primary" data-a="mclose" id="br-ok">Verstanden</button></div>`,
    });
    U.$('#br-help', m.el).addEventListener('click', () => setTimeout(() => KY.ui.panel('hilfe'), 50));
    U.$('#br-ok', m.el).addEventListener('click', () => setTimeout(() => KY.ui.panel('lage'), 50));
  }

  /* ---------- Laden ---------- */
  B.loadSlot = function (slot) {
    const S = SIM.load(slot);
    if (!S) { KY.ui && KY.ui.toast ? KY.ui.toast({ t: 'Spielstand nicht lesbar', icon: 'x', kind: 'crit' }) : window.alert('Spielstand nicht lesbar.'); return; }
    B.startLoaded(S);
  };
  B.startLoaded = function (S) {
    if (KY.ui) KY.ui.running = false;
    S.paused = true;
    build(S.seed, () => S, false);
  };

  /* ---------- Hinweis für Hochformat und kleine Bildschirme ---------- */
  B.init = function () {
    const n = U.$('#notice-portrait');
    n.innerHTML = `<div class="box"><div style="color:var(--gold)">${KY.sealSvg(54)}</div><h2>Bitte im Querformat verwenden</h2><p class="note" style="font-size:13px">KYTHERA · MANDAT ist für das iPad im Querformat mit Magic Keyboard gestaltet. Drehen Sie das Gerät oder vergrößern Sie das Fenster.</p><button class="btn ghost sm" id="np-skip" style="margin-top:12px">Trotzdem fortfahren</button></div>`;
    U.$('#np-skip').addEventListener('click', () => n.classList.remove('on'));
    document.addEventListener('pointerdown', () => KY.audio.unlock(), { once: true });
    document.addEventListener('keydown', () => KY.audio.unlock(), { once: true });
    // Kein Seitenzoom durch Gesten oder Doppeltippen
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => { if (!e.target.closest('input,textarea')) e.preventDefault(); }, { passive: false });
    B.title();
  };
})();


/* ===== js/main.js ===== */
/* KYTHERA · MANDAT · Einstieg */
(function () {
  'use strict';
  const start = () => {
    try { window.KY.boot.init(); } catch (e) { console.error(e); document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f88;padding:20px">' + String(e && e.stack || e) + '</pre>'); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();


</script>
</body>
</html>
