      <text x="62" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="rgba(255,225,205,0.82)">${U.esc(mono)}</text>
      <ellipse cx="46" cy="38" rx="16" ry="7" fill="rgba(255,255,255,0.12)" transform="rotate(-30 46 38)"/></svg>`;
  };

  /* ---------- Diagramme ---------- */
  const C = (KY.chart = {});
  let cid = 0;
  const store = {};
  /* Linie: pts = [{x, y, lbl}], o = {h, fmt, color, min, max, zero, xlab} */
  C.line = function (pts, o) {
    o = o || {};
    if (!pts || pts.length < 2) return '<div class="empty" style="padding:16px">Noch zu wenige Daten für einen Verlauf.</div>';
    const id = 'c' + (++cid);
    const W = 400, H = o.h || 120, pl = 4, pr = 4, pt = 10, pb = 18;
    const ys = pts.map(p => p.y);
    let lo = o.min !== undefined ? o.min : Math.min.apply(null, ys), hi = o.max !== undefined ? o.max : Math.max.apply(null, ys);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * 0.08; if (o.min === undefined) lo -= pad; if (o.max === undefined) hi += pad;
    const X = i => pl + i / (pts.length - 1) * (W - pl - pr);
    const Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join('');
    const col = o.color || 'var(--blue)';
    const grid = [0.25, 0.5, 0.75].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${(pt + f * (H - pt - pb)).toFixed(1)}" y2="${(pt + f * (H - pt - pb)).toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`).join('');
    const zl = o.zero && lo < 0 && hi > 0 ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="rgba(255,255,255,0.25)" stroke-dasharray="3 3"/>` : '';
    const fmt = o.fmt || (v => U.n(v, 1));
    const area = o.area !== false ? `<path d="${d}L${X(pts.length - 1).toFixed(1)} ${H - pb}L${X(0)} ${H - pb}Z" fill="${col}" opacity="0.08"/>` : '';
    const last = pts[pts.length - 1];
    store[id] = { pts, X, Y, W, H, fmt, pb, pt };
    if (Object.keys(store).length > 80) delete store[Object.keys(store)[0]];
    return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${grid}${zl}${area}<path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="3.5" fill="${col}" stroke="var(--panel2)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="rgba(255,255,255,0.35)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
      <text x="${pl}" y="${H - 4}" font-size="10" fill="var(--dim)" font-family="Inter, sans-serif">${U.esc(pts[0].xl || '')}</text>
      <text x="${W - pr}" y="${H - 4}" font-size="10" fill="var(--dim)" text-anchor="end" font-family="Inter, sans-serif">${U.esc(last.xl || '')}</text></svg><div class="ctip"></div></div>`;
  };
  C.bind = function (root) {
    root.addEventListener('pointermove', e => {
      const el = e.target.closest && e.target.closest('.chart');
      if (!el) return;
      const s = store[el.dataset.chart];
      if (!s) return;
      const r = el.getBoundingClientRect();
      const fx = (e.clientX - r.left) / r.width;
      const i = U.clamp(Math.round(fx * (s.pts.length - 1)), 0, s.pts.length - 1);
      const p = s.pts[i];
      const xh = el.querySelector('.xh');
      const vx = s.X(i);
      xh.setAttribute('x1', vx); xh.setAttribute('x2', vx); xh.style.display = '';
      const tip = el.querySelector('.ctip');
      tip.style.display = 'block';
      tip.innerHTML = `<b>${U.esc(s.fmt(p.y))}</b> <span class="dim">${U.esc(p.lbl || p.xl || '')}</span>`;
      tip.style.left = (vx / s.W * r.width) + 'px';
      tip.style.top = (s.Y(p.y) / s.H * r.height - 6) + 'px';
    });
    root.addEventListener('pointerout', e => {
      const el = e.target.closest && e.target.closest('.chart');
      if (!el || el.contains(e.relatedTarget)) return;
      const xh = el.querySelector('.xh'); if (xh) xh.style.display = 'none';
      const tip = el.querySelector('.ctip'); if (tip) tip.style.display = 'none';
    });
  };
  /* Monatsreihe → Punkte mit Datumsbeschriftung */
  C.monthly = function (arr, endDay, fmtv) {
    const n = arr.length;
    return arr.map((v, i) => { const day = endDay - (n - 1 - i) * 30; return { y: v, xl: U.monthStr(Math.max(0, day)), lbl: U.monthStr(Math.max(0, day)) }; });
  };
  /* Kleine Verlaufslinie ohne Achsen für Kennzahlen */
  C.spark = function (vals, col, w, h) {
    w = w || 80; h = h || 22;
    if (!vals || vals.length < 2) return '';
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals) || 1;
    const d = vals.map((v, i) => (i ? 'L' : 'M') + (i / (vals.length - 1) * w).toFixed(1) + ' ' + (h - 2 - (v - lo) / ((hi - lo) || 1) * (h - 4)).toFixed(1)).join('');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><path d="${d}" fill="none" stroke="${col || 'var(--blue)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  };
})();

      line.forEach((p, i) => { if (p.f >= 2 && (i % 2 === 0 || i === line.length - 1)) { pts.push([lonX(p.lon), latY(p.lat)]); cls = Math.max(cls, p.f >= 9 ? 2 : p.f >= 4 ? 1 : 0); } });
      if (pts.length < 2 || cls < 0) return;
      // Sprünge über die Datumsgrenze trennen
      let seg = [pts[0]];
      const flush = () => { if (seg.length > 1) { const s = chaikin(seg, 3, false); riverPaths[cls].moveTo(s[0][0], s[0][1]); for (let i = 1; i < s.length; i++) riverPaths[cls].lineTo(s[i][0], s[i][1]); } };
      for (let i = 1; i < pts.length; i++) { if (Math.abs(pts[i][0] - pts[i - 1][0]) > WW / 2) { flush(); seg = []; } seg.push(pts[i]); }
      flush();
    });
  }

  /* ---------- Initialisierung ---------- */
  M.init = function (canvas, world) {
    cv = canvas; ctx = cv.getContext('2d'); W = world;
    sel = null; M.placing = null; overlayKey = ''; overlay = null; detail = null; djob = null;
    resize();
    if (!M.bound) { M.bound = true; window.addEventListener('resize', () => { resize(); dirty = true; }); bindInput(); }
    M.home(true);
    const S = SIM.S;
    if (S.ui.view) { view.x = S.ui.view.x; view.y = S.ui.view.y; view.z = Math.max(zmin(), S.ui.view.z); clampView(); }
    M.layer = S.ui.layer || 'pol';
    buildLayerCtl();
  };
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    SW = cv.clientWidth; SH = cv.clientHeight;
    cv.width = Math.round(SW * dpr); cv.height = Math.round(SH * dpr);
    if (view.z < zmin()) view.z = zmin();
    clampView();
  }
  const zmin = () => Math.max(SW / WW, (SH - 60) / WH * 0.98);
  const zmax = () => zmin() * 16;
  M.zoomLevel = () => view.z / zmin();
  function clampView() {
    viewT = time;
    view.z = U.clamp(view.z, zmin(), zmax());
    const hh = SH / 2 / view.z;
    if (WH <= hh * 2) view.y = WH / 2;
    else view.y = U.clamp(view.y, hh - 30 / view.z, WH - hh + 40 / view.z);
    view.x = ((view.x % WW) + WW) % WW;
  }
  M.home = function (instant) {
    // Größte Landmasse mittig
    let best = null;
    if (SIM.S) SIM.W.nations.forEach(n => { if (!best || n.pop > best.pop) best = n; });
    const tgt = { x: best ? lonX(best.lon) : WW / 2, y: WH / 2 + 20, z: zmin() * 1.15 };
    if (instant) { Object.assign(view, tgt); clampView(); dirty = true; } else animateTo(tgt);
  };
  M.focus = function (lon, lat, zl) {
    const z = zl ? zmin() * zl : Math.max(view.z, zmin() * 2.2);
    let x = lonX(lon);
    if (x - view.x > WW / 2) x -= WW; else if (view.x - x > WW / 2) x += WW;
    const offX = (document.body.classList.contains('insp-open') ? 190 : 0) - (KY.ui.cur ? 220 : 0);
    animateTo({ x: x + offX / z, y: latY(lat), z });
  };
  function animateTo(t) {
    anim = { from: Object.assign({}, view), to: t, t: 0, d: 0.45 };
  }
  M.zoomBy = function (f, sx, sy) {
    sx = sx === undefined ? SW / 2 : sx; sy = sy === undefined ? SH / 2 : sy;
    const wx = (sx - SW / 2) / view.z + view.x, wy = (sy - SH / 2) / view.z + view.y;
    view.z = U.clamp(view.z * f, zmin(), zmax());
    view.x = wx - (sx - SW / 2) / view.z; view.y = wy - (sy - SH / 2) / view.z;
    clampView(); dirty = true; saveView();
  };
  M.panBy = function (dx, dy) { view.x += dx / view.z; view.y += dy / view.z; clampView(); dirty = true; saveView(); };
  let svT = 0;
  function saveView() { clearTimeout(svT); svT = setTimeout(() => { if (SIM.S) SIM.S.ui.view = { x: view.x, y: view.y, z: view.z }; }, 400); }
  M.toWorld = (sx, sy) => ({ x: (sx - SW / 2) / view.z + view.x, y: (sy - SH / 2) / view.z + view.y });
  M.toLonLat = (sx, sy) => { const w = M.toWorld(sx, sy); let lon = xLon(((w.x % WW) + WW) % WW); return { lon, lat: U.clamp(yLat(w.y), -89.9, 89.9) }; };
  function toScreen(wx, wy) {
    let dx = wx - view.x;
    if (dx > WW / 2) dx -= WW; else if (dx < -WW / 2) dx += WW;
    return [dx * view.z + SW / 2, (wy - view.y) * view.z + SH / 2];
  }
  const llScreen = (lon, lat) => toScreen(lonX(lon), latY(lat));
  M.llScreen = llScreen;

  /* ---------- Detailansicht: sichtbarer Ausschnitt in voller Auflösung ---------- */
  const DETAIL_ZL = 2.2;
  function viewRect() { return { u0: view.x - SW / 2 / view.z, v0: view.y - SH / 2 / view.z, uw: SW / view.z, vh: SH / view.z }; }
  const alignU = u => u + Math.round((view.x - u) / WW) * WW;
  function covers(d) {
    if (!d) return false;
    const r = viewRect();
    const du0 = alignU(d.u0 + d.uw / 2) - d.uw / 2;
    return r.u0 >= du0 - 0.5 && r.u0 + r.uw <= du0 + d.uw + 0.5 && r.v0 >= d.v0 - 0.5 && r.v0 + r.vh <= d.v0 + d.vh + 0.5 && d.W / d.uw >= view.z * 0.8;
  }
  function stepDetail() {
    if (!W || view.z / zmin() < DETAIL_ZL) { djob = null; return; }
    if (djob) {
      if (viewT > djob.t0 + 0.001) { djob = null; return; }
      const y1 = Math.min(djob.H, djob.y + 28);
      KY.paint.paintRegion(W, djob.u0, djob.v0, djob.uw, djob.vh, djob.W, djob.H, djob.img.data, djob.y, y1);
      djob.y = y1;
      if (djob.y >= djob.H) {
        const c = document.createElement('canvas');
        c.width = djob.W; c.height = djob.H;
        c.getContext('2d').putImageData(djob.img, 0, 0);
        detail = { cv: c, u0: djob.u0, v0: djob.v0, uw: djob.uw, vh: djob.vh, W: djob.W, H: djob.H };
        djob = null; dirty = true;
      }
      return;
    }
    if (time - viewT < 0.25 || covers(detail)) return;
    const r = viewRect(), m = 0.1;
    const Wd = Math.min(1700, Math.round(SW * (1 + 2 * m))), Hd = Math.min(1200, Math.round(SH * (1 + 2 * m)));
    const v0 = Math.max(0, r.v0 - r.vh * m), v1 = Math.min(WH, r.v0 + r.vh * (1 + m));
    djob = { u0: r.u0 - r.uw * m, v0, uw: r.uw * (1 + 2 * m), vh: v1 - v0, W: Wd, H: Math.max(8, Math.round(Hd * (v1 - v0) / (r.vh * (1 + 2 * m)))), y: 0, t0: viewT };
    djob.img = new ImageData(djob.W, djob.H);
  }
  M.resetDetail = () => { detail = null; djob = null; };

  /* ---------- Ebenen ---------- */
  M.setLayer = function (id) { M.layer = id; if (SIM.S) SIM.S.ui.layer = id; overlayKey = ''; dirty = true; buildLayerCtl(); };
  M.cycleLayer = function (d) { const i = M.LAYERS.findIndex(l => l.id === M.layer); M.setLayer(M.LAYERS[(i + d + M.LAYERS.length) % M.LAYERS.length].id); KY.ui.toast({ t: 'Kartenebene: ' + M.LAYERS.find(l => l.id === M.layer).n, icon: 'layers', ms: 1800 }); };
  M.invalidate = function () { overlayKey = ''; dirty = true; };
  M.dataChanged = function () { dirty = true; if (SIM.S && SIM.S.day - overlayDay >= 10) overlayKey = ''; };
  function buildLayerCtl() {
    const box = U.$('#mapctl');
    if (!box) return;
    const L = M.LAYERS.find(l => l.id === M.layer);
    const leg = L && L.legend ? `<div class="legend"><div class="lbl">${U.esc(L.n)}</div><div class="bar" style="background:${M.rampCss(L.id)}"></div><div class="ends">${L.legend.map(t => '<span>' + U.esc(t) + '</span>').join('')}</div>${L.id === 'op' ? '<div class="dim" style="font-size:10px;margin-top:4px">Blasse Flächen: Sie sind dort kaum bekannt.</div>' : ''}</div>` : '';
    box.innerHTML = leg + `<div class="ctlbox layers">${M.LAYERS.map(l => `<button class="${l.id === M.layer ? 'on' : ''}" data-a="layer" data-v="${l.id}" title="${l.n} (G wechselt)">${KY.icon(l.icon, 14)}${l.id === M.layer ? '<span>' + l.n + '</span>' : ''}</button>`).join('')}</div>
      <div class="ctlbox"><button class="iconbtn" data-a="zoomIn" title="Vergrößern (+)">${KY.icon('zoomIn', 17)}</button><button class="iconbtn" data-a="zoomOut" title="Verkleinern (−)">${KY.icon('zoomOut', 17)}</button><button class="iconbtn" data-a="home" title="Übersicht (0)">${KY.icon('compass', 17)}</button></div>`;
  }
  KY.A.layer = b => M.setLayer(b.dataset.v);
  KY.A.zoomIn = () => M.zoomBy(1.5);
  KY.A.zoomOut = () => M.zoomBy(1 / 1.5);
  KY.A.home = () => M.home();

  function natColor(id, layer) {
    const n = SIM.S.nations[id], w = SIM.W.nations[id];
    switch (layer) {
      case 'pol': case 'rel': { const h = w.hue; const c = hslRgb(h, 0.32, 0.5); return [c[0], c[1], c[2], 0.26]; }
      case 'op': {
        const t = U.clamp(n.op / 40, -1, 1);
        const mid = [56, 56, 53], pos = [57, 135, 229], neg = [230, 103, 103];
        const c = t >= 0 ? mid.map((m, i) => m + (pos[i] - m) * t) : mid.map((m, i) => m + (neg[i] - m) * -t);
        return [c[0], c[1], c[2], 0.18 + 0.55 * U.clamp(n.aware / 60, 0, 1)];
      }
      case 'happy': return rampColor(BLUE, (n.happy - 20) / 65).concat(0.62);
      case 'unrest': return rampColor(ORANGE, n.unrest / 75).concat(0.62);
      case 'wealth': return rampColor(BLUE, (Math.log(n.gdpPc) - Math.log(1800)) / (Math.log(72000) - Math.log(1800))).concat(0.62);
      case 'energy': return rampColor(BLUE, (n.energy - 20) / 80).concat(0.62);
      case 'health': return rampColor(BLUE, (n.health - 20) / 78).concat(0.62);
    }
    return null;
  }
  function hslRgb(h, s, l) {
    h /= 360;
    const f = n => { const k = (n + h * 12) % 12; const a = s * Math.min(l, 1 - l); return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
    return [f(0), f(8), f(4)];
  }
  function buildOverlay() {
    const L = M.layer;
    const key = L + ':' + SIM.S.day;
    if (L === 'terrain') { overlay = null; overlayKey = key; return; }
    const GW = W.GW, GH = W.GH;
    if (!overlay) { overlay = document.createElement('canvas'); overlay.width = GW; overlay.height = GH; }
    const o = overlay.getContext('2d');
    const img = o.createImageData(GW, GH);
    const cols = SIM.W.nations.map(n => natColor(n.id, L));
    const N = W.nation, d = img.data;
    for (let k = 0; k < GW * GH; k++) {
      const id = N[k];
      if (id < 0) continue;
      const c = cols[id];
      d[k * 4] = c[0]; d[k * 4 + 1] = c[1]; d[k * 4 + 2] = c[2]; d[k * 4 + 3] = c[3] * 255;
    }
    o.putImageData(img, 0, 0);
    overlayKey = key; overlayDay = SIM.S.day;
  }

  /* ---------- Zeichnen ---------- */
  M.frame = function (dt) {
    time += dt;
    stepDetail();
    if (anim) {
      anim.t += dt / anim.d;
      const e = U.smooth(Math.min(1, anim.t));
      view.x = anim.from.x + (anim.to.x - anim.from.x) * e;
      view.y = anim.from.y + (anim.to.y - anim.from.y) * e;
      view.z = anim.from.z + (anim.to.z - anim.from.z) * e;
      clampView(); dirty = true;
      if (anim.t >= 1) { anim = null; saveView(); }
    }
    const animating = M.hasAnim();
    if (!dirty && !(animating && time - lastDraw > 1 / 30)) return;
    dirty = false; lastDraw = time;
    draw();
  };
  M.hasAnim = () => SIM.S && (SIM.S.events.some(e => e.phase !== 'vorbei') || SIM.S.incidents.some(i => i.status === 'offen') || M.placing || SIM.S.cities.some(c => c.protest));
  M.redraw = () => { dirty = true; };

  function worldCopies() {
    const out = [];
    for (let k = -1; k <= 1; k++) {
      const x0 = (k * WW - view.x) * view.z + SW / 2, x1 = x0 + WW * view.z;
      if (x1 > 0 && x0 < SW) out.push(k * WW);
    }
    return out;
  }

  function draw() {
    if (!ctx || !tex) return;
    const S = SIM.S;
    if (overlayKey.split(':')[0] !== M.layer || !overlayKey) buildOverlay();
    const z = view.z;
    const zl = z / zmin();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0d1d31';
    ctx.fillRect(0, 0, SW, SH);
    const copies = worldCopies();
    const wt = off => ctx.setTransform(z * dpr, 0, 0, z * dpr, (off - view.x) * z * dpr + SW / 2 * dpr, (-view.y) * z * dpr + SH / 2 * dpr);
    for (const off of copies) {
      wt(off);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = zl > 4 ? 'high' : 'medium';
      ctx.drawImage(tex, 0, 0, WW, WH);
      if (detail && zl >= DETAIL_ZL) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, WW, WH); ctx.clip();
        const du = alignU(detail.u0 + detail.uw / 2) - detail.uw / 2 - off;

      if (overlay && M.layer !== 'terrain') ctx.drawImage(overlay, 0, 0, WW, WH);

      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(92,146,190,0.62)';
      [0.5, 0.9, 1.5].forEach((w, i) => { if (i === 0 && zl < 1.6) return; ctx.lineWidth = Math.max(w * 0.9, w * Math.sqrt(zl) * 0.6) / z; ctx.stroke(riverPaths[i]); });
      // Grenzen
      ctx.strokeStyle = M.layer === 'terrain' ? 'rgba(20,16,10,0.55)' : 'rgba(18,14,10,0.7)';
      ctx.lineWidth = (zl > 3 ? 1.6 : 1.1) / z;
      ctx.setLineDash([]);
      ctx.stroke(borderPath);
      ctx.strokeStyle = 'rgba(255,240,210,0.22)';
      ctx.lineWidth = 0.6 / z;
      ctx.stroke(borderPath);
      // Ausgewählter oder überfahrener Staat
      const hl = sel && sel.type === 'nation' ? sel.id : -1;
      const hv = M.placing && (M.placing.kind === 'nation' || M.placing.kind === 'two') ? hoverNation : -1;
      [[hl, 'rgba(227,196,122,0.95)'], [hv, 'rgba(255,255,255,0.8)']].forEach(([id, col]) => {
        if (id < 0 || !natOutline[id]) return;
        ctx.strokeStyle = col; ctx.lineWidth = 2.2 / z; ctx.stroke(natOutline[id]);
      });
      if (M.placing && M.placing.kind === 'two' && M.placing.first >= 0) { ctx.strokeStyle = 'rgba(227,196,122,0.95)'; ctx.lineWidth = 2.2 / z; ctx.stroke(natOutline[M.placing.first]); }
      // Landesweite Ereignisse
      S.events.forEach(ev => {
        if (ev.phase === 'vorbei' || !ev.nationwide) return;
        const a = 0.45 + 0.35 * Math.sin(time * 3);
        ctx.strokeStyle = U.fill('rgba({r},{g},{b},' + a.toFixed(2) + ')', (c => ({ r: c[0], g: c[1], b: c[2] }))(hexRgb(EVCOL[ev.type] || '#ffffff')));
        ctx.lineWidth = 2.6 / z; ctx.stroke(natOutline[ev.n]);

    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hits = [];
    drawRoads(zl);
    drawRelations();
    drawNationLabels(zl);
    drawProjectShapes(zl);
    drawEvents(zl);
    drawCities(zl);
    drawProjects(zl);
    drawPlacing();
  }

  function drawRoads(zl) {
    if (zl < 2.2) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(240,226,190,' + U.clamp((zl - 2.2) / 2, 0, 0.35).toFixed(2) + ')';
    ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    W.roads.forEach(r => {
      const a = W.cities[r.a], b = W.cities[r.b];
      const pa = llScreen(a.lon, a.lat), pb = llScreen(b.lon, b.lat);
      if (Math.abs(pa[0] - pb[0]) > SW) return;
      ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
    });
    ctx.restore();
  }
  function drawRelations() {
    const S = SIM.S;
    const all = M.layer === 'rel';
    ctx.save();
    for (const k in S.rel) {
      const R = S.rel[k];
      if (!all && R.state !== 'krise' && R.state !== 'eiszeit') continue;
      if (all && R.state === 'normal') continue;
      const [a, b] = k.split(':').map(Number);
      const A = SIM.W.nations[a], B = SIM.W.nations[b];
      const pa = llScreen(A.lon, A.lat), pb = llScreen(B.lon, B.lat);
      if (Math.abs(pa[0] - pb[0]) > SW * 0.9) continue;
      const col = R.state === 'eiszeit' ? '#d03b3b' : R.state === 'krise' ? '#ec835a' : R.state === 'angespannt' ? '#fab219' : '#4fc46a';
      ctx.strokeStyle = col; ctx.globalAlpha = R.state === 'partner' ? 0.5 : 0.85;
      ctx.lineWidth = R.state === 'eiszeit' ? 2.5 : 1.8;
      ctx.setLineDash(R.state === 'partner' ? [] : [6, 5]);
      ctx.lineDashOffset = -time * 12;
      const mx = (pa[0] + pb[0]) / 2, my = (pa[1] + pb[1]) / 2 - Math.hypot(pb[0] - pa[0], pb[1] - pa[1]) * 0.18;
      ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.quadraticCurveTo(mx, my, pb[0], pb[1]); ctx.stroke();
      if (R.state === 'krise' || R.state === 'eiszeit') {
        ctx.globalAlpha = 1; ctx.setLineDash([]);
        badge(mx * 0.5 + (pa[0] + pb[0]) / 4, my * 0.5 + (pa[1] + pb[1]) / 4, 'alert', col, 9);
        hits.push({ x: mx * 0.5 + (pa[0] + pb[0]) / 4, y: my * 0.5 + (pa[1] + pb[1]) / 4, r: 11, type: 'rel', a, b });
      }
    }
    ctx.restore();
  }
  function drawNationLabels(zl) {
    if (zl > 5.5) return;
    const S = SIM.S;
    const a = zl < 1.2 ? 0.75 : U.clamp(1 - (zl - 3) / 2.5, 0, 0.75);
    if (a <= 0.02) return;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fs = Math.round(U.clamp(10 + zl * 1.6, 10, 16));
    ctx.font = '600 ' + fs + 'px Inter, -apple-system, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (fs * 0.22).toFixed(1) + 'px';
    SIM.W.nations.forEach(n => {
      if (n.cells < 120 && zl < 1.6) return;
      const p = llScreen(n.lon, n.lat);
      if (p[0] < -100 || p[0] > SW + 100) return;

      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,10,14,0.55)';

      ctx.fillStyle = S.g && S.nations[n.id].crisis ? '#ffd3a8' : 'rgba(244,236,218,0.95)';
      ctx.fillText(t, p[0], p[1]);
    });
    ctx.restore();
  }

  function drawProjectShapes(zl) {
    const S = SIM.S;
    ctx.save();
    for (const p of S.projects) {
      const A = D.ACT[p.act];
      const col = PHCOL[p.phase] || '#999';
      const dead = p.phase === 'stillgelegt' || p.phase === 'aufgegeben' || p.phase === 'abgelehnt';
      if (p.area) {
        const a = llScreen(p.area.lon0, p.area.lat0), b = llScreen(p.area.lon1, p.area.lat1);
        if (Math.abs(a[0] - b[0]) > SW) continue;
        const fill = p.act === 'MEER' ? 'rgba(57,135,229,' : p.act === 'WUESTE' ? 'rgba(201,162,79,' : 'rgba(79,196,106,';
        ctx.fillStyle = fill + (dead ? 0.05 : 0.14 + (p.phase === 'betrieb' ? 0.1 : 0)) + ')';
        ctx.strokeStyle = fill + (dead ? 0.3 : 0.75) + ')';
        ctx.setLineDash([5, 4]); ctx.lineWidth = 1.3;
        const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), w = Math.abs(a[0] - b[0]), h = Math.abs(a[1] - b[1]);
        ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
      } else if (p.c2 >= 0 && (A.place.indexOf('line') === 0)) {
        const a = W.cities[p.c], b = W.cities[p.c2];
        const pa = llScreen(a.lon, a.lat), pb = llScreen(b.lon, b.lat);
        if (Math.abs(pa[0] - pb[0]) > SW) continue;
        ctx.globalAlpha = dead ? 0.35 : 1;
        ctx.setLineDash(p.act === 'SEEKABEL' ? [2, 5] : p.phase === 'bau' || p.phase === 'antrag' ? [7, 5] : []);
        ctx.lineDashOffset = p.phase === 'bau' ? -time * 10 : 0;
        if (p.act === 'HSR') { ctx.strokeStyle = 'rgba(10,12,16,0.8)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke(); }
        ctx.strokeStyle = p.act === 'SEEKABEL' ? '#7fd3ff' : p.act === 'HGUE' ? '#fab219' : col;
        ctx.lineWidth = p.act === 'HSR' ? 2.6 : p.act === 'BRUECKE' ? 3.4 : 1.8;
        ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }

  function badge(x, y, icon, col, r, ring) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(8,11,16,0.92)'; ctx.fill();
    ctx.lineWidth = ring || 2; ctx.strokeStyle = col; ctx.stroke();
    const s = r * 1.15;
    ctx.translate(x - s / 2, y - s / 2); ctx.scale(s / 24, s / 24);
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#eef2f6';
    KY.iconPaths(icon).forEach(p => ctx.stroke(p));
    ctx.restore();
  }
  M.badge = badge;

  function drawEvents(zl) {
    const S = SIM.S;
    for (const ev of S.events) {
      if (ev.phase === 'vorbei' && S.day - ev.end > 20) continue;
      const done = ev.phase === 'vorbei';
      let lon = ev.lon, lat = ev.lat;
      const age = S.day - ev.start;
      if (ev.from && age < 3) { const t = U.smooth(Math.min(1, (age + (time % 1) * 0) / 3)); lon = ev.from.lon + (ev.lon - ev.from.lon) * t; lat = ev.from.lat + (ev.lat - ev.from.lat) * t; }
      const p = llScreen(lon, lat);
      if (p[0] < -200 || p[0] > SW + 200) continue;
      const col = EVCOL[ev.type] || '#fff';
      const rgb = hexRgb(col).join(',');
      if (ev.radius && !ev.nationwide) {
        const r = kmUnits(ev.radius) * view.z;
        ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + rgb + ',' + (done ? 0.05 : 0.13) + ')'; ctx.fill();
        if (!done) {
          const ph = (time * 0.6) % 1;
          ctx.beginPath(); ctx.arc(p[0], p[1], r * (0.3 + ph * 0.7), 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.6 * (1 - ph)).toFixed(2) + ')'; ctx.lineWidth = 2; ctx.stroke();
        }
      }
      if (ev.type === 'storm' && !done) {
        ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(-time * 2.2);
        const s = 18 + ev.sev * 4;
        ctx.translate(-s / 2, -s / 2); ctx.scale(s / 24, s / 24);
        ctx.strokeStyle = 'rgba(' + rgb + ',0.95)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
        KY.iconPaths('storm').forEach(pp => ctx.stroke(pp));
        ctx.restore();
      }
      const br = 10 + ev.sev;
      badge(p[0], p[1] - (ev.type === 'storm' && !done ? 22 : 0), D.EVENTS[ev.type].icon, done ? '#6b7280' : col, br);
      hits.push({ x: p[0], y: p[1] - (ev.type === 'storm' && !done ? 22 : 0), r: br + 3, type: 'ev', id: ev.id });
    }
  }

  function drawCities(zl) {
    const S = SIM.S;
    const cities = W.cities.slice().sort((a, b) => b.pop - a.pop);
    const placed = [];
    const pl = M.placing;
    ctx.save();
    ctx.textBaseline = 'middle';
    cities.forEach((c, rank) => {
      const p = llScreen(c.lon, c.lat);
      if (p[0] < -40 || p[0] > SW + 40 || p[1] < -40 || p[1] > SH + 40) return;
      const sc = S.cities[c.id];
      const r = U.clamp(1.8 + Math.sqrt(sc.pop) * 1.1, 2, 7) * U.clamp(0.75 + zl * 0.12, 0.8, 1.4);
      let valid = true;
      if (pl && pl.cityFilter) valid = pl.cityFilter(c);
      const dim = pl && pl.cityFilter && !valid;
      ctx.globalAlpha = dim ? 0.3 : 1;
      if (pl && pl.cityFilter && valid) {
        const ph = (time * 1.2) % 1;
        ctx.beginPath(); ctx.arc(p[0], p[1], r + 4 + ph * 6, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(227,196,122,' + (0.8 * (1 - ph)).toFixed(2) + ')'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
      ctx.fillStyle = sc.dmg > 0.2 ? '#ec835a' : '#f4ecda'; ctx.fill();
      ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(8,10,14,0.85)'; ctx.stroke();
      if (c.capital) { ctx.beginPath(); ctx.arc(p[0], p[1], r + 2.6, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(244,236,218,0.8)'; ctx.lineWidth = 1.1; ctx.stroke(); }
      if (sel && sel.type === 'city' && sel.id === c.id) { ctx.beginPath(); ctx.arc(p[0], p[1], r + 7, 0, Math.PI * 2); ctx.strokeStyle = '#e3c47a'; ctx.lineWidth = 2.2; ctx.stroke(); }
      hits.push({ x: p[0], y: p[1], r: Math.max(9, r + 4), type: 'city', id: c.id, pri: 1 });
      // Beschriftung
      const show = zl >= 1.5 ? (rank < 12 * zl * zl || c.capital) : c.capital && zl >= 1.05;
      if (show) {
        const fs = c.capital ? 12 : 11;
        ctx.font = (c.capital ? '700 ' : '600 ') + fs + 'px Inter, -apple-system, sans-serif';
        if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
        const w = ctx.measureText(c.name).width;
        const box = [p[0] + r + 5, p[1] - 8, w + 2, 16];
        if (!placed.some(b => box[0] < b[0] + b[2] && box[0] + box[2] > b[0] && box[1] < b[1] + b[3] && box[1] + box[3] > b[1])) {
          placed.push(box);
          ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,10,14,0.8)'; ctx.strokeText(c.name, box[0], p[1]);
          ctx.fillStyle = '#f4ecda'; ctx.fillText(c.name, box[0], p[1]);
        }
      }
      // Proteste
      if (sc.protest) {
        const st = sc.protest.stage;
        const col = st >= 3 ? '#d03b3b' : st >= 2 ? '#ec835a' : '#fab219';
        const bx = p[0] - r - 12, by = p[1] - r - 10;
        const pulse = st >= 2 ? 1 + 0.12 * Math.sin(time * 6) : 1;
        badge(bx, by, 'megaphone', col, 9 * pulse);
        hits.push({ x: bx, y: by, r: 11, type: 'city', id: c.id, pri: 3 });
      }
    });
    ctx.restore();
  }

  function drawProjects(zl) {
    const S = SIM.S;
    const perCity = {};
    const openInc = new Set(S.incidents.filter(i => i.status === 'offen').map(i => i.proj));
    for (const p of S.projects) {
      if (p.lon === undefined || p.n < 0 || p.lon === null) continue;
      const A = D.ACT[p.act];
      if (A.place === 'global' || A.place === 'front' || A.place === 'event') continue;
      if (p.phase === 'abgelehnt' && S.day - (p.rejectedAt || 0) > 200) continue;
      let lon = p.lon, lat = p.lat;
      if (A.place.indexOf('line') === 0 && p.c2 >= 0) { const a = W.cities[p.c], b = W.cities[p.c2]; lon = a.lon + KY.geo.dlon(a.lon, b.lon) / 2; lat = (a.lat + b.lat) / 2; }
      let pt = llScreen(lon, lat);
      if (pt[0] < -40 || pt[0] > SW + 40 || pt[1] < -40 || pt[1] > SH + 40) continue;
      // Mehrere Vorhaben am selben Ort im Kreis anordnen
      const key = Math.round(pt[0] / 14) + ':' + Math.round(pt[1] / 14);
      const k = perCity[key] = (perCity[key] || 0) + 1;
      if (k > 1 || (A.place.indexOf('city') === 0 || A.place === 'nation')) {
        const ang = -Math.PI / 2 + (k - 1) * 0.9 + (A.place === 'nation' ? 1.4 : 0.6);
        const rr = A.place === 'nation' ? 26 : 19;
        pt = [pt[0] + Math.cos(ang) * rr, pt[1] + Math.sin(ang) * rr];
      }
      const col = openInc.has(p.id) ? '#d03b3b' : PHCOL[p.phase] || '#999';
      const r = U.clamp(8 + zl * 0.6, 9, 12);
      if (openInc.has(p.id)) {
        const ph = (time * 1.4) % 1;
        ctx.beginPath(); ctx.arc(pt[0], pt[1], r + 3 + ph * 14, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(208,59,59,' + (0.9 * (1 - ph)).toFixed(2) + ')'; ctx.lineWidth = 2.4; ctx.stroke();
      }
      ctx.globalAlpha = p.phase === 'stillgelegt' || p.phase === 'aufgegeben' || p.phase === 'abgelehnt' ? 0.45 : 1;
      badge(pt[0], pt[1], A.icon, col, r, sel && sel.type === 'proj' && sel.id === p.id ? 3.2 : 2);
      if (p.phase === 'bau' || p.phase === 'laufend') {
        ctx.beginPath(); ctx.arc(pt[0], pt[1], r + 2.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p.prog);
        ctx.strokeStyle = '#e3c47a'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.globalAlpha = 1;
      hits.push({ x: pt[0], y: pt[1], r: r + 3, type: 'proj', id: p.id, pri: 2 });
    }
  }

  /* ---------- Platzierungsmodus ---------- */
  M.place = function (o) {
    M.placing = Object.assign({ first: -1, a: null, drag: null, mouse: null }, o);
    cv.classList.add('placing');
    dirty = true;
  };
  M.cancelPlace = function () { M.placing = null; cv.classList.remove('placing'); dirty = true; };
  function drawPlacing() {
    const pl = M.placing;
    if (!pl) return;
    ctx.save();
    if (pl.kind === 'line' && pl.first >= 0 && pl.mouse) {
      const a = W.cities[pl.first];
      const pa = llScreen(a.lon, a.lat);
      ctx.strokeStyle = pl.valid === false ? '#ef6b5f' : '#e3c47a';
      ctx.setLineDash([8, 6]); ctx.lineDashOffset = -time * 20; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pl.mouse[0], pl.mouse[1]); ctx.stroke();
      ctx.setLineDash([]);
      if (pl.km) {
        ctx.font = '600 12px Inter, sans-serif';
        const t = U.n(pl.km) + ' km';
        const mx = (pa[0] + pl.mouse[0]) / 2, my = (pa[1] + pl.mouse[1]) / 2 - 12;
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,10,14,0.9)'; ctx.strokeText(t, mx, my);
        ctx.fillStyle = '#f4ecda'; ctx.fillText(t, mx, my);
      }
    }
    if (pl.kind === 'point' && pl.mouse) {
      const ok = pl.valid !== false;
      ctx.beginPath(); ctx.arc(pl.mouse[0], pl.mouse[1], 14, 0, Math.PI * 2);
      ctx.strokeStyle = ok ? '#4fc46a' : '#ef6b5f'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(pl.mouse[0], pl.mouse[1], 3, 0, Math.PI * 2); ctx.fillStyle = ok ? '#4fc46a' : '#ef6b5f'; ctx.fill();
    }
    if (pl.kind === 'area' && pl.drag) {
      const [x0, y0, x1, y1] = pl.drag;
      ctx.fillStyle = 'rgba(227,196,122,0.12)'; ctx.strokeStyle = pl.valid === false ? '#ef6b5f' : '#e3c47a';
      ctx.setLineDash([6, 4]); ctx.lineWidth = 1.8;
      ctx.fillRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
      ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
      if (pl.areaTxt) {
        ctx.setLineDash([]); ctx.font = '600 12px Inter, sans-serif';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,10,14,0.9)'; ctx.strokeText(pl.areaTxt, Math.min(x0, x1) + 6, Math.min(y0, y1) - 8);
        ctx.fillStyle = '#f4ecda'; ctx.fillText(pl.areaTxt, Math.min(x0, x1) + 6, Math.min(y0, y1) - 8);
      }
    }
    ctx.restore();
  }

  /* ---------- Treffer ---------- */
  function hitTest(x, y) {
    let best = null, bd = Infinity;
    for (const h of hits) {
      const d = Math.hypot(h.x - x, h.y - y);
      if (d <= h.r) { const s = d - (h.pri || 0) * 3; if (s < bd) { bd = s; best = h; } }
    }
    if (best) return best;
    const ll = M.toLonLat(x, y);
    const nid = KY.geo.nationAt(ll.lon, ll.lat);
    if (nid >= 0) return { type: 'nation', id: nid, lon: ll.lon, lat: ll.lat };
    return { type: 'sea', lon: ll.lon, lat: ll.lat };
  }
  M.select = function (s) { sel = s; dirty = true; };

  /* ---------- Eingabe ---------- */
  function bindInput() {
    const ptrs = new Map();
    let down = null, pinch = null;
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId);
      ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
      anim = null;
      if (ptrs.size === 2) {
        const [a, b] = Array.from(ptrs.values());
        pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 };
        down = null; return;
      }
      down = { x: e.offsetX, y: e.offsetY, moved: false, area: M.placing && M.placing.kind === 'area' };
      if (down.area) M.placing.drag = [e.offsetX, e.offsetY, e.offsetX, e.offsetY];
    });
    cv.addEventListener('pointermove', e => {
      const x = e.offsetX, y = e.offsetY;
      if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [x, y]);
      if (pinch && ptrs.size === 2) {
        const [a, b] = Array.from(ptrs.values());
        const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        M.panBy(pinch.x - mx, pinch.y - my);
        M.zoomBy(d / pinch.d, mx, my);
        pinch = { d, x: mx, y: my };
        return;
      }
      if (down) {
        if (down.area) {
          M.placing.drag[2] = x; M.placing.drag[3] = y;
          if (M.placing.onArea) M.placing.onArea(M.placing.drag, false);
          dirty = true; return;
        }
        const dx = x - down.x, dy = y - down.y;
        if (!down.moved && Math.hypot(dx, dy) > 5) { down.moved = true; cv.classList.add('dragging'); hideTip(); }
        if (down.moved) { M.panBy(-(x - (down.lx || down.x)), -(y - (down.ly || down.y))); down.lx = x; down.ly = y; }
        return;
      }
      onHover(x, y);
    });
    const up = e => {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      cv.classList.remove('dragging');
      if (!down) return;
      const d = down; down = null;
      if (d.area && M.placing) {
        const dr = M.placing.drag;
        if (dr && Math.hypot(dr[2] - dr[0], dr[3] - dr[1]) > 10 && M.placing.onArea) M.placing.onArea(dr, true);
        else if (M.placing) M.placing.drag = null;
        dirty = true; return;
      }
      if (!d.moved) onClick(e.offsetX, e.offsetY);
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => { if (!down) hideTip(); });
    cv.addEventListener('dblclick', e => { if (!M.placing) M.zoomBy(2, e.offsetX, e.offsetY); });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      anim = null;
      const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? SH : 1;
      if (e.ctrlKey) M.zoomBy(Math.exp(-e.deltaY * k * 0.012), e.offsetX, e.offsetY);
      else M.panBy(e.deltaX * k, e.deltaY * k);
      hideTip();
    }, { passive: false });
    // Safari: Pinch-Geste auf dem Trackpad
    let gs = 1, gp = null;
    cv.addEventListener('gesturestart', e => { e.preventDefault(); gs = 1; const r = cv.getBoundingClientRect(); gp = [e.clientX - r.left, e.clientY - r.top]; });
    cv.addEventListener('gesturechange', e => { e.preventDefault(); const f = e.scale / gs; gs = e.scale; M.zoomBy(f, gp ? gp[0] : SW / 2, gp ? gp[1] : SH / 2); });
    cv.addEventListener('gestureend', e => { e.preventDefault(); });
    document.addEventListener('gesturestart', e => e.preventDefault());
  }

  function onHover(x, y) {
    const pl = M.placing;
    if (pl) {
      pl.mouse = [x, y];
      if (pl.onMove) pl.onMove(x, y);
      if (pl.kind === 'nation' || pl.kind === 'two') { const ll = M.toLonLat(x, y); const nid = KY.geo.nationAt(ll.lon, ll.lat); if (nid !== hoverNation) { hoverNation = nid; } }
      dirty = true;
    }
    const h = hitTest(x, y);
    hover = h;
    showTip(h, x, y);
  }
  function onClick(x, y) {
    const h = hitTest(x, y);
    const pl = M.placing;
    if (pl) { if (pl.onClick) pl.onClick(h, x, y); dirty = true; return; }
    hideTip();
    if (h.type === 'city') KY.ui.inspect('city', h.id);
    else if (h.type === 'proj') KY.ui.inspect('proj', h.id);
    else if (h.type === 'ev') KY.ui.inspect('ev', h.id);
    else if (h.type === 'nation') KY.ui.inspect('nation', h.id);
    else if (h.type === 'rel') KY.ui.inspect('nation', h.a);
    else KY.ui.closeInsp();
  }

  const tipEl = () => U.$('#tip');
  function hideTip() { const t = tipEl(); if (t) t.style.display = 'none'; }
  function showTip(h, x, y) {
    const t = tipEl();
    if (!t) return;
    const S = SIM.S;
    let html = '';
    const row = (k, v) => `<div class="r"><span>${k}</span><b>${v}</b></div>`;
    if (h.type === 'city') {
      const c = W.cities[h.id], sc = S.cities[h.id];
      html = `<div class="h">${KY.icon('pin', 14)}${U.esc(c.name)}${c.capital ? ' <span class="chip ghost" style="height:18px">Hauptstadt</span>' : ''}</div>` + row('Staat', U.esc(W.nations[c.nation].short)) + row('Einwohner', U.people(sc.pop)) + row('Wohlstand', Math.round(sc.prosperity)) + row('Stimmung zu Ihnen', U.sgn(sc.sent, 0)) + (sc.protest ? row('Protest', KY.nations.PROTEST_STAGES[sc.protest.stage]) : '');
    } else if (h.type === 'proj') {
      const p = KY.projects.byId(h.id);
      html = `<div class="h">${KY.icon(D.ACT[p.act].icon, 14)}${U.esc(p.name)}</div>` + row('Status', KY.projects.PHASES[p.phase]) + (p.phase === 'bau' || p.phase === 'laufend' ? row('Fortschritt', U.pct(p.prog * 100, 0)) : '') + row('Träger', U.esc(KY.projects.frontName(p)));
    } else if (h.type === 'ev') {
      const ev = KY.events.byId(h.id);
      html = `<div class="h">${KY.icon(D.EVENTS[ev.type].icon, 14)}${U.esc(ev.name)}</div>` + row('Stufe', ev.sev + ' von 5') + row('Todesopfer', U.n(ev.deadNow)) + (ev.displaced ? row('Obdachlos', U.count(ev.displaced)) : '') + row('Lage', ev.phase === 'vorbei' ? 'vorüber' : 'akut');
    } else if (h.type === 'nation') {
      const n = S.nations[h.id], w = W.nations[h.id];
      html = `<div class="h">${KY.flag(w, 18)}${U.esc(w.short)}</div>` + row('Einwohner', U.people(n.pop)) + row('Regierung', U.esc(n.gov.leader)) + row('Haltung zu Ihnen', n.aware < 5 ? 'unbekannt' : U.sgn(n.op, 0)) + row('Zufriedenheit', Math.round(n.happy)) + row('Ihr Zugang', Math.round(n.access));
      if (M.placing && M.placing.kind === 'two' && M.placing.first >= 0 && M.placing.first !== h.id) { const R = SIM.rel(M.placing.first, h.id); html += row('Beziehung', SIM.REL_NAMES[R.state] + ' (' + Math.round(R.v) + ')'); }
    } else if (h.type === 'rel') {
      const R = SIM.rel(h.a, h.b);
      html = `<div class="h">${KY.icon('alert', 14)}${U.esc(W.nations[h.a].short)} – ${U.esc(W.nations[h.b].short)}</div>` + row('Beziehung', SIM.REL_NAMES[R.state]) + row('Wert', Math.round(R.v));
    } else { hideTip(); return; }
    if (M.placing && M.placing.tipExtra) html += M.placing.tipExtra(h);
    t.innerHTML = html;
    t.style.display = 'block';
    const tw = t.offsetWidth, th = t.offsetHeight;
    let tx = x + 16, ty = y + 16;
    if (tx + tw > SW - 10) tx = x - tw - 16;
    if (ty + th > SH - 40) ty = y - th - 16;
    t.style.left = tx + 'px'; t.style.top = ty + 'px';
  }

  /* Kartenausschnitt für das Fernsehbild */
  M.snapshot = function (lon, lat, w, h, zoomUnits, target) {
    const c = target || document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const z = w / zoomUnits;
    let cx = lonX(lon), cy = latY(lat);
    g.fillStyle = '#0d1d31'; g.fillRect(0, 0, w, h);
    g.imageSmoothingEnabled = true;
    for (const off of [-WW, 0, WW]) {
      g.setTransform(z, 0, 0, z, (off - cx) * z + w / 2, -cy * z + h / 2);
      if (tex) g.drawImage(tex, 0, 0, WW, WH);
      if (borderPath) { g.strokeStyle = 'rgba(255,240,210,0.4)'; g.lineWidth = 1.2 / z; g.stroke(borderPath); }
      riverPaths.forEach((rp, i) => { g.strokeStyle = 'rgba(96,150,196,0.8)'; g.lineWidth = (0.8 + i * 0.6) / z; g.stroke(rp); });
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    return c;
  };
})();


/* ===== js/ui/panels.js ===== */
/* KYTHERA · MANDAT · Bereiche der Seitenleiste */
(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U, D = KY.data, SIM = KY.sim;
  const P = KY.P, A = KY.A, ui = KY.ui;
  const ic = (n, s) => KY.icon(n, s || 16);
  const esc = U.esc;
  const stat = (k, v, s, cls) => `<div class="stat ${cls || ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? '<div class="s">' + s + '</div>' : ''}</div>`;

  function projRow(p) {
    const Ac = D.ACT[p.act];

  /* ================= LAGE ================= */
  P.lage = {
    title: 'Lagezentrum', kicker: 'Nur für die Mandatsperson',
    sub: () => U.dateStr(SIM.S.day) + ' · Mandatsjahr ' + SIM.S.year.n,
    render() {

      let h = `<div class="grid2">
        ${stat('Liquides Vermögen', U.money(KY.finance.avail()), 'Zusagen ' + U.money(KY.finance.commitments()))}

        ${stat('Leben gerettet', U.count(Math.round(g.lives)), 'geschätzt, kumuliert')}
        ${stat('Todesopfer', U.n(g.deaths), 'in Ihrer Verantwortung')}
        ${stat('Vorhaben', tot.count + ' aktiv', tot.building + ' im Bau oder Verfahren')}
        ${stat('Haltung der Welt', U.sgn(SIM.worldOp(), 1), U.pct(SIM.worldAware(), 0) + ' wissen von Ihnen')}
      </div>`;
      const todo = [];
      if (g.hearing) todo.push(`<div class="card alert click" data-a="hearing"><div class="row">${ic('gavel', 18)}<div><b>Anhörung vor dem Kuratorium</b><div class="dim" style="font-size:12px">Das Kuratorium erwartet Ihre Antworten.</div></div></div></div>`);
      openInc.forEach(i => todo.push(`<div class="card alert click" data-a="inc" data-id="${i.id}"><div class="row top">${ic('siren', 18)}<div style="flex:1;min-width:0"><b>${esc(i.name)} · ${esc(i.projName)}</b><div class="dim ell" style="font-size:12px">${esc(i.title)}</div></div><span class="deadline">${i.deadline - S.day < 0 ? 'überfällig' : 'Frist ' + U.days(i.deadline - S.day)}</span></div></div>`));
      blocks.forEach(c => { const p = KY.projects.byId(c.protest.proj); todo.push(`<div class="card click" data-a="city" data-id="${c.id}"><div class="row">${ic('protest', 18)}<div><b>${KY.nations.PROTEST_STAGES[c.protest.stage]} in ${esc(SIM.cName(c.id))}</b><div class="dim" style="font-size:12px">${p ? esc(p.name) : ''} · ${U.count(c.protest.size)} Menschen</div></div></div></div>`); });
      rej.forEach(p => todo.push(`<div class="card click" data-a="proj" data-id="${p.id}"><div class="row">${ic('refresh', 18)}<div><b>Neuer Antrag möglich</b><div class="dim" style="font-size:12px">${esc(p.name)}</div></div></div></div>`));
      (S.forecasts || []).filter(f => f.sev >= 3 && !f.prepared).forEach(f => todo.push(`<div class="card goldb"><div class="row">${ic('sat', 18)}<div style="flex:1"><b>Vorhersage: ${D.EVENTS[f.type].n} in ${f.day - S.day} Tagen</b><div class="dim" style="font-size:12px">${esc(SIM.cName(f.city))} · Stufe ${f.sev}</div></div><button class="btn sm" data-a="prepare" data-c="${f.city}" data-d="${f.day}">Vorsorgen</button></div></div>`));
      h += `<div class="h3">${ic('check', 13)} Entscheidungen<span class="r dim">${todo.length || 'keine'}</span></div>` + (todo.length ? todo.join('') : '<div class="empty">Nichts wartet auf Ihre Entscheidung.</div>');

      act.forEach(ev => {

        h += `<div class="card"><div class="row top"><div class="ic-c" style="color:var(--serious)">${ic(D.EVENTS[ev.type].icon, 20)}</div><div style="flex:1;min-width:0"><b class="ell" style="display:block">${esc(ev.name)}</b><div class="dim" style="font-size:12px">Stufe ${ev.sev} · ${U.n(ev.deadNow)} Tote${ev.displaced ? ' · ' + U.count(ev.displaced) + ' obdachlos' : ''}${ev.saved ? ' · <span class="good">' + U.n(Math.round(ev.saved)) + ' gerettet</span>' : ''}</div></div></div>
          <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">${['LUFTBRUECKE', 'LAZARETT', 'WIEDERAUFBAU'].map(id => ev.helped[id] ? `<span class="chip green">${ic('check', 12)} ${D.ACT[id].name}</span>` : `<button class="btn xs" data-a="order" data-id="${id}" data-pl='${JSON.stringify({ ev: ev.id })}'>${ic(D.ACT[id].icon, 13)} ${D.ACT[id].name}</button>`).join('')}<button class="btn xs ghost" data-a="ev" data-id="${ev.id}">${ic('pin', 13)}</button></div>${!helped && ev.phase !== 'vorbei' ? '' : ''}</div>`;
      });
      tens.forEach(k => {
        const [a, b] = k.split(':').map(Number); const R = S.rel[k];
        h += `<div class="card"><div class="row"><div class="ic-c" style="color:var(--crit)">${ic('alert', 18)}</div><div style="flex:1"><b>${SIM.REL_NAMES[R.state]}: ${esc(SIM.nName(a))} – ${esc(SIM.nName(b))}</b><div class="dim" style="font-size:12px">Beziehung ${Math.round(R.v)} · seit ${U.dateStr(R.since, true)}</div></div><button class="btn sm" data-a="order" data-id="VERMITTLUNG" data-pl='${JSON.stringify({ n: a, n2: b })}'>Vermitteln</button></div></div>`;
      });
      h += `<div class="h3">${ic('news', 13)} Neueste Meldungen<span class="r"><button class="btn xs ghost" data-a="panel" data-p="medien">Alle</button></span></div><div>` + S.news.slice(0, 6).map(KY.mediaUi.artRow).join('') + '</div>';
      if (g.pressHist.length > 2) h += `<div class="h3">${ic('pulse', 13)} Druck im Verlauf</div>` + KY.chart.line(KY.chart.monthly(g.pressHist, S.day), { h: 90, min: 0, max: 100, color: '#ec835a', fmt: v => Math.round(v) + ' %' });

    },
    sub: () => { const t = KY.projects.totals(); return 'Investiert ' + U.money(t.invested) + ' · Einnahmen ' + U.money(t.income) + ' pro Jahr'; },
    render(tab) {

      let h = `<div class="grid4">${stat('Arbeitsplätze', U.count(t.jobs))}${stat('Saubere Leistung', U.n(t.power, 1) + ' GW')}${stat('CO₂ vermieden', U.n(t.co2, 1) + ' Mt/a')}${stat('Wohnungen', U.count(t.homes))}</div><div style="height:12px"></div>`;
      const set = { aktiv: p => KY.projects.ACTIVE[p.phase], fertig: p => p.phase === 'abgeschlossen' || p.phase === 'uebergeben', aus: p => ['abgelehnt', 'stillgelegt', 'aufgegeben'].indexOf(p.phase) >= 0 }[tab];
      const list = S.projects.filter(set).slice().reverse();
      if (!list.length) return h + `<div class="empty">${tab === 'aktiv' ? 'Noch keine Vorhaben. Öffnen Sie den Handlungskatalog mit <span class="kbd">A</span>.' : 'Keine Einträge.'}</div>`;
      return h + '<div class="list">' + list.map(projRow).join('') + '</div>';

  };

  /* ================= VERANTWORTUNG ================= */
  P.verantwortung = {
    title: 'Verantwortung', kicker: 'Verantwortungsregister KY-M/2027/05',
    tabs: () => [{ id: 'bilanz', n: 'Bilanz' }, { id: 'register', n: 'Register', badge: KY.incidents.open().length || '' }, { id: 'grundsaetze', n: 'Grundsätze' }, { id: 'berichte', n: 'Jahresberichte' }],
    sub: () => 'Was Ihre Entscheidungen bewirkt haben – im Guten wie im Schlechten',
    render(tab) {
      const S = SIM.S, g = S.g;
      tab = tab || 'bilanz';
      if (tab === 'register') {
        if (!S.incidents.length) return '<div class="empty">Das Register ist leer. Bisher ist bei Ihren Vorhaben nichts geschehen.</div>';
        const open = S.incidents.filter(i => i.status === 'offen'), rest = S.incidents.filter(i => i.status !== 'offen');
        return (open.length ? `<div class="h3">Offen<span class="r dim">${open.length}</span></div><div class="list">${open.map(incRow).join('')}</div>` : '') + `<div class="h3">Entschieden<span class="r dim">${rest.length}</span></div><div class="list">${rest.map(incRow).join('') || '<div class="empty">—</div>'}</div>`;
      }
      if (tab === 'grundsaetze') {
        const pr = S.contracts.vals.principles || [];
        const K8 = D.CONTRACTS.find(c => c.id === 'K08');
        const ch = K8 ? K8.fields[0].choices : [];
        let h = '<div class="note" style="margin-bottom:12px">Ihre freiwilligen Grundsätze aus der Ethischen Grundsatzerklärung (KY-M/2027/08). Ein Bruch ist möglich, wird aber protokolliert und kostet Vertrauen.</div>';
        if (!pr.length) h += '<div class="empty">Sie haben sich auf keine Grundsätze verpflichtet.</div>';
        pr.forEach(id => {
          const c = ch.find(x => x.v === id) || { l: id, note: '' };
          const br = g.breaks.filter(b => b.id === id);
          h += `<div class="card ${br.length ? 'alert' : ''}"><div class="row sb"><b>${esc(c.l)}</b>${br.length ? '<span class="chip red">' + br.length + '× gebrochen</span>' : '<span class="chip green">eingehalten</span>'}</div><div class="dim" style="font-size:12px;margin-top:3px">${esc(c.note || '')}</div>${br.map(b => '<div style="font-size:12px;margin-top:5px">' + ic('x', 12) + ' ' + U.dateStr(b.day, true) + (b.projName ? ' · ' + esc(b.projName) : '') + '</div>').join('')}</div>`;
        });
        if (g.auflagen && S.day < g.auflagen.until) h += `<div class="h3">Auflagen</div><div class="warnbox">${ic('alert', 16)}<div>${g.auflagen.kind === 'safety' ? 'Nur höchster Sicherheitsstandard' : '15 % des Vermögens gesperrt'} bis ${U.dateStr(g.auflagen.until, true)}${g.auflagen.self ? ' (Selbstverpflichtung)' : ''}.</div></div>`;
        return h;
      }
      if (tab === 'berichte') {
        const R = S.reports || [];
        if (!R.length) return `<div class="empty">Der erste Jahresbericht ist am ${U.dateStr(365, true)} fällig.</div>`;
        return R.slice().reverse().map(r => `<div class="card click" data-a="report" data-y="${r.year}"><div class="row sb"><b>Jahresbericht ${r.year}</b><span class="chip ${r.score > 1.5 ? 'green' : r.score > 0 ? 'gold' : 'red'}">${esc(r.grade)}</span></div><div class="dim" style="font-size:12px;margin-top:4px">${U.n(r.lives)} Leben gerettet · ${U.n(r.deaths)} Todesopfer · ${r.done} Vorhaben fertig · ${r.versaeumt} Versäumnisse</div></div>`).join('');
      }
      const ratio = g.deaths > 0 ? g.lives / g.deaths : null;
      const p = g.pressure;
      let h = `<div class="grid2">
        <div class="stat big"><div class="k">Leben gerettet</div><div class="v good">${U.count(Math.round(g.lives))}</div><div class="s">davon ${U.count(Math.round(g.livesRelief))} durch Krisenhilfe</div></div>
        <div class="stat big"><div class="k">Todesopfer</div><div class="v ${g.deaths ? 'bad' : ''}">${U.n(g.deaths)}</div><div class="s">${U.n(g.injured)} Verletzte · ${U.count(g.displaced)} Umsiedlungen</div></div>
      </div>
      <div class="note" style="margin:10px 0 0">${ratio ? 'Auf jedes Todesopfer kommen rechnerisch ' + U.n(ratio, ratio < 10 ? 1 : 0) + ' gerettete Leben. Keine Rechnung macht ein Opfer ungeschehen.' : 'Bei Ihren Vorhaben ist bisher niemand ums Leben gekommen.'}</div>
      <div class="h3">Druck auf die Mandatsperson</div>
      <div class="card"><div class="row sb"><b style="font-size:20px" class="${p > 60 ? 'bad' : p > 35 ? 'warnc' : ''}">${Math.round(p)} %</b><span class="dim" style="font-size:12px">${p > 80 ? 'Krisenmodus: das Kuratorium beobachtet jede Ihrer Entscheidungen' : p > 60 ? 'Hoher Druck: Medien und Kuratorium erwarten Antworten' : p > 35 ? 'Spürbarer Druck' : 'Ruhige Lage'}</span></div>${ui.meter(p, p > 60 ? 'var(--crit)' : p > 35 ? 'var(--warn)' : 'var(--good)')}
      <div style="margin-top:10px">${pressureParts().map(x => `<div class="kv"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div></div>
      <div class="h3">Vertrauen des Kuratoriums</div>
      <div class="card"><div class="row sb"><b style="font-size:20px">${Math.round(g.trust)} %</b><span class="dim" style="font-size:12px">${g.trust < 25 ? 'Auflagen drohen' : g.trust < 45 ? 'Das Kuratorium ist besorgt' : g.trust > 75 ? 'Großes Vertrauen' : 'Stabil'}</span></div>${ui.meter(g.trust, g.trust < 25 ? 'var(--crit)' : 'var(--gold)')}
      <div class="kv" style="margin-top:8px"><span>Versäumnisse nach Krisenprotokoll</span><span>${g.versaeumt}</span></div><div class="kv"><span>Grundsatzbrüche</span><span>${g.breaks.length}</span></div><div class="kv"><span>Anhörungen</span><span>${g.hearings.length}</span></div></div>`;
      if (g.pressHist.length > 2) h += `<div class="h3">Verlauf des Drucks</div>` + KY.chart.line(KY.chart.monthly(g.pressHist, S.day), { h: 100, min: 0, max: 100, color: '#ec835a', fmt: v => Math.round(v) + ' %' });
      const mem = S.incidents.filter(i => i.dead > 0);
      if (mem.length) h += `<div class="h3">${ic('candle', 13)} In Erinnerung</div>` + mem.slice(0, 12).map(i => `<div class="memorial" style="padding:4px 0">${ic('candle', 14)} ${U.n(i.dead)} Menschen · ${esc(i.name)} bei ${esc(i.projName)} · ${U.dateStr(i.day, true)}</div>`).join('');

  A.report = b => { const r = (SIM.S.reports || []).find(x => x.year === +b.dataset.y); if (r) KY.crisis.report(r, true); };

  /* ================= STAATEN ================= */

    { k: 'happy', n: 'Zufried.', v: id => SIM.S.nations[id].happy, f: v => Math.round(v), r: 1 },
    { k: 'unrest', n: 'Unruhe', v: id => SIM.S.nations[id].unrest, f: v => Math.round(v), r: 1 },

    { k: 'aware', n: 'Bekannt', v: id => SIM.S.nations[id].aware, f: v => Math.round(v) + ' %', r: 1 },

    { k: 'gov', n: 'Regierung', v: id => SIM.S.nations[id].gov.lean, f: (v, id) => `<span class="chip" style="background:${D.PARTY_COLOR[v]}33;color:#e6e6e6">${D.PARTY_NAME[v]}</span>` },
    { k: 'elect', n: 'Wahl', v: id => SIM.S.nations[id].gov.next, f: v => U.days(v - SIM.S.day), r: 1 },
  ];
  P.staaten = {
    title: 'Staaten', kicker: 'Weltlage', wide: true,
    tabs: [{ id: 'tab', n: 'Übersicht' }, { id: 'rel', n: 'Beziehungen' }, { id: 'wahl', n: 'Wahlen' }],
    sub: () => SIM.W.nations.length + ' Staaten · ' + U.people(U.sum(SIM.S.nations.map(n => n.pop))) + ' Menschen',
    render(tab) {
      const S = SIM.S, W = SIM.W;
      tab = tab || 'tab';
      if (tab === 'rel') {
        const keys = Object.keys(S.rel).filter(k => S.rel[k].state !== 'normal').sort((a, b) => S.rel[a].v - S.rel[b].v);
        if (!keys.length) return '<div class="empty">Keine auffälligen Beziehungen.</div>';
        return '<table class="tbl"><tr><th>Staaten</th><th>Zustand</th><th class="r">Wert</th><th class="r">Seit</th><th></th></tr>' + keys.map(k => {
          const [a, b] = k.split(':').map(Number), R = S.rel[k];
          const col = R.state === 'partner' ? 'green' : R.state === 'angespannt' ? 'amber' : 'red';
          return `<tr><td>${KY.flag(W.nations[a], 14)} ${esc(W.nations[a].short)} – ${KY.flag(W.nations[b], 14)} ${esc(W.nations[b].short)}</td><td><span class="chip ${col}">${SIM.REL_NAMES[R.state]}</span>${R.trade ? ' <span class="chip blue">Handelsabkommen</span>' : ''}</td><td class="r">${Math.round(R.v)}</td><td class="r">${U.dateStr(R.since, true)}</td><td class="r">${R.state !== 'partner' ? `<button class="btn xs" data-a="order" data-id="VERMITTLUNG" data-pl='${JSON.stringify({ n: a, n2: b })}'>Vermitteln</button>` : ''}</td></tr>`;
        }).join('') + '</table>';
      }
      if (tab === 'wahl') {
        const up = S.nations.map((n, id) => ({ id, n })).sort((a, b) => a.n.gov.next - b.n.gov.next);
        let h = '<div class="h3">Anstehende Wahlen</div><table class="tbl"><tr><th>Staat</th><th>Regierung</th><th>Zustimmung</th><th class="r">Termin</th></tr>' + up.slice(0, 12).map(x => `<tr class="click" data-a="nation" data-id="${x.id}"><td>${KY.flag(W.nations[x.id], 14)} ${esc(W.nations[x.id].short)}</td><td>${esc(x.n.gov.leader)} · ${esc(x.n.gov.party)}</td><td>${Math.round(x.n.gov.approval)} %</td><td class="r">${U.dateStr(x.n.gov.next, true)}</td></tr>`).join('') + '</table>';
        const past = [];
        S.nations.forEach((n, id) => n.elections.forEach(e => past.push(Object.assign({ id }, e))));
        past.sort((a, b) => b.day - a.day);
        h += '<div class="h3">Ergebnisse</div>' + (past.length ? '<table class="tbl"><tr><th>Datum</th><th>Staat</th><th>Sieger</th><th class="r">Ergebnis</th></tr>' + past.slice(0, 20).map(e => `<tr><td>${U.dateStr(e.day, true)}</td><td>${esc(W.nations[e.id].short)}</td><td>${esc(e.party)} <span class="chip" style="background:${D.PARTY_COLOR[e.lean]}33">${D.PARTY_NAME[e.lean]}</span>${e.re ? '' : ' <span class="chip gold">Wechsel</span>'}</td><td class="r">${U.pct(e.pct, 1)}</td></tr>`).join('') + '</table>' : '<div class="empty">Noch keine Wahlen seit Beginn des Mandats.</div>');
        return h;
      }
      const so = ui.st.sort.staaten || { k: 'pop', d: -1 };
      const col = COLS.find(c => c.k === so.k) || COLS[1];
      const ids = W.nations.map(n => n.id).sort((a, b) => { const va = col.v(a), vb = col.v(b); return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * so.d; });
      return '<table class="tbl"><tr>' + COLS.map(c => `<th class="${c.r ? 'r' : ''} ${c.k === so.k ? 'on' : ''}" data-a="sort" data-p="staaten" data-v="${c.k}">${c.n}${c.k === so.k ? (so.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>' +
        ids.map(id => `<tr class="click" data-a="nation" data-id="${id}">` + COLS.map(c => { const v = c.v(id); return `<td class="${c.r ? 'r' : ''}">${c.k === 'name' ? KY.flag(W.nations[id], 14) + ' ' + esc(v) + (S.nations[id].crisis ? ' <span class="chip red" style="height:18px">' + esc(D.CRISES[S.nations[id].crisis.k] ? D.CRISES[S.nations[id].crisis.k].n : '') + '</span>' : '') : c.f ? c.f(v, id) : esc(v)}</td>`; }).join('') + '</tr>').join('') + '</table>';
    },
  };
  A.sort = b => { const p = b.dataset.p, k = b.dataset.v; const so = ui.st.sort[p] || {}; ui.st.sort[p] = { k, d: so.k === k ? -so.d : (k === 'name' ? 1 : -1) }; ui.renderPanel(true); };

  /* ================= FINANZEN ================= */
  P.finanzen = {
    title: 'Finanzen', kicker: 'Treuhand · ' + 'Vermögensverwaltung',
    sub: () => { const tr = SIM.adv('trustee'); return tr.house + ' · Strategie ' + ({ kons: 'konservativ', bal: 'ausgewogen', off: 'offensiv' }[SIM.contract('strategy')] || ''); },
    render() {
      const S = SIM.S, f = S.fin;
      const t = KY.projects.totals();
      const frozen = S.day < f.frozenUntil ? f.frozen : 0;
      let h = `<div class="grid2">${stat('Liquides Vermögen', U.money(KY.finance.avail()), frozen ? U.money(frozen) + ' gesperrt bis ' + U.dateStr(f.frozenUntil, true) : 'verfügbar')}${stat('Entschädigungsfonds', U.money(f.fund), 'Krisenprotokoll KY-M/2027/06')}${stat('Offene Zusagen', U.money(KY.finance.commitments()), 'laufende Bauvorhaben')}${stat('Einnahmen aus Vorhaben', U.money(t.income) + '/Jahr', 'Unterhalt ' + U.money(t.upkeep) + '/Jahr')}</div>`;
      if (f.hist.length > 2) h += `<div class="h3">Vermögen im Verlauf</div>` + KY.chart.line(f.hist.map(x => ({ y: x.c, xl: U.monthStr(x.d), lbl: U.monthStr(x.d) })), { h: 130, color: '#c9a24f', fmt: v => U.money(v) });
      const y = f.y;
      h += `<div class="h3">Laufendes Jahr</div><div class="card"><div class="kv"><span>Kapitalerträge</span><span class="${y.ret >= 0 ? 'good' : 'bad'}">${U.sgn(y.ret, 1)} Mrd.</span></div><div class="kv"><span>Einnahmen aus Vorhaben</span><span>${U.money(y.inc)}</span></div><div class="kv"><span>Ausgaben</span><span>${U.money(y.spent)}</span></div><div class="kv"><span>Gebühren (Treuhand und Rechtsordnung)</span><span>${U.money(y.fees)}</span></div><div class="kv"><span>Entschädigungen</span><span>${U.money(y.comp)}</span></div></div>`;
      if (f.ly) h += `<div class="note" style="margin-top:8px">Vorjahr: Erträge ${U.sgn(f.ly.ret, 1)} Mrd. · Ausgaben ${U.money(f.ly.spent)}.</div>`;
      const bonds = S.projects.filter(p => p.bond && p.phase === 'betrieb');
      if (bonds.length) h += `<div class="h3">Staatsanleihen</div>` + bonds.map(p => `<div class="kv"><span>${esc(SIM.nName(p.n))}</span><span>${U.money(p.bond.amount)} · ${U.n(p.bond.rate, 1)} %</span></div>`).join('');
      h += `<div class="h3">Buchungen</div>` + ((f.log || []).slice(0, 40).map(l => `<div class="kv"><span>${U.dateStr(l.day, true)} · ${esc(l.t)}</span><span class="${l.v < 0 ? '' : 'good'}">${l.v < 0 ? '−' : '+'}${U.money(Math.abs(l.v))}</span></div>`).join('') || '<div class="empty">Noch keine Buchungen.</div>');
      return h;
    },
  };

  /* ================= TARNUNG ================= */
  P.tarnung = {
    title: 'Tarnung', kicker: 'Geheimhaltung KY-M/2027/02',
    sub: () => SIM.S.g.exposed ? 'Öffentliche Phase: Ihr Deckname ist bekannt, Ihr Name nicht.' : 'Strukturen, Spuren und Recherchen',
    render() {
      const S = SIM.S, g = S.g;
      const e = g.exposure;
      let h = `<div class="card ${g.exposed ? 'alert' : e > 70 ? 'alert' : ''}"><div class="row sb"><div><div class="lbl">Enttarnungsgrad</div><div style="font:600 26px var(--sans)">${g.exposed ? 'Öffentlich' : Math.round(e) + ' %'}</div></div><div style="text-align:right;font-size:12px" class="dim">${g.exposed ? 'seit ' + U.dateStr(g.exposedAt, true) : e > 70 ? 'Die Enttarnung steht bevor' : e > 40 ? 'Journalisten vermuten eine einzelne Quelle' : 'Niemand ahnt etwas'}</div></div>${ui.meter(e, 'var(--serious)')}</div>`;
      h += `<div class="row" style="gap:8px;margin:12px 0;flex-wrap:wrap"><button class="btn sm" data-a="newFront">${ic('plus', 14)} Neue Struktur</button><button class="btn sm" data-a="order" data-id="TARN_KETTE">${ic('chain', 14)} Treuhandkette</button><button class="btn sm" data-a="order" data-id="TARN_GESICHT" ${g.face ? 'disabled' : ''}>${ic('face', 14)} Öffentliches Gesicht</button></div>`;
      if (S.day < g.chainUntil) h += `<div class="okbox" style="margin-bottom:10px">${ic('chain', 15)}<div>Verlängerte Treuhandkette aktiv bis ${U.dateStr(g.chainUntil, true)}: neue Spuren wachsen langsamer.</div></div>`;
      if (g.face) h += `<div class="card goldb"><div class="row">${ic('face', 20)}<div style="flex:1"><b>${esc(g.face.name)}</b><div class="dim" style="font-size:12px">${esc(g.face.role)} · öffentliches Gesicht seit ${U.dateStr(g.face.since, true)}</div></div><div style="text-align:right"><div class="lbl">Glaubwürdigkeit</div><b>${Math.round(g.face.cred)} %</b></div></div></div>`;
      h += `<div class="h3">Tarnstrukturen<span class="r dim">${S.fronts.length}</span></div>`;
      S.fronts.forEach(f => {
        const K = D.FRONT_KINDS.find(k => k.id === f.kind);
        const act = f.projects.filter(pid => { const p = KY.projects.byId(pid); return p && KY.projects.ACTIVE[p.phase]; }).length;
        const ch = f.inv ? D.CHANNELS.find(c => c.id === f.inv.ch) : null;
        h += `<div class="card ${f.exposed ? 'alert' : ''} click" data-a="front" data-id="${f.id}"><div class="row sb"><div style="min-width:0"><b>${esc(f.name)}</b><div class="dim" style="font-size:12px">${K.n} · Sitz ${esc(f.seat)} · ${f.projects.length} Vorhaben (${act} aktiv)</div></div>${f.exposed ? '<span class="stamp">Enttarnt</span>' : `<b class="${f.trace > 80 ? 'bad' : f.trace > 50 ? 'warnc' : ''}">${Math.round(f.trace)} %</b>`}</div>${f.exposed ? '' : ui.meter(f.trace, f.trace > 80 ? 'var(--crit)' : f.trace > 50 ? 'var(--warn)' : 'var(--blue)')}${f.inv ? `<div class="warnbox" style="margin-top:8px">${ic('eyeglass', 15)}<div>Recherche von ${esc(ch ? ch.name : 'Journalisten')} (${esc(f.inv.reporter)}) · ${Math.round(f.inv.prog * 100)} %</div></div>` : ''}<div class="dim" style="font-size:11px;margin-top:6px">${esc(K.note)}</div></div>`;
      });
      h += `<div class="h3">Leitfaden von Milena Dobrev</div><div class="note">Sichtbare Vorhaben, Länder mit freier Presse und schwere Vorfälle erzeugen Spuren. Wer viele Vorhaben über eine einzige Struktur abwickelt, erzeugt ein Muster. Passende Strukturen sind unauffälliger. Druck auf Journalisten ist nach dem Mandat ausgeschlossen – Sie können nur verteilen, verlängern und auflösen.</div>`;
      return h;
    },
  };
  A.newFront = () => KY.order.newFrontDialog();

  /* ================= FORSCHUNG ================= */
  P.forschung = {
    title: 'Forschung', kicker: 'Forschungsprogramme',
    sub: () => SIM.S.res.active.length + ' von ' + KY.research.MAX + ' Programmen laufen',
    render() {
      const S = SIM.S;
      let h = '<div class="note" style="margin-bottom:12px">Offene Forschung steht allen Staaten frei zur Verfügung und stärkt Ihr Ansehen. Exklusive Forschung bringt Lizenzeinnahmen. Die Wirkung tritt mit dem Abschluss ein.</div>';
      const fields = Array.from(new Set(D.TECH.map(t => t.field)));
      fields.forEach(fld => {
        h += `<div class="h3">${esc(fld)}</div>`;
        D.TECH.filter(t => t.field === fld).forEach(t => {
          const st = KY.research.state(t.id);
          const a = S.res.active.find(x => x.id === t.id);
          const d = S.res.done[t.id];
          h += `<div class="card ${st === 'done' ? 'goldb' : ''}" style="${st === 'locked' ? 'opacity:.55' : ''}"><div class="row top"><div class="ic-c" style="color:var(--gold2)">${ic(t.icon, 20)}</div><div style="flex:1;min-width:0"><div class="row sb"><b>${esc(t.n)}</b>${st === 'done' ? '<span class="chip green">' + (d.mode === 'open' ? 'offen' : 'exklusiv') + ' · ' + U.dateStr(d.day, true) + '</span>' : st === 'active' ? '<span class="chip blue">' + Math.round(a.prog * 100) + ' %</span>' : st === 'locked' ? '<span class="chip ghost">' + ic('lock', 11) + ' gesperrt</span>' : ''}</div><div class="note" style="margin-top:3px">${esc(t.text)}</div>
            ${st === 'active' ? '<div class="prog"><i style="width:' + (a.prog * 100) + '%"></i></div>' : ''}
            ${st === 'locked' ? '<div class="dim" style="font-size:11px;margin-top:5px">Erfordert: ' + t.req.map(r => esc(D.TECH_BY[r].n)).join(', ') + '</div>' : ''}
            ${st === 'open' ? `<div class="row" style="margin-top:8px;gap:6px"><span class="dim" style="font-size:12px;margin-right:auto">${U.money(t.cost)} · ${U.days(t.days)}</span><button class="btn xs" data-a="research" data-id="${t.id}" data-m="open">Offen starten</button><button class="btn xs ghost" data-a="research" data-id="${t.id}" data-m="excl">Exklusiv</button></div>` : ''}</div></div></div>`;
        });
      });
      return h;
    },
  };
  A.research = b => {

    ui.renderPanel(true);
  };

  /* ================= KANAL ================= */
  P.kanal = {
    title: 'Verschlüsselter Kanal', kicker: 'KYTHERA · Ende-zu-Ende',
    sub: () => { const u = SIM.S.inbox.filter(m => !m.read).length; return u ? u + ' ungelesen' : 'Alle Nachrichten gelesen'; },
    render() {
      const S = SIM.S;
      const open = ui.st.msg ? S.inbox.find(m => m.id === ui.st.msg) : null;
      if (open) {
        open.read = true;
        const a = SIM.adv(open.from);
        const acts = open.acts.map((x, i) => `<button class="btn sm ${i === 0 ? 'primary' : ''}" data-a="msgAct" data-m="${open.id}" data-i="${i}">${esc(x.l)}</button>`).join('');
        const body = open.kind === 'letter'
          ? `<div class="letter"><div class="lh"><span>KURATORIUM · KYTHERA</span><span>${U.dateStr(open.day, true).toUpperCase()}</span></div><p><b>${esc(open.subj)}</b></p>${open.body.map(p => '<p>' + esc(p) + '</p>').join('')}<div class="sig">${esc(a.name)}<br><span style="font-size:12px">${esc(a.role)}</span></div></div>`
          : `<div class="card"><div class="row">${ui.advAvatar(open.from)}<div><b>${esc(a.name)}</b><div class="dim" style="font-size:12px">${esc(a.role)} · ${U.dateStr(open.day, true)}</div></div></div><div style="margin-top:12px;font-weight:700;font-size:15px">${esc(open.subj)}</div>${open.body.map(p => '<p class="note" style="font-size:13px;margin:8px 0 0">' + esc(p) + '</p>').join('')}</div>`;
        return `<button class="btn sm ghost" data-a="msgBack" style="margin-bottom:10px">${ic('chevL', 14)} Zurück</button>${body}${acts ? '<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">' + acts + '</div>' : ''}`;

      }).join('');

  /* ================= CHRONIK ================= */

        h += `<div class="kv" ${a} style="${a ? 'cursor:pointer' : ''}"><span style="color:var(--text);flex:1">${esc(c.text)}</span><span class="dim" style="font-weight:500;font-size:11px;white-space:nowrap">${U.mday(c.day)}. · ${CHT[c.type] || ''}</span></div>`;

        <div class="h3">Urkunden</div><div class="list">` + D.CONTRACTS.map(c => `<div class="li" data-a="readContract" data-id="${c.id}"><div class="ic-c">${ic('doc', 17)}</div><div class="m"><div class="t">${esc(c.title)}</div><div class="d">${esc(c.no)} · ${esc(c.party)}</div></div><div class="r">${ic('seal', 16)}</div></div>`).join('') + '</div>';

  /* ================= SYSTEM ================= */
  P.system = {
    title: 'System', kicker: 'Mandat verwalten', static: true,
    sub: () => 'Speichern, Laden, Einstellungen',
    render() {
      const S = SIM.S;

    const pos = rec.filter(p => p.tone > 0.2).length, neg = rec.filter(p => p.tone < -0.2).length, neu = rec.length - pos - neg;

    return r(pos, 'Positiv', 'var(--blue)') + r(neu, 'Neutral', '#7d8a9a') + r(neg, 'Negativ', '#e66767');
  }
  function worldOpHist() {
    const S = SIM.S;
    const L = Math.min.apply(null, S.nations.map(n => n.hist.op.length));
    const out = [];
    for (let i = 0; i < L; i++) {
      let s = 0, w = 0;
      S.nations.forEach(n => { const v = n.hist.op[n.hist.op.length - L + i]; s += v * n.pop; w += n.pop; });
      out.push(w ? s / w : 0);
    }
    return out;
  }
})();
