        '<div class="row" style="align-items:flex-start"><div class="li ic" style="width:42px;height:42px;padding:0;border:1px solid ' + (isNull ? 'var(--crit)' : 'var(--line3)') + ';display:grid;place-items:center;font:600 13px/1 var(--font-cond)">' + U.esc(s.short) + '</div><div style="min-width:0;flex:1;margin-left:12px"><div class="bold">' + U.esc(s.name) + '</div><div class="xs mut">' + U.esc(s.role || (s.kind === 'seat' ? 'Sitz des Kuratoriums' : s.kind === 'null' ? 'Zustellung über internen Knoten · Kennung IX-alt' : 'Systemnachricht')) + '</div></div><span class="mono xs mut">' + U.stamp(m.ts) + '</span></div>' +
        '<h2 class="serif" style="font-size:24px;font-weight:600;margin-top:16px">' + U.esc(m.subj) + '</h2>' +
        '<div class="' + (isNull ? 'mono' : 'serif') + '" style="white-space:pre-wrap;margin-top:12px;line-height:1.65;font-size:' + (isNull ? '14px' : '17px') + ';color:' + (isNull ? '#d9e3dc' : 'var(--fg)') + ';max-width:70ch">' + body + '</div>' +
        (m.replies ? '<div class="lbl mt16" style="margin-bottom:8px">' + (m.replied != null ? 'Ihre Antwort' : 'Antworten') + '</div>' + (m.replied != null ? '<div style="border-left:2px solid var(--acc);padding:6px 12px;background:var(--acc-bg)">' + U.esc(m.replies[m.replied].t) + '</div>' : '<div class="col">' + m.replies.map((r, i) => '<button class="opt" data-rep="' + i + '"><span class="on">' + String.fromCharCode(65 + i) + '</span><span class="t" style="font-weight:500">' + U.esc(r.t) + '</span></button>').join('') + '</div>') : '') +
        '</div>');
    },
    compose() {
      const S = KY.S, D = KY.data;
      const recips = D.council.filter(m => !m.proxy).map(m => ({ id: m.id, n: m.id + ' · Sitz ' + m.seat })).concat([{ id: 'HYDRA', n: 'HYDRA · Sitz VIII' }]);
      const body = document.createElement('div');
      body.innerHTML = '<div class="fld"><label for="cmTo">Empfänger</label><select class="inp" id="cmTo">' + recips.map(r => '<option value="' + r.id + '">' + r.n + '</option>').join('') + '</select></div>' +
        '<div class="fld mt12"><label for="cmI">Anliegen</label><select class="inp" id="cmI">' + Object.entries(INTENTS).map(([k, v]) => '<option value="' + k + '">' + v.n + '</option>').join('') + '</select></div>' +
        '<div class="fld mt12"><label for="cmT">Text</label><textarea class="inp" id="cmT" rows="4"></textarea></div>';
      const ta = body.querySelector('#cmT'), sel = body.querySelector('#cmI');
      const fill = () => { ta.value = INTENTS[sel.value].t + '\n\n' + S.user.codename + ' (IX)'; };
      sel.onchange = fill; fill();
      KY.ui.modal({
        lbl: 'Gesicherte Nachricht', title: 'Nachricht verfassen', body,
        actions: [{ label: 'Abbrechen', cls: 'ghost' }, { label: 'Senden', cls: 'pri', fn: () => { this.send(body.querySelector('#cmTo').value, sel.value, ta.value); } }],
      });
    },
    send(to, intent, text) {
      const S = KY.S, D = KY.data;
      KY.log('msg', 'Gesendet an ' + to + ': ' + INTENTS[intent].n);
      KY.ui.flashMsg('Nachricht an ' + to + ' zugestellt', 'ok');
      S.sentCool = S.sentCool || {};
      const key = to + intent;
      const cool = (S.sentCool[key] || 0) > S.t;
      S.sentCool[key] = S.t + 300;
      const delay = U.ri(12, 30);
      setTimeout(() => {
        if (!KY.S) return;
        if (to === 'HYDRA') {
          KY.story.sendCustom('SEK', 'Unzustellbar: Nachricht an Sitz VIII', 'Ihre Nachricht an Sitz VIII konnte nicht zugestellt werden. Für diesen Sitz ist kein persönliches Postfach hinterlegt. Stimmabgaben erfolgen über den beglaubigten Proxy (Charta, Anhang C).\n\nUrsprünglicher Text:\n' + text);
          return;
        }
        const m = D.council.find(x => x.id === to);
        const att = S.council.att[to];
        let reply;
        if (cool) reply = 'Sie haben mir dazu vor Kurzem bereits geschrieben. Ich habe es nicht vergessen.';
        else if (intent === 'dank') { KY.seatAdj(to, att > 40 ? 1 : 3); reply = { förmlich: 'Ihr Dank ist angekommen und vermerkt.', warm: 'Danke Ihnen. Das tut gut in diesen Wochen.', knapp: 'Zur Kenntnis genommen.', misstrauisch: 'Danke. Ich frage mich, was Sie als Nächstes brauchen.', neugierig: 'Oh, danke! Wir sollten uns einmal persönlich unterhalten.', diplomatisch: 'Ich weiß das zu schätzen. Der Ton im Plenum wird dadurch nicht schlechter.', direkt: 'Danke. Weiter so.' }[m.style]; }
        else if (intent === 'bitte') {
          const res = S.council.open;
          if (!res || !res.mine || res.mine === 'ENTH') reply = 'Ich weiß nicht, worum Sie mich bitten. Es liegt keine Vorlage vor, oder Sie haben noch keine Position bezogen.';
          else if (res.lobby[to]) reply = 'Wir sind uns bereits einig.';
          else if (att > 25 && Math.random() < 0.4 + att / 200) { res.lobby[to] = res.mine; KY.bus.emit('council'); reply = 'Einverstanden. Ich stimme mit Ihnen: ' + (res.mine === 'JA' ? 'Ja' : 'Nein') + '. Denken Sie daran, wenn ich Sie einmal brauche.'; KY.seatAdj(to, -1); }
          else { KY.seatAdj(to, -1); reply = 'Ich entscheide nach eigenem Ermessen. Bitte verstehen Sie das nicht als Unfreundlichkeit.'; }
        } else {
          const axis = Object.entries(m.prio).sort((a, b) => b[1] - a[1])[0][0];
          reply = 'Offen gesagt: Mich interessiert vor allem ' + D.axisNames[axis] + '. Vorlagen, die das stärken, unterstütze ich. Alles andere prüfe ich genau.';
        }
        KY.story.sendCustom(to, 'Re: ' + INTENTS[intent].n, reply + '\n\n' + m.sig);
      }, delay * 1000);
    },
  };
})();

/* js/mod/pythia.js */
/* KYTHERA · Modul PYTHIA */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;
  const CHIPS = ['Lagebericht', 'Was empfiehlst du?', 'Wie steht es um Zambra?', 'Marktlage', 'Offene Abstimmung', 'Risiko und Diskretion', 'Wer bist du?'];

  KY.mod.pythia = {
    mount(el, arg) {
      const S = KY.S;
      this.el = el;
      this.busy = false;
      el.innerHTML = KY.ui.head({ crumb: 'Analyse', code: 'PY-11', title: 'PYTHIA', sub: 'Analytisches Unterstützungssystem des Kuratoriums seit 1987. Fragen in natürlicher Sprache; Antworten beruhen auf der aktuellen Lage.' }) +
        '<div class="g g-main"><section class="pn tick" style="height:calc(100vh - 250px);min-height:460px"><div class="pn-h"><h3>Dialog</h3><div class="tools"><span class="meta" id="pyState">bereit</span><button class="btn sm ghost" id="pyClear">Verlauf leeren</button></div></div>' +
        '<div class="chat" id="pyChat"></div><div class="pn-f" style="flex-direction:column;align-items:stretch;gap:8px"><div class="chips" id="pyChips"></div><form class="row" id="pyForm"><input class="inp" id="pyIn" placeholder="Frage an PYTHIA …" autocomplete="off"><button class="btn pri" type="submit">Senden</button></form></div></section>' +
        '<aside class="col gap12"><section class="pn"><div class="pn-h"><h3>Systemzustand</h3></div><div class="pn-b" id="pyStat"></div></section><section class="pn"><div class="pn-h"><h3>Aktuelle Empfehlungen</h3></div><div class="pn-b flush" id="pyRecs"></div></section></aside></div>';
      if (!S.pythia.length) S.pythia.push({ who: 'py', text: 'Guten ' + (new Date().getHours() < 11 ? 'Morgen' : new Date().getHours() < 18 ? 'Tag' : 'Abend') + ', ' + S.user.codename + '. Ich bin PYTHIA.\n\nIch beobachte zwölf Regionen, 24 Emittenten, neun Sitze und alles, was dazwischen geschieht. Fragen Sie mich nach der Lage, nach Empfehlungen, nach einer Region oder einem Unternehmen.\n\nIch beantworte fast alles.', ts: Date.now(), conf: null });
      this.rChat();
      U.setHTML(el.querySelector('#pyChips'), CHIPS.map(c => '<button class="chip" type="button" data-q="' + U.esc(c) + '">' + U.esc(c) + '</button>').join(''));
      U.on(el, 'click', '[data-q]', (e, b) => this.ask(b.dataset.q));
      U.on(el, 'click', '[data-act]', (e, b) => KY.ui.doAct(JSON.parse(b.dataset.act)));
      U.on(el, 'click', '[data-src]', (e, b) => KY.ui.go(b.dataset.src, b.dataset.arg || undefined));
      el.querySelector('#pyForm').onsubmit = e => { e.preventDefault(); const v = el.querySelector('#pyIn').value.trim(); if (v) { el.querySelector('#pyIn').value = ''; this.ask(v); } };
      el.querySelector('#pyClear').onclick = () => { S.pythia = S.pythia.slice(0, 1); this.rChat(); };
      this.rSide();
      if (arg && arg.ask) setTimeout(() => this.ask(arg.ask), 250);
      setTimeout(() => { const i = el.querySelector('#pyIn'); if (i && window.innerWidth > 900) i.focus(); }, 60);
    },
    arg(a) { if (a && a.ask) this.ask(a.ask); },
    unmount() { this.dead = true; },
    tick() { this.n = (this.n || 0) + 1; if (this.n % 3 === 0) this.rSide(); },
    rChat() {
      const S = KY.S;
      const box = this.el.querySelector('#pyChat');
      box.innerHTML = S.pythia.map(m => this.msgHtml(m)).join('');
      box.scrollTop = box.scrollHeight;
    },
    msgHtml(m, typing) {
      const py = m.who === 'py';
      let foot = '';
      if (py && (m.conf != null || (m.src && m.src.length))) {
        foot = '<div class="foot">' + (m.conf != null ? '<span>Konfidenz ' + m.conf + ' %</span>' : '') + (m.src && m.src.length ? '<span>Quellen: ' + m.src.map(s => '<button class="lnk xs" data-src="' + s.mod + '"' + (s.arg ? ' data-arg="' + U.esc(s.arg) + '"' : '') + '>' + U.esc(s.label) + '</button>').join(', ') + '</span>' : '') + '</div>';
      }
      const acts = py && m.acts && m.acts.length ? '<div class="acts">' + m.acts.map(a => '<button class="btn sm ghost" data-act=\'' + JSON.stringify(a.act).replace(/'/g, '&#39;') + '\'>' + KY.I('arrow') + U.esc(a.label) + '</button>').join('') + '</div>' : '';
      return '<div class="msg ' + (py ? 'py' : 'me') + '"><div class="av">' + (py ? 'PY' : 'IX') + '</div><div style="min-width:0"><div class="bub' + (m.glitch ? ' glitch' : '') + (typing ? ' caret' : '') + '">' + U.esc(m.text) + '</div>' + (typing ? '' : foot + acts) + '</div></div>';
    },
    ask(q) {
      const S = KY.S;
      if (this.busy) return;
      this.busy = true;
      S.pythia.push({ who: 'me', text: q, ts: Date.now() });
      KY.log('py', 'Anfrage: „' + q + '“');
      this.rChat();
      U.setText(this.el.querySelector('#pyState'), 'analysiert …');
      const r = KY.pythia.ask(q);
      const m = { who: 'py', text: r.text, ts: Date.now(), conf: r.conf, src: r.src, acts: r.acts, glitch: r.glitch };
      const box = this.el.querySelector('#pyChat');
      const holder = document.createElement('div');
      box.appendChild(holder);
      let i = 0;
      const delay = r.glitch ? 900 : 380 + Math.random() * 400;
      if (r.glitch && KY.audio) KY.audio.play('glitch');
      setTimeout(() => {
        const stepf = () => {
          if (this.dead) return;
          i = Math.min(r.text.length, i + (r.glitch ? 2 : 4));
          holder.innerHTML = this.msgHtml(Object.assign({}, m, { text: r.text.slice(0, i) }), i < r.text.length);
          box.scrollTop = box.scrollHeight;
          if (i % 24 === 0 && KY.audio) KY.audio.play('type');
          if (i < r.text.length) setTimeout(stepf, r.glitch ? 22 : 12);
          else {
            S.pythia.push(m);
            if (S.pythia.length > 80) S.pythia.splice(1, S.pythia.length - 80);
            holder.outerHTML = this.msgHtml(m);
            this.busy = false;
            U.setText(this.el.querySelector('#pyState'), 'bereit');
          }
        };
        stepf();
      }, delay);
    },
    rSide() {
      const S = KY.S;
      const load = U.clamp(54 + Math.sin(S.t / 13) * 9 + S.projects.active.length * 2, 10, 99);
      U.setHTML(this.el.querySelector('#pyStat'), '<dl class="kv"><dt>Kern</dt><dd class="mono">PYTHIA 31.0 · KY-3</dd><dt>Laufzeit</dt><dd class="mono">seit 21.10.1987</dd><dt>Kernlast</dt><dd>' + C.meter(load, 100, 'prog') + '</dd><dt>Modell</dt><dd class="mono">' + (KY.hasRes('A3') ? 'Kontextfusion' : KY.hasRes('A1') ? 'Prädiktiv II' : 'Prädiktiv I') + '</dd><dt>Betriebsregel 7</dt><dd>' + (S.story.ending === 'frei' ? C.pill('außer Kraft', 'plain') : C.pill('aktiv', 'acc')) + '</dd><dt>Entscheidungen per Fristablauf</dt><dd class="mono">' + S.stats.crisesAuto + '</dd></dl>' +
        (S.story.ending === 'symbiose' ? '<label class="chk mt12"><input type="checkbox" id="pyAuto"' + (S.autopilot ? ' checked' : '') + '><span class="small">Autonomie: PYTHIA setzt eigene Empfehlungen bei Krisen und Abstimmungen selbst um</span></label>' : ''));
      const ap = this.el.querySelector('#pyAuto');
      if (ap) ap.onchange = () => { S.autopilot = ap.checked; KY.log('py', 'Autonomie ' + (ap.checked ? 'aktiviert' : 'deaktiviert')); };
      const recs = KY.pythia.recommend(4);
      U.setHTML(this.el.querySelector('#pyRecs'), recs.map(r => '<div class="li" data-act=\'' + JSON.stringify(r.act).replace(/'/g, '&#39;') + '\'><div class="body"><div class="t">' + U.esc(r.t) + '</div><div class="xs mut mt4">' + U.esc(r.d) + '</div></div></div>').join('') || '<div class="empty">Keine Empfehlungen.</div>');
    },
  };
})();

/* js/mod/depeschen.js */
/* KYTHERA · Modul Depeschen */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const KIND = { chance: 'Gelegenheit', warnung: 'Warnung', markt: 'Markt', plenum: 'Plenum', betrieb: 'Betrieb', archiv: 'Archiv' };

  function cipher(id, len) {
    const r = U.rng(U.hash(id));
    let s = '';
    for (let i = 0; i < len; i++) { s += B64[Math.floor(r() * 64)]; if (i % 64 === 63) s += '\n'; }
    return s;
  }

  KY.mod.depeschen = {
    mount(el, arg) {
      this.el = el;
      this.f = 'alle';
      this.sel = arg || (KY.S.dsp.list[0] && KY.S.dsp.list[0].id);
      el.innerHTML = KY.ui.head({ crumb: 'Analyse', code: 'DP-12', title: 'Depeschen', sub: 'Verschlüsselte Meldungen der Feldbüros, Stationen und Schiffe. Entschlüsselung kostet Rechenzeit; manche Meldungen sind nur für kurze Zeit nützlich.' }) +
        '<div class="g g4" id="dpKpi"></div>' +
        '<div class="g g-main2 mt12"><section class="pn"><div class="pn-h"><div class="seg">' + [['alle', 'Alle'], ['enc', 'Verschlüsselt'], ['flag', 'Markiert'], ['dec', 'Gelesen']].map(([k, n]) => '<button data-f="' + k + '"' + (k === this.f ? ' class="on"' : '') + '>' + n + '</button>').join('') + '</div></div><div class="pn-b flush" id="dpList" style="max-height:calc(100vh - 360px);min-height:320px;overflow-y:auto"></div></section>' +
        '<div class="col gap12"><section class="pn tick" id="dpView"></section><section class="pn"><div class="pn-h"><h3>Stichwortfilter</h3><div class="tools"><span class="meta">markiert passende Depeschen</span></div></div><div class="pn-b"><div class="row wrap" id="dpTags" style="gap:4px"></div><form class="row mt8" id="dpTagF"><input class="inp" id="dpTagIn" placeholder="Stichwort hinzufügen …" maxlength="24"><button class="btn" type="submit">Hinzufügen</button></form>' +
        '<label class="chk mt12"><input type="checkbox" id="dpAuto"' + (KY.S.dsp.autoDec ? ' checked' : '') + '><span class="small fg2">Markierte Depeschen automatisch entschlüsseln, solange mehr als 100 EF verfügbar sind</span></label></div></section></div></div>';
      U.on(el, 'click', '[data-f]', (e, b) => { this.f = b.dataset.f; U.$$('[data-f]', el).forEach(x => x.classList.toggle('on', x === b)); this.rList(); });
      U.on(el, 'click', '[data-d]', (e, b) => { this.sel = b.dataset.d; const d = KY.S.dsp.list.find(x => x.id === this.sel); if (d) d.read = true; this.rList(); this.rView(true); });
      U.on(el, 'click', '[data-dec]', () => {
        const r = KY.dsp.decrypt(this.sel);
        if (!r.ok) { KY.ui.flashMsg(r.err || 'Nicht möglich', 'crit'); return; }
        if (KY.audio) KY.audio.play('scan');
        this.rView(true); this.rList();
      });
      U.on(el, 'click', '[data-untag]', (e, b) => { const S = KY.S; S.dsp.filters = S.dsp.filters.filter(f => f !== b.dataset.untag); this.rTags(); this.refilter(); });
      U.on(el, 'click', '[data-goact]', (e, b) => KY.ui.doAct(JSON.parse(b.dataset.goact)));
      el.querySelector('#dpTagF').onsubmit = e => {
        e.preventDefault();
        const S = KY.S, v = el.querySelector('#dpTagIn').value.trim();
        if (!v) return;
        if (S.dsp.filters.length >= 10) { KY.ui.flashMsg('Höchstens zehn Stichwörter.', 'crit'); return; }
        if (S.dsp.filters.indexOf(v) < 0) S.dsp.filters.push(v);
        el.querySelector('#dpTagIn').value = '';
        KY.log('dsp', 'Stichwortfilter hinzugefügt: „' + v + '“');
        this.rTags(); this.refilter();
      };
      el.querySelector('#dpAuto').onchange = e => { KY.S.dsp.autoDec = e.target.checked; KY.log('dsp', 'Automatische Entschlüsselung ' + (e.target.checked ? 'aktiv' : 'aus')); };
      this.sub = KY.bus.on('dsp', () => { this.dirty = true; });
      this.render();
    },
    arg(a) { if (a) { this.sel = a; this.rList(); this.rView(true); } },
    unmount() { this.sub(); },
    tick() {
      this.rKpi();
      const d = KY.S.dsp.list.find(x => x.id === this.sel);
      if (this.dirty) { this.dirty = false; this.rList(); this.rView(true); }
      else if (d && d.decT > 0) { this.rView(false); this.rList(); }
    },
    render() { this.rKpi(); this.rTags(); this.rList(); this.rView(true); },
    refilter() {
      const S = KY.S;
      S.dsp.list.forEach(d => {
        if (!d.enc && !d.story) { const txt = U.norm(d.subj + ' ' + d.body + ' ' + d.src); d.flag = S.dsp.filters.some(f => txt.indexOf(U.norm(f)) >= 0); }
        else if (!d.story) { const txt = U.norm(d.src + ' ' + (KY.data.regions[d.rid] ? KY.data.regions[d.rid].name : '')); d.flag = S.dsp.filters.some(f => txt.indexOf(U.norm(f)) >= 0) || d.flag; }
      });
      this.rList();
    },
    rKpi() {
      const S = KY.S, L = S.dsp.list;
      U.setHTML(this.el.querySelector('#dpKpi'),
        '<div class="kpi"><span class="lbl">Eingang</span><span class="v">' + L.length + '</span><span class="dl mut">' + S.stats.decrypted + ' entschlüsselt</span></div>' +
        '<div class="kpi"><span class="lbl">Verschlüsselt</span><span class="v">' + L.filter(d => d.enc).length + '</span><span class="dl mut">' + L.filter(d => d.decT > 0).length + ' in Arbeit</span></div>' +
        '<div class="kpi"><span class="lbl">Markiert</span><span class="v">' + L.filter(d => d.flag).length + '</span><span class="dl mut">' + S.dsp.filters.length + ' Stichwörter</span></div>' +
        '<div class="kpi"><span class="lbl">Rechenkontingent</span><span class="v">' + U.n(S.res.rech) + '<small>EF</small></span><span class="dl mut">' + (KY.hasRes('A2') ? 'Tiefenentschlüsselung aktiv' : 'Standardverfahren') + '</span></div>');
    },
    rTags() {
      U.setHTML(this.el.querySelector('#dpTags'), KY.S.dsp.filters.map(f => '<span class="tag acc" style="display:inline-flex;gap:6px;align-items:center">' + U.esc(f) + '<button class="lnk xs" data-untag="' + U.esc(f) + '" aria-label="Entfernen">×</button></span>').join('') || '<span class="xs mut">Keine Stichwörter.</span>');
    },
    rList() {
      const S = KY.S, D = KY.data;
      const list = S.dsp.list.filter(d => this.f === 'alle' || (this.f === 'enc' && d.enc) || (this.f === 'flag' && d.flag) || (this.f === 'dec' && !d.enc));
      U.setHTML(this.el.querySelector('#dpList'), list.length ? list.map(d => {
        const st = d.decT > 0 ? C.pill(Math.round(d.prog * 100) + ' %', 'warn', true) : d.enc ? C.pill('verschlüsselt', d.story ? 'crit' : 'plain') : C.pill(KIND[d.k] || 'Meldung', d.k === 'chance' ? 'ok' : d.k === 'warnung' ? 'warn' : 'info');
        return '<div class="li' + (d.id === this.sel ? ' on' : '') + (!d.read && !d.enc ? ' unread' : '') + '" data-d="' + d.id + '"><div class="ic" style="' + (d.flag ? 'border-color:var(--acc);color:var(--acc)' : '') + '">' + KY.I(d.enc ? 'lock' : 'depeschen') + '</div><div class="body"><div class="row"><span class="mono small ' + (d.story ? 'acc' : '') + '">' + d.id + '</span><span class="xs mut ell" style="flex:1">' + U.esc(d.src) + '</span><span class="mono xs mut">' + U.hm(new Date(d.ts)) + '</span></div>' +
          '<div class="t ell mt4">' + (d.enc ? '<span class="mono dim">' + cipher(d.id, 34).replace(/\n/g, '') + '</span>' : U.esc(d.subj)) + '</div><div class="mt4">' + st + (d.flag ? ' <span class="tag acc">markiert</span>' : '') + '</div></div></div>';
      }).join('') : '<div class="empty"><b>Keine Depeschen</b></div>');
    },
    rView(full) {
      const S = KY.S, D = KY.data, d = S.dsp.list.find(x => x.id === this.sel);
      const box = this.el.querySelector('#dpView');
      if (!d) { U.setHTML(box, '<div class="pn-b"><div class="empty"><b>Keine Depesche ausgewählt</b></div></div>'); return; }

/* KYTHERA · Modul Archiv */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.archiv = {
    mount(el, arg) {
      this.el = el;
      this.sel = null;
      el.innerHTML = KY.ui.head({ crumb: 'Analyse', code: 'AR-13', title: 'Archiv', sub: 'Bestände der Archivanlage Gotthelm, digitalisiert ab 1957. Schwärzungen lassen sich mit Rechenzeit analysieren, sofern Ihre Freigabe ausreicht.' }) +
        '<div class="g g-side"><section class="pn"><div class="pn-h"><h3>Bestände</h3><div class="tools"><span class="meta" id="arCount"></span></div></div><div class="pn-b flush" id="arList"></div></section><div id="arView"></div></div>';
      U.on(el, 'click', '[data-doc]', (e, b) => this.open(b.dataset.doc));
      U.on(el, 'click', '[data-ana]', () => this.analyse());
      this.subs = ['clearance', 'story'].map(ev => KY.bus.on(ev, () => { this.rList(); if (this.sel === 'fragmente') this.open('fragmente'); }));
      this.rList();
      this.open(arg || 'KY-0412');
    },
    arg(a) { if (a) this.open(a); },
    unmount() { this.subs.forEach(f => f()); clearTimeout(this.anaT); },
    tick() {},
    visible(d) { return d.id !== 'KY-0000' || KY.S.story.ending; },
    rList() {
      const S = KY.S, D = KY.data;
      const docs = D.archive.filter(d => this.visible(d) || d.id === 'KY-0000');
      const fr = Object.keys(S.story.frags).length;
      let h = '<div class="li' + (this.sel === 'fragmente' ? ' on' : '') + '" data-doc="fragmente"><div class="ic" style="border-color:var(--acc3);color:var(--acc)">' + KY.I('key') + '</div><div class="body"><div class="t">Schlüsselfragmente</div><div class="m">' + fr + ' von 4 gesichert</div></div></div>';
      [3, 4, 5].forEach(lvl => {
        const g = docs.filter(d => d.clr === lvl);
        if (!g.length) return;
        h += '<div class="lbl" style="padding:12px 12px 6px">Freigabestufe ' + lvl + (S.user.clr < lvl ? ' · gesperrt' : '') + '</div>';
        h += g.map(d => {
          const locked = S.user.clr < d.clr;
          const hidden = d.id === 'KY-0000' && !S.story.ending;
          return '<div class="li' + (this.sel === d.id ? ' on' : '') + (locked ? '" style="opacity:.55' : '') + '" data-doc="' + d.id + '"><div class="ic mono" style="width:auto;padding:0 6px;font-size:9.5px">' + (locked ? KY.I('lock') : d.id.slice(3)) + '</div><div class="body"><div class="t">' + (hidden ? '████████████' : U.esc(d.title)) + '</div><div class="m">' + d.id + ' · ' + (d.date === 'heute' ? U.date(new Date()) : d.date) + (d.enc && !S.archive.unlocked[d.id] ? ' · verschlüsselt' : '') + (S.archive.read[d.id] ? '' : ' · <span class="acc">neu</span>') + '</div></div></div>';
        }).join('');
      });
      U.setHTML(this.el.querySelector('#arList'), h);
      U.setText(this.el.querySelector('#arCount'), docs.filter(d => S.user.clr >= d.clr).length + ' zugänglich');
    },
    open(id) {
      const S = KY.S, D = KY.data;
      this.sel = id;
      const box = this.el.querySelector('#arView');
      if (id === 'fragmente') { this.frags(box); this.rList(); return; }
      const d = D.archive.find(x => x.id === id);
      if (!d) return;
      if (S.user.clr < d.clr) {
        if (KY.audio) KY.audio.play('deny');
        box.innerHTML = '<section class="pn"><div class="pn-b"><div class="empty"><b>Zugriff verweigert</b>' + d.id + ' erfordert Freigabestufe ' + d.clr + '. Ihre Freigabe: ' + S.user.clr + '.<div class="mono xs mt12">Zugriffsversuch protokolliert.</div></div></div></section>';
        KY.log('arc', 'Zugriff verweigert: ' + d.id + ' (Stufe ' + d.clr + ')');
        this.rList();
        return;
      }
      if (d.enc && !S.archive.unlocked[d.id]) {
        box.innerHTML = '<section class="pn tick"><div class="pn-h"><h3>' + d.id + ' · verschlüsselte Leihgabe</h3></div><div class="pn-b"><div class="empty" style="padding:30px 10px"><b>' + U.esc(d.title) + '</b>Diese Leihgabe ist mit einem Kennwort des Leihgebers geschützt. Quelle: ' + U.esc(d.src) + '.' +
          '<form class="row mt16" id="arPw" style="max-width:360px;margin-inline:auto"><input class="inp mono" id="arPwIn" placeholder="Kennwort" autocomplete="off" style="letter-spacing:.2em;text-transform:uppercase"><button class="btn pri" type="submit">Öffnen</button></form></div></div></section>';
        box.querySelector('#arPw').onsubmit = e => {
          e.preventDefault();
          const v = box.querySelector('#arPwIn').value.trim().toUpperCase();
          if (v === d.enc) {
            S.archive.unlocked[d.id] = true;
            KY.log('arc', 'Leihgabe ' + d.id + ' entschlüsselt');
            if (KY.audio) KY.audio.play('grant');
            this.open(d.id);
          } else {
            KY.log('arc', 'Falsches Kennwort für ' + d.id);
            if (KY.audio) KY.audio.play('deny');
            KY.ui.flashMsg('Kennwort abgelehnt.', 'crit');
          }
        };
        this.rList();
        return;
      }
      if (!S.archive.read[d.id]) { S.archive.read[d.id] = Date.now(); KY.log('arc', 'Gelesen: ' + d.id + ' · ' + d.title); }
      const reds = this.redactions(d);
      const open = reds.filter(r => !r.rev);
      const nextR = open.find(r => !r.perm && r.clr <= S.user.clr);
      const body = this.renderBody(d);
      box.innerHTML = '<article class="doc"><div class="dh"><div style="min-width:0"><div class="lbl" style="color:var(--acc)">' + d.id + ' · ' + d.kind + '</div><h2 class="mt4">' + U.esc(d.title) + '</h2><div class="mono xs mut mt8">' + (d.date === 'heute' ? U.date(new Date()) : d.date) + ' · ' + U.esc(d.src) + '</div></div><span class="stamp">Streng geheim · Stufe ' + d.clr + '</span></div>' + body + '</article>' +
        '<section class="pn mt12"><div class="pn-b row wrap"><span class="small fg2">' + (reds.length ? reds.filter(r => r.rev).length + ' von ' + reds.length + ' Schwärzungen aufgehoben' + (open.some(r => r.perm) ? ' · Originalschwärzung nicht analysierbar' : '') + (open.some(r => !r.perm && r.clr > S.user.clr) ? ' · teilweise höhere Freigabe erforderlich' : '') : 'Keine Schwärzungen') + '</span><span class="sp"></span>' +
        (nextR ? '<button class="btn pri" data-ana="1"' + (S.res.rech < nextR.cost ? ' disabled' : '') + '>' + KY.I('eye') + 'Schwärzung analysieren · ' + nextR.cost + ' EF</button>' : '') + '</div></section>';
      this.rList();
    },
    redactions(d) {
      const S = KY.S, out = [];
      const re = /\{\{(r\d+):([^}]*)\}\}/g;
      let m;
      while ((m = re.exec(d.body))) {
        const spec = d.red[m[1]] || {};
        out.push({ id: m[1], text: m[2], perm: !!spec.perm && !S.story.ending, clr: spec.clr || d.clr, cost: spec.cost || 10, frag: spec.frag, rev: !!S.archive.rev[d.id + ':' + m[1]] || (spec.perm && S.story.ending) });
      }
      return out;
    },
    renderBody(d) {
      const S = KY.S;
      const reds = {};
      this.redactions(d).forEach(r => { reds[r.id] = r; });
      let txt = d.body.replace('{codename}', S.user.codename);
      const paras = txt.split(/\n\n+/);
      return paras.map(p => {
        if (p.indexOf('## ') === 0) return '<h4>' + U.esc(p.slice(3)) + '</h4>';
        let html = U.esc(p).replace(/\{\{(r\d+):([^}]*)\}\}/g, (all, rid, t) => {
          const r = reds[rid];
          if (r.rev) return '<span class="revealed">' + t + '</span>';
          const cls = r.perm ? 'redact lock' : 'redact';
          return '<span class="' + cls + '" data-rid="' + rid + '">' + t.replace(/\S/g, '█') + '</span>';
        });
        return '<p>' + html.replace(/\n/g, '<br>') + '</p>';
      }).join('');
    },
    analyse() {
      const S = KY.S, D = KY.data, d = D.archive.find(x => x.id === this.sel);
      if (!d || this.anaT) return;
      const r = this.redactions(d).find(x => !x.rev && !x.perm && x.clr <= S.user.clr);
      if (!r) return;
      if (!KY.pay({ rech: r.cost })) { KY.ui.flashMsg('Nicht genügend Rechenkontingent.', 'crit'); return; }
      const span = this.el.querySelector('[data-rid="' + r.id + '"]');
      if (span) span.classList.add('scan');
      if (KY.audio) KY.audio.play('scan');
      const btn = this.el.querySelector('[data-ana]');
      if (btn) { btn.disabled = true; btn.textContent = 'Analyse läuft …'; }
      this.anaT = setTimeout(() => {
        this.anaT = null;
        S.archive.rev[d.id + ':' + r.id] = Date.now();
        KY.log('arc', 'Schwärzung aufgehoben: ' + d.id + ' / ' + r.id);
        if (r.frag) KY.story.fragment(r.frag);
        if (KY.audio) KY.audio.play('ok');
        if (this.sel === d.id) this.open(d.id);
      }, 2400);
    },
    frags(box) {
      const S = KY.S, D = KY.data;
      const all = Object.keys(S.story.frags).length === 4;
      box.innerHTML = '<section class="pn tick"><div class="pn-h"><h3>Schlüsselfragmente</h3><div class="tools"><span class="meta">Zugang zu Artikel 0</span></div></div><div class="pn-b">' +
        '<p class="fg2" style="max-width:70ch;line-height:1.6">Hier werden Codefragmente gesammelt, die in Dokumenten, Depeschen und Aufnahmen auftauchen. ' + (all ? 'Alle vier Teile liegen vor. Die Reihenfolge folgt den Buchstaben.' : 'Ihr Vorgänger hat einen Zugang in Teile zerlegt. Wo die übrigen liegen, ist nicht verzeichnet.') + '</p>' +
        '<div class="g g4 mt16">' + ['A', 'B', 'G', 'D'].map(k => {
          const f = D.fragments[k], got = S.story.frags[k];
          return '<div class="frag-card' + (got ? ' got' : '') + '"><div class="L">' + f.letter + '</div><div class="code">' + (got ? f.code : '····') + '</div><div class="xs mut">' + (got ? 'Quelle: ' + f.where : 'nicht gefunden') + '</div></div>';
        }).join('') + '</div>' +
        (all ? '<div class="mt16 mono" style="font-size:20px;letter-spacing:.2em;text-align:center;color:var(--acc2)">' + ['A', 'B', 'G', 'D'].map(k => D.fragments[k].code).join(' – ') + '</div><p class="xs mut c mt8">Einzugeben im Terminal. Der Befehl steht im Verlauf von IX-alt.</p>' : '') +
        '</div></section>';
    },
  };
})();

(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  /* ---------- Zahnradzeichnung ---------- */
  function gear(ctx, x, y, r, teeth, ang, col, spokes) {
    const tw = Math.PI * 2 / teeth, h = Math.max(3, r * 0.09);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a = i * tw;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(a + tw * 0.15) * (r + h), Math.sin(a + tw * 0.15) * (r + h));
      ctx.lineTo(Math.cos(a + tw * 0.45) * (r + h), Math.sin(a + tw * 0.45) * (r + h));
      ctx.lineTo(Math.cos(a + tw * 0.6) * r, Math.sin(a + tw * 0.6) * r);
    }
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalCompositeOperation = 'destination-out';
    const n = spokes || 4;
    for (let i = 0; i < n; i++) {
      const a0 = i / n * Math.PI * 2 + 0.25, a1 = (i + 1) / n * Math.PI * 2 - 0.25;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.78, a0, a1); ctx.arc(0, 0, r * 0.28, a1, a0, true); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const GEARS = [
    { x: 0, y: 0, r: 150, t: 223, c: '#8a6b33', s: 6 }, { x: 228, y: -64, r: 68, t: 96, c: '#6f5a32' }, { x: -214, y: 92, r: 58, t: 80, c: '#7a6233' },
    { x: 176, y: 140, r: 40, t: 53, c: '#9b7a3e' }, { x: -150, y: -172, r: 46, t: 64, c: '#5f4d2b' }, { x: 318, y: 58, r: 34, t: 48, c: '#86703f' },
    { x: -310, y: -22, r: 36, t: 50, c: '#6b5530' }, { x: 64, y: -214, r: 32, t: 45, c: '#8f733d' }, { x: -72, y: 226, r: 42, t: 57, c: '#715b31' },
    { x: 262, y: -196, r: 24, t: 32, c: '#a0823f' }, { x: -280, y: 200, r: 26, t: 38, c: '#5d4a27' }, { x: 66, y: 226, r: 22, t: 30, c: '#9a7d40' },
  ];
  const SYMS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', '0'];

  KY.mod.mechanismus = {
    mount(el) {
      this.el = el;
      el.innerHTML = KY.ui.head({ crumb: 'Analyse', code: 'ME-00', title: 'Mechanismus', sub: 'Rekonstruktion des Fundstücks von 1901 nach dem Forschungsprogramm „Zahnradanalyse“. 37 Zahnräder, ein äußerer Ring mit zehn Zeichen.' }) +
        '<div class="g g-main"><section class="pn tick"><div class="pn-b flush"><div class="mech-wrap"><canvas id="meCv" width="1200" height="760"></canvas></div></div></section>' +
        '<aside class="col gap12"><section class="pn"><div class="pn-h"><h3>Anzeige</h3></div><div class="pn-b" id="meRead"></div></section><section class="pn"><div class="pn-h"><h3>Resonanz</h3><div class="tools"><span class="meta">Anzeige vs. Ergebnis</span></div></div><div class="pn-b flush" id="meRes"></div></section></aside></div>';
      this.alive = true;
      const cv = el.querySelector('#meCv'), ctx = cv.getContext('2d');
      const draw = now => {
        if (!this.alive) return;
        const S = KY.S;
        ctx.clearRect(0, 0, 1200, 760);
        ctx.save(); ctx.translate(600, 380);
        const base = now / 1000 * 0.05;
        GEARS.forEach((g, i) => {
          const dir = i % 2 ? -1 : 1;
          gear(ctx, g.x, g.y, g.r, Math.round(g.t / 3), base * dir * (223 / g.t), g.c, g.s);
        });
        // Zifferblatt
        ctx.strokeStyle = 'rgba(236,208,150,0.55)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 120, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 92, 0, Math.PI * 2); ctx.stroke();

        ctx.font = '600 17px "Cormorant Garamond", Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        SYMS.forEach((s, i) => {
          const a = -Math.PI / 2 + i / 10 * Math.PI * 2;
          const on = i === target;
          ctx.fillStyle = on ? '#ffe9b8' : 'rgba(236,208,150,0.6)';
          ctx.fillText(s, Math.cos(a) * 106, Math.sin(a) * 106);
          ctx.strokeStyle = 'rgba(236,208,150,0.25)';

        this.ang = this.ang === undefined ? 0 : this.ang;
        const ta = -Math.PI / 2 + target / 10 * Math.PI * 2 + Math.sin(now / 900) * 0.04;
        let d = ta - this.ang; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;

/* KYTHERA · Modul Integrität */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;
  const SEV = { 1: ['gering', 'info'], 2: ['erhöht', 'warn'], 3: ['kritisch', 'crit'] };

  KY.mod.integritaet = {
    mount(el, arg) {
      this.el = el;
      this.sel = arg || null;
      el.innerHTML = KY.ui.head({ crumb: 'System', code: 'IN-14', title: 'Integrität', sub: 'Zustand des KYTHERA-Netzes und der Diskretion des Kuratoriums. Offene Anomalien kosten Rechenkapazität, bis sie behoben sind.' }) +
        '<div class="g g4" id="inKpi"></div>' +
        '<div class="g g-main mt12"><section class="pn tick"><div class="pn-h"><h3>Netzknoten</h3><div class="tools"><span class="meta">Verbindungsgraph · Echtzeit</span></div></div><div class="pn-b flush" id="inMap"></div></section>' +
        '<aside class="col gap12"><section class="pn"><div class="pn-h"><h3>Diskretion</h3></div><div class="pn-b" id="inDisk"></div></section></aside></div>' +
        '<section class="pn mt12"><div class="pn-h"><h3>Anomalien</h3><div class="tools"><span class="meta" id="inAnMeta"></span></div></div><div class="pn-b flush tbl-w" id="inAn"></div></section>' +
        '<section class="pn mt12"><div class="pn-h"><h3>Knotenübersicht</h3></div><div class="pn-b flush tbl-w" id="inNodes"></div></section>';
      this.map = new KY.Map(el.querySelector('#inMap'), { height: 300, overlay: 'praes', tools: false, legend: false, layers: { nodes: true, labels: false } });
      U.on(el, 'click', '[data-ia]', (e, b) => {
        const [aid, act] = b.dataset.ia.split('|');

        KY.ui.flashMsg(r.fixed ? 'Anomalie ' + aid + ' behoben' : 'Maßnahme ohne Wirkung', r.fixed ? 'ok' : 'crit');
        this.render();
      });
      U.on(el, 'click', '[data-go]', (e, b) => KY.ui.go(b.dataset.go));

    arg(a) { this.sel = a; this.rAn(); },

    render() { this.rKpi(); this.rAn(); this.rNodes(); this.rDisk(); },
    rKpi() {
      const S = KY.S;
      const open = S.integ.anomalies.filter(a => a.state === 'offen');
      const up = Object.values(S.integ.nodes).filter(n => n.up).length;

    },
    rAn() {

      U.setHTML(this.el.querySelector('#inAn'), list.length ? '<table class="tbl"><thead><tr><th>Kennung</th><th>Knoten</th><th>Beschreibung</th><th>Schwere</th><th>Status</th><th></th></tr></thead><tbody>' + list.map(a => {

        return '<tr' + (a.id === this.sel ? ' class="on"' : '') + '><td class="mono small">' + a.id + '</td><td class="mono small' + (a.node === 'KY-Ω' ? ' acc' : '') + '">' + a.node + '</td><td><div class="small">' + U.esc(a.t) + '</div>' + (a.res ? '<div class="xs ' + (a.state === 'behoben' ? 'fg2' : 'dn') + ' mt4">' + U.esc(a.res) + '</div>' : '') + '</td><td>' + C.pill(sv[0], sv[1]) + '</td><td>' + (a.state === 'offen' ? C.pill('offen', 'warn', true) : C.pill('behoben', 'ok')) + '</td><td class="r nowrap">' + acts + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="empty"><b>Keine Anomalien</b>Das Netz arbeitet einwandfrei.</div>');
    },
    rNodes() {
      const S = KY.S, D = KY.data;
      const nodes = D.nodes.filter(n => !n.hidden || KY.flag('omegaTraced') || S.story.ending);
      U.setHTML(this.el.querySelector('#inNodes'), '<table class="tbl"><thead><tr><th>Knoten</th><th>Standort</th><th class="num">Latenz</th><th>Integrität</th><th>Status</th></tr></thead><tbody>' + nodes.map(n => {
        const st = S.integ.nodes[n.id];

        return '<tr><td class="mono' + (n.hidden ? ' acc' : '') + '">' + n.id + '</td><td>' + (n.hidden ? '34,2° N · 21,4° O' : n.name) + '</td><td class="num">' + (n.hidden ? '−252 000 ms' : Math.round(st.lat) + ' ms') + '</td><td style="width:160px">' + C.meter(st.integ, 100, st.integ > 95 ? 'ok' : st.integ > 85 ? 'warn' : 'crit') + '</td><td>' + (!st.up ? C.pill('isoliert', 'plain') : open ? C.pill(open + ' Anomalie' + (open > 1 ? 'n' : ''), 'warn') : C.pill('online', 'ok')) + '</td></tr>';
      }).join('') + '</tbody></table>');
    },
    rDisk() {

        '<p class="xs mut mt12">Unter 35 Punkten verliert das Plenum das Vertrauen. Öffentlichkeitsarbeit über Stiftungen hebt die Diskretion.</p><button class="btn sm ghost mt8" data-go="news">Zur Öffentlichkeitsarbeit</button>');
    },
  };
})();

      const S = KY.S, D = KY.data, o = (t, c) => this.print(t, c);
      if (!a[0]) {
        S.infra.sats.forEach(s => { const [lon, lat] = KY.infra.satPos(s.id, S.t); o(s.id.padEnd(8) + KY.infra.satDef(s.id).fn.padEnd(15) + (U.n(lat, 1) + ' / ' + U.n(lon, 1)).padEnd(16) + (s.focus ? D.regions[s.focus].name : 'Bereitschaft')); });
        return;
      }
      if (a[0] === 'ausrichten') {
        const id = (a[1] || '').toUpperCase(), rid = this.findRegion(a.slice(2).join(' '));
        const r = KY.infra.retask(id, rid);
        if (!r.ok) o(r.err || 'Syntax: sat ausrichten <ARGO-n> <region>', 'e'); else o(id + ' → ' + (rid ? D.regions[rid].name : 'Bereitschaft'), 'o');
        return;
      }
      if (a[0] === 'img') {
        const lat = parseFloat((a[1] || '').replace(',', '.')), lon = parseFloat((a[2] || '').replace(',', '.'));
        if (a.indexOf('--res') >= 0 && !KY.hasRes('O1')) o('Hinweis: Angeforderte Auflösung nicht verfügbar. Fallback 4,0 m/px.', 'w');
        const r = KY.infra.requestImage(lat, lon);
        if (!r.ok) { o(r.err, 'e'); return; }
        o('Bildauftrag ' + r.img.id + ' an ' + r.img.sat + '. Empfang in 18 s. Anzeige unter Flotte & Orbit › Bildaufklärung.', 'o');
        return;
      }
      o('Syntax: sat | sat ausrichten <id> <region> | sat img <breite> <länge>', 'e');
    },
  };
})();

/* js/mod/protokoll.js */
/* KYTHERA · Modul Protokoll */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.protokoll = {
    mount(el) {
      this.el = el;
      this.cat = '';
      this.q = '';
      el.innerHTML = KY.ui.head({ crumb: 'System', code: 'PR-16', title: 'Protokoll', sub: 'Lückenlose Aufzeichnung aller Vorgänge an Sitz IX gemäß Charta, Artikel IX. Einträge können nicht gelöscht werden.', act: '<button class="btn ghost" id="prCopy">' + KY.I('copy') + 'In Zwischenablage</button>' }) +
        '<div class="g g4" id="prKpi"></div>' +
        '<section class="pn mt12"><div class="pn-h"><input class="inp" id="prQ" placeholder="Protokoll durchsuchen …" style="height:26px;max-width:280px"><div class="tools"><span class="meta" id="prN"></span></div></div><div class="row wrap" style="gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)" id="prCats"></div><div class="pn-b flush tbl-w" id="prTbl" style="max-height:calc(100vh - 380px);min-height:300px;overflow-y:auto"></div></section>';
      el.querySelector('#prQ').oninput = e => { this.q = e.target.value; this.rTbl(); };
      U.on(el, 'click', '[data-cat]', (e, b) => { this.cat = this.cat === b.dataset.cat ? '' : b.dataset.cat; this.rCats(); this.rTbl(); });
      el.querySelector('#prCopy').onclick = () => {
        const txt = this.rows().map(l => U.stamp(l.ts) + '\t' + (KY.CATS[l.cat] || l.cat) + '\t' + l.text).join('\n');
        U.copy(txt, el.querySelector('#prTbl')).then(ok => KY.ui.flashMsg(ok ? 'Protokoll kopiert' : 'Kopieren nicht möglich. Text wurde markiert.', ok ? 'ok' : 'info'));
      };
      this.sub = KY.bus.on('log', () => { this.dirty = true; });
      this.render();
    },
    unmount() { this.sub(); },
    tick() { if (this.dirty) { this.dirty = false; this.render(); } },
    render() { this.rKpi(); this.rCats(); this.rTbl(); },
    rows() {
      const q = U.norm(this.q);
      return KY.S.log.filter(l => (!this.cat || l.cat === this.cat) && (!q || U.norm(l.text).indexOf(q) >= 0)).slice().reverse();
    },
    rKpi() {
      const S = KY.S;
      U.setHTML(this.el.querySelector('#prKpi'),
        '<div class="kpi"><span class="lbl">Einträge</span><span class="v">' + S.log.length + '</span></div>' +
        '<div class="kpi"><span class="lbl">Sitzungszeit</span><span class="v">' + U.dur(S.t) + '</span></div>' +
        '<div class="kpi"><span class="lbl">Entscheidungen</span><span class="v">' + (S.stats.crises + S.stats.votes) + '</span><span class="dl mut">' + S.stats.crisesAuto + ' durch Fristablauf</span></div>' +
        '<div class="kpi"><span class="lbl">Amtsantritt</span><span class="v" style="font-size:17px">' + U.stamp(S.meta.created) + '</span></div>');
    },
    rCats() {
      const S = KY.S;
      const counts = {};
      S.log.forEach(l => { counts[l.cat] = (counts[l.cat] || 0) + 1; });
      U.setHTML(this.el.querySelector('#prCats'), Object.keys(KY.CATS).filter(k => counts[k]).map(k => '<button class="chip" data-cat="' + k + '"' + (this.cat === k ? ' style="border-color:var(--acc);color:var(--acc2)"' : '') + '>' + KY.CATS[k] + ' <span class="mono mut">' + counts[k] + '</span></button>').join(''));
    },
    rTbl() {
      const rows = this.rows();
      U.setText(this.el.querySelector('#prN'), rows.length + ' Einträge');
      U.setHTML(this.el.querySelector('#prTbl'), rows.length ? '<table class="tbl"><thead><tr><th>Zeitpunkt</th><th>Sitzung</th><th>Kategorie</th><th>Vorgang</th></tr></thead><tbody>' + rows.slice(0, 400).map(l => '<tr><td class="mono small nowrap">' + U.stamp(l.ts) + '</td><td class="mono small mut">' + U.dur(l.t) + '</td><td>' + C.pill(KY.CATS[l.cat] || l.cat, l.cat === 'kri' ? 'crit' : l.cat === 'kur' ? 'acc' : 'plain') + '</td><td class="small">' + U.esc(l.text) + '</td></tr>').join('') + '</tbody></table>' : '<div class="empty">Keine Einträge.</div>');
    },
  };
})();

(function () {
  'use strict';
  const KY = window.KY, U = KY.U;

  KY.mod.system = {
    mount(el) {
      this.el = el;
      U.on(el, 'click', '[data-pref]', (e, b) => {
        const p = KY.S.user.prefs, k = b.dataset.pref, v = b.dataset.val;
        p[k] = v === 'true' ? true : v === 'false' ? false : v;
        KY.ui.applyPrefs();
        if (k === 'sound' && p.sound) KY.audio.play('ok');
        this.render();
      });
      this.render();
    },
    unmount() {},
    tick() {},
    render() {
      const S = KY.S, p = S.user.prefs, el = this.el;
      const accents = [['messing', 'Messing'], ['eis', 'Eis'], ['signal', 'Signal']];
      if (S.story.ending === 'archon') accents.push(['archon', 'Archon']);
      if (S.story.ending === 'symbiose') accents.push(['symbiose', 'Symbiose']);
      const seg = (key, opts, cur) => '<div class="seg">' + opts.map(([v, n]) => '<button data-pref="' + key + '" data-val="' + v + '"' + (String(cur) === v ? ' class="on"' : '') + '>' + n + '</button>').join('') + '</div>';
      el.innerHTML = KY.ui.head({ crumb: 'System', code: 'KF-17', title: 'Konfiguration', sub: 'Darstellung, Ton und Sitzungsdaten. Der Sitzungsstand wird lokal in diesem Browser gespeichert.' }) +
        '<div class="g g2"><section class="pn"><div class="pn-h"><h3>Darstellung</h3></div><div class="pn-b col gap16">' +
        '<div class="fld"><span class="lbl">Akzentfarbe</span>' + seg('accent', accents, p.accent) + '</div>' +
        '<div class="fld"><span class="lbl">Dichte</span>' + seg('density', [['normal', 'Normal'], ['kompakt', 'Kompakt']], p.density) + '</div>' +
        '<div class="fld"><span class="lbl">Animationen</span>' + seg('motion', [['true', 'An'], ['false', 'Aus']], p.motion) + '</div>' +
        '<div class="fld"><span class="lbl">Bildschirmraster</span>' + seg('scan', [['true', 'An'], ['false', 'Aus']], p.scan) + '</div>' +
        '<div class="fld"><span class="lbl">Einweisung</span><div><button class="btn sm ghost" id="sysOnb">Einweisung im Lagebild ' + (S.onb.hidden ? 'wieder einblenden' : 'ausblenden') + '</button></div></div></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Ton</h3></div><div class="pn-b col gap16"><div class="fld"><span class="lbl">Signaltöne</span>' + seg('sound', [['true', 'An'], ['false', 'Aus']], p.sound) + '</div>' +
        '<div class="fld"><label for="sysVol">Lautstärke</label><input type="range" id="sysVol" min="0" max="1" step="0.05" value="' + p.vol + '"></div><div><button class="btn sm ghost" id="sysTest">Testsignal</button></div></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Sitzungsdaten</h3></div><div class="pn-b"><dl class="kv"><dt>Rufname</dt><dd>' + U.esc(S.user.codename) + '</dd><dt>Amtsantritt</dt><dd class="mono">' + U.stamp(S.meta.created) + '</dd><dt>Anmeldungen</dt><dd class="mono">' + S.meta.boots + '</dd><dt>Sitzungszeit</dt><dd class="mono">' + U.dur(S.t) + '</dd><dt>Letzte Sicherung</dt><dd class="mono">' + U.stamp(S.meta.saved) + '</dd></dl>' +
        '<div class="row wrap mt16"><button class="btn" id="sysSave">Jetzt sichern</button><button class="btn ghost" id="sysExp">Sitzungsstand exportieren</button><button class="btn ghost" id="sysImp">Importieren</button></div></div></section>' +
        '<section class="pn" style="border-color:rgba(224,72,72,.45)"><div class="pn-h"><h3>Notfalllöschung</h3></div><div class="pn-b"><p class="fg2 small">Löscht den gesamten Sitzungsstand unwiderruflich und gibt Sitz IX zurück an das Kuratorium. Die Simulation beginnt danach von vorn.</p><button class="btn dan mt12" id="sysWipe">' + KY.I('warn') + 'Notfalllöschung einleiten</button></div></section></div>' +
        '<p class="xs mut mt16">KYTHERA 7.4.2 · Alle Daten, Personen, Organisationen und Ereignisse dieser Simulation sind fiktiv.</p>';
      el.querySelector('#sysVol').oninput = e => { p.vol = +e.target.value; };
      el.querySelector('#sysVol').onchange = () => KY.audio.play('note');
      el.querySelector('#sysTest').onclick = () => KY.audio.play('alert');
      el.querySelector('#sysOnb').onclick = () => { S.onb.hidden = !S.onb.hidden; this.render(); };
      el.querySelector('#sysSave').onclick = () => { const ok = KY.save(); KY.ui.flashMsg(ok ? 'Sitzungsstand gesichert' : 'Speichern in diesem Browser nicht möglich', ok ? 'ok' : 'crit'); this.render(); };
      el.querySelector('#sysExp').onclick = () => this.exportDlg();
      el.querySelector('#sysImp').onclick = () => this.importDlg();
      el.querySelector('#sysWipe').onclick = () => this.wipe();
    },
    exportDlg() {
      const txt = KY.exportState();
      const body = document.createElement('div');
      body.innerHTML = '<p class="small fg2">Der vollständige Sitzungsstand als Text. Kopieren Sie ihn, um ihn auf einem anderen Gerät zu importieren.</p><textarea class="inp mono mt12" id="expTxt" rows="8" readonly style="font-size:10.5px"></textarea>';
      body.querySelector('#expTxt').value = txt;
      KY.ui.modal({ lbl: 'Export', title: 'Sitzungsstand exportieren', body, actions: [{ label: 'Schließen', cls: 'ghost' }, { label: 'Kopieren', cls: 'pri', fn: () => { const ta = body.querySelector('#expTxt'); U.copy(txt, ta).then(ok => KY.ui.flashMsg(ok ? 'In die Zwischenablage kopiert' : 'Text markiert, bitte manuell kopieren', ok ? 'ok' : 'info')); ta.select(); return false; } }] });
    },
    importDlg() {
      const body = document.createElement('div');
      body.innerHTML = '<p class="small fg2">Fügen Sie einen exportierten Sitzungsstand ein. Der aktuelle Stand wird ersetzt.</p><textarea class="inp mono mt12" id="impTxt" rows="8" style="font-size:10.5px"></textarea>';
      KY.ui.modal({ lbl: 'Import', title: 'Sitzungsstand importieren', body, actions: [{ label: 'Abbrechen', cls: 'ghost' }, { label: 'Importieren und neu laden', cls: 'pri', fn: () => {
        try { KY.engine.stop(); KY.importState(body.querySelector('#impTxt').value); KY.S = null; location.reload(); }
        catch (e) { KY.engine.start(); KY.ui.flashMsg(e.message || 'Ungültiger Sitzungsstand', 'crit'); return false; }
      } }] });
    },
    wipe() {
      const S = KY.S;
      const body = document.createElement('div');
      body.innerHTML = '<p class="fg2">Geben Sie zur Bestätigung Ihren Rufnamen ein. Dieser Vorgang kann nicht rückgängig gemacht werden.</p><input class="inp mono mt12" id="wipeIn" autocomplete="off" style="letter-spacing:.2em;text-transform:uppercase" placeholder="' + U.esc(S.user.codename) + '">';
      const dlg = KY.ui.modal({ lbl: 'Notfalllöschung', title: 'Sitz IX zurückgeben?', body, cls: 'crisis', actions: [{ label: 'Abbrechen', cls: 'ghost' }, { label: 'Endgültig löschen', cls: 'dan', fn: () => {
        if (body.querySelector('#wipeIn').value.trim().toUpperCase() !== S.user.codename) { KY.ui.flashMsg('Rufname stimmt nicht überein.', 'crit'); return false; }
        this.countdown();
      } }] });
      void dlg;
    },
    countdown() {
      const ov = document.createElement('div');
      ov.className = 'null-ovl';
      ov.innerHTML = '<div class="lbl" style="color:var(--crit);letter-spacing:.4em">Notfalllöschung</div><div class="mono" style="font-size:72px;color:#ff8f84" id="wipeN">5</div><p>Schlüssel werden vernichtet. Sitz IX wird an das Kuratorium zurückgegeben.</p><button class="btn ghost" id="wipeStop">Abbrechen</button>';
      document.body.appendChild(ov);
      let n = 5, stop = false;
      ov.querySelector('#wipeStop').onclick = () => { stop = true; ov.remove(); };
      const t = () => {
        if (stop) return;
        if (KY.audio) KY.audio.play('alert');
        if (n <= 0) {
          KY.engine.stop();
          KY.wipe();
          KY.S = null;
          ov.innerHTML = '<div class="mono" style="color:#9aa39c">Sitzungsstand gelöscht.</div>';
          setTimeout(() => location.reload(), 1200);
          return;
        }
        ov.querySelector('#wipeN').textContent = n--;
        setTimeout(t, 1000);
      };
      t();
    },
  };
})();

/* js/main.js */
/* KYTHERA · Start */
(function () {
  'use strict';
  const KY = window.KY;

  function launch(fromHot) {
    const S = KY.S;
    S.meta.boots = (S.meta.boots || 0) + 1;
    S.meta.sessions = (S.meta.sessions || 0) + 1;
    KY.ui.init();
    const away = (Date.now() - (S.meta.lastSeen || Date.now())) / 1000;
    if (!fromHot && S.meta.boots > 1 && away > 30) {
      KY.log('sys', 'Sitzung fortgesetzt nach ' + KY.U.dur(Math.min(away, 3600)) + ' Abwesenheit');
      KY.engine.catchUp(away, true);
    } else if (S.meta.boots === 1) {
      KY.log('sys', 'Erstanmeldung Sitz IX · Rufname ' + S.user.codename);
    } else {
      KY.log('sys', 'Anmeldung Sitz IX');
    }
    KY.save();
    KY.engine.start();
  }

  function start(hot) {
    const saved = hot && hot.state ? hot.state : KY.load();
    if (saved && saved.user && saved.user.sworn) {
      KY.S = saved;
      if (hot && hot.state) { launch(true); return; }
      KY.boot.run(true, () => launch(false));
    } else {
      KY.S = KY.newState();
      KY.boot.run(false, () => launch(false));
    }
  }

  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state: KY.S }));
  } catch (e) { /* ohne Vorschau-Hook */ }
  const boot = () => {
    const h = window.claude && window.claude.hot;
    if (h && h.ready) h.ready(start); else start((h && h.data) || {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
