        '<div class="g g4" id="nlKpi"></div>' +
        '<div class="g g-main mt12"><section class="pn"><div class="pn-h"><h3>Pressespiegel</h3><div class="tools">' +
        '<input class="inp" id="nlQ" placeholder="Suchen …" style="height:26px;width:150px">' +
        '<select class="inp" id="nlR" style="height:26px;width:auto"><option value="">Alle Regionen</option>' + KY.data.regionOrder.map(id => '<option value="' + id + '">' + KY.data.regions[id].name + '</option>').join('') + '<option value="GLOBAL">Weltweit</option></select>' +
        '<div class="seg" id="nlT"><button data-t="" class="on">Alle</button><button data-t="good">Positiv</button><button data-t="bad">Negativ</button><button data-t="proj">Eigene</button></div></div></div>' +
        '<div class="pn-b flush" id="nlFeed" style="max-height:calc(100vh - 330px);min-height:360px;overflow-y:auto"></div></section>' +
        '<aside class="col gap12"><section class="pn"><div class="pn-h"><h3>Tonlage nach Region</h3><div class="tools"><span class="meta">letzte 60 Meldungen</span></div></div><div class="pn-b" id="nlTone"></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Öffentlichkeitsarbeit</h3></div><div class="pn-b col" id="nlPr"></div></section></aside></div>';
      el.querySelector('#nlQ').oninput = e => { this.f.q = e.target.value; this.rFeed(); };
      el.querySelector('#nlR').onchange = e => { this.f.r = e.target.value; this.rFeed(); };
      U.on(el, 'click', '[data-t]', (e, b) => { this.f.tone = b.dataset.t; U.$$('[data-t]', el).forEach(x => x.classList.toggle('on', x === b)); this.rFeed(); });
      U.on(el, 'click', '[data-pr]', (e, b) => this.pr(b.dataset.pr));
      U.on(el, 'click', '[data-proj]', (e, b) => KY.ui.go('vorhaben', b.dataset.proj));
      this.sub = KY.bus.on('news', () => { this.dirty = true; });
      this.render();
    },
    unmount() { this.sub(); },
    tick() { if (this.dirty) { this.dirty = false; this.render(); } else this.rPr(); },
    render() { this.rKpi(); this.rFeed(); this.rTone(); this.rPr(); },
    rKpi() {
      const S = KY.S;
      const recent = S.news.filter(n => S.t - n.t < 600);
      const own = S.news.slice(0, 60).filter(n => n.proj).length;
      const bad = recent.filter(n => n.tone === 'bad').length, good = recent.filter(n => n.tone === 'good').length;
      const att = U.clamp(own * 6 + (100 - S.res.disk) * 0.6, 0, 100);
      U.setHTML(this.el.querySelector('#nlKpi'),
        '<div class="kpi"><span class="lbl">Meldungen · 10 min</span><span class="v">' + recent.length + '</span><span class="dl mut">' + good + ' positiv · ' + bad + ' negativ</span></div>' +
        '<div class="kpi" data-tip="<b>Eigene Vorhaben in der Presse</b>Meldungen der letzten Stunde, die auf Vorhaben des Kuratoriums zurückgehen. Die Redaktionen kennen den Absender nicht."><span class="lbl">Bezüge zu eigenen Vorhaben</span><span class="v">' + own + '</span><span class="dl mut">ohne Absenderzuordnung</span></div>' +
        '<div class="kpi" data-tip="<b>Aufmerksamkeit</b>Wie stark Redaktionen nach anonymen Großgeldgebern fragen. Abgeleitet aus Berichterstattung und Diskretion."><span class="lbl">Aufmerksamkeit</span><span class="v">' + U.n(att) + '<small>/100</small></span>' + C.meter(att, 100, C.lvlCls(att, true)) + '</div>' +
        '<div class="kpi"><span class="lbl">Diskretion</span><span class="v">' + U.n(S.res.disk) + '<small>/100</small></span>' + C.meter(S.res.disk, 100, C.lvlCls(S.res.disk)) + '</div>');
    },
    rFeed() {
      const S = KY.S, D = KY.data, f = this.f;
      const q = U.norm(f.q);
      const list = S.news.filter(n => (!f.r || n.rid === f.r || (f.r === 'GLOBAL' && n.outlet === D.outlets.GLOBAL)) && (!f.tone || (f.tone === 'proj' ? n.proj : n.tone === f.tone)) && (!q || U.norm(n.head + n.outlet).indexOf(q) >= 0)).slice(0, 80);
      U.setHTML(this.el.querySelector('#nlFeed'), list.length ? list.map(n => {
        const tone = n.tone === 'good' ? C.pill('positiv', 'ok') : n.tone === 'bad' ? C.pill('negativ', 'crit') : C.pill('neutral', 'plain');
        return '<article class="li" style="cursor:default"><div class="body"><div class="row wrap" style="gap:6px"><span class="lbl" style="color:var(--fg2)">' + U.esc(n.outlet) + '</span><span class="mono xs mut">' + U.clock(new Date(n.ts)) + '</span>' + (n.rid && D.regions[n.rid] ? '<span class="tag">' + D.regions[n.rid].name + '</span>' : '') + '<span class="sp"></span>' + tone + '</div>' +
          '<div class="serif" style="font-size:18px;line-height:1.3;margin-top:5px;color:var(--fg)">' + U.esc(n.head) + '</div>' +
          (n.proj ? '<div class="xs mt4"><span class="acc">◆ Intern: geht auf Vorhaben ' + n.proj + ' zurück</span> · <button class="lnk xs" data-proj="' + n.proj + '">öffnen</button></div>' : '') + '</div></article>';
      }).join('') : '<div class="empty"><b>Keine Meldungen</b>Filter anpassen oder abwarten.</div>');
    },
    rTone() {
      const S = KY.S, D = KY.data;
      const last = S.news.slice(0, 60);
      U.setHTML(this.el.querySelector('#nlTone'), D.regionOrder.map(id => {
        const ns = last.filter(n => n.rid === id);
        const g = ns.filter(n => n.tone === 'good').length, b = ns.filter(n => n.tone === 'bad').length;
        const net = ns.length ? (g - b) / ns.length : 0;
        const w = Math.abs(net) * 50;
        return '<div class="mrow" style="grid-template-columns:110px minmax(0,1fr) 44px" data-tip="' + U.esc(D.regions[id].name + ': ' + g + ' positiv, ' + b + ' negativ, ' + (ns.length - g - b) + ' neutral') + '"><span class="k">' + D.regions[id].name + '</span>' +
          '<div style="position:relative;height:8px;background:var(--line)"><i style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line3)"></i><i style="position:absolute;top:0;bottom:0;' + (net >= 0 ? 'left:50%' : 'right:50%') + ';width:' + w + '%;background:var(--' + (net >= 0 ? 'ok' : 'crit') + ')"></i></div>' +
          '<span class="v">' + ns.length + '</span></div>';
      }).join('') + '<div class="row xs mut mt8" style="justify-content:space-between"><span>◀ überwiegend negativ</span><span>positiv ▶</span></div>');
    },
    rPr() {
      const S = KY.S;
      S.prCool = S.prCool || {};
      U.setHTML(this.el.querySelector('#nlPr'), '<p class="xs mut">Maßnahmen laufen ausschließlich über öffentliche Stiftungen. Sie heben die Diskretion.</p>' + PR.map(p => {
        const cd = Math.max(0, (S.prCool[p.id] || 0) - S.t);
        const can = !cd && KY.canPay(p.cost);
        return '<div style="border:1px solid var(--line2);padding:10px"><div class="bold small">' + p.t + '</div><div class="xs fg2 mt4">' + p.d + '</div><div class="row mt8"><span class="mono xs mut">' + KY.costText(p.cost) + ' · Diskretion +' + p.fx.disk + '</span><span class="sp"></span><button class="btn sm' + (can ? ' pri' : '') + '" data-pr="' + p.id + '"' + (can ? '' : ' disabled') + '>' + (cd ? U.dur(cd) : 'Ausführen') + '</button></div></div>';
      }).join(''));
    },
    pr(id) {
      const S = KY.S, p = PR.find(x => x.id === id);
      if ((S.prCool[id] || 0) > S.t) return;
      if (!KY.pay(p.cost)) { KY.ui.flashMsg('Nicht genügend Mittel.', 'crit'); return; }
      KY.adj('disk', p.fx.disk);
      if (p.trust) KY.trustAdj(p.trust[0], p.trust[1]);
      if (p.news) {
        const rid = U.pick(KY.data.regionOrder);
        KY.regAdj(rid, { vert: 2 });
        KY.wsim.news(rid, 'Stiftung Serrano vergibt 400 Kulturstipendien in ' + KY.data.regions[rid].name, 'good');
      }
      S.prCool[id] = S.t + p.cd;
      KY.log('sys', 'Öffentlichkeitsarbeit: ' + p.t);
      KY.ui.flashMsg(p.t + ' · Diskretion +' + p.fx.disk, 'ok');
      this.render();
    },
  };
})();

/* js/mod/vorhaben.js */
/* KYTHERA · Modul Vorhaben */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.vorhaben = {
    mount(el, arg) {
      this.el = el;
      this.tab = 'aktiv';
      this.sel = null;
      this.plan = { type: 'INF', rid: KY.S.atlasSel || 'ZAM', rid2: null, budget: 1, ap: 'STD', partners: [], code: U.codename() };
      el.innerHTML = KY.ui.head({
        crumb: 'Steuerung', code: 'VH-04', title: 'Vorhaben',
        sub: 'Planen, genehmigen und überwachen Sie Projekte in den Regionen. Jedes Vorhaben verändert die Lage messbar.',
        act: '<button class="btn pri" id="vhNew">' + KY.I('plus') + 'Neues Vorhaben</button>',
      }) + '<div class="tabs" id="vhTabs"></div><div id="vhBody"></div>';
      el.querySelector('#vhNew').onclick = () => this.setTab('plan');
      U.on(el, 'click', '[data-tab]', (e, b) => this.setTab(b.dataset.tab));
      this.subs = ['projects', 'res', 'people'].map(ev => KY.bus.on(ev, () => { this.dirty = true; }));
      this.arg(arg);
    },
    unmount() { this.subs.forEach(f => f()); },
    arg(a) {
      const S = KY.S;
      if (a && a.plan) {
        Object.assign(this.plan, a.plan);
        if (a.plan.type && KY.data.projectTypes[a.plan.type].dual && !this.plan.rid2) this.plan.rid2 = KY.wsim.neighbor(this.plan.rid);
        this.setTab('plan');
      } else if (typeof a === 'string') {
        this.sel = a;
        this.setTab(S.projects.active.find(p => p.id === a) ? 'aktiv' : 'done');
      } else {
        this.setTab(S.projects.active.length ? 'aktiv' : 'plan');
      }
    },
    setTab(t) {
      this.tab = t;
      const S = KY.S;
      U.setHTML(this.el.querySelector('#vhTabs'), [['aktiv', 'Laufend', S.projects.active.length], ['plan', 'Planung'], ['done', 'Abgeschlossen', S.projects.done.length]].map(([k, n, c]) => '<button data-tab="' + k + '"' + (k === t ? ' class="on"' : '') + '>' + n + (c !== undefined ? '<span class="n">' + c + '</span>' : '') + '</button>').join(''));
      this.render(true);
    },
    tick() {
      if (this.tab === 'aktiv') this.rActive(this.dirty);
      else if (this.tab === 'plan' && this.dirty) this.rPlanSide();
      else if (this.tab === 'done' && this.dirty) this.render(true);
      if (this.dirty) { this.dirty = false; this.setTabsOnly(); }
    },
    setTabsOnly() {
      const S = KY.S;
      const n = this.el.querySelectorAll('#vhTabs .n');
      if (n[0]) n[0].textContent = S.projects.active.length;
      if (n[1]) n[1].textContent = S.projects.done.length;
    },
    render(full) {
      if (this.tab === 'plan') { this.rPlan(); return; }
      const b = this.fresh();
      if (this.tab === 'done') { this.rDone(); return; }
      if (full) b.innerHTML = '<div class="g g-main2"><section class="pn"><div class="pn-h"><h3>Laufende Vorhaben</h3></div><div class="pn-b flush" id="vhList"></div></section><section class="pn tick" id="vhDet"></section></div>';
      this.rActive(true);
    },

    /* ---------- Laufende ---------- */
    rActive(full) {
      const S = KY.S, D = KY.data;
      const list = this.el.querySelector('#vhList');
      if (!list) return;
      if (!S.projects.active.length) {
        U.setHTML(list, '<div class="empty"><b>Keine laufenden Vorhaben</b>Starten Sie ein Vorhaben über „Neues Vorhaben“ oder folgen Sie einer Empfehlung von PYTHIA.</div>');
        U.setHTML(this.el.querySelector('#vhDet'), '<div class="pn-b"><div class="empty">Kein Vorhaben ausgewählt.</div></div>');
        return;
      }
      if (!this.sel || !S.projects.active.find(p => p.id === this.sel)) this.sel = S.projects.active[0].id;
      U.setHTML(list, S.projects.active.map(pr => {
        const T = D.projectTypes[pr.type];
        return '<div class="li' + (pr.id === this.sel ? ' on' : '') + '" data-sel="' + pr.id + '"><div class="ic mono" style="width:44px">' + T.short.slice(0, 5) + '</div><div class="body"><div class="row"><span class="t bold" style="color:var(--fg)">' + pr.code + '</span><span class="mono xs mut">' + pr.id + '</span><span class="sp"></span><span class="mono small">' + U.dur(KY.proj.remaining(pr)) + '</span></div>' +
          '<div class="m">' + T.name + ' · ' + D.regions[pr.rid].name + (pr.rid2 ? ' ↔ ' + D.regions[pr.rid2].name : '') + ' · ' + D.approaches[pr.ap].name + '</div><div class="mt8">' + C.meter(KY.proj.progress(pr) * 100, 100, 'prog stripes') + '</div></div></div>';
      }).join(''));
      if (!this._bound) {
        this._bound = true;
        U.on(this.el, 'click', '[data-sel]', (e, b) => { this.sel = b.dataset.sel; this.rActive(true); });
        U.on(this.el, 'click', '[data-pact]', (e, b) => this.pAct(b.dataset.pact));
      }
      this.rDet();
    },
    rDet() {
      const S = KY.S, D = KY.data;
      const pr = S.projects.active.find(p => p.id === this.sel);
      const box = this.el.querySelector('#vhDet');
      if (!pr || !box) return;
      const T = D.projectTypes[pr.type], k = KY.proj.progress(pr);
      const fx = Object.entries(T.fx).map(([m, v]) => '<span class="tag">' + D.metricInfo[m].short + ' ' + U.sgn(v * pr.fxMult, 0) + '</span>').join(' ');
      U.setHTML(box, '<div class="pn-h"><h3>' + pr.id + ' · ' + T.name + '</h3><div class="tools">' + C.pill('aktiv', 'acc', true) + '</div></div><div class="pn-b">' +
        '<div class="row" style="align-items:flex-end"><div><div class="lbl">Deckname</div><div style="font:600 26px/1.1 var(--font-cond);letter-spacing:.12em">' + pr.code + '</div></div><span class="sp"></span><div class="r"><div class="lbl">Restlaufzeit</div><div class="mono" style="font-size:22px">' + U.dur(KY.proj.remaining(pr)) + '</div></div></div>' +
        '<div class="mt12">' + C.meter(k * 100, 100, 'prog tall stripes') + '</div>' +
        '<div class="row mt8 wrap" style="gap:4px">' + T.phases.map((p, i) => '<span class="tag' + (i <= pr.phase ? ' acc' : '') + '">' + (i + 1) + ' ' + p + '</span>').join('') + '</div>' +
        '<dl class="kv mt16"><dt>Region</dt><dd>' + D.regions[pr.rid].name + (pr.rid2 ? ' ↔ ' + D.regions[pr.rid2].name : '') + '</dd><dt>Erfolgsprognose</dt><dd class="mono">' + pr.p + ' %</dd><dt>Vorgehen</dt><dd>' + D.approaches[pr.ap].name + ' · Budget ' + Math.round(pr.budget * 100) + ' %</dd><dt>Mittel</dt><dd class="mono">' + KY.costText(pr.cost) + '</dd>' +
        '<dt>Partner</dt><dd>' + (pr.partners.length ? pr.partners.map(id => U.esc(D.people.find(p => p.id === id).n)).join(', ') : '<span class="mut">keine</span>') + '</dd>' + (pr.ship ? '<dt>Schiff</dt><dd>FS ' + pr.ship + '</dd>' : '') + '<dt>Erwartete Wirkung</dt><dd>' + fx + '</dd></dl>' +
        '<div class="lbl mt16">Einsatzprotokoll</div><div class="mono small mt8" style="line-height:1.65;max-height:220px;overflow-y:auto">' + pr.log.slice().reverse().map(l => '<div><span class="mut">' + U.clock(new Date(l.ts)) + '</span> ' + U.esc(l.text) + '</div>').join('') + '</div>' +
        '</div><div class="pn-f"><button class="btn sm" data-pact="acc" data-tip="Restlaufzeit −40 %. Kosten: 25 % des Budgets und 8 Einfluss. Erfolgsprognose −3 Punkte.">' + KY.I('play') + 'Beschleunigen</button><button class="btn sm ghost" data-pact="map">Im Atlas</button><span class="sp"></span><button class="btn sm dan" data-pact="abort">Abbrechen</button></div>');
    },
    pAct(a) {
      const id = this.sel;
      if (a === 'map') { const pr = KY.S.projects.active.find(p => p.id === id); if (pr) KY.ui.go('atlas', pr.rid); return; }
      if (a === 'acc') { const r = KY.proj.accelerate(id); if (!r.ok) KY.ui.flashMsg(r.err || 'Nicht möglich', 'crit'); else KY.ui.flashMsg('Vorhaben beschleunigt', 'ok'); this.rActive(true); return; }
      if (a === 'abort') KY.ui.confirm('Vorhaben abbrechen?', 'Die Hälfte der nicht verbrauchten Mittel fließt zurück. Ihr Ansehen im Plenum sinkt leicht.', 'Abbrechen', () => { KY.proj.abort(id); this.rActive(true); }, true);
    },

    /* ---------- Planung ---------- */
    fresh() {
      const old = this.el.querySelector('#vhBody'), b = old.cloneNode(false);
      old.replaceWith(b);
      return b;
    },
    rPlan() {
      const S = KY.S, D = KY.data, P = this.plan;
      const b = this.fresh();
      const types = Object.keys(D.projectTypes);
      const regOpts = sel => D.regionOrder.map(id => '<option value="' + id + '"' + (id === sel ? ' selected' : '') + '>' + D.regions[id].name + '</option>').join('');
      b.innerHTML = '<div class="g g-main"><div class="col gap12">' +
        '<section class="pn"><div class="pn-h"><h3>1 · Typ</h3></div><div class="pn-b"><div class="g g4" style="gap:6px" id="vpTypes">' + types.map(t => {
          const T = D.projectTypes[t], av = KY.proj.available(t);
          return '<button class="opt' + (P.type === t ? ' py' : '') + (av ? '' : ' dis') + '" data-type="' + t + '" style="flex-direction:column;gap:4px;padding:10px"' + (av ? '' : ' data-tip="Erfordert Forschung: ' + U.esc(KY.research.get(T.requires).n) + '"') + '><span class="t" style="font-size:12.5px">' + T.name + '</span><span class="mono xs mut">' + U.money(T.cost, 1) + ' · ' + U.dur(T.dur) + '</span></button>';
        }).join('') + '</div><p class="small fg2 mt12" id="vpTypeText"></p></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>2 · Region</h3></div><div class="pn-b"><div class="g g2"><div class="fld"><label for="vpRid">Zielregion</label><select class="inp" id="vpRid">' + regOpts(P.rid) + '</select></div>' +
        '<div class="fld" id="vpRid2W"><label for="vpRid2">Partnerregion</label><select class="inp" id="vpRid2"><option value="">— wählen —</option>' + regOpts(P.rid2) + '</select></div></div><div id="vpRegInfo" class="mt12"></div></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>3 · Budget und Vorgehen</h3></div><div class="pn-b"><div class="g g2"><div class="fld"><span class="lbl">Budgetrahmen</span><div class="seg" id="vpBud">' + [0.75, 1, 1.25, 1.5].map(v => '<button data-bud="' + v + '"' + (P.budget === v ? ' class="on"' : '') + '>' + Math.round(v * 100) + ' %</button>').join('') + '</div><span class="xs mut">Mehr Budget erhöht Erfolg und Wirkung.</span></div>' +
        '<div class="fld"><span class="lbl">Vorgehen</span><div class="seg" id="vpAp">' + Object.keys(D.approaches).map(k => '<button data-ap="' + k + '"' + (P.ap === k ? ' class="on"' : '') + '>' + D.approaches[k].name + '</button>').join('') + '</div><span class="xs mut" id="vpApT"></span></div></div></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>4 · Partner aus dem Netzwerk</h3><div class="tools"><span class="meta" id="vpPN"></span></div></div><div class="pn-b flush tbl-w" id="vpPeople" style="max-height:300px;overflow:auto"></div></section>' +
        '</div><aside class="col gap12" id="vpSide"></aside></div>';
      U.on(b, 'click', '[data-type]', (e, x) => {
        if (x.classList.contains('dis')) { KY.ui.flashMsg('Dieser Typ erfordert ein Forschungsprogramm.', 'crit'); return; }
        P.type = x.dataset.type;
        if (D.projectTypes[P.type].dual && !P.rid2) P.rid2 = KY.wsim.neighbor(P.rid);
        P.partners = P.partners.filter(pid => KY.S.people[pid] && !KY.S.people[pid].busy);
        this.rPlan();
      });
      b.querySelector('#vpRid').onchange = e => { P.rid = e.target.value; if (P.rid2 === P.rid) P.rid2 = null; this.rPlanSide(); this.rPlanBits(); };
      b.querySelector('#vpRid2').onchange = e => { P.rid2 = e.target.value || null; this.rPlanSide(); };
      U.on(b, 'click', '[data-bud]', (e, x) => { P.budget = +x.dataset.bud; U.$$('[data-bud]', b).forEach(y => y.classList.toggle('on', y === x)); this.rPlanSide(); });
      U.on(b, 'click', '[data-ap]', (e, x) => { P.ap = x.dataset.ap; U.$$('[data-ap]', b).forEach(y => y.classList.toggle('on', y === x)); this.rPlanBits(); this.rPlanSide(); });
      U.on(b, 'change', '[data-pp]', (e, x) => {
        const id = x.dataset.pp;
        if (x.checked) { if (P.partners.length >= 3) { x.checked = false; KY.ui.flashMsg('Höchstens drei Partner je Vorhaben.', 'crit'); return; } P.partners.push(id); }
        else P.partners = P.partners.filter(p => p !== id);
        U.setText(b.querySelector('#vpPN'), P.partners.length + ' / 3 gewählt');
        this.rPlanSide();
      });
      this.rPlanBits();
      this.rPlanSide();
    },
    rPlanBits() {
      const S = KY.S, D = KY.data, P = this.plan, T = D.projectTypes[P.type], b = this.el.querySelector('#vhBody');
      U.setText(b.querySelector('#vpTypeText'), T.text);
      b.querySelector('#vpRid2W').style.display = T.dual ? '' : 'none';
      U.setText(b.querySelector('#vpApT'), D.approaches[P.ap].text);
      const R = S.regions[P.rid];
      U.setHTML(b.querySelector('#vpRegInfo'), '<div class="g g4" style="gap:6px">' + ['vert', 'praes', 'span', 'stab'].map(k => '<div class="kpi" style="padding:8px 10px"><span class="lbl">' + D.metricInfo[k].name + '</span><span class="mono">' + U.n(R.m[k]) + '</span>' + C.meter(R.m[k], 100, C.lvlCls(R.m[k], k === 'span')) + '</div>').join('') + '</div>' +
        (R.mora > 0 && T.big ? '<p class="pill crit mt8" style="white-space:normal">Moratorium für Großvorhaben aktiv (' + U.dur(R.mora) + ')</p>' : ''));
      // Partnerliste: passende zuerst
      const ppl = D.people.map(p => ({ p, st: S.people[p.id], match: p.tags.filter(t => T.tags.indexOf(t) >= 0).length })).sort((a, b2) => (b2.match - a.match) || (b2.st.trust - a.st.trust));
      U.setText(b.querySelector('#vpPN'), P.partners.length + ' / 3 gewählt');
      U.setHTML(b.querySelector('#vpPeople'), '<table class="tbl"><thead><tr><th></th><th>Person</th><th>Fachgebiete</th><th class="num">Vertrauen</th><th>Status</th></tr></thead><tbody>' + ppl.map(({ p, st, match }) => {
        const busy = st.busy && P.partners.indexOf(p.id) < 0;
        return '<tr><td style="width:30px"><input type="checkbox" data-pp="' + p.id + '"' + (P.partners.indexOf(p.id) >= 0 ? ' checked' : '') + (busy ? ' disabled' : '') + ' aria-label="' + U.esc(p.n) + ' als Partner"></td><td><div class="small">' + U.esc(p.n) + '</div><div class="xs mut ell" style="max-width:240px">' + U.esc(p.role) + '</div></td><td>' + p.tags.map(t => '<span class="tag' + (T.tags.indexOf(t) >= 0 ? ' acc' : '') + '">' + KY.data.tagNames[t] + '</span>').join(' ') + '</td><td class="num">' + U.n(st.trust) + '</td><td>' + (busy ? C.pill('gebunden', 'plain') : match ? C.pill('passend', 'ok') : '<span class="xs mut">verfügbar</span>') + '</td></tr>';
      }).join('') + '</tbody></table>');
    },
    rPlanSide() {
      const S = KY.S, D = KY.data, P = this.plan, T = D.projectTypes[P.type];
      const side = this.el.querySelector('#vpSide');
      if (!side) return;
      const pl = KY.proj.plan(P);
      const can = !pl.blocked && KY.canPay(pl.cost);
      const fx = Object.entries(T.fx).map(([m, v]) => '<div class="row small"><span class="fg2" style="flex:1">' + D.metricInfo[m].name + '</span><span class="mono">' + U.sgn(v * pl.fxMult, 1) + '</span></div>').join('');
      const pyCom = pl.p >= 75 ? 'Hohe Erfolgswahrscheinlichkeit. Ich empfehle die Genehmigung.' : pl.p >= 55 ? 'Vertretbares Risiko. Partner mit passender Fachrichtung würden die Prognose verbessern.' : 'Erhebliches Risiko. Erwägen Sie mehr Budget, Partner oder zuerst eine Bildungsstiftung zur Stärkung der Kooperation.';
      U.setHTML(side, '<section class="pn tick"><div class="pn-h"><h3>Prognose</h3><div class="tools"><span class="meta">PYTHIA · Modell 31</span></div></div><div class="pn-b">' +
        C.gauge(pl.p, { label: 'Erfolgsprognose', cls: pl.p >= 70 ? 'ok' : pl.p >= 50 ? 'warn' : 'crit', max: 220 }) +
        '<div class="col gap4 mt12">' + pl.parts.map(p => '<div class="row small"><span class="fg2 ell" style="flex:1">' + U.esc(p.label) + '</span><span class="mono ' + (p.base ? '' : p.v > 0 ? 'up' : 'dn') + '">' + (p.base ? p.v : U.sgn(p.v, 0)) + '</span></div>').join('') + '<div class="row small" style="border-top:1px solid var(--line2);padding-top:5px;margin-top:3px"><span class="bold" style="flex:1">Gesamt</span><span class="mono bold">' + pl.p + ' %</span></div></div>' +
        '<p class="small mt12" style="color:var(--acc2);font-style:italic">„' + pyCom + '“</p></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Einsatz und Wirkung</h3></div><div class="pn-b"><dl class="kv"><dt>Kosten</dt><dd class="mono">' + KY.costText(pl.cost) + '</dd><dt>Laufzeit</dt><dd class="mono">' + U.dur(pl.dur) + '</dd><dt>Diskretion</dt><dd class="mono">−' + U.n(pl.disk, 1) + '</dd></dl>' +
        '<div class="lbl mt12" style="margin-bottom:6px">Wirkung bei Erfolg · ' + D.regions[P.rid].name + '</div>' + fx +
        (T.returns ? '<p class="xs acc mt8">Kapital fließt nach Abschluss mit Rendite zurück.</p>' : '') + (T.research ? '<p class="xs acc mt8">Erhöht dauerhaft Ihre Forschungsgeschwindigkeit.</p>' : '') + (T.expedition ? '<p class="xs acc mt8">Benötigt ein freies Schiff. Mögliche Funde.</p>' : '') + (T.resilience ? '<p class="xs acc mt8">Senkt Schäden künftiger Naturereignisse.</p>' : '') +
        '</div></section>' +
        '<section class="pn"><div class="pn-b"><div class="fld"><label for="vpCode">Deckname</label><div class="row"><input class="inp mono" id="vpCode" value="' + U.esc(P.code) + '" maxlength="24" style="letter-spacing:.14em;text-transform:uppercase"><button class="btn ghost" id="vpReCode" aria-label="Neuer Deckname">↻</button></div></div>' +
        (pl.blocked ? '<p class="pill crit mt12" style="white-space:normal">' + U.esc(pl.blocked) + '</p>' : !KY.canPay(pl.cost) ? '<p class="pill crit mt12">Nicht ausreichend: ' + KY.missing(pl.cost).join(', ') + '</p>' : '') +
        '<button class="btn pri lg block mt12" id="vpGo"' + (can ? '' : ' disabled') + '>' + KY.I('check') + 'Vorhaben genehmigen</button></div></section>');
      side.querySelector('#vpCode').oninput = e => { P.code = e.target.value.toUpperCase().replace(/[^A-ZÄÖÜ0-9-]/g, ''); };
      side.querySelector('#vpReCode').onclick = () => { P.code = U.codename(); side.querySelector('#vpCode').value = P.code; };
      side.querySelector('#vpGo').onclick = () => {
        const r = KY.proj.launch(Object.assign({}, P, { code: P.code || undefined }));
        if (!r.ok) { KY.ui.flashMsg(r.err, 'crit'); return; }
        KY.ui.flashMsg('Vorhaben ' + r.pr.code + ' genehmigt', 'ok');
        this.plan.code = U.codename();
        this.plan.partners = [];
        this.sel = r.pr.id;
        this.setTab('aktiv');
      };
    },

    /* ---------- Abgeschlossen ---------- */
    rDone() {
      const S = KY.S, D = KY.data;
      const b = this.fresh();
      const ok = S.projects.done.filter(p => p.status === 'VOLL' || p.status === 'ERF').length;
      b.innerHTML = '<div class="g g4"><div class="kpi"><span class="lbl">Abgeschlossen</span><span class="v">' + S.projects.done.length + '</span></div><div class="kpi"><span class="lbl">Erfolgreich</span><span class="v">' + ok + '</span></div><div class="kpi"><span class="lbl">Erfolgsquote</span><span class="v">' + (S.projects.done.length ? U.n(ok / S.projects.done.length * 100) : '–') + '<small>%</small></span></div><div class="kpi"><span class="lbl">Eingesetztes Kapital</span><span class="v">' + U.n(U.sum(S.projects.done.map(p => p.cost.kap)), 1) + '<small>Mrd ¤</small></span></div></div>' +
        '<section class="pn mt12"><div class="pn-h"><h3>Archiv der Vorhaben</h3></div><div class="pn-b flush tbl-w">' + (S.projects.done.length ? '<table class="tbl"><thead><tr><th>Kennung</th><th>Deckname</th><th>Typ</th><th>Region</th><th class="num">Prognose</th><th>Ergebnis</th><th></th></tr></thead><tbody>' +
        S.projects.done.map(p => {
          const O = D.outcomes[p.status];
          return '<tr class="click' + (p.id === this.sel ? ' on' : '') + '" data-rep="' + p.id + '"><td class="mono small">' + p.id + '</td><td class="bold">' + p.code + '</td><td>' + D.projectTypes[p.type].name + '</td><td>' + D.regions[p.rid].name + (p.rid2 ? ' ↔ ' + D.regions[p.rid2].name : '') + '</td><td class="num">' + p.p + ' %</td><td>' + (O ? C.pill(O.name, O.cls) : C.pill('Abgebrochen', 'plain')) + '</td><td class="r"><button class="btn sm ghost">Bericht</button></td></tr>';
        }).join('') + '</tbody></table>' : '<div class="empty"><b>Noch keine abgeschlossenen Vorhaben</b>Ergebnisse und Nachberichte erscheinen hier.</div>') + '</div></section>';
      U.on(b, 'click', '[data-rep]', (e, r) => this.report(r.dataset.rep));
      if (this.sel && S.projects.done.find(p => p.id === this.sel)) { const id = this.sel; this.sel = null; setTimeout(() => this.report(id), 50); }
    },
    report(id) {
      const p = KY.S.projects.done.find(x => x.id === id);
      if (!p) return;
      KY.ui.modal({
        lbl: 'Nachbericht', title: p.code + ' · ' + KY.data.projectTypes[p.type].name, cls: 'wide',
        body: '<pre class="mono small" style="white-space:pre-wrap;line-height:1.7;margin:0;color:var(--fg)">' + U.esc(p.report || 'Vorhaben vorzeitig abgebrochen.') + '</pre><div class="lbl mt16">Einsatzprotokoll</div><div class="mono xs fg2 mt8" style="line-height:1.7">' + p.log.map(l => '<div><span class="mut">' + U.clock(new Date(l.ts)) + '</span> ' + U.esc(l.text) + '</div>').join('') + '</div>',
        actions: [{ label: 'Schließen', cls: 'ghost' }, { label: 'Ähnliches Vorhaben planen', cls: 'pri', fn: () => { KY.ui.go('vorhaben', { plan: { type: p.type, rid: p.rid, rid2: p.rid2 } }); } }],
      });
    },
  };
})();

/* js/mod/kapital.js */
/* KYTHERA · Modul Kapital */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.kapital = {
    mount(el, arg) {
      const D = KY.data;
      this.el = el;
      this.n = 0;
      this.sel = arg && D.companies.find(c => c.t === arg) ? arg : 'SSC';
      this.side = 'buy';
      this.amt = 5;
      this.sort = { k: 'pos', d: -1 };
      this.filter = 'alle';
      el.innerHTML = KY.ui.head({ crumb: 'Steuerung', code: 'KP-05', title: 'Kapital', sub: 'Beteiligungen des Sitzes IX an 24 börsennotierten Unternehmen. Ihre Orders sind groß genug, um Kurse zu bewegen.' }) +
        '<div class="g g5" id="kpKpi"></div>' +
        '<div class="g g-main mt12"><section class="pn"><div class="pn-h"><h3>Markt und Positionen</h3><div class="tools"><div class="seg" id="kpF"><button data-f="alle" class="on">Alle</button><button data-f="pos">Gehalten</button></div></div></div><div class="pn-b flush tbl-w" id="kpTbl" style="max-height:560px;overflow-y:auto"></div></section>' +
        '<aside class="col gap12" id="kpDet"></aside></div>' +
        '<div class="g g3 mt12"><section class="pn"><div class="pn-h"><h3>Aufteilung nach Sektor</h3></div><div class="pn-b row gap16" id="kpAlloc" style="align-items:center"></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Rohstoffe und Indizes</h3></div><div class="pn-b flush" id="kpCom"></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Gesamtvermögen · 20 min</h3></div><div class="pn-b" id="kpNw"></div></section></div>';
      U.on(el, 'click', '[data-co]', (e, r) => { this.sel = r.dataset.co; this.rTbl(); this.rDet(true); });
      U.on(el, 'click', '[data-f]', (e, b) => { this.filter = b.dataset.f; U.$$('[data-f]', el).forEach(x => x.classList.toggle('on', x === b)); this.rTbl(); });
      U.on(el, 'click', '[data-sort]', (e, th) => { const k = th.dataset.sort; this.sort = { k, d: this.sort.k === k ? -this.sort.d : -1 }; this.rTbl(); });
      this.sub = KY.bus.on('market', () => { this.dirty = true; });
      this.render();
    },
    arg(a) { if (a && KY.data.companies.find(c => c.t === a)) { this.sel = a; this.rTbl(); this.rDet(true); } },
    unmount() { this.sub(); },
    tick() {
      this.n++;
      this.rKpi();
      if (this.n % 2 === 0 || this.dirty) { this.rTbl(); this.rDet(false); }
      if (this.n % 5 === 0 || this.dirty) { this.rAlloc(); this.rCom(); this.rNw(); }
      this.dirty = false;
    },
    render() { this.rKpi(); this.rTbl(); this.rDet(true); this.rAlloc(); this.rCom(); this.rNw(); },
    rKpi() {
      const S = KY.S, M = KY.market, D = KY.data;
      const hold = M.holdings();
      const cost = U.sum(D.companies.map(c => S.market.c[c.t].cost));
      const pl = hold - cost;
      const ih = S.market.idx.h;
      const ich = ih.length > 60 ? (S.market.idx.v / ih[ih.length - 60] - 1) * 100 : 0;
      U.setHTML(this.el.querySelector('#kpKpi'),
        '<div class="kpi"><span class="lbl">Gesamtvermögen</span><span class="v">' + U.n(M.netWorth(), 1) + '<small>Mrd ¤</small></span><div class="sp-wrap">' + C.spark(S.market.nw.slice(-60), { w: 160, h: 28 }) + '</div></div>' +
        '<div class="kpi"><span class="lbl">Liquidität</span><span class="v">' + U.n(S.res.kap, 1) + '<small>Mrd ¤</small></span><span class="dl mut">' + U.pct(S.res.kap / M.netWorth() * 100, 0) + ' des Vermögens</span></div>' +
        '<div class="kpi"><span class="lbl">Beteiligungen</span><span class="v">' + U.n(hold, 1) + '<small>Mrd ¤</small></span><span class="dl">' + C.delta(pl, 2, ' Mrd') + ' <span class="mut">unrealisiert</span></span></div>' +
        '<div class="kpi" data-tip="<b>Laufende Erträge</b>Dividenden ' + U.esc(U.money(M.lastDiv)) + ' + Stiftungserträge ¤ 1,20 Mrd. − Unterhalt ' + U.esc(U.money(M.upkeep())) + ' je Minute."><span class="lbl">Erträge je Minute</span><span class="v">' + U.n(M.lastIncome, 2) + '<small>Mrd ¤</small></span><span class="dl mut">realisiert ' + U.sgn(S.stats.profit, 2) + ' Mrd</span></div>' +
        '<div class="kpi"><span class="lbl">' + D.indexName + '</span><span class="v">' + U.n(S.market.idx.v, 1) + '</span><span class="dl">' + C.delta(ich, 2, ' %') + ' <span class="mut">5 min</span></span><div class="sp-wrap">' + C.spark(ih.slice(-60), { w: 160, h: 28, color: 'var(--c1)' }) + '</div></div>');
    },
    rTbl() {
      const S = KY.S, D = KY.data, M = KY.market;
      const f1 = KY.hasRes('F1');
      let rows = D.companies.map(co => {
        const c = S.market.c[co.t];
        return { co, c, ch: M.change(co.t, 60), pos: c.u * c.p, pl: c.u * c.p - c.cost, fc: f1 ? M.forecast(co.t) : 0 };
      });
      if (this.filter === 'pos') rows = rows.filter(r => r.pos > 0.001);
      const k = this.sort.k, d = this.sort.d;
      rows.sort((a, b) => {
        const va = k === 'name' ? a.co.n : k === 'ch' ? a.ch : k === 'pos' ? a.pos : k === 'pl' ? a.pl : k === 'fc' ? a.fc : a.c.p;
        const vb = k === 'name' ? b.co.n : k === 'ch' ? b.ch : k === 'pos' ? b.pos : k === 'pl' ? b.pl : k === 'fc' ? b.fc : b.c.p;
        return (va > vb ? 1 : va < vb ? -1 : 0) * d;
      });
      const th = (key, label, cls) => '<th class="sortable ' + (cls || '') + '" data-sort="' + key + '">' + label + (this.sort.k === key ? (this.sort.d < 0 ? ' ▾' : ' ▴') : '') + '</th>';
      U.setHTML(this.el.querySelector('#kpTbl'), '<table class="tbl"><thead><tr>' + th('name', 'Unternehmen') + '<th class="hide-xs">Sektor</th>' + th('p', 'Kurs', 'num') + th('ch', '5 min', 'num') + '<th class="hide-xs">Verlauf</th>' + th('pos', 'Position', 'num') + th('pl', 'G/V', 'num') + (f1 ? th('fc', 'Prognose', 'num') : '') + '</tr></thead><tbody>' +
        rows.map(r => '<tr class="click' + (r.co.t === this.sel ? ' on' : '') + '" data-co="' + r.co.t + '"><td><span class="mono acc small">' + r.co.t + '</span> <span class="small">' + U.esc(r.co.n) + '</span></td><td class="hide-xs small fg2">' + D.sectors[r.co.s] + '</td><td class="num">' + U.n(r.c.p, 2) + '</td><td class="num">' + C.delta(r.ch, 2, ' %') + '</td><td class="hide-xs" style="width:90px"><div style="height:20px">' + C.spark(r.c.h.slice(-40), { w: 90, h: 20, color: r.ch >= 0 ? 'var(--ok)' : 'var(--crit)' }) + '</div></td>' +
          '<td class="num">' + (r.pos > 0.001 ? U.n(r.pos, 2) : '<span class="dim">–</span>') + '</td><td class="num">' + (r.pos > 0.001 ? C.delta(r.pl, 2) : '<span class="dim">–</span>') + '</td>' + (f1 ? '<td class="num">' + C.delta(r.fc, 1, ' %') + '</td>' : '') + '</tr>').join('') + '</tbody></table>');
    },
    rDet(full) {
      const S = KY.S, D = KY.data, M = KY.market;
      const co = M.co(this.sel), c = S.market.c[co.t];
      let box = this.el.querySelector('#kpDet');
      const pos = c.u * c.p;
      if (full || !box.querySelector('#kpChart')) {
        const fresh = box.cloneNode(false);
        box.replaceWith(fresh);
        box = fresh;
        box.innerHTML = '<section class="pn tick"><div class="pn-h"><h3>' + co.t + ' · ' + U.esc(D.sectors[co.s]) + '</h3><div class="tools"><span class="meta">' + D.regions[co.r].name + '</span></div></div><div class="pn-b">' +
          '<div class="serif" style="font-size:24px;line-height:1.1">' + U.esc(co.n) + '</div><p class="small fg2 mt8">' + U.esc(co.text) + '</p>' +
          '<div class="row mt12" style="align-items:baseline"><span style="font:500 28px/1 var(--font-ui)" id="kpPx"></span><span class="mono small" id="kpCh"></span></div>' +
          '<div id="kpChart" class="mt8"></div><dl class="kv mt12" id="kpStats"></dl></div></section>' +
          '<section class="pn"><div class="pn-h"><h3>Order</h3><div class="tools"><div class="seg"><button data-side="buy"' + (this.side === 'buy' ? ' class="on"' : '') + '>Kaufen</button><button data-side="sell"' + (this.side === 'sell' ? ' class="on"' : '') + '>Verkaufen</button></div></div></div><div class="pn-b">' +
          '<div class="fld"><label for="kpAmt">Volumen in Mrd ¤</label><input class="inp mono" id="kpAmt" type="number" min="0.1" step="0.5" value="' + this.amt + '"></div>' +
          '<div class="row wrap mt8" style="gap:4px">' + [1, 5, 10, 25].map(v => '<button class="btn sm ghost" data-amt="' + v + '">' + v + '</button>').join('') + '<button class="btn sm ghost" data-amt="max">Max</button></div>' +
          '<dl class="kv mt12" id="kpPrev"></dl><button class="btn pri lg block mt12" id="kpGo"></button></div></section>';
        const amt = box.querySelector('#kpAmt');
        amt.oninput = () => { this.amt = Math.max(0, parseFloat(amt.value) || 0); this.rPrev(); };
        U.on(box, 'click', '[data-side]', (e, b) => { this.side = b.dataset.side; U.$$('[data-side]', box).forEach(x => x.classList.toggle('on', x === b)); this.rPrev(); });
        U.on(box, 'click', '[data-amt]', (e, b) => {
          const v = b.dataset.amt;
          this.amt = v === 'max' ? Math.floor((this.side === 'buy' ? S.res.kap * 0.99 : S.market.c[this.sel].u * S.market.c[this.sel].p) * 10) / 10 : +v;
          amt.value = this.amt; this.rPrev();
        });
        box.querySelector('#kpGo').onclick = () => {
          const r = M.trade(this.sel, this.side, this.amt);
          if (!r.ok) { KY.ui.flashMsg(r.err, 'crit'); return; }
          KY.ui.flashMsg((this.side === 'buy' ? 'Gekauft: ' : 'Verkauft: ') + U.money(this.amt) + ' ' + this.sel + ' · Kursimpuls ' + U.sgn(r.impact, 2, ' %'), 'ok');
          this.render();
        };
        this.chartN = -1;
      }
      U.setText(box.querySelector('#kpPx'), U.n(c.p, 2) + ' ¤');
      const ch = M.change(co.t, 60);
      U.setHTML(box.querySelector('#kpCh'), C.delta(ch, 2, ' %') + ' <span class="mut">5 min</span>');
      if (this.chartN !== this.n) {
        this.chartN = this.n;
        const band = KY.hasRes('F1') ? (() => { const f = M.forecast(co.t); const mid = c.p * (1 + f / 100); return [mid * 0.985, mid * 1.015]; })() : null;
        C.line(box.querySelector('#kpChart'), { vals: c.h.slice(-120), h: 170, fmt: v => U.n(v, 2) + ' ¤', label: i => 'vor ' + U.dur((119 - i) * 5), band, xlabels: [[0, '−10 min'], [119, 'jetzt']] });
      }
      const mc = co.mc * c.p / co.p;
      U.setHTML(box.querySelector('#kpStats'), '<dt>Marktkapitalisierung</dt><dd class="mono">' + U.money(mc) + '</dd><dt>Ihr Anteil</dt><dd class="mono">' + U.pct(pos / mc * 100, 2) + '</dd><dt>Position</dt><dd class="mono">' + U.money(pos) + ' · Einstand ' + U.money(c.cost) + '</dd><dt>Dividendenrendite</dt><dd class="mono">' + U.pct(co.div) + '</dd><dt>Volatilität</dt><dd class="mono">' + ['gering', 'mittel', 'hoch'][co.v < 1.2 ? 0 : co.v < 1.7 ? 1 : 2] + '</dd>' +
        (KY.hasRes('F1') ? '<dt>Prognose</dt><dd class="mono">' + C.delta(M.forecast(co.t), 1, ' %') + ' zur fairen Bewertung</dd>' : ''));
      this.rPrev();
    },
    rPrev() {
      const S = KY.S, M = KY.market, box = this.el.querySelector('#kpDet');
      const pv = M.preview(this.sel, this.side, this.amt || 0);
      const c = S.market.c[this.sel];
      const can = this.side === 'buy' ? S.res.kap >= this.amt + pv.fee && this.amt > 0 : c.u * c.p >= this.amt - 1e-6 && this.amt > 0;
      U.setHTML(box.querySelector('#kpPrev'), '<dt>Durchschnittskurs</dt><dd class="mono">' + U.n(pv.avg, 2) + ' ¤</dd><dt>Erwarteter Kursimpuls</dt><dd class="mono ' + (pv.impact >= 0 ? 'up' : 'dn') + '">' + U.sgn(pv.impact, 2, ' %') + '</dd><dt>Gebühren</dt><dd class="mono">' + U.money(pv.fee) + '</dd>' +
        '<dt>Verfügbar</dt><dd class="mono">' + (this.side === 'buy' ? U.money(S.res.kap) : U.money(c.u * c.p)) + '</dd>');
      const go = box.querySelector('#kpGo');
      go.disabled = !can;
      go.textContent = (this.side === 'buy' ? 'Kaufen · ' : 'Verkaufen · ') + U.money(this.amt || 0);
    },
    rAlloc() {
      const S = KY.S, D = KY.data;
      const by = {};
      D.companies.forEach(co => { const v = S.market.c[co.t].u * S.market.c[co.t].p; if (v > 0.001) by[co.s] = (by[co.s] || 0) + v; });
      let segs = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([s, v]) => ({ l: D.sectors[s], v }));
      if (segs.length > 6) { const rest = segs.slice(5); segs = segs.slice(0, 5).concat([{ l: 'Weitere', v: U.sum(rest.map(r => r.v)) }]); }
      segs.forEach((s, i) => { s.c = s.l === 'Weitere' ? 'var(--line3)' : C.CAT[i]; });
      const tot = U.sum(segs.map(s => s.v));
      U.setHTML(this.el.querySelector('#kpAlloc'), segs.length ? '<div style="width:140px;flex:none">' + C.donut(segs, [U.n(tot, 0), 'MRD ¤']) + '</div><div style="flex:1;min-width:0">' + C.legend(segs, tot) + '</div>' : '<div class="empty">Keine Beteiligungen.</div>');
    },
    rCom() {
      const S = KY.S, D = KY.data;
      U.setHTML(this.el.querySelector('#kpCom'), '<table class="tbl"><tbody>' + D.commodities.map(cm => {
        const c = S.market.com[cm.id], h = c.h, ch = h.length > 30 ? (c.p / h[h.length - 30] - 1) * 100 : 0;
        return '<tr><td><div class="small">' + cm.n + '</div><div class="xs mut">' + cm.unit + '</div></td><td class="num">' + U.n(c.p, c.p > 1000 ? 0 : 2) + '</td><td class="num">' + C.delta(ch, 2, ' %') + '</td><td style="width:80px"><div style="height:20px">' + C.spark(h.slice(-40), { w: 80, h: 20, color: 'var(--c1)' }) + '</div></td></tr>';
      }).join('') + '</tbody></table>');
    },
    rNw() {
      const S = KY.S;
      const vals = S.market.nw.slice(-240);
      if (vals.length < 2) { U.setHTML(this.el.querySelector('#kpNw'), '<div class="empty">Daten werden gesammelt …</div>'); return; }
      C.line(this.el.querySelector('#kpNw'), { vals, h: 150, fmt: v => U.n(v, 1) + ' Mrd', label: i => 'vor ' + U.dur((vals.length - 1 - i) * 5) });
    },
  };
})();

/* js/mod/orbit.js */
/* KYTHERA · Modul Flotte & Orbit */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.orbit = {
    mount(el, arg) {

      b.querySelector('#imPre').onchange = e => { const p = presets[+e.target.value]; if (!p) return; b.querySelector('#imLat').value = p.lat.toFixed(2); b.querySelector('#imLon').value = p.lon.toFixed(2); };
      b.querySelector('#imGo').onclick = () => {

        '<p class="small fg2 mt12" id="imNote"></p>';

    /* Prozedurales Satellitenbild */
    render(cv, img) {
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      const lowRes = img.res > 1;
      const f = lowRes ? 12 : 1;
      const w = Math.ceil(W / f), h = Math.ceil(H / f);
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const o = off.getContext('2d');
      const id = o.createImageData(w, h);
      const seed = U.hash(img.lat.toFixed(2) + ',' + img.lon.toFixed(2));
      const rnd = U.rng(seed);
      const kyt = KY.infra.isKythera(img.lat, img.lon);
      const fld = KY.world.field(img.lon, img.lat, true).h;
      const rid = KY.world.regionAt(img.lon, img.lat);
      const D = KY.data;
      let urban = 0;
      D.regionOrder.forEach(r => { const c = D.regions[r].capPos; const d = Math.hypot(c[0] - img.lon, c[1] - img.lat); if (d < 2.5) urban = Math.max(urban, 1 - d / 2.5); });
      const arid = ['TAR', 'PAM', 'YAR'].indexOf(rid) >= 0, cold = rid === 'KAL' || img.lat < -60, trop = ['SOL', 'ZAM', 'SUN'].indexOf(rid) >= 0;
      const landC = cold ? [196, 204, 208] : arid ? [176, 150, 104] : trop ? [52, 82, 46] : kyt ? [128, 118, 96] : [82, 92, 62];
      const base = kyt ? 0.05 : U.clamp(fld * 1.6, -0.9, 0.9);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const X = x * f, Y = y * f;
          let v = base + (KY.world.fbm(X / 170 + seed % 97, Y / 170, 11, 5) - 0.5) * 1.3;
          if (kyt) v += 0.45 - Math.hypot((X - W / 2) / 260, (Y - H / 2) / 170) * 0.9;
          const g = (KY.world.fbm(X / 18 + 3, Y / 18 + 7, 12, 3) - 0.5) * 30;
          const p = (y * w + x) * 4;
          let c;
          if (v < 0) {
            const dpt = U.clamp(-v * 2.4, 0, 1);
            c = [16 + (1 - dpt) * 26, 40 + (1 - dpt) * 46, 54 + (1 - dpt) * 40];
          } else {
            const sh = v < 0.05 ? 1.25 : 1;
            c = [landC[0] * sh + g, landC[1] * sh + g, landC[2] * sh + g * 0.8];
          }
          id.data[p] = c[0]; id.data[p + 1] = c[1]; id.data[p + 2] = c[2]; id.data[p + 3] = 255;
        }
      }
      o.putImageData(id, 0, 0);
      // Bebauung
      const sc = 1 / f;
      o.save(); o.scale(sc, sc);
      if (urban > 0.05 && !kyt) {
        o.strokeStyle = 'rgba(190,190,180,0.55)'; o.lineWidth = 3;
        for (let i = 0; i < 8; i++) { o.beginPath(); const yy = rnd() * H; o.moveTo(0, yy); o.lineTo(W, yy + (rnd() - 0.5) * 120); o.stroke(); }
        for (let i = 0; i < 7; i++) { o.beginPath(); const xx = rnd() * W; o.moveTo(xx, 0); o.lineTo(xx + (rnd() - 0.5) * 120, H); o.stroke(); }
        const n = Math.round(urban * 420);
        for (let i = 0; i < n; i++) {
          const bx = rnd() * W, by = rnd() * H, bw = 6 + rnd() * 22, bh = 6 + rnd() * 18;
          const gr = 120 + rnd() * 80;
          o.fillStyle = 'rgb(' + gr + ',' + gr + ',' + (gr - 8) + ')';
          o.fillRect(bx, by, bw, bh);
          o.fillStyle = 'rgba(0,0,0,0.35)'; o.fillRect(bx + bw, by + 2, 3, bh);
        }
      }
      if (kyt) {
        const cx = W / 2 + 18, cy = H / 2 - 6;
        o.fillStyle = 'rgba(0,0,0,0.4)'; o.beginPath(); o.ellipse(cx + 10, cy + 8, 22, 22, 0, 0, Math.PI * 2); o.fill();
        o.fillStyle = '#d8d2c2'; o.beginPath(); o.arc(cx, cy, 20, 0, Math.PI * 2); o.fill();
        o.strokeStyle = '#8c8574'; o.lineWidth = 2; o.beginPath(); o.arc(cx, cy, 20, 0, Math.PI * 2); o.stroke();
        o.fillStyle = '#4a463d'; o.beginPath(); o.arc(cx, cy, 7, 0, Math.PI * 2); o.fill();
        // Nebengebäude mit Flachdach
        o.fillStyle = 'rgba(0,0,0,0.4)'; o.fillRect(cx - 150 + 6, cy + 30 + 6, 120, 58);
        o.fillStyle = '#9b9584'; o.fillRect(cx - 150, cy + 30, 120, 58);
        o.save(); o.translate(cx - 90, cy + 59); o.rotate(-0.04);
        o.fillStyle = '#f4f1e8'; o.font = '700 30px Georgia, serif'; o.textAlign = 'center'; o.textBaseline = 'middle';
        o.fillText('Γ · NULL', 0, 1);
        o.restore();
        o.strokeStyle = 'rgba(200,190,170,0.5)'; o.lineWidth = 2; o.setLineDash([5, 6]);
        o.beginPath(); o.moveTo(cx - 30, cy + 60); o.quadraticCurveTo(cx + 80, cy + 120, cx + 160, cy + 160); o.stroke(); o.setLineDash([]);
      }
      o.restore();
      ctx.imageSmoothingEnabled = !lowRes;
      ctx.drawImage(off, 0, 0, W, H);
      // Körnung und Vignette
      const gi = ctx.getImageData(0, 0, W, H);
      for (let i = 0; i < gi.data.length; i += 4) { const n = (rnd() - 0.5) * 18; gi.data[i] += n; gi.data[i + 1] += n; gi.data[i + 2] += n; }
      ctx.putImageData(gi, 0, 0);
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.7);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      if (kyt && lowRes) return 'Auffällige helle Struktur auf einem Flachdach nördlich des Leuchtturms. Bei 4,0 m/px nicht auflösbar. Empfehlung: Forschungsprogramm „Hochauflösende Optik“.';
      if (kyt) return 'Leuchtturm Kythera, Nordspitze. Auf dem Flachdach des Nebengebäudes eine großflächige Beschriftung in weißer Farbe. Alter der Farbe: geschätzt unter zwei Monaten.';
      if (urban > 0.3) return 'Dichte städtische Bebauung. Keine Auffälligkeiten.';
      if (base < -0.5) return 'Offene See. Keine Auffälligkeiten.';
      return 'Aufnahme ohne Auffälligkeiten. Geländeklassifikation: ' + (cold ? 'Eis und Tundra' : arid ? 'arid' : trop ? 'tropische Vegetation' : 'gemäßigt') + '.';
    },

/* js/mod/forschung.js */
/* KYTHERA · Modul Forschung */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.forschung = {
    mount(el) {
      this.el = el;
      el.innerHTML = KY.ui.head({ crumb: 'Steuerung', code: 'FO-07', title: 'Forschung', sub: 'Forschungsprogramme erweitern, was Sitz IX tun kann. Ein Programm läuft aktiv, bis zu drei weitere warten in der Reihe.' }) +
        '<div class="g g4" id="foKpi"></div><div id="foTree" class="mt12"></div>';
      U.on(el, 'click', '[data-rs]', (e, b) => {
        const r = KY.research.start(b.dataset.rs);
        if (!r.ok) { KY.ui.flashMsg(r.err, 'crit'); return; }
        KY.ui.flashMsg('Forschung beauftragt: ' + KY.research.get(b.dataset.rs).n, 'ok');
        this.render();
      });
      this.sub = KY.bus.on('research', () => { this.dirty = true; });
      this.render();
    },
    unmount() { this.sub(); },
    tick() { this.rKpi(); if (this.dirty) { this.dirty = false; this.rTree(); } else this.rActive(); },
    render() { this.rKpi(); this.rTree(); },
    rKpi() {
      const S = KY.S, RS = KY.research;
      const a = S.research.active, r = a ? RS.get(a.id) : null;
      const rate = RS.rate();
      const done = Object.keys(S.research.done).length;
      const vis = KY.data.research.filter(x => RS.visible(x)).length;
      U.setHTML(this.el.querySelector('#foKpi'),
        '<div class="kpi span2" style="grid-column:span 2"><span class="lbl">Aktives Programm</span><span class="v" style="font-size:19px">' + (r ? U.esc(r.n) : '<span class="mut">keines</span>') + '</span>' + (r ? C.meter(a.pts / r.pts * 100, 100, 'prog stripes') + '<span class="dl mut">' + U.n(a.pts, 0) + ' / ' + r.pts + ' Punkte · noch ' + U.dur((r.pts - a.pts) / rate) + '</span>' : '<span class="dl mut">Wählen Sie unten ein Programm.</span>') + '</div>' +
        '<div class="kpi" data-tip="<b>Forschungsrate</b>Grundrate 0,55 Punkte/s, +6 % je Forschungsstation (' + S.research.stations + '), Boni durch Plenarbeschlüsse."><span class="lbl">Rate</span><span class="v">' + U.n(rate, 2) + '<small>Pkt/s</small></span><span class="dl mut">' + S.research.stations + ' Stationen</span></div>' +
        '<div class="kpi"><span class="lbl">Abgeschlossen</span><span class="v">' + done + '<small>/ ' + vis + '</small></span><span class="dl mut">Warteschlange: ' + S.research.queue.length + '</span></div>');
    },
    rActive() {
      const S = KY.S, a = S.research.active;
      if (!a) return;
      const n = this.el.querySelector('[data-node="' + a.id + '"] .meter > i');
      if (n) n.style.width = (a.pts / KY.research.get(a.id).pts * 100).toFixed(1) + '%';
    },
    rTree() {
      const S = KY.S, D = KY.data, RS = KY.research;
      let h = '';
      for (const b in D.branches) {
        const br = D.branches[b];
        if (br.hidden && !KY.flag('mechBranch')) {
          h += '<section class="pn mt12" style="border-style:dashed"><div class="pn-h"><h3>██████████</h3><div class="tools"><span class="meta">Zweig nicht freigegeben</span></div></div><div class="pn-b"><p class="small mut">Die Existenz dieses Forschungszweigs ist für Ihre aktuelle Kenntnislage nicht bestätigt.</p></div></section>';
          continue;
        }
        const nodes = D.research.filter(r => r.b === b);
        h += '<section class="pn mt12' + (br.hidden ? ' tick' : '') + '"><div class="pn-h"><h3>' + br.name + '</h3><div class="tools"><span class="meta">' + br.text + '</span></div></div><div class="pn-b"><div class="rtree">' + nodes.map(r => {
          const done = S.research.done[r.id], act = S.research.active && S.research.active.id === r.id, q = S.research.queue.indexOf(r.id) >= 0;
          const why = RS.canStart(r.id);
          const locked = why && !done && !act && !q;
          const fx = r.id === 'M3' && !KY.flag('nullstellung') ? '<span class="redact">' + '█'.repeat(38) + '</span>' : U.esc(r.fx);
          return '<div class="rnode' + (done ? ' done' : act ? ' act' : locked ? ' lock' : '') + '" data-node="' + r.id + '"><div class="row"><span class="id">' + r.id + '</span><span class="sp"></span>' + (done ? C.pill('abgeschlossen', 'ok') : act ? C.pill('läuft', 'acc', true) : q ? C.pill('vorgemerkt', 'info') : '') + '</div>' +
            '<div class="n">' + U.esc(r.n) + '</div><div class="fx">' + fx + '</div>' +
            (act ? C.meter(S.research.active.pts / r.pts * 100, 100, 'prog stripes') : '') +
            '<div class="row mt4"><span class="mono xs mut">' + r.pts + ' Pkt · ' + U.money(r.cost, 1) + '</span><span class="sp"></span>' + (done || act || q ? '' : '<button class="btn sm' + (why ? '' : ' pri') + '" data-rs="' + r.id + '"' + (why ? ' disabled data-tip="' + U.esc(why) + '"' : '') + '>' + (S.research.active ? 'Vormerken' : 'Starten') + '</button>') + '</div></div>';
        }).join('') + '</div></div></section>';
      }
      U.setHTML(this.el.querySelector('#foTree'), h);
    },
  };
})();

        '<div>' + C.seats(t.votes, { center: t.JA + ':' + t.NEIN, sub: 'PROGNOSE JA : NEIN' }) + '<p class="xs mut c">Prognose von PYTHIA auf Grundlage der bekannten Haltungen. Sitz VIII stimmt per Proxy.</p></div></div>' +

    propose() {
      const S = KY.S, D = KY.data, K = KY.council;

      const tpls = D.resolutions;

        '<div class="fld mt12" id="prPW"><label for="prP">Parameter</label><select class="inp" id="prP"></select></div><p class="small fg2 mt12" id="prText"></p><div id="prPred" class="mt12"></div>';
      const upd = () => {
        const t = tpls.find(x => x.id === body.querySelector('#prT').value);
        const pw = body.querySelector('#prPW'), ps = body.querySelector('#prP');
        pw.style.display = t.param ? '' : 'none';
        if (t.param && ps.dataset.kind !== t.param) {
          ps.dataset.kind = t.param;
          ps.innerHTML = t.param === 'region' ? D.regionOrder.map(id => '<option value="' + id + '">' + D.regions[id].name + '</option>').join('') : t.param === 'sector' ? Object.keys(D.sectors).map(k => '<option value="' + k + '">' + D.sectors[k] + '</option>').join('') : D.researchTopics.map(x => '<option>' + x + '</option>').join('');

      U.setHTML(this.el.querySelector('#nwList'), list.map(p => {
        const st = S.people[p.id];

    rDos() {

      };
      const html = '<div class="pn-h"><h3>Dossier ' + p.id + '</h3><div class="tools">' + (st.busy ? C.pill('gebunden: ' + st.busy, 'acc') : C.pill('verfügbar', 'ok')) + '</div></div><div class="pn-b">' +
        '<div class="row" style="align-items:flex-start;gap:14px">' + C.avatar(p.id, 72) + '<div style="min-width:0;flex:1"><div class="serif" style="font-size:25px;line-height:1.1">' + U.esc(p.n) + '</div><div class="fg2 mt4">' + U.esc(p.role) + '</div><div class="xs mut mt4">' + U.esc(p.org) + ' · ' + D.regions[p.r].name + '</div><div class="row wrap mt8" style="gap:4px">' + p.tags.map(t => '<span class="tag acc">' + D.tagNames[t] + '</span>').join('') + '</div></div></div>' +
        '<p class="mt12" style="line-height:1.6">' + U.esc(p.bio) + '</p>' +
        '<div class="mrow mt12" style="grid-template-columns:90px minmax(0,1fr) 40px"><span class="k">Vertrauen</span>' + C.meter(st.trust, 100, C.lvlCls(st.trust)) + '<span class="v">' + U.n(st.trust) + '</span></div>' +
        '<div class="lbl mt16" style="margin-bottom:6px">Bekannte Verbindungen</div><div class="row wrap" style="gap:4px">' + links.map(id => '<button class="chip" data-p="' + id + '">' + U.esc(D.people.find(x => x.id === id).n) + '</button>').join('') + '</div>' +
        (st.lastBrief ? '<div class="lbl mt16">Letztes Briefing</div><div class="mt8" style="border-left:2px solid var(--acc3);padding:6px 12px;background:var(--acc-bg);font-style:italic;line-height:1.6">„' + U.esc(st.lastBrief) + '“</div>' : '') +
        '</div><div class="pn-f">' + btn('pflege', 'Kontakt pflegen', { ein: 3 }, 'cdPflege') + btn('foerder', 'Arbeit fördern', { kap: 1 }, 'cdFoerder') + btn('brief', 'Briefing anfordern', {}, 'cdBrief', st.trust < 40 ? 'Erfordert Vertrauen ab 40' : null) +
        '<span class="sp"></span><button class="btn sm pri" data-pa="plan"' + (st.busy ? ' disabled' : '') + '>Für Vorhaben einplanen</button></div>';
      U.setHTML(this.el.querySelector('#nwDos'), html);
    },
    act(a) {
      const S = KY.S, D = KY.data, p = D.people.find(x => x.id === this.sel), st = S.people[p.id];

      } else if (a === 'foerder') {

        KY.log('net', 'Förderung ' + p.n + ' · ¤ 1 Mrd. · Vertrauen +8, Kooperation ' + D.regions[p.r].name + ' +2');
        KY.ui.flashMsg('Förderung zugesagt · Vertrauen +8', 'ok');
      } else if (a === 'brief') {
        if (st.trust < 40) return;

        if (STORY[p.id]) txt = STORY[p.id](S);
        else {
          const R = S.regions[p.r];
          const weak = Object.keys(R.m).filter(k => k !== 'span' && k !== 'praes').sort((x, y) => R.m[x] - R.m[y])[0];

          KY.addBuff({ kind: 'proj', type: Object.keys(D.projectTypes).filter(t => D.projectTypes[t].tags.some(x => p.tags.indexOf(x) >= 0)), succ: 8, region: p.r, ttl: 300, label: 'Kontakte ' + p.n });
        }
        st.lastBrief = txt;
        KY.log('net', 'Briefing ' + p.n);
        if (KY.audio) KY.audio.play('note');
      } else if (a === 'plan') {
        const T = Object.keys(D.projectTypes).find(t => D.projectTypes[t].tags[0] === p.tags[0] && KY.proj.available(t)) || 'INF';
        KY.ui.go('vorhaben', { plan: { type: T, rid: p.r, partners: [p.id] } });

    /* Kräftebasierter Beziehungsgraph */
    graph() {
      const S = KY.S, D = KY.data;
      const wrap = this.el.querySelector('#nwGraph'), cv = wrap.querySelector('canvas'), ctx = cv.getContext('2d');
      const nodes = D.people.map((p, i) => ({ id: p.id, p, x: Math.cos(i / D.people.length * Math.PI * 2) * 160, y: Math.sin(i / D.people.length * Math.PI * 2) * 120, vx: 0, vy: 0 }));
      const byId = {}; nodes.forEach(n => { byId[n.id] = n; });
      const edges = D.links.map(([a, b]) => [byId[a], byId[b]]);
      let hover = null, W = 0, H = 0, dpr = 1;
      const size = () => { const r = wrap.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; };
      size();
      const ro = new ResizeObserver(size); ro.observe(wrap);
      this.alive = true;
      let iter = 0;
      const step = () => {
        for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01;
          const f = 2600 / d2;
          const d = Math.sqrt(d2);
          a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
        }
        edges.forEach(([a, b]) => { const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, f = (d - 70) * 0.02; a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; });
        nodes.forEach(n => { n.vx -= n.x * 0.004; n.vy -= n.y * 0.006; n.vx *= 0.82; n.vy *= 0.82; n.x += n.vx; n.y += n.vy; n.x = U.clamp(n.x, -W / 2 + 30, W / 2 - 30); n.y = U.clamp(n.y, -H / 2 + 24, H / 2 - 24); });
      };
      for (let i = 0; i < 200; i++) step();
      const draw = () => {
        if (!this.alive || !wrap.isConnected) { ro.disconnect(); return; }
        if (iter++ < 600) step();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.save(); ctx.translate(W / 2, H / 2);
        const now = performance.now();
        edges.forEach(([a, b]) => {
          const on = this.sel === a.id || this.sel === b.id || hover === a || hover === b;
          ctx.strokeStyle = on ? 'rgba(201,165,92,0.7)' : 'rgba(120,130,140,0.18)';
          ctx.lineWidth = on ? 1.4 : 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        });
        nodes.forEach(n => {
          const st = S.people[n.id];
          const r = 4 + st.trust / 14;
          const sel = n.id === this.sel;
          const col = st.trust >= 60 ? '#2fb344' : st.trust >= 45 ? '#c9a55c' : st.trust >= 30 ? '#ec835a' : '#e04848';
          if (sel) { ctx.strokeStyle = 'rgba(236,208,150,' + (0.4 + Math.sin(now / 300) * 0.3) + ')'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(n.x, n.y, r + 6, 0, Math.PI * 2); ctx.stroke(); }
          ctx.fillStyle = col; ctx.globalAlpha = st.busy ? 0.55 : 0.95;
          ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1; ctx.strokeStyle = '#0c0f12'; ctx.lineWidth = 2; ctx.stroke();
          if (sel || hover === n || n.p.story && KY.S.user.clr >= 4) {
            ctx.font = '11px "IBM Plex Sans", sans-serif'; ctx.fillStyle = sel ? '#ecd096' : 'rgba(226,221,209,0.85)';
            ctx.fillText(n.p.n, n.x + r + 5, n.y + 4);
          }
        });
        ctx.restore();
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
      const pick = e => {
        const r = cv.getBoundingClientRect();
        const x = e.clientX - r.left - W / 2, y = e.clientY - r.top - H / 2;
        let best = null, bd = 400;
        nodes.forEach(n => { const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd) { bd = d; best = n; } });
        return best;
      };
      cv.addEventListener('mousemove', e => { hover = pick(e); cv.style.cursor = hover ? 'pointer' : 'default'; });
      cv.addEventListener('mouseleave', () => { hover = null; });
      cv.addEventListener('click', e => { const n = pick(e); if (n) this.select(n.id); });
    },
  };
})();
