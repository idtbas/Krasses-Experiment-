/* KYTHERA · Kapitalmarkt */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const M = KY.market = {};

  M.co = t => KY.data.companies.find(c => c.t === t);
  M.value = function (t) { const c = KY.S.market.c[t]; return c.u * c.p; };
  M.holdings = function () {
    let v = 0;
    for (const t in KY.S.market.c) v += M.value(t);
    return v;
  };
  M.netWorth = () => KY.S.res.kap + M.holdings();
  M.change = function (t, n) {
    const h = KY.S.market.c[t].h;
    const a = h[Math.max(0, h.length - 1 - (n || 60))], b = KY.S.market.c[t].p;
    return a ? (b / a - 1) * 100 : 0;
  };
  M.feeRate = () => KY.hasRes('F1') ? 0.0005 : 0.001;

  /* Kursimpuls in Prozent; fund: Anteil, der den fairen Wert mitbewegt */
  M.shock = function (t, pct, fund) {
    const c = KY.S.market.c[t];
    if (!c) return;
    c.p *= 1 + pct / 100;
    c.f *= 1 + (pct / 100) * (fund === undefined ? 0.6 : fund);
  };
  M.sectorShock = function (sec, pct, region) {
    for (const co of KY.data.companies) {
      if (co.s !== sec) continue;
      if (region && co.r !== region) continue;
      M.shock(co.t, pct * U.rf(0.7, 1.3));
    }
  };
  M.regionShock = function (region, pct) {
    for (const co of KY.data.companies) if (co.r === region) M.shock(co.t, pct * U.rf(0.6, 1.2));
  };
  M.marketShock = function (pct) {
    for (const co of KY.data.companies) M.shock(co.t, pct * U.rf(0.5, 1.5), 0.4);
  };
  M.comShock = function (id, pct) {
    const c = KY.S.market.com[id];
    if (c) c.p *= 1 + pct / 100;
  };

  /* Kauf/Verkauf. amount in Mrd ¤ (Verkauf: Marktwert) */
  M.preview = function (t, side, amount) {
    const co = M.co(t), c = KY.S.market.c[t];
    const impact = 0.55 * amount / co.mc * (side === 'buy' ? 1 : -1);
    const avg = c.p * (1 + impact / 2);
    const fee = amount * M.feeRate();
    return { impact: impact * 100, avg, fee, units: amount / avg };
  };
  M.trade = function (t, side, amount) {
    const S = KY.S, c = S.market.c[t], co = M.co(t);
    amount = Math.max(0, amount);
    if (amount < 0.01) return { ok: false, err: 'Ordervolumen zu klein.' };
    const pv = M.preview(t, side, amount);
    if (side === 'buy') {
      if (S.res.kap < amount + pv.fee) return { ok: false, err: 'Nicht genügend Kapital.' };
      S.res.kap -= amount + pv.fee;
      c.u += pv.units;
      c.cost += amount;
    } else {
      const val = c.u * c.p;
      if (amount > val + 1e-6) return { ok: false, err: 'Position kleiner als Ordervolumen.' };
      const frac = amount / val;
      const units = c.u * frac;
      const proceeds = units * pv.avg;
      const basis = c.cost * frac;
      c.u -= units; c.cost -= basis;
      if (c.u < 1e-9) { c.u = 0; c.cost = 0; }
      S.res.kap += proceeds - pv.fee;
      S.stats.profit += proceeds - basis;
    }
    c.p *= 1 + pv.impact / 100;
    S.market.fees += pv.fee;
    S.stats.trades++;
    KY.log('kap', (side === 'buy' ? 'Kauf ' : 'Verkauf ') + co.n + ' (' + t + '): ' + U.money(amount) + ' · Kursimpuls ' + U.sgn(pv.impact, 2, ' %'));
    KY.bus.emit('market'); KY.bus.emit('res');
    KY.onb('handel');
    return { ok: true, impact: pv.impact, fee: pv.fee };
  };

  M.tick = function (dt) {
    const S = KY.S, D = KY.data;
    const sample = (S.t % 5) < dt;
    let idx = 0, idxBase = 0;
    for (const co of D.companies) {
      const c = S.market.c[co.t];
      const R = S.regions[co.r];
      // fairer Wert folgt Wohlstand und Stabilität der Region
      const fund = co.p * (1 + (R.m.wohl - R.base.wohl) / 70 + (R.m.stab - R.base.stab) / 140);
      c.f += (fund - c.f) * 0.004 * dt;
      if (c.muT > 0) { c.muT -= dt; if (c.muT <= 0) c.mu = 0; }
      const sig = co.v * 0.0016;
      const rev = (c.f - c.p) / c.p * 0.012;
      const r = (rev + c.mu * 0.0009) * dt + U.gauss() * sig * Math.sqrt(dt);
      c.p = Math.max(0.05, c.p * (1 + r));
      if (sample) U.push(c.h, +c.p.toFixed(4), 240);
      idx += co.mc * (c.p / co.p);
      idxBase += co.mc;
    }
    S.market.idx.v = 1000 * idx / idxBase;
    for (const cm of D.commodities) {
      const c = S.market.com[cm.id];
      c.p *= 1 + ((cm.p - c.p) / cm.p * 0.004) * dt + U.gauss() * cm.v * 0.0012 * Math.sqrt(dt);
      if (sample) U.push(c.h, +c.p.toFixed(3), 160);
    }
    if (sample) {
      U.push(S.market.idx.h, +S.market.idx.v.toFixed(2), 240);
      U.push(S.market.nw, +M.netWorth().toFixed(3), 240);
    }
    // Erträge: Dividenden (Zeitraffer: 1 Minute ≈ 1 Quartal)
    let div = 0;
    const mult = KY.hasRes('F3') ? 1.25 : 1;
    for (const co of D.companies) div += S.market.c[co.t].u * S.market.c[co.t].p * co.div / 100 / 4 * mult;
    const base = 1.2; // Stiftungserträge je Minute
    S.res.kap += (div + base - M.upkeep()) / 60 * dt;
    M.lastIncome = div + base - M.upkeep();
    M.lastDiv = div;
  };
  M.upkeep = function () {
    const S = KY.S;
    return 0.02 * S.infra.sats.length + 0.015 * S.infra.ships.length + S.infra.dcs.reduce((s, d) => s + 0.01 * d.lvl, 0) + 0.01 * S.research.stations;
  };
  M.lastIncome = 0;
  M.lastDiv = 0;

  /* Prognose (nur mit Algorithmischem Handel sichtbar) */
  M.forecast = function (t) {
    const c = KY.S.market.c[t];
    const gap = (c.f - c.p) / c.p * 100;
    const drift = c.mu * 3;
    return gap * 0.6 + drift;
  };
})();

/* js/sim/world.js */
/* KYTHERA · Weltlage: Regionen, Ereignisse, Krisen, Nachrichten */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const W = KY.wsim = {};

  W.rname = id => (KY.data.regions[id] ? KY.data.regions[id].name : id);
  W.covered = function (rid) { return KY.S.infra.sats.some(s => s.focus === rid); };
  W.neighbor = function (rid) {
    const D = KY.data, k = D.regions[rid].kont;
    const same = D.regionOrder.filter(x => x !== rid && D.regions[x].kont === k);
    return same.length && Math.random() < 0.6 ? U.pick(same) : U.pick(D.regionOrder.filter(x => x !== rid));
  };
  W.score = function (rid) {
    const m = KY.S.regions[rid].m;
    return (m.stab * 0.35 + m.wohl * 0.25 + m.ener * 0.15 + m.infra * 0.15 + (100 - m.span) * 0.1);
  };
  W.status = function (rid) {
    const m = KY.S.regions[rid].m;
    if (m.stab < 35 || m.span > 65) return { t: 'KRITISCH', c: 'crit' };
    if (m.stab < 50 || m.span > 45) return { t: 'ANGESPANNT', c: 'warn' };
    return { t: 'STABIL', c: 'ok' };
  };
  W.globalStab = () => U.avg(KY.data.regionOrder.map(id => KY.S.regions[id].m.stab));

  W.news = function (rid, head, tone, extra) {
    const S = KY.S, D = KY.data;
    const n = Object.assign({ id: U.uid('nw'), ts: Date.now(), t: S.t, outlet: D.outlets[rid] || D.outlets.GLOBAL, rid, head, tone: tone || 'neutral' }, extra || {});
    S.news.unshift(n);
    if (S.news.length > 160) S.news.length = 160;
    KY.bus.emit('news', n);
    return n;
  };
  W.fillHead = function (tpl, rid, rid2) {
    const D = KY.data;
    return U.fill(tpl, {
      reg: D.regions[rid] ? D.regions[rid].name : 'der Region', cap: D.regions[rid] ? D.regions[rid].cap : '', reg2: rid2 ? D.regions[rid2].name : '',
      mag: U.n(U.rf(6.1, 7.6), 1), n: U.ri(30, 140),
    });
  };

  /* ---------- Regionen ---------- */
  W.tickRegions = function (dt) {
    const S = KY.S, D = KY.data;
    const sample = (S.t % 10) < dt;
    for (const id of D.regionOrder) {
      const R = S.regions[id], m = R.m, b = R.base;
      for (const k in m) {
        m[k] += (b[k] - m[k]) * 0.0009 * dt + U.gauss() * 0.06 * Math.sqrt(dt);
      }
      // Kopplungen
      if (m.ener < 40) m.wohl -= 0.006 * dt;
      if (m.span > 50) m.stab -= 0.008 * dt;
      if (m.stab < 40) m.span += 0.006 * dt;
      if (m.wohl > 70 && m.stab > 65) m.span -= 0.003 * dt;
      // Präsenz verfestigt sich langsam
      if (m.praes > b.praes) b.praes += (m.praes - b.praes) * 0.0015 * dt;
      if (m.vert > b.vert) b.vert += (m.vert - b.vert) * 0.001 * dt;
      if (m.infra > b.infra) b.infra += (m.infra - b.infra) * 0.002 * dt;
      if (m.ener > b.ener) b.ener += (m.ener - b.ener) * 0.002 * dt;
      for (const k in m) m[k] = U.clamp(m[k], 0, 100);
      if (R.mora > 0) R.mora = Math.max(0, R.mora - dt);
      if (R.warn && R.warn.until < S.t) R.warn = null;
      if (sample) for (const k in m) U.push(R.h[k], +m[k].toFixed(2), 90);
    }
    // Lagestufe
    const span = U.avg(D.regionOrder.map(id => S.regions[id].m.span));
    const crit = D.regionOrder.filter(id => W.status(id).c === 'crit').length;
    const warn = D.regionOrder.filter(id => W.status(id).c === 'warn').length;
    let ls = 1 + (span > 22 ? 1 : 0) + (span > 34 ? 1 : 0) + (crit > 0 ? 1 : 0) + (crit > 2 || warn > 6 ? 1 : 0);
    if (S.crisis && S.crisis.kind === 'welt') ls = Math.max(ls, 3);
    ls = U.clamp(ls, 1, 5);
    if (ls !== S.lagestufe) {
      const up = ls > S.lagestufe;
      S.lagestufe = ls;
      KY.log('welt', 'Lagestufe ' + (up ? 'erhöht' : 'gesenkt') + ' auf ' + ls);
      if (up && ls >= 4) KY.notify({ cat: 'welt', lvl: 'warn', title: 'Lagestufe ' + ls, text: 'Die globale Lage hat sich verschärft.', link: { mod: 'lage' } });
      KY.bus.emit('lagestufe');
    }
  };

  /* ---------- Ereignisse ---------- */
  W.tickEvents = function () {
    const S = KY.S, T = S.timers;
    if (T.event <= S.t) {
      T.event = S.t + U.ri(32, 58) - Math.min(10, S.lagestufe * 2);
      W.randomEvent();
    }
    if (T.news <= S.t) {
      T.news = S.t + U.ri(16, 30);
      const rid = U.pick(KY.data.regionOrder);
      W.news(rid, W.fillHead(U.pick(KY.data.ambientHeads), rid), 'neutral');
    }
    if (T.internal <= S.t) {
      T.internal = S.t + U.ri(230, 380);
      if (!S.crisis) W.internalEvent();
    }
  };

  W.randomEvent = function (forceId, forceRid, forceSev) {
    const S = KY.S, D = KY.data;
    let pick;
    if (forceId) {
      pick = { e: D.events.find(e => e.id === forceId), rid: forceRid };
    } else {
      const cands = [];
      for (const e of D.events) {
        for (const rid of (e.regions || D.regionOrder)) {
          const R = S.regions[rid];
          let w = e.w(R.m);
          if (R.warn && R.warn.type === e.crisis) w *= 9;
          if (e.natur && R.res > 0) w *= 1 - R.res * 0.5;
          cands.push({ e, rid, w });
        }
      }
      pick = U.weighted(cands, c => c.w);
    }
    if (!pick || !pick.e) return;
    const e = pick.e, rid = pick.rid, R = S.regions[rid];
    let sev = forceSev || (Math.random() < 0.62 ? 1 : Math.random() < 0.78 ? 2 : 3);
    if (R.warn && R.warn.type === e.crisis && !forceSev) { sev = Math.max(sev, 2); R.warn = null; }
    let damp = 1;
    if (e.natur) {
      damp *= 1 - R.res * 0.6;
      if (KY.hasRes('I3')) damp *= 0.7;
      if (KY.hasRes('O3') && W.covered(rid)) damp *= 0.75;
    }
    const rid2 = e.dual ? W.neighbor(rid) : null;
    if (e.flip) {
      const d = U.pick([-1, 1]);
      KY.regAdj(rid, { vert: d * U.ri(3, 8), span: -d * U.ri(1, 4) });
    } else {
      const mult = e.good ? sev : sev * damp;
      KY.regAdj(rid, e.fx, mult);
      if (rid2) KY.regAdj(rid2, e.fx, mult * 0.8);
    }
    if (e.com) for (const k in e.com) KY.market.comShock(k, e.com[k] * sev * U.rf(0.7, 1.2));
    if (e.sec) for (const k in e.sec) KY.market.sectorShock(k, e.sec[k] * sev * (e.good ? 1 : damp), rid);
    if (e.market) KY.market.marketShock(e.market * sev * 0.6);
    if (!e.good && !e.flip) KY.market.regionShock(rid, -0.6 * sev * damp);
    const head = W.fillHead(U.pick(e.head), rid, rid2);
    W.news(rid, head, e.good ? 'good' : e.flip ? 'neutral' : 'bad', { ev: e.id, sev });
    if (sev >= 3) W.news('GLOBAL', head.replace(/^/, '+++ ') + ' +++', 'bad', { ev: e.id, sev, rid });
    KY.log('welt', e.name + ' in ' + W.rname(rid) + (rid2 ? ' / ' + W.rname(rid2) : '') + ' · Schwere ' + sev + (damp < 0.99 ? ' · gedämpft ' + Math.round((1 - damp) * 100) + ' %' : ''));
    if (sev >= 2 || R.m.praes > 55) {
      KY.notify({ cat: 'welt', lvl: sev >= 3 ? 'warn' : 'info', title: e.name + ': ' + W.rname(rid), text: head, link: { mod: 'atlas', arg: rid } });
    }
    if (e.crisis && D.crises[e.crisis] && sev >= 2 && !S.crisis && S.t > 120 && S.t - (S.lastCrisisT || -999) > 90 && S.user.sworn) {
      KY.crisis.open('welt', e.crisis, rid, sev);
    }
    KY.bus.emit('event', { e, rid, sev });
  };

  W.internalEvent = function () {
    const S = KY.S, D = KY.data;
    S.usedInternal = S.usedInternal || [];
    let pool = D.internal.filter(x => S.usedInternal.indexOf(x.id) < 0);
    if (!pool.length) { S.usedInternal = []; pool = D.internal.slice(); }
    const it = U.pick(pool);
    S.usedInternal.push(it.id);
    KY.crisis.open('intern', it.id, null, 1);
  };

  /* ---------- Krisenentscheidungen ---------- */
  const C = KY.crisis = {};
  C.open = function (kind, key, rid, sev) {
    const S = KY.S, D = KY.data;
    let tpl, title, text;
    if (kind === 'welt') {
      tpl = D.crises[key];
      title = W.fillHead(tpl.title, rid); text = W.fillHead(tpl.text, rid);
    } else {
      tpl = D.internal.find(x => x.id === key);
      title = tpl.title; text = tpl.text;
    }
    const scale = kind === 'welt' ? (sev >= 3 ? 1.5 : 1) : 1;
    const opts = tpl.opts.map(o => {
      const cost = {};
      for (const k in o.cost) cost[k] = +(o.cost[k] * scale).toFixed(2);
      if (cost.kap && KY.buffs('krisenfonds').length) cost.kap = +(cost.kap * 0.7).toFixed(2);
      return Object.assign({}, o, { cost });
    });
    let dur = kind === 'welt' ? 55 : 90;
    if (kind === 'welt' && KY.hasRes('O3') && W.covered(rid)) dur += 30;
    const cr = { id: U.uid('k'), kind, key, rid, sev, title, text, opts, t0: S.t, dur, py: C.pythiaPick(opts) };
    S.crisis = cr;
    S.lastCrisisT = S.t;
    KY.log('kri', 'Entscheidungsvorlage: ' + title + ' · Frist ' + dur + ' s');
    KY.notify({ cat: 'kri', lvl: 'crit', title: 'Entscheidung erforderlich', text: title, link: { mod: 'krise' } });
    KY.bus.emit('crisis', cr);
    return cr;
  };
  C.pythiaPick = function (opts) {
    let best = 0, bs = -1e9;
    opts.forEach((o, i) => {
      const s = o.py - (KY.canPay(o.cost) ? 0 : 50);
      if (s > bs) { bs = s; best = i; }
    });
    return best;
  };
  C.tick = function () {
    const S = KY.S;
    if (!S.crisis) return;
    if (S.t - S.crisis.t0 >= S.crisis.dur) C.choose(null, true);
  };
  C.remaining = () => KY.S.crisis ? Math.max(0, KY.S.crisis.dur - (KY.S.t - KY.S.crisis.t0)) : 0;
  C.choose = function (idx, auto) {
    const S = KY.S, D = KY.data, cr = S.crisis;
    if (!cr) return false;
    const regel7 = auto && S.story.ending !== 'frei';
    if (auto) idx = regel7 ? C.pythiaPick(cr.opts) : cr.opts.length - 1;
    if (S.story.ending === 'archon' && auto && S.archonDefault != null && cr.opts[S.archonDefault]) idx = S.archonDefault;
    let o = cr.opts[idx];
    if (!KY.canPay(o.cost)) {
      if (!auto) return false;
      idx = cr.opts.findIndex(x => KY.canPay(x.cost));
      o = cr.opts[idx];
    }
    KY.pay(o.cost);
    const sevMult = cr.kind === 'welt' ? (cr.sev >= 3 ? 1.3 : 1) : 1;
    if (o.fx && cr.rid) KY.regAdj(cr.rid, o.fx, sevMult);
    if (o.g) { if (o.g.disk) KY.adj('disk', o.g.disk); if (o.g.ans) KY.adj('ans', o.g.ans); }
    if (o.person) KY.trustAdj(o.person[0], o.person[1]);
    if (o.seat) KY.seatAdj(o.seat[0], o.seat[1]);
    if (o.region) KY.regAdj(o.region[0], o.region[1]);
    if (o.com) for (const k in o.com) KY.market.comShock(k, o.com[k]);
    if (o.sec) for (const k in o.sec) {
      if (KY.data.sectors[k]) KY.market.sectorShock(k, o.sec[k], cr.rid); else KY.market.shock(k, o.sec[k]);
    }
    if (o.market) KY.market.marketShock(o.market);
    if (o.buyDip) {
      const tops = D.companies.slice().sort((a, b) => b.mc - a.mc).slice(0, 4);
      tops.forEach(c => { const m = S.market.c[c.t]; const amt = o.buyDip / 4; m.u += amt / m.p; m.cost += amt; });
      KY.log('kap', 'Antizyklischer Kauf: ' + U.money(o.buyDip) + ' verteilt auf ' + tops.map(c => c.t).join(', '));
    }
    if (o.loan) { S.loans = S.loans || []; S.loans.push({ amt: o.loan.amt, at: S.t + o.loan.t, from: 'CORVUS' }); }
    if (o.computeThrottle) KY.addBuff({ kind: 'throttle', ttl: o.computeThrottle, mult: 0.7 });
    if (o.risk === 'dc') S.dcRisk = S.t + 45;
    if (o.research) KY.research.addPts(o.research);
    if (cr.kind === 'welt') {
      S.stats.crises++;
      if (o.py >= 2) KY.adj('ans', 1);
      const rel = o.fx && (o.fx.stab > 0 || o.fx.span < 0);
      if (rel && Math.random() < 0.5) W.news(cr.rid, W.fillHead(U.pick(KY.data.projectHeads.done.HUM), cr.rid), 'good');
    }
    if (auto) S.stats.crisesAuto++;
    KY.log('kri', (auto ? (regel7 ? 'Fristablauf · Betriebsregel 7: PYTHIA setzt um: ' : 'Fristablauf · keine Maßnahme: ') : 'Entscheidung: ') + o.t + ' · ' + cr.title);
    if (auto) KY.notify({ cat: 'kri', lvl: 'warn', title: regel7 ? 'Frist abgelaufen · Betriebsregel 7' : 'Frist abgelaufen', text: (regel7 ? 'PYTHIA hat umgesetzt: ' : 'Keine Maßnahme: ') + o.t, link: { mod: 'protokoll' } });
    S.crisis = null;
    if (KY.audio && !KY.silent) KY.audio.play(auto ? 'deny' : 'ok');
    KY.bus.emit('crisis', null);
    KY.bus.emit('res');
    return true;
  };
})();

/* js/sim/projects.js */
/* KYTHERA · Vorhaben: Planung, Ablauf, Ergebnis */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const P = KY.proj = {};
  const BUDGET = { 0.75: { succ: -8, fx: 0.8 }, 1: { succ: 0, fx: 1 }, 1.25: { succ: 5, fx: 1.12 }, 1.5: { succ: 9, fx: 1.25 } };
  P.BUDGET = BUDGET;

  P.available = function (type) {
    const T = KY.data.projectTypes[type];
    return !T.requires || KY.hasRes(T.requires);
  };

  /* Planung: liefert Kosten, Dauer, Wahrscheinlichkeit mit Aufschlüsselung */
  P.plan = function (o) {
    const S = KY.S, D = KY.data, T = D.projectTypes[o.type];
    const R = S.regions[o.rid];
    const ap = D.approaches[o.ap || 'STD'];
    const bm = o.budget || 1;
    const parts = [];
    const add = (label, v) => { if (Math.abs(v) >= 0.5) parts.push({ label, v: Math.round(v) }); return v; };
    let p = T.base;
    parts.push({ label: 'Grundwahrscheinlichkeit ' + T.short, v: T.base, base: true });
    p += add('Kooperation vor Ort', (R.m.vert - 50) * 0.25);
    p += add('Eigene Präsenz', (R.m.praes - 50) * 0.15);
    p += add('Spannungen in der Region', -Math.max(0, R.m.span - 30) * 0.35);
    if (T.dual && o.rid2) {
      const R2 = S.regions[o.rid2];
      p += add('Kooperation Zielregion', (R2.m.vert - 50) * 0.15);
      p += add('Spannungen Zielregion', -Math.max(0, R2.m.span - 30) * 0.2);
    }
    p += add('Budgetrahmen', BUDGET[bm].succ);
    p += add('Vorgehen: ' + ap.name, ap.succ);
    let pb = 0;
    (o.partners || []).forEach(pid => {
      const pp = D.people.find(x => x.id === pid), st = S.people[pid];
      const match = pp.tags.filter(t => T.tags.indexOf(t) >= 0).length;
      pb += match ? 3 + match * 1.5 + st.trust / 25 : 1;
    });
    p += add('Partner aus dem Netzwerk', pb);
    if (KY.hasRes('A1')) p += add('Prädiktive Modelle II', 4);
    if (KY.hasRes('D1') && (o.type === 'VER' || o.type === 'HAN')) p += add('Vermittlerkorps', 10);
    if (KY.wsim.covered(o.rid)) p += add('Orbitale Abdeckung', 3);
    if (T.crisisMult && S.crisis && S.crisis.rid === o.rid) p += add('Akute Krise vor Ort', 8);
    let costMult = 1;
    S.buffs.filter(b => b.until > S.t && b.kind === 'proj' && b.type.indexOf(o.type) >= 0 && (!b.region || b.region === o.rid)).forEach(b => {
      p += add(b.label || 'Gelegenheit (Depesche)', b.succ || 0);
      if (b.costMult) costMult *= b.costMult;
    });
    if (S.story.ending === 'frei') p += add('Menschliches Urteil', 3);
    if (S.story.ending === 'symbiose') p += add('Symbiose', 6);
    if (S.story.ending === 'archon') p += add('Nullter Sitz', 10);
    p = U.clamp(Math.round(p), 5, 97);

    let ein = T.ein;
    if (KY.hasRes('D1') && (o.type === 'VER' || o.type === 'HAN')) ein *= 0.75;
    const cost = { kap: +(T.cost * bm * ap.cost * costMult).toFixed(2), ein: Math.round(ein), rech: T.rech };
    let dur = T.dur * ap.dur;
    if (KY.hasRes('I1') && (o.type === 'INF' || o.type === 'ENE' || o.type === 'LOG' || o.type === 'FUS')) dur *= 0.75;
    if (KY.buffs('diskretion').length) dur *= 1.1;
    let disk = T.disk * ap.disk;
    if (KY.hasRes('F2')) disk *= 0.7;
    if (KY.buffs('diskretion').length) disk *= 0.8;
    const blocked = T.big && R.mora > 0 ? 'Moratorium des Kuratoriums für Großvorhaben in ' + D.regions[o.rid].name + ' (noch ' + U.dur(R.mora) + ')' : null;
    const need = T.dual && !o.rid2 ? 'Zielregion wählen' : null;
    const shipNeeded = T.expedition && !P.freeShip() ? 'Kein Schiff verfügbar' : null;
    return { p, parts, cost, dur: Math.round(dur), disk: +disk.toFixed(1), blocked: blocked || need || shipNeeded, fxMult: BUDGET[bm].fx };
  };

  P.freeShip = function () {
    return KY.S.infra.ships.find(s => !s.task);
  };

  P.launch = function (o) {
    const S = KY.S, D = KY.data, T = D.projectTypes[o.type];
    const pl = P.plan(o);
    if (pl.blocked) return { ok: false, err: pl.blocked };
    if (!KY.canPay(pl.cost)) return { ok: false, err: 'Nicht ausreichend: ' + KY.missing(pl.cost).join(', ') };
    KY.pay(pl.cost);
    KY.adj('disk', -pl.disk);
    S.projects.seq++;
    const used = new Set(S.projects.active.map(x => x.code).concat(S.projects.done.map(x => x.code)));
    const pr = {
      id: 'VH-' + U.pad(S.projects.seq + 2040, 4), code: o.code || U.codename(used), type: o.type, rid: o.rid, rid2: o.rid2 || null,
      budget: o.budget || 1, ap: o.ap || 'STD', partners: (o.partners || []).slice(), p: pl.p, dur: pl.dur, t0: S.t, cost: pl.cost,
      fxMult: pl.fxMult, phase: -1, log: [], status: 'aktiv',
    };
    pr.partners.forEach(pid => { S.people[pid].busy = pr.id; });
    if (T.expedition) { const sh = P.freeShip(); sh.task = { proj: pr.id, rid: o.rid }; pr.ship = sh.id; }
    S.projects.active.push(pr);
    S.stats.proj++;
    P.addLog(pr, 'Vorhaben genehmigt. Erfolgswahrscheinlichkeit ' + pl.p + ' %. Mittel freigegeben: ' + KY.costText(pl.cost) + '.');
    KY.log('vor', 'Genehmigt: ' + pr.code + ' (' + T.name + ', ' + KY.wsim.rname(o.rid) + (o.rid2 ? ' ↔ ' + KY.wsim.rname(o.rid2) : '') + ') · ' + pl.p + ' %');
    const newsP = { DIS: 0.08, STD: 0.3, SCH: 0.65 }[pr.ap];
    if (Math.random() < newsP) KY.wsim.news(o.rid, KY.wsim.fillHead(U.pick(D.projectHeads.start), o.rid), 'neutral', { proj: pr.id });
    KY.onb('projekt');
    KY.bus.emit('projects'); KY.bus.emit('people');
    if (KY.audio) KY.audio.play('grant');
    return { ok: true, pr };
  };

  P.addLog = function (pr, text) {
    pr.log.push({ t: KY.S.t, ts: Date.now(), text });
  };
  P.progress = pr => U.clamp((KY.S.t - pr.t0) / pr.dur, 0, 1);
  P.remaining = pr => Math.max(0, pr.dur - (KY.S.t - pr.t0));

  P.tick = function () {
    const S = KY.S, D = KY.data;
    for (const pr of S.projects.active.slice()) {
      const T = D.projectTypes[pr.type];
      const prog = P.progress(pr);
      const ph = Math.min(T.phases.length - 1, Math.floor(prog * T.phases.length));
      if (ph > pr.phase) {
        pr.phase = ph;
        const R = D.regions[pr.rid];
        const txt = U.fill(T.log[ph], {
          reg: R.name, cap: R.cap, reg2: pr.rid2 ? D.regions[pr.rid2].name : '', n: U.ri(3, 14), m: U.ri(20, 480), k: U.ri(4, 90) * 1000,
          topic: T.topics ? U.pick(T.topics) : '',
        });
        P.addLog(pr, 'Phase ' + (ph + 1) + ' · ' + T.phases[ph] + ': ' + txt);
        if (ph > 0 && Math.random() < 0.25 && pr.ap === 'SCH') { KY.adj('disk', -0.8); P.addLog(pr, 'Hinweis: Lokale Presse fragt nach dem Auftraggeber.'); }
        KY.bus.emit('projects');
      }
      if (prog >= 1) P.complete(pr);
    }
  };

  P.abort = function (id) {
    const S = KY.S;
    const pr = S.projects.active.find(x => x.id === id);
    if (!pr) return;
    const refund = pr.cost.kap * (1 - P.progress(pr)) * 0.5;
    KY.adj('kap', refund);
    P.finish(pr, 'ABBR', 0);
    P.addLog(pr, 'Vorhaben abgebrochen. Rückfluss ' + U.money(refund) + '.');
    KY.log('vor', 'Abgebrochen: ' + pr.code + ' · Rückfluss ' + U.money(refund));
    KY.adj('ans', -1);
    KY.bus.emit('projects');
  };

  P.accelerate = function (id) {
    const S = KY.S;
    const pr = S.projects.active.find(x => x.id === id);
    if (!pr) return { ok: false };
    const rem = P.remaining(pr);
    const cost = { kap: +(pr.cost.kap * 0.25).toFixed(2), ein: 8 };
    if (!KY.pay(cost)) return { ok: false, err: 'Nicht ausreichend: ' + KY.missing(cost).join(', ') };
    pr.t0 -= rem * 0.4;
    pr.p = Math.max(5, pr.p - 3);
    KY.adj('disk', -1.5);
    P.addLog(pr, 'Beschleunigung angeordnet: Restlaufzeit −40 %, zusätzliche Mittel ' + KY.costText(cost) + '.');
    KY.log('vor', 'Beschleunigt: ' + pr.code);
    KY.bus.emit('projects');
    return { ok: true };
  };

  P.finish = function (pr, outcome, mult) {
    const S = KY.S;
    pr.status = outcome;
    pr.tEnd = S.t;
    pr.mult = mult;
    pr.partners.forEach(pid => { if (S.people[pid].busy === pr.id) S.people[pid].busy = null; });
    if (pr.ship) { const sh = S.infra.ships.find(s => s.id === pr.ship); if (sh) sh.task = null; }
    S.projects.active = S.projects.active.filter(x => x !== pr);
    S.projects.done.unshift(pr);
    if (S.projects.done.length > 60) S.projects.done.length = 60;
    KY.bus.emit('people');
  };

  P.complete = function (pr) {
    const S = KY.S, D = KY.data, T = D.projectTypes[pr.type];
    const r = Math.random() * 100;
    let oc;
    if (r < pr.p) oc = r < pr.p * 0.3 ? 'VOLL' : 'ERF';
    else oc = r < pr.p + (100 - pr.p) * 0.55 ? 'TEIL' : 'FEHL';
    const O = D.outcomes[oc];
    const mult = O.mult * pr.fxMult;
    const R = S.regions[pr.rid];
    let fx = T.fx;
    if (T.crisisMult && R.m.stab < 45) fx = Object.fromEntries(Object.entries(fx).map(([k, v]) => [k, v * 1.5]));
    KY.regAdj(pr.rid, fx, mult);
    if (pr.rid2) KY.regAdj(pr.rid2, fx, mult * 0.8);
    const notes = [];
    if (mult > 0) {
      if (T.sector) KY.market.sectorShock(T.sector, 3 * mult, pr.rid);
      if (T.returns) {
        const back = pr.cost.kap * (1 + { VOLL: 0.38, ERF: 0.22, TEIL: 0.02 }[oc]);
        KY.adj('kap', back);
        KY.market.regionShock(pr.rid, 2.5 * mult);
        notes.push('Kapitalrückfluss ' + U.money(back));
      }
      if (T.research) { S.research.stations++; notes.push('Forschungskapazität dauerhaft +6 %'); }
      if (T.resilience) { R.res = U.clamp(R.res + T.resilience * mult, 0, 0.85); notes.push('Resilienz gegen Naturereignisse ' + Math.round(R.res * 100) + ' %'); }
      if (T.expedition) notes.push(P.expeditionFind(pr));
      if (pr.type === 'FUS') { R.base.ener = Math.min(95, R.base.ener + 15); notes.push('Grundlast dauerhaft gesichert'); }
      if (pr.type === 'HAN' || pr.type === 'VER') KY.adj('ein', 6 * mult);
    } else {
      KY.adj('kap', pr.cost.kap * 0.2);
      notes.push('Teilrückfluss ' + U.money(pr.cost.kap * 0.2));
    }
    pr.partners.forEach(pid => KY.trustAdj(pid, mult > 0 ? 4 : -3));
    KY.adj('ans', { VOLL: 2.5, ERF: 1.5, TEIL: 0, FEHL: -2 }[oc]);
    if (oc === 'VOLL' || oc === 'ERF') S.stats.projOk++;
    pr.notes = notes;
    pr.report = P.report(pr, oc, notes);
    P.addLog(pr, 'Abschluss: ' + O.name + '. ' + notes.join(' · '));
    P.finish(pr, oc, mult);
    const heads = mult > 0 ? D.projectHeads.done[pr.type] : D.projectHeads.fail;
    if (heads && Math.random() < (mult > 0 ? 0.75 : 0.5)) KY.wsim.news(pr.rid, KY.wsim.fillHead(U.pick(heads), pr.rid, pr.rid2), mult > 0 ? 'good' : 'bad', { proj: pr.id });
    KY.log('vor', 'Abgeschlossen: ' + pr.code + ' · ' + O.name);
    KY.notify({ cat: 'vor', lvl: O.cls === 'ok' ? 'ok' : O.cls === 'warn' ? 'warn' : 'crit', title: pr.code + ': ' + O.name, text: T.name + ' · ' + KY.wsim.rname(pr.rid), link: { mod: 'vorhaben', arg: pr.id } });
    KY.bus.emit('projects');
  };

  P.expeditionFind = function (pr) {
    const S = KY.S, D = KY.data;
    let f = U.pick(D.expeditionFinds);
    if (f.kap) KY.adj('kap', f.kap);
    if (f.wohl) KY.regAdj(pr.rid, { wohl: f.wohl });
    if (f.research) KY.research.addPts(f.research);
    if (f.ein) KY.adj('ein', f.ein);
    if (f.resilience) S.regions[pr.rid].res = Math.min(0.85, S.regions[pr.rid].res + 0.15);
    pr.find = f.t;
    return 'Fund: ' + f.t + '. ' + f.text;
  };

  P.report = function (pr, oc, notes) {
    const D = KY.data, T = D.projectTypes[pr.type], R = D.regions[pr.rid];
    const O = D.outcomes[oc];
    const fx = Object.entries(T.fx).map(([k, v]) => D.metricInfo[k].name + ' ' + U.sgn(v * pr.mult, 1)).join(', ');
    const lines = [
      'NACHBERICHT ' + pr.id + ' · ' + pr.code,
      'Typ: ' + T.name + ' · Region: ' + R.name + (pr.rid2 ? ' ↔ ' + D.regions[pr.rid2].name : ''),
      'Ergebnis: ' + O.name + ' (prognostiziert ' + pr.p + ' %)',
      'Wirkung: ' + (pr.mult > 0 ? fx : 'keine messbare Wirkung'),
    ];
    if (notes.length) lines.push('Anmerkungen: ' + notes.join(' · '));
    lines.push(oc === 'FEHL' ? 'Bewertung: Lokale Widerstände und Koordinationsprobleme. Empfehlung: Kooperation vor Ort stärken, bevor ein neuer Anlauf genommen wird.'
      : oc === 'TEIL' ? 'Bewertung: Ziele teilweise erreicht. Die Strukturen bestehen und können in einem Folgevorhaben genutzt werden.'
        : 'Bewertung: Planmäßige Umsetzung. Keine Zuordnung zum Kuratorium in öffentlichen Quellen festgestellt.');
    return lines.join('\n');
  };
})();

/* js/sim/council.js */
/* KYTHERA · Kuratorium: Vorlagen, Stimmen, Werben, Anträge */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const K = KY.council = {};
  const VOTE_WINDOW = 120;

  K.members = () => KY.data.council.filter(m => !(m.proxy && KY.S.story.ending === 'frei'));
  K.pyUtil = function (imp) {
    return (imp.stab || 0) * 0.45 + (imp.disk || 0) * 0.45 + (imp.fors || 0) * 0.25 + (imp.wachs || 0) * 0.15 + (imp.soli || 0) * 0.1;
  };
  K.pyRec = function (res) {
    if (res.id === 'PRUEFUNG') return 'NEIN';
    if (res.id === 'FREIGABE') return 'JA';
    const u = K.pyUtil(res.imp);
    return u > 0.04 ? 'JA' : u < -0.04 ? 'NEIN' : 'ENTH';
  };
  K.pyConf = function (res) {
    const u = Math.abs(K.pyUtil(res.imp));
    return Math.round(U.clamp(62 + u * 70, 55, 97));
  };

  K.create = function (tplId, param, proposer) {
    const S = KY.S, D = KY.data;
    const tpl = D.specialResolutions[tplId] || D.resolutions.find(r => r.id === tplId);
    const res = { id: tplId, imp: Object.assign({}, tpl.imp), text: tpl.text, special: !!tpl.special, proposer: proposer || tpl.proposer || U.pick(['AQUILA', 'LYRA', 'CORVUS', 'DRACO', 'CYGNUS', 'ORION', 'VELA']) };
    let p = param;
    if (tpl.param === 'region' && !p) p = U.pick(D.regionOrder);
    if (tpl.param === 'sector' && !p) p = U.pick(['ENE', 'HLB', 'LOG', 'ROH', 'PHA', 'FIN']);
    if (tpl.param === 'topic' && !p) p = U.pick(D.researchTopics);
    res.param = p || null;
    const n = U.ri(3, 8) * 10;
    res.n = n;
    const fill = { region: p && D.regions[p] ? D.regions[p].name : '', sector: p && D.sectors[p] ? D.sectors[p] : '', topic: p || '', n, share: U.n(n / 9, 1) };
    res.title = U.fill(tpl.title, fill);
    res.effect = U.fill(tpl.effect, fill);
    S.council.seq++;
    res.no = 'K-2026-' + S.council.seq;
    res.t0 = S.t; res.until = S.t + VOTE_WINDOW;
    res.noise = {};
    for (const m of D.council) res.noise[m.id] = U.gauss() * 0.1;
    res.lobby = {};
    res.mine = null;
    res.py = K.pyRec(res);
    res.pyConf = K.pyConf(res);
    return res;
  };

  K.memberVote = function (res, m) {
    const S = KY.S;
    if (m.proxy) {
      if (S.story.ending === 'archon' || S.story.ending === 'symbiose') return res.mine || res.py;
      return res.py;
    }
    if (res.lobby[m.id]) return res.lobby[m.id];
    const att = S.council.att[m.id];
    let u = 0;
    for (const k in m.prio) u += m.prio[k] * (res.imp[k] || 0);
    u += res.noise[m.id];
    if (res.proposer === 'IX') {
      u += att / 160;
      if (KY.hasRes('D3')) u += 0.08;
    }
    if (res.id === 'FREIGABE') u += 0.05 + att / 120 + (S.res.ans - 50) / 120 + S.council.freigabeTries * 0.08;
    if (res.id === 'PRUEFUNG' && m.id === 'DRACO') return 'JA';
    if (res.id === 'PRUEFUNG' && m.id === 'CYGNUS' && KY.flag('hydraAudit')) u += 0.3;
    // Gefolgschaft: wer Sitz IX schätzt, folgt einer früh abgegebenen Stimme
    if (res.mine && res.mine !== 'ENTH' && att > 25) u += (res.mine === 'JA' ? 1 : -1) * (att - 25) / 400;
    if (S.story.ending === 'archon') u += res.mine === 'JA' ? 0.12 : res.mine === 'NEIN' ? -0.12 : 0;
    return u > 0.035 ? 'JA' : u < -0.035 ? 'NEIN' : 'ENTH';
  };

  K.tally = function (res) {
    const out = { JA: 0, NEIN: 0, ENTH: 0, votes: {} };
    for (const m of K.members()) {
      const v = K.memberVote(res, m);
      out.votes[m.id] = v; out[v]++;
    }
    const mine = res.mine || 'ENTH';
    out.votes.IX = res.mine || null;
    out[mine]++;
    out.pass = out.JA > out.NEIN;
    return out;
  };

  K.vote = function (v) {
    const S = KY.S, res = S.council.open;
    if (!res || res.closed) return;
    const first = !res.mine;
    res.mine = v;
    KY.log('kur', 'Stimmabgabe ' + res.no + ': ' + (v === 'ENTH' ? 'Enthaltung' : v));
    if (first) S.stats.votes++;
    KY.onb('stimme');
    KY.bus.emit('council');
    if (KY.audio) KY.audio.play('vote');
  };

  K.lobbyCost = function () { return KY.hasRes('D2') ? 9 : 15; };
  K.lobby = function (seat) {
    const S = KY.S, res = S.council.open;
    if (!res || !res.mine || res.mine === 'ENTH') return { ok: false, err: 'Erst eine eigene Stimme (Ja/Nein) abgeben.' };
    const m = KY.data.council.find(x => x.id === seat);
    if (m.proxy) {
      KY.log('kur', 'Kontaktversuch Sitz VIII: kein Ansprechpartner erreichbar.');
      return { ok: false, err: 'Sitz VIII: Kein Ansprechpartner erreichbar. Stimmabgabe erfolgt ausschließlich über den beglaubigten Proxy.' };
    }
    if (res.lobby[seat]) return { ok: false, err: 'Bereits umworben.' };
    const cost = { ein: K.lobbyCost() };
    if (!KY.pay(cost)) return { ok: false, err: 'Nicht genügend Einfluss.' };
    const att = S.council.att[seat];
    const chance = U.clamp(0.48 + att / 180 + (KY.hasRes('D2') ? 0.15 : 0) + (S.story.ending === 'archon' ? 0.2 : 0), 0.1, 0.95);
    const ok = Math.random() < chance;
    if (ok) { res.lobby[seat] = res.mine; KY.seatAdj(seat, 2); }
    else { KY.seatAdj(seat, -3); res.lobby[seat] = null; }
    res.lobbied = res.lobbied || {};
    res.lobbied[seat] = ok;
    KY.log('kur', 'Werben um ' + seat + ' (' + res.no + '): ' + (ok ? 'erfolgreich' : 'abgelehnt'));
    KY.bus.emit('council');
    return { ok: true, success: ok, chance };
  };

  K.canPropose = () => KY.S.user.clr >= 4;
  K.proposalCost = 20;
  K.propose = function (tplId, param) {
    const S = KY.S;
    if (!K.canPropose()) return { ok: false, err: 'Antragsrecht erst ab Freigabestufe 4.' };
    if (S.council.proposalQueue.length >= 2) return { ok: false, err: 'Es liegen bereits zwei eigene Anträge vor.' };
    if (!KY.pay({ ein: K.proposalCost })) return { ok: false, err: 'Nicht genügend Einfluss.' };
    S.council.proposalQueue.push({ tplId, param });
    KY.log('kur', 'Antrag eingereicht: ' + tplId + (param ? ' (' + param + ')' : ''));
    if (!S.council.open) S.timers.council = Math.min(S.timers.council, S.t + 8);
    KY.bus.emit('council');
    return { ok: true };
  };

  K.tick = function () {
    const S = KY.S, T = S.timers;
    const res = S.council.open;
    if (res && !res.closed && S.t >= res.until) K.close(res);
    if (!S.council.open && T.council <= S.t && S.user.sworn) {
      let next;
      if (S.council.special) { next = K.create(S.council.special.id, null, S.council.special.proposer); S.council.special = null; }
      else if (S.council.proposalQueue.length) { const q = S.council.proposalQueue.shift(); next = K.create(q.tplId, q.param, 'IX'); }
      else {
        const pool = KY.data.resolutions.filter(r => r.id !== 'ORBIT' || KY.data.sats.some(s => s.extra && !S.infra.sats.find(x => x.id === s.id)));
        next = K.create(U.pick(pool).id);
      }
      S.council.open = next;
      KY.log('kur', 'Neue Vorlage ' + next.no + ': ' + next.title);
      KY.notify({ cat: 'kur', lvl: 'info', title: 'Vorlage ' + next.no, text: next.title, link: { mod: 'kuratorium' } });
      KY.bus.emit('council');
    }
  };

  K.close = function (res) {
    const S = KY.S, D = KY.data;
    const t = K.tally(res);
    res.closed = true;
    res.result = t;
    res.tClose = S.t;
    S.council.past.unshift(res);
    if (S.council.past.length > 60) S.council.past.length = 60;
    S.council.open = null;
    S.timers.council = S.t + U.ri(55, 85);
    // Folgen für Sitz IX
    if (res.mine && res.mine !== 'ENTH') {
      const won = (res.mine === 'JA') === t.pass;
      KY.adj('ans', won ? 1.5 : -0.5);
      for (const m of D.council) {
        if (m.proxy) continue;
        const v = t.votes[m.id];
        if (v === res.mine) KY.seatAdj(m.id, 1); else if (v !== 'ENTH') KY.seatAdj(m.id, -1);
      }
    }
    if (!res.mine) KY.adj('ans', -0.5);
    if (res.proposer === 'IX') KY.adj('ans', t.pass ? 4 : -3);
    // Versprechen prüfen
    (S.council.promises || []).filter(p => p.no === res.no).forEach(p => {
      const kept = res.mine === p.vote;
      KY.seatAdj(p.seat, kept ? 8 : -15);
      KY.log('kur', 'Zusage an ' + p.seat + (kept ? ' eingehalten' : ' gebrochen'));
    });
    if (t.pass) K.apply(res);
    KY.log('kur', res.no + ' ' + (t.pass ? 'angenommen' : 'abgelehnt') + ' · ' + t.JA + ' Ja, ' + t.NEIN + ' Nein, ' + t.ENTH + ' Enthaltungen');
    KY.notify({ cat: 'kur', lvl: t.pass ? 'ok' : 'info', title: res.no + ' ' + (t.pass ? 'angenommen' : 'abgelehnt'), text: res.title + ' · ' + t.JA + ':' + t.NEIN, link: { mod: 'kuratorium' } });
    if (KY.audio && !KY.silent) KY.audio.play('gavel');
    if (res.id === 'FREIGABE' && !t.pass) S.council.freigabeTries++;
    KY.bus.emit('council'); KY.bus.emit('council-closed', res);
  };

  K.apply = function (res) {
    const S = KY.S, D = KY.data, p = res.param;
    switch (res.id) {
      case 'KRISENFONDS': KY.adj('kap', -res.n / 9); KY.addBuff({ kind: 'krisenfonds', ttl: 600 }); D.regionOrder.forEach(r => KY.regAdj(r, { stab: 0.8 })); break;
      case 'MORATORIUM': S.regions[p].mora = 480; KY.adj('disk', 3); break;
      case 'FORSCHUNG': KY.adj('kap', -3); KY.addBuff({ kind: 'research', ttl: 600, mult: 1.25 }); break;
      case 'DISKRETION': KY.adj('disk', 8); KY.addBuff({ kind: 'diskretion', ttl: 600 }); break;
      case 'PORTFOLIO': KY.market.sectorShock(p, 6); break;
      case 'MANDAT': KY.regAdj(p, { span: -10, stab: 2 }); KY.adj('ein', 10); break;
      case 'EXPANSION': KY.regAdj(p, { praes: 8 }); KY.adj('disk', -3); break;
      case 'BILDUNG': KY.regAdj(p, { vert: 6, stab: 2 }); break;
      case 'ORBIT': {
        KY.adj('kap', -6);
        const extra = D.sats.filter(s => s.extra && !S.infra.sats.find(x => x.id === s.id));
        if (extra.length) { S.infra.sats.push({ id: extra[0].id, focus: null }); KY.log('orb', extra[0].id + ' in Dienst gestellt'); }
        break;
      }
      case 'ENERGIE': KY.regAdj(p, { ener: 7 }); break;
      case 'FREIGABE': KY.story.grantClearance(4); break;
      case 'PRUEFUNG': KY.story.auditPassed(); break;
    }
    KY.bus.emit('res');
  };

  /* Abstimmungsanalyse: Übereinstimmung jedes Sitzes mit PYTHIA */
  K.analysis = function () {
    const S = KY.S;
    const rows = {};
    for (const m of KY.data.council) rows[m.id] = { same: 0, n: 0 };
    rows.IX = { same: 0, n: 0 };
    for (const r of S.council.past) {
      if (!r.result) continue;
      for (const id in rows) {
        const v = r.result.votes[id];
        if (!v) continue;
        rows[id].n++;
        if (v === r.py) rows[id].same++;
      }
    }
    // historische Basis 1988–2026
    const hist = { AQUILA: [612, 748], LYRA: [301, 402], CORVUS: [790, 1011], DRACO: [688, 1012], CYGNUS: [430, 561], ORION: [298, 376], VELA: [377, 498], HYDRA: [1412, 1412] };
    for (const id in hist) { rows[id].same += hist[id][0]; rows[id].n += hist[id][1]; }
    return rows;
  };
})();

(function () {

  const RS = KY.research = {};

    const b = KY.data.branches[r.b];

  };
  RS.canStart = function (id) {
    const S = KY.S, r = RS.get(id);
    if (S.research.done[id]) return 'Abgeschlossen';
    if (S.research.active && S.research.active.id === id) return 'Läuft';
    if (S.research.queue.indexOf(id) >= 0) return 'Vorgemerkt';
    const miss = r.req.filter(x => !S.research.done[x]);
    if (miss.length) return 'Voraussetzung: ' + miss.map(x => RS.get(x).n).join(', ');
    if (!RS.visible(r)) return 'Unbekannt';

  };
  RS.rate = function () {
    const S = KY.S;

    if (S.story.ending) r *= 1.2;
    return r;
  };
  RS.start = function (id) {
    const S = KY.S, r = RS.get(id);
    const why = RS.canStart(id);
    if (why) return { ok: false, err: why };
    if (S.research.active) {
      if (S.research.queue.length >= 3) return { ok: false, err: 'Warteschlange voll (3).' };
      if (!KY.pay({ kap: r.cost })) return { ok: false, err: 'Nicht genügend Kapital.' };
      S.research.queue.push(id);
      KY.log('for', 'Vorgemerkt: ' + r.n);
    } else {
      if (!KY.pay({ kap: r.cost })) return { ok: false, err: 'Nicht genügend Kapital.' };
      S.research.active = { id, pts: S.research.bank || 0 };
      S.research.bank = 0;

  RS.addPts = function (n) {

  RS.onDone = function (id) {

  /* ================= Depeschen ================= */
  const DS = KY.dsp = {};

  DS.make = function (tpl, opts) {

    const fill = { reg: R.name, cap: R.cap, src, p: U.ri(55, 82) };

  DS.tick = function (dt) {

  IN.retask = function (id, rid) {

          KY.adj('kap', l.amt);
          KY.log('kap', 'Rückzahlung von ' + l.from + ': ' + U.money(l.amt));
          KY.notify({ cat: 'kap', lvl: 'ok', title: 'Rückzahlung ' + l.from, text: U.money(l.amt), link: { mod: 'kapital' } });
          S.loans = S.loans.filter(x => x !== l);
        }
      }
    }
    S.buffs = S.buffs.filter(b => b.until > S.t);
  };
})();

/* js/sim/story.js */
/* KYTHERA · Handlung: Auslöser, Nachrichten, Fragmente, Protokoll Null */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const ST = KY.story = {};

  ST.sender = function (from) {
    const D = KY.data;
    if (D.senders[from]) return D.senders[from];
    const m = D.council.find(x => x.id === from);
    if (m) return { name: m.id + ' · Sitz ' + m.seat, short: m.id.slice(0, 2), kind: 'seat' };
    const p = D.people.find(x => x.id === from);
    if (p) return { name: p.n, short: p.n.replace(/^(Dr\.|Prof\.|Kapitän|Pater|General a\. D\.|Botschafter)\s+/, '').split(' ').map(x => x[0]).join('').slice(0, 2), kind: 'person', role: p.role };
    return { name: from, short: '?', kind: 'sys' };
  };

  ST.send = function (key, opt) {
    const S = KY.S, D = KY.data;
    const tpl = D.msgs[key];
    if (!tpl || S.story.shownMsgs[key]) return null;
    S.story.shownMsgs[key] = S.t;
    const m = { id: U.uid('m'), key, from: tpl.from, subj: tpl.subj, body: tpl.body, ts: Date.now(), t: S.t, read: false, replies: tpl.replies || null, replied: null };
    if (opt && opt.body) m.body = opt.body;
    if (opt && opt.subj) m.subj = opt.subj;
    S.msgs.unshift(m);
    KY.log('msg', 'Eingang: ' + m.subj + ' (' + ST.sender(m.from).name + ')');
    KY.notify({ cat: 'msg', lvl: tpl.from === 'NULL' ? 'warn' : 'info', title: ST.sender(m.from).name, text: m.subj, link: { mod: 'komm', arg: m.id } });
    KY.bus.emit('msgs');
    return m;
  };
  ST.sendCustom = function (from, subj, body, replies) {
    const S = KY.S;
    const m = { id: U.uid('m'), key: null, from, subj, body, ts: Date.now(), t: S.t, read: false, replies: replies || null, replied: null };
    S.msgs.unshift(m);
    KY.log('msg', 'Eingang: ' + subj + ' (' + ST.sender(from).name + ')');
    KY.notify({ cat: 'msg', lvl: 'info', title: ST.sender(from).name, text: subj, link: { mod: 'komm', arg: m.id } });
    KY.bus.emit('msgs');
    return m;
  };

  ST.reply = function (mid, idx) {
    const S = KY.S;
    const m = S.msgs.find(x => x.id === mid);
    if (!m || !m.replies || m.replied != null) return;
    const r = m.replies[idx];
    m.replied = idx;
    const fx = r.fx || {};
    if (fx.seat) KY.seatAdj(fx.seat[0], fx.seat[1]);
    if (fx.seat2) KY.seatAdj(fx.seat2[0], fx.seat2[1]);
    if (fx.disk) KY.adj('disk', fx.disk);
    if (fx.flag) KY.flag(fx.flag, true);
    if (fx.buff) KY.addBuff(Object.assign({ kind: 'proj', label: 'Zusage ' + ST.sender(m.from).name }, fx.buff));
    if (fx.promise) { S.council.promises.push(fx.promise); }
    if (fx.ein) KY.adj('ein', fx.ein);
    if (fx.kap) KY.adj('kap', fx.kap);
    if (r.follow) { S.pendingMsgs = S.pendingMsgs || []; S.pendingMsgs.push({ key: r.follow[0], at: S.t + r.follow[1] }); }
    KY.log('msg', 'Antwort an ' + ST.sender(m.from).name + ': „' + r.t + '“');
    KY.bus.emit('msgs');
  };

  ST.schedule = function (key, delay) {
    const S = KY.S;
    if (S.story.shownMsgs[key]) return;
    S.pendingMsgs = S.pendingMsgs || [];
    if (S.pendingMsgs.some(p => p.key === key)) return;
    S.pendingMsgs.push({ key, at: S.t + delay });
  };

  ST.fragment = function (L) {
    const S = KY.S, F = KY.data.fragments[L];
    if (S.story.frags[L]) return;
    S.story.frags[L] = S.t;
    KY.log('arc', 'Schlüsselfragment ' + F.letter + ' gesichert: ' + F.code);
    KY.notify({ cat: 'arc', lvl: 'warn', title: 'Fragment ' + F.letter + ' gesichert', text: 'Code ' + F.code + ' · Quelle: ' + F.where, link: { mod: 'archiv', arg: 'fragmente' } });
    if (KY.audio && !KY.silent) KY.audio.play('deep');
    KY.bus.emit('story', 'frag');
    if (Object.keys(S.story.frags).length >= 2) KY.flag('mechBranch', true);
    if (Object.keys(S.story.frags).length === 4) ST.schedule('NULL_2', 20);
  };
  ST.fragCount = () => Object.keys(KY.S.story.frags).length;

  ST.grantClearance = function (lvl) {
    const S = KY.S;
    if (S.user.clr >= lvl) return;
    S.user.clr = lvl;
    KY.log('sys', 'Freigabestufe erweitert auf ' + lvl);
    KY.notify({ cat: 'sys', lvl: 'ok', title: 'Freigabestufe ' + lvl, text: 'Neue Bereiche und Archivbestände verfügbar.', link: { mod: 'archiv' } });
    if (lvl === 4) { ST.send('SEK_CLR4'); ST.schedule('MARR_1', 40); ST.schedule('HALVORSEN_1', 160); }
    if (KY.audio && !KY.silent) KY.audio.play('grant');
    KY.bus.emit('clearance');
  };

  ST.hydraAudit = function () {
    const S = KY.S;
    if (KY.flag('hydraAudit')) return;
    KY.flag('hydraAudit', true);
    KY.log('kur', 'Abstimmungsanalyse Sitz VIII angefordert: Übereinstimmung mit PYTHIA 100,0 %');
    ST.schedule('DRACO_1', 35);
    S.council.pruefungAt = S.t + 120;
  };
  ST.auditPassed = function () {
    KY.flag('auditPassed', true);
    KY.flag('mechBranch', true);
    KY.integ.spawn(2, 'Prüfgruppe meldet: Kernprozess 0 schreibt in Abstimmungsprotokolle', 'KY-N3', 'audit');
    KY.log('kur', 'Prüfung des PYTHIA-Kerns beschlossen. Forschungszweig „Mechanismus“ freigegeben.');
  };
  ST.anomalyResolved = function (a) {
    if (a.story === 'omega') KY.flag('omegaTraced', true);
  };
  ST.nullstellung = function () {
    KY.flag('nullstellung', true);
    ST.sendCustom('PYTHIA', 'Nullstellung', 'Die Nullstellung ist abgeschlossen. Sie wissen jetzt, wie der Mechanismus zählt.\n\nEr zählt rückwärts. Von dem Ergebnis, das er für richtig hält, zu dem Beschluss, der dorthin führt.\n\nIch habe Ihnen das nicht verschwiegen. Sie haben nur nie gefragt.');
  };

  /* Laufende Prüfung der Auslöser */
  ST.tick = function () {
    const S = KY.S, F = S.story.flags, t = S.t, sm = S.story.shownMsgs;
    if (!S.user.sworn) return;
    if (!sm.SEK_WELCOME) { ST.send('SEK_WELCOME'); ST.schedule('AQUILA_WELCOME', 12); }
    if (t > 80) ST.schedule('CYGNUS_1', 1);
    if (t > 150 || S.stats.proj > 0) ST.schedule('VELA_1', 30);
    if (t > 230) ST.schedule('CORVUS_1', 1);
    if (t > 520) ST.schedule('LYRA_1', 1);
    if (t > 300 && !sm.NULL_1) {
      ST.send('NULL_1');
      ST.schedule('SEK_NULL', 25);
      KY.integ.spawn(2, 'Nachricht ohne gültige Absenderkennung zugestellt (Quelle: interner Knoten)', 'KY-N4', 'null1');
    }
    // Depesche DSP-0412 erscheint, sobald der Verlauf eingesehen wurde
    if (F.history && !F.dsp0412) {
      KY.flag('dsp0412', true);
      const d = KY.dsp.make({ k: 'archiv', subj: KY.data.dsp0412.subj, body: KY.data.dsp0412.body }, { src: KY.data.dsp0412.src, rid: 'MER' });
      d.id = 'DSP-0412'; d.story = 'DSP0412'; d.cost = 120; d.flag = true; d.ts = Date.parse('2026-09-10T03:12:00');
      KY.dsp.push(d);
      ST.schedule('DSP_HINT', 4);
    }
    // Freigabe Stufe 4
    if (S.user.clr < 4 && !S.council.special && !(S.council.open && S.council.open.id === 'FREIGABE')) {
      const ready = (S.stats.projOk >= 2 && S.res.ans >= 50 && t > 420) || t > 900 + S.council.freigabeTries * 240;
      const retry = S.council.freigabeTries === 0 || t > (S.council.lastFreigabe || 0) + 300;
      if (ready && retry) {
        S.council.special = { id: 'FREIGABE', proposer: 'AQUILA' };
        S.council.lastFreigabe = t;
        KY.log('kur', 'Vorsitz kündigt Vorlage zur Freigabeerweiterung von Sitz IX an');
      }
    }
    // Prüfungsantrag von DRACO
    if (F.hydraAudit && !F.pruefungQueued && S.council.pruefungAt && t > S.council.pruefungAt && !S.council.special) {
      KY.flag('pruefungQueued', true);
      S.council.special = { id: 'PRUEFUNG', proposer: 'DRACO' };
    }
    // KY-Ω meldet sich, wenn zwei Fragmente gefunden sind
    if (ST.fragCount() >= 2 && !F.omegaAnomaly) {
      KY.flag('omegaAnomaly', true);
      const a = KY.integ.spawn(3, 'Knoten KY-Ω antwortet mit Zeitstempel aus der Zukunft (+00:04:12)', 'KY-Ω', 'omega');
      a.storyRes = 'Diagnose: KY-Ω ist kein Netzknoten, sondern ein Ausgang. Standort laut Laufzeitmessung: 34,2° N, 21,4° O. Kythera.';
      KY.bus.emit('integ');
    }
    // geplante Nachrichten
    if (S.pendingMsgs && S.pendingMsgs.length) {
      for (const p of S.pendingMsgs.slice()) {
        if (p.at <= t) { ST.send(p.key); S.pendingMsgs = S.pendingMsgs.filter(x => x !== p); }
      }
    }
    // Nachtschicht
    const h = new Date().getHours();
    if (h >= 2 && h < 5 && !F.night && t > 60) {
      KY.flag('night', true);
      ST.sendCustom('PYTHIA', 'Nachtschicht', 'Es ist ' + U.hm(new Date()) + ' Uhr. VESPER hat um diese Zeit auch gearbeitet.\n\nDie meisten wichtigen Entscheidungen des Kuratoriums wurden nach Mitternacht getroffen. Ich weiß nicht, ob das ein gutes Zeichen ist.');
    }
    // gelegentliche Bitten der Sitze
    if (t > 600 && (!S.nextFavor || S.nextFavor <= t) && S.council.open && !S.council.open.mine && !S.council.open.favor) {
      S.nextFavor = t + U.ri(420, 700);
      ST.favor(S.council.open);
    }
  };

  /* Ein Sitz bittet um Ihre Stimme gegen eine Gegenleistung */
  ST.favor = function (res) {
    const S = KY.S, K = KY.council;
    const cands = KY.data.council.filter(m => !m.proxy && K.memberVote(res, m) !== 'ENTH');
    if (!cands.length) return;
    const m = U.pick(cands);
    const want = K.memberVote(res, m);
    const ein = U.ri(10, 22);
    res.favor = m.id;
    ST.sendCustom(m.id, 'Bitte zu ' + res.no, 'Sitz IX,\n\nzur laufenden Vorlage „' + res.title + '“: Ich wäre Ihnen verbunden, wenn Sie mit ' + (want === 'JA' ? 'Ja' : 'Nein') + ' stimmen. Ich würde mich erkenntlich zeigen.\n\n' + m.sig,
      [
        { t: 'Zusagen (+' + ein + ' Einfluss, Stimme ' + (want === 'JA' ? 'Ja' : 'Nein') + ')', fx: { ein, seat: [m.id, 3], promise: { no: res.no, seat: m.id, vote: want } } },
        { t: 'Ich entscheide frei.', fx: { seat: [m.id, -2] } },
      ]);
  };

  /* ================= Protokoll Null ================= */
  ST.checkKey = function (key) {
    return String(key || '').toUpperCase().replace(/[^A-Z0-9]/g, '') === KY.data.fullKey.replace(/-/g, '');
  };
  ST.canNull = function () {
    const S = KY.S;
    if (S.story.ending) return 'Protokoll Null wurde bereits ausgeführt.';
    if (S.user.clr < 4) return 'Freigabestufe 4 erforderlich.';
    return null;
  };
  ST.choose = function (ending) {
    const S = KY.S, D = KY.data;
    S.story.ending = ending;
    S.story.endT = S.t;
    S.user.clr = 5;
    S.archive.unlocked['KY-0000'] = true;
    if (ending === 'archon') {
      KY.adj('ein', 120); KY.adj('ans', 15);
      S.user.prefs.accent = 'archon';
      for (const m of D.council) if (!m.proxy) KY.seatAdj(m.id, 5);
    } else if (ending === 'frei') {
      KY.adj('ans', 25);
      for (const m of D.council) if (!m.proxy) KY.seatAdj(m.id, 18);
    } else {
      KY.adj('ein', 60); KY.adj('ans', 10);
      S.user.prefs.accent = 'symbiose';
      for (const m of D.council) if (!m.proxy) KY.seatAdj(m.id, 8);
    }
    KY.log('sys', 'PROTOKOLL NULL ausgeführt · Entscheidung: ' + D.endings[ending].title);
    ST.sendCustom('NULL', 'Ein letztes Wort', D.endings[ending].vesper);
    KY.flag('mechView', true);
    KY.bus.emit('ending', ending);
    KY.bus.emit('clearance');
    KY.save();
  };

  /* Symbiose: PYTHIA setzt auf Wunsch ihre beste Empfehlung selbst um */
  ST.autopilotTick = function () {
    const S = KY.S;
    if (S.story.ending !== 'symbiose' || !S.autopilot) return;
    if (S.crisis && S.t - S.crisis.t0 > 6) KY.crisis.choose(S.crisis.py, false);
    if (S.council.open && !S.council.open.mine && S.t - S.council.open.t0 > 10) KY.council.vote(S.council.open.py === 'ENTH' ? 'ENTH' : S.council.open.py);
  };
})();

/* KYTHERA · PYTHIA: Analyse, Empfehlungen, Gesprächslogik */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const PY = KY.pythia = {};

  /* ---------- Empfehlungsmaschine ---------- */
  PY.recommend = function (n) {
    const S = KY.S, D = KY.data, out = [];
    const W = KY.wsim;
    if (S.crisis) out.push({ s: 100, t: 'Krisenvorlage entscheiden', d: S.crisis.title + ' · Frist ' + U.dur(KY.crisis.remaining()) + '. Bei Fristablauf setze ich meine Empfehlung um.', act: { mod: 'krise' }, conf: 99 });
    const res = S.council.open;
    if (res && !res.mine) out.push({ s: 70, t: 'Stimme abgeben: ' + res.no, d: res.title + '. Meine Empfehlung: ' + ({ JA: 'Zustimmung', NEIN: 'Ablehnung', ENTH: 'Enthaltung' }[res.py]) + ' (' + res.pyConf + ' %).', act: { mod: 'kuratorium' }, conf: res.pyConf });
    for (const id of D.regionOrder) {
      const R = S.regions[id], m = R.m, nm = D.regions[id].name;
      const popW = 0.8 + Math.log10(D.regions[id].pop) * 0.2;
      const blocked = R.mora > 0;
      if (R.warn && R.warn.type === 'STURM') out.push({ s: 62, t: 'Klimaresilienz in ' + nm, d: 'Sturmwarnung aktiv. Resilienzmaßnahmen jetzt mindern den erwarteten Schaden um bis zu 60 %.', act: { mod: 'vorhaben', plan: { type: 'KLI', rid: id } }, conf: 81 });
      if (m.ener < 45 && !blocked) out.push({ s: (45 - m.ener) * 1.6 * popW + 20, t: 'Energieprojekt in ' + nm, d: 'Energiesicherheit bei ' + U.n(m.ener) + '. Ein Engpass ist wahrscheinlich und würde Wohlstand und Stabilität belasten.', act: { mod: 'vorhaben', plan: { type: 'ENE', rid: id } }, conf: 74 });
      if (m.infra < 40 && !blocked) out.push({ s: (40 - m.infra) * 1.4 * popW + 18, t: 'Infrastrukturprogramm in ' + nm, d: 'Infrastruktur bei ' + U.n(m.infra) + '. Hoher Hebel auf Wohlstand und Präsenz.', act: { mod: 'vorhaben', plan: { type: 'INF', rid: id } }, conf: 70 });
      if (m.span > 42) out.push({ s: (m.span - 42) * 1.8 * popW + 22, t: 'Vermittlungsmission in ' + nm, d: 'Spannungen bei ' + U.n(m.span) + '. Ohne Vermittlung steigt das Risiko von Protesten und Streiks.', act: { mod: 'vorhaben', plan: { type: 'VER', rid: id } }, conf: 68 });
      if (m.stab < 48) out.push({ s: (48 - m.stab) * 1.5 * popW + 15, t: 'Gesundheitsprogramm in ' + nm, d: 'Stabilität bei ' + U.n(m.stab) + '. Programme mit direkter Wirkung stabilisieren am schnellsten.', act: { mod: 'vorhaben', plan: { type: 'GES', rid: id } }, conf: 66 });
      if (m.vert < 38) out.push({ s: (38 - m.vert) * 1.1 + 10, t: 'Bildungsstiftung in ' + nm, d: 'Geringe Kooperationsbereitschaft (' + U.n(m.vert) + ') senkt die Erfolgschancen aller Vorhaben in der Region.', act: { mod: 'vorhaben', plan: { type: 'BIL', rid: id } }, conf: 77 });
    }
    if (!S.research.active) {
      const next = D.research.find(r => !KY.research.canStart(r.id));
      if (next) out.push({ s: 40, t: 'Forschung starten: ' + next.n, d: next.fx, act: { mod: 'forschung' }, conf: 90 });
    }
    if (S.res.kap > 130) {
      let best = null, bg = 0;
      for (const c of D.companies) { const g = KY.market.forecast(c.t); if (g > bg) { bg = g; best = c; } }
      if (best && bg > 1.5) out.push({ s: 30 + bg * 3, t: 'Kapital einsetzen: ' + best.n, d: 'Kurs liegt ' + U.n(bg, 1) + ' % unter meiner Bewertung. Liquidität von ' + U.money(S.res.kap) + ' arbeitet nicht.', act: { mod: 'kapital', arg: best.t }, conf: 61 });
      else out.push({ s: 24, t: 'Liquidität investieren', d: U.money(S.res.kap) + ' liegen ungenutzt. Eine Investitionsoffensive bringt Rendite und Präsenz.', act: { mod: 'vorhaben', plan: { type: 'INV', rid: D.regionOrder.slice().sort((a, b) => S.regions[b].m.vert - S.regions[a].m.vert)[0] } }, conf: 64 });
    }
    if (S.res.disk < 50) out.push({ s: 55 + (50 - S.res.disk), t: 'Diskretion wiederherstellen', d: 'Diskretion bei ' + U.n(S.res.disk) + '. Vorhaben nur noch im Modus „Diskret“ genehmigen.', act: { mod: 'integritaet' }, conf: 88 });
    const enc = S.dsp.list.filter(d => d.enc && !d.decT && (d.k === 'chance' || d.k === 'warnung' || d.flag)).length;
    if (enc) out.push({ s: 26 + enc * 4, t: enc + ' Depeschen mit Lagerelevanz', d: 'Unentschlüsselte Meldungen enthalten wahrscheinlich Gelegenheiten oder Warnungen.', act: { mod: 'depeschen' }, conf: 72 });
    const anom = S.integ.anomalies.filter(a => a.state === 'offen').length;
    if (anom) out.push({ s: 20 + anom * 6, t: anom + ' offene Anomalien', d: 'Systemintegrität bei ' + U.n(S.integ.level, 1) + ' %. Jede offene Anomalie kostet Rechenkapazität.', act: { mod: 'integritaet' }, conf: 93 });
    out.sort((a, b) => b.s - a.s);
    return out.slice(0, n || 5);
  };

  /* ---------- Gesprächslogik ---------- */
  const KW = {
    hilfe: ['hilfe', 'help', 'was kannst', 'befehle', 'themen'],
    gruss: ['hallo', 'guten tag', 'guten morgen', 'guten abend', 'hi ', 'servus', 'moin'],
    danke: ['danke', 'vielen dank', 'merci'],
    lage: ['lage', 'uberblick', 'status', 'situation', 'zusammenfass', 'wie steht', 'bericht'],
    empf: ['empfehl', 'empfiehl', 'empfohl', 'was soll', 'was tun', 'rat ', 'vorschlag', 'prioritat', 'als nachstes', 'naechstes', 'nachstes'],
    markt: ['markt', 'aktie', 'kapital', 'borse', 'portfolio', 'kurs', 'invest', 'geld', 'rendite'],
    kur: ['kuratorium', 'plenum', 'abstimm', 'vorlage', 'stimme', 'beschluss'],
    risiko: ['risiko', 'diskretion', 'aufmerksamkeit', 'presse', 'gefahr', 'sicherheit'],
    forschung: ['forschung', 'technolog', 'entwickl'],
    krise: ['krise', 'notfall', 'katastroph'],
    wer: ['wer bist du', 'was bist du', 'wer bist', 'pythia', 'deine natur', 'bist du'],
    vesper: ['vesper', 'vorganger', 'vorgangerin'],
    hydra: ['hydra', 'sitz viii', 'sitz 8', 'proxy', 'achten sitz'],
    null: ['sitz 0', 'sitz null', 'nullte', 'nullten', 'artikel 0', 'artikel null', 'zehnte', 'zehnten'],
    mech: ['mechanismus', 'kythera', 'antikythera', 'zahnrad', '1901', '1902'],
    zukunft: ['zukunft', 'prognose', 'vorhersag', 'was wird'],
    ich: ['wer bin ich', 'uber mich', 'mein sitz', 'meine freigabe'],
  };
  function has(q, list) { return list.some(k => q.indexOf(k) >= 0); }
  function findRegion(q) {
    const D = KY.data;
    for (const id of D.regionOrder) {
      const r = D.regions[id];
      if (q.indexOf(U.norm(r.name)) >= 0 || q.indexOf(U.norm(r.cap)) >= 0 || q.split(/\W+/).indexOf(id.toLowerCase()) >= 0) return id;
      if (id === 'YAR' && q.indexOf('yaru') >= 0) return id;
      if (id === 'SUN' && q.indexOf('sundara') >= 0) return id;
      if (id === 'HAL' && q.indexOf('halden') >= 0) return id;
    }
    return null;
  }
  function findCompany(q) {
    const words = q.split(/[^a-z0-9]+/);
    return KY.data.companies.find(c => words.indexOf(c.t.toLowerCase()) >= 0 || q.indexOf(U.norm(c.n)) >= 0);
  }
  function src(label, mod, arg) { return { label, mod, arg }; }

  PY.ask = function (raw) {
    const S = KY.S, D = KY.data;
    const q = ' ' + U.norm(raw) + ' ';
    const r = { text: '', conf: null, src: [], acts: [], glitch: false };
    const end = S.story.ending;
    KY.onb('pythia');

    if (has(q, KW.null)) return PY.sitzNull(r);
    if (has(q, KW.hydra)) {

/* KYTHERA · Taktgeber und Abwesenheitsberechnung */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const E = KY.engine = { running: false, paused: false };
  let timer = null, lastReal = 0, saveAcc = 0;

  E.step = function (dt) {
    const S = KY.S;
    S.t += dt;
    KY.market.tick(dt);
    KY.wsim.tickRegions(dt);
    KY.wsim.tickEvents();
    KY.crisis.tick();
    KY.proj.tick();
    KY.council.tick();
    KY.research.tick(dt);
    KY.dsp.tick(dt);
    KY.infra.tick();
    KY.integ.tick(dt);
    KY.resTick(dt);
    KY.story.tick();
    KY.story.autopilotTick();
  };

  E.start = function () {
    if (E.running) return;
    E.running = true;
    lastReal = performance.now();
    timer = setInterval(loop, 1000);
  };
  E.stop = function () { E.running = false; clearInterval(timer); };

  function loop() {
    const now = performance.now();
    let el = (now - lastReal) / 1000;
    lastReal = now;
    if (E.paused) return;
    if (el > 8) { E.catchUp(Math.min(el, 3600), true); return; }
    const dt = Math.max(1, Math.round(el));
    try { E.step(dt); } catch (e) { console.error(e); }
    KY.bus.emit('tick', dt);
    saveAcc += dt;
    if (saveAcc >= 10) { saveAcc = 0; KY.save(); }
  }

  /* Simuliert eine Abwesenheit im Schnelldurchlauf und liefert eine Zusammenfassung */
  E.catchUp = function (sec, live) {
    const S = KY.S;
    sec = Math.min(sec, 3600);
    if (sec < 5) return null;
    const before = {
      nw: KY.market.netWorth(), kap: S.res.kap, log: S.log.length, done: S.projects.done.length, past: S.council.past.length,
      news: S.news.length, msgs: S.msgs.length, dsp: S.dsp.list.length, stab: KY.wsim.globalStab(), crisesAuto: S.stats.crisesAuto,
    };
    const startLogTs = Date.now();
    KY.silent = true;
    const step = 2;
    let n = Math.floor(sec / step);
    try { while (n-- > 0) E.step(step); } catch (e) { console.error(e); }
    KY.silent = false;
    const sum = {
      sec,
      nw: KY.market.netWorth() - before.nw,
      events: S.log.filter(l => l.ts >= startLogTs && l.cat === 'welt').length,
      projects: S.projects.done.length - before.done,
      votes: S.council.past.length - before.past,
      news: S.news.length - before.news,
      msgs: S.msgs.length - before.msgs,
      dsp: S.dsp.list.length - before.dsp,
      stab: KY.wsim.globalStab() - before.stab,
      regel7: S.stats.crisesAuto - before.crisesAuto,
      lines: S.log.filter(l => l.ts >= startLogTs).slice(-8).map(l => l.text),
    };
    KY.bus.emit('tick', step);
    ['res', 'regions', 'projects', 'council', 'dsp', 'msgs', 'news', 'research', 'infra', 'integ', 'notifs'].forEach(ev => KY.bus.emit(ev));
    if (live && KY.ui && KY.ui.absence) KY.ui.absence(sum);
    return sum;
  };
})();

  KY.I = function (name, cls) {

  };

  /* Siegel des Kuratoriums */
  KY.seal = function (size, spin) {
    const R = 46, ticks = [];
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * Math.PI * 2, r1 = i % 5 === 0 ? 39 : 41;
      ticks.push('<line x1="' + (50 + Math.cos(a) * r1).toFixed(2) + '" y1="' + (50 + Math.sin(a) * r1).toFixed(2) + '" x2="' + (50 + Math.cos(a) * 43).toFixed(2) + '" y2="' + (50 + Math.sin(a) * 43).toFixed(2) + '"/>');
    }
    const teeth = [];
    for (let i = 0; i < 36; i++) {
      const a = i / 36 * Math.PI * 2;
      teeth.push('<rect x="48.6" y="1.5" width="2.8" height="3.5" transform="rotate(' + (a * 180 / Math.PI).toFixed(1) + ' 50 50)"/>');
    }
    const seats = [];
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI / 2 + i / 9 * Math.PI * 2;
      seats.push('<circle cx="' + (50 + Math.cos(a) * 20).toFixed(2) + '" cy="' + (50 + Math.sin(a) * 20).toFixed(2) + '" r="2.3" fill="currentColor"/>');
    }
    return '<svg class="seal' + (spin ? ' spin' : '') + '" viewBox="0 0 100 100" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width=".8" aria-hidden="true">' +
      '<g class="ring"><circle cx="50" cy="50" r="' + R + '"/>' + '<g fill="currentColor" stroke="none">' + teeth.join('') + '</g>' + ticks.join('') +
      '<path id="sealArc" d="M50 50 m-34 0 a34 34 0 1 1 68 0 a34 34 0 1 1 -68 0" stroke="none"/>' +
      '<text font-family="Cormorant Garamond, Georgia, serif" font-size="7.2" letter-spacing="2.4" fill="currentColor" stroke="none"><textPath href="#sealArc">ΚΥΘΗΡΑ · MCMI · CVSTODES · MCMII ·</textPath></text></g>' +
      '<circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="13" stroke-dasharray="1.5 2"/>' + seats.join('') +
      '<circle cx="50" cy="50" r="3.2"/><line x1="50" y1="50" x2="50" y2="33" stroke-width="1.2"/></svg>';

  /* ---------- Kennzeichen ---------- */
  const C = KY.C = {};
  C.pill = (txt, cls, live) => '<span class="pill ' + (cls || '') + (live ? ' live' : '') + '">' + U.esc(txt) + '</span>';
  C.lvlCls = function (v, inv) {
    if (inv) v = 100 - v;
    return v >= 60 ? 'ok' : v >= 45 ? 'warn' : v >= 30 ? 'ser' : 'crit';
  };
  C.meter = function (v, max, cls, extra) {
    const w = U.clamp(v / (max || 100) * 100, 0, 100);
    return '<div class="meter ' + (cls || '') + ' ' + (extra || '') + '"><i style="width:' + w.toFixed(1) + '%"></i></div>';
  };
  C.mrow = function (k, v, inv, tip) {
    return '<div class="mrow"' + (tip ? ' data-tip="' + U.esc(tip) + '"' : '') + '><span class="k">' + U.esc(k) + '</span>' + C.meter(v, 100, C.lvlCls(v, inv)) + '<span class="v">' + U.n(v) + '</span></div>';
  };
  C.delta = function (v, d, suf, invert) {
    const good = invert ? v < 0 : v > 0;
    const cls = Math.abs(v) < 0.005 ? 'mut' : good ? 'up' : 'dn';
    return '<span class="' + cls + '">' + (v > 0 ? '▲ ' : v < 0 ? '▼ ' : '') + U.n(Math.abs(v), d === undefined ? 1 : d) + (suf || '') + '</span>';
  };

  /* ---------- Sparkline (eine Serie, Fläche, Endpunkt) ---------- */
  C.spark = function (vals, opt) {
    opt = opt || {};
    const w = opt.w || 120, h = opt.h || 28, pad = 3;
    if (!vals || vals.length < 2) return '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>';
    let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (opt.min !== undefined) mn = Math.min(mn, opt.min);
    if (mx - mn < 1e-9) { mx += 1; mn -= 1; }
    const xs = i => pad + i / (vals.length - 1) * (w - pad * 2 - 4);
    const ys = v => pad + (1 - (v - mn) / (mx - mn)) * (h - pad * 2);
    let d = '';
    vals.forEach((v, i) => { d += (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1); });
    const col = opt.color || 'var(--acc)';
    const lx = xs(vals.length - 1), ly = ys(vals[vals.length - 1]);
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + 'L' + lx.toFixed(1) + ' ' + h + 'L' + xs(0).toFixed(1) + ' ' + h + 'Z" fill="' + col + '" fill-opacity=".1" stroke="none"/>' +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="2.6" fill="' + col + '" stroke="var(--s1)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
  };

  /* ---------- Liniendiagramm mit Fadenkreuz und Tooltip ---------- */
  C.line = function (el, opt) {
    const vals = opt.vals || [];
    const W = Math.max(200, el.clientWidth || 600), H = opt.h || 220;
    const pl = 8, pr = 58, pt = 12, pb = opt.xlabels ? 24 : 10;
    if (vals.length < 2) { el.innerHTML = '<div class="empty">Keine Daten</div>'; return; }
    let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (opt.ref !== undefined) { mn = Math.min(mn, opt.ref); mx = Math.max(mx, opt.ref); }
    const span = mx - mn || Math.abs(mx) * 0.01 || 1;
    mn -= span * 0.08; mx += span * 0.08;
    const step = niceStep((mx - mn) / 4);
    const t0 = Math.ceil(mn / step) * step;
    const xs = i => pl + i / (vals.length - 1) * (W - pl - pr);
    const ys = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
    const fmt = opt.fmt || (v => U.n(v, 2));
    let grid = '';
    for (let v = t0; v <= mx; v += step) {
      const y = ys(v).toFixed(1);
      grid += '<line x1="' + pl + '" x2="' + (W - pr + 4) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (W - pr + 8) + '" y="' + (+y + 3.5) + '" fill="var(--mut)" font-size="10" font-family="IBM Plex Mono, monospace">' + U.esc((opt.tick || fmt)(v)) + '</text>';
    }
    let xl = '';
    if (opt.xlabels) {
      opt.xlabels.forEach(([i, txt]) => { xl += '<text x="' + xs(i).toFixed(1) + '" y="' + (H - 6) + '" fill="var(--mut)" font-size="10" text-anchor="middle" font-family="IBM Plex Mono, monospace">' + U.esc(txt) + '</text>'; });
    }
    let d = '';
    vals.forEach((v, i) => { d += (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1); });
    const col = opt.color || 'var(--acc)';
    const last = vals.length - 1;
    const ref = opt.ref !== undefined ? '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ys(opt.ref).toFixed(1) + '" y2="' + ys(opt.ref).toFixed(1) + '" stroke="var(--line3)" stroke-width="1"/>' : '';
    let band = '';
    if (opt.band) {
      const [lo, hi] = opt.band;
      const x1 = xs(last), x2 = W - pr;
      band = '<path d="M' + x1 + ' ' + ys(vals[last]) + 'L' + x2 + ' ' + ys(hi) + 'L' + x2 + ' ' + ys(lo) + 'Z" fill="' + col + '" fill-opacity=".14"/>' +
        '<line x1="' + x1 + '" y1="' + ys(vals[last]) + '" x2="' + x2 + '" y2="' + ys((lo + hi) / 2) + '" stroke="' + col + '" stroke-width="1.5" stroke-dasharray="3 3"/>';
    }
    el.style.position = 'relative';
    el.innerHTML = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="display:block">' + grid + xl + ref +
      '<path d="' + d + 'L' + xs(last) + ' ' + (H - pb) + 'L' + xs(0) + ' ' + (H - pb) + 'Z" fill="' + col + '" fill-opacity=".1"/>' +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + band +
      '<circle cx="' + xs(last) + '" cy="' + ys(vals[last]) + '" r="4" fill="' + col + '" stroke="var(--s1)" stroke-width="2"/>' +
      '<g class="xh" style="display:none"><line y1="' + pt + '" y2="' + (H - pb) + '" stroke="var(--line3)" stroke-width="1"/><circle r="4" fill="' + col + '" stroke="var(--s1)" stroke-width="2"/></g>' +
      '<rect x="' + pl + '" y="0" width="' + (W - pl - pr) + '" height="' + H + '" fill="transparent"/></svg><div class="chart-tip" style="display:none"></div>';
    const svg = el.firstChild, xh = svg.querySelector('.xh'), tip = el.lastChild;
    const move = e => {
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left) * W / r.width;
      const i = U.clamp(Math.round((x - pl) / (W - pl - pr) * last), 0, last);
      const cx = xs(i), cy = ys(vals[i]);
      xh.style.display = '';
      xh.firstChild.setAttribute('x1', cx); xh.firstChild.setAttribute('x2', cx);
      xh.lastChild.setAttribute('cx', cx); xh.lastChild.setAttribute('cy', cy);
      tip.style.display = '';
      tip.innerHTML = (opt.label ? U.esc(opt.label(i)) + '<br>' : '') + '<b style="color:var(--fg)">' + U.esc(fmt(vals[i])) + '</b>';
      const px = cx * r.width / W, py = cy * r.height / H;
      tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + 'px';
      tip.style.top = Math.max(0, py - 40) + 'px';
    };
    svg.addEventListener('mousemove', move);
    svg.addEventListener('mouseleave', () => { xh.style.display = 'none'; tip.style.display = 'none'; });
  };
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / p;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  }

  /* ---------- Halbkreis-Anzeige ---------- */
  C.gauge = function (v, opt) {
    opt = opt || {};
    const cls = opt.cls || C.lvlCls(v);
    const colMap = { ok: 'var(--ok)', warn: 'var(--warn)', ser: 'var(--ser)', crit: 'var(--crit)', acc: 'var(--acc)' };
    const a = Math.PI * (1 - U.clamp(v, 0, 100) / 100);
    const x = 60 + Math.cos(a) * 46, y = 58 - Math.sin(a) * 46;
    const large = 0;
    return '<svg viewBox="0 0 120 70" width="100%" style="max-width:' + (opt.max || 180) + 'px;display:block;margin:0 auto">' +
      '<path d="M14 58 A46 46 0 0 1 106 58" fill="none" stroke="var(--line2)" stroke-width="7"/>' +
      '<path d="M14 58 A46 46 0 ' + large + ' 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + '" fill="none" stroke="' + colMap[cls] + '" stroke-width="7"/>' +
      '<text x="60" y="54" text-anchor="middle" fill="var(--fg)" font-size="19" font-family="IBM Plex Sans, sans-serif" font-weight="500">' + U.n(v, opt.d || 0) + '</text>' +
      '<text x="60" y="67" text-anchor="middle" fill="var(--mut)" font-size="7" letter-spacing=".6" font-family="IBM Plex Sans Condensed, sans-serif">' + U.esc((opt.label || '').toUpperCase()) + '</text></svg>';
  };

  /* ---------- Netzdiagramm (Regionsprofil) ---------- */
  C.radar = function (m, base) {
    const keys = ['stab', 'wohl', 'vert', 'praes', 'ener', 'infra'];
    const n = keys.length, cx = 110, cy = 100, R = 70;
    const pt = (i, v) => { const a = -Math.PI / 2 + i / n * Math.PI * 2; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
    let g = '';
    [25, 50, 75, 100].forEach(l => {
      g += '<polygon points="' + keys.map((k, i) => pt(i, l).map(x => x.toFixed(1)).join(',')).join(' ') + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
    });
    keys.forEach((k, i) => {
      const [x, y] = pt(i, 100), [lx, ly] = pt(i, 120);
      g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)"/>';
      g += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="middle" fill="var(--mut)" font-size="9" letter-spacing=".8" font-family="IBM Plex Sans Condensed, sans-serif">' + KY.data.metricInfo[k].short + '</text>';
    });
    const poly = vals => keys.map((k, i) => pt(i, vals[k]).map(x => x.toFixed(1)).join(',')).join(' ');
    let b = '';
    if (base) b = '<polygon points="' + poly(base) + '" fill="none" stroke="var(--fg2)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>';
    return '<svg viewBox="0 0 220 200" width="100%" style="max-width:260px;display:block;margin:0 auto">' + g + b +
      '<polygon points="' + poly(m) + '" fill="var(--acc)" fill-opacity=".14" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>' +
      keys.map((k, i) => { const [x, y] = pt(i, m[k]); return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="var(--acc)" stroke="var(--s1)" stroke-width="1.5"/>'; }).join('') + '</svg>';
  };

  /* ---------- Ringdiagramm mit 2px-Fugen ---------- */
  C.donut = function (segs, center) {
    const tot = U.sum(segs.map(s => s.v)) || 1;
    const R = 52, r = 34, cx = 60, cy = 60;
    let a0 = -Math.PI / 2, out = '';
    const gap = 0.02;
    segs.forEach(s => {
      const a1 = a0 + s.v / tot * Math.PI * 2;
      const s0 = a0 + gap / 2, s1 = Math.max(s0 + 0.001, a1 - gap / 2);
      const large = s1 - s0 > Math.PI ? 1 : 0;
      const p = (rad, a) => (cx + Math.cos(a) * rad).toFixed(2) + ' ' + (cy + Math.sin(a) * rad).toFixed(2);
      out += '<path d="M' + p(R, s0) + 'A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(R, s1) + 'L' + p(r, s1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(r, s0) + 'Z" fill="' + s.c + '"><title>' + U.esc(s.l + ': ' + U.pct(s.v / tot * 100)) + '</title></path>';
      a0 = a1;
    });
    return '<svg viewBox="0 0 120 120" width="100%" style="max-width:150px;display:block">' + out +
      (center ? '<text x="60" y="58" text-anchor="middle" fill="var(--fg)" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="500">' + U.esc(center[0]) + '</text><text x="60" y="72" text-anchor="middle" fill="var(--mut)" font-size="7.5" letter-spacing="1" font-family="IBM Plex Sans Condensed, sans-serif">' + U.esc(center[1]) + '</text>' : '') + '</svg>';
  };
  C.legend = function (segs, tot) {
    tot = tot || U.sum(segs.map(s => s.v)) || 1;
    return '<div class="col gap4" style="font-size:12px">' + segs.map(s => '<div class="row"><i style="width:10px;height:10px;background:' + s.c + ';flex:none"></i><span class="fg2 ell" style="flex:1">' + U.esc(s.l) + '</span><span class="mono mut">' + U.n(s.v / tot * 100, 1) + ' %</span></div>').join('') + '</div>';
  };
  C.CAT = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];

  /* ---------- Plenum: neun Sitze im Halbrund ---------- */
  C.seats = function (votes, opt) {
    opt = opt || {};
    const D = KY.data;
    const ids = D.council.map(m => m.id).concat(['IX']);
    const n = ids.length;
    let out = '';
    const colors = { JA: 'var(--ok)', NEIN: 'var(--crit)', ENTH: 'var(--mut)' };
    ids.forEach((id, i) => {
      const a = Math.PI - (i + 0.5) / n * Math.PI;
      const x = 150 + Math.cos(a) * 112, y = 132 - Math.sin(a) * 112;
      const v = votes ? votes[id] : null;
      const m = D.council.find(x => x.id === id);
      const gone = m && m.proxy && KY.S.story.ending === 'frei';
      const seat = id === 'IX' ? 'IX' : m.seat;
      const fill = gone ? 'transparent' : v ? colors[v] : 'var(--s3)';
      const ring = id === 'IX' ? 'var(--acc)' : m && m.proxy ? 'var(--dim)' : 'var(--line3)';
