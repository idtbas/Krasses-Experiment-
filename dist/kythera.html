        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2, Math.min(y1, y2) - 30, x2, y2); ctx.stroke();
      }
      for (const n of D.nodes) {
        if (n.hidden && !KY.flag('omegaTraced') && !S.story.ending) continue;
        const st = S.integ.nodes[n.id];
        const [x, y] = this.proj(n.pos[0], n.pos[1]);
        const open = S.integ.anomalies.some(a => a.state === 'offen' && a.node === n.id);
        ctx.fillStyle = !st.up ? '#50565c' : open ? '#e04848' : '#2fb344';
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#0c0f12'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
        if (open) { ctx.strokeStyle = 'rgba(224,72,72,' + (0.6 - pulse * 0.4) + ')'; ctx.beginPath(); ctx.arc(x, y, 8 + pulse * 6, 0, Math.PI * 2); ctx.stroke(); }
        ctx.fillStyle = 'rgba(220,220,210,0.8)'; ctx.font = '9.5px "IBM Plex Mono", monospace'; ctx.fillText(n.id, x + 7, y + 3);
      }
    }
    // Regionsbeschriftung
    if (L.labels !== false && !mini) {
      ctx.textAlign = 'center';
      for (const id of D.regionOrder) {
        const R = D.regions[id];
        const [x, y] = this.proj(R.labelPos[0], R.labelPos[1]);
        if (x < -40 || x > this.w + 40) continue;
        const on = id === this.sel || id === this.hover;
        ctx.font = '600 ' + (on ? 11 : 10) + 'px "IBM Plex Sans Condensed", sans-serif';
        const txt = R.name.toUpperCase().split('').join(String.fromCharCode(8202));
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(6,8,10,0.85)'; ctx.strokeText(txt, x, y);
        ctx.fillStyle = on ? '#ecd096' : 'rgba(226,221,209,0.78)';
        ctx.fillText(txt, x, y);
        if (this.z > 1.6) {
          const [cx, cy] = this.proj(R.capPos[0], R.capPos[1]);
          ctx.fillStyle = 'rgba(226,221,209,0.9)';
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4); ctx.fillRect(-2.5, -2.5, 5, 5); ctx.restore();
          ctx.font = '9.5px "IBM Plex Sans", sans-serif'; ctx.fillStyle = 'rgba(200,200,190,0.75)'; ctx.textAlign = 'left';
          ctx.fillText(R.cap, cx + 6, cy + 3); ctx.textAlign = 'center';
        }
      }
      ctx.textAlign = 'left';
    }
    // Orte
    if (L.pois) {
      for (const p of D.pois) {
        if (p.id === 'KYT' && !KY.flag('history') && S.user.clr < 4 && this.z < 2) continue;
        const [x, y] = this.proj(p.pos[0], p.pos[1]);
        ctx.strokeStyle = p.id === 'KYT' ? 'rgba(236,208,150,' + (0.5 + pulse * 0.5) + ')' : 'rgba(226,221,209,0.6)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 3, y - 3, 6, 6);
        if (!mini && (this.z > 1.4 || p.id === 'ORSA' || p.id === 'KYT')) {
          ctx.font = '9.5px "IBM Plex Sans Condensed", sans-serif'; ctx.fillStyle = 'rgba(226,221,209,0.65)';
          ctx.fillText(p.name, x + 6, y - 4);
        }
      }
    }
    // Vorhaben
    if (L.projects) {
      for (const pr of S.projects.active) {
        const [x, y] = this.proj.apply(this, D.regions[pr.rid].capPos);
        const k = KY.proj.progress(pr);
        ctx.strokeStyle = 'rgba(201,165,92,0.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 8, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(201,165,92,' + (0.5 - pulse * 0.4) + ')'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, 12 + pulse * 5, 0, Math.PI * 2); ctx.stroke();
        if (pr.rid2) {
          const [x2, y2] = this.proj.apply(this, D.regions[pr.rid2].capPos);
          ctx.strokeStyle = 'rgba(201,165,92,0.5)'; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo((x + x2) / 2, Math.min(y, y2) - 40, x2, y2); ctx.stroke(); ctx.setLineDash([]);
        }
      }
      ctx.lineWidth = 1;
    }
    // Krise
    if (S.crisis && S.crisis.rid) {
      const [x, y] = this.proj.apply(this, D.regions[S.crisis.rid].capPos);
      for (let i = 0; i < 3; i++) {
        const ph = ((now / 1400) + i / 3) % 1;
        ctx.strokeStyle = 'rgba(224,72,72,' + (1 - ph) * 0.8 + ')';
        ctx.beginPath(); ctx.arc(x, y, 6 + ph * 26, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // Ereignisblitze
    this.flashes = this.flashes.filter(f => now - f.t < 2600);
    for (const f of this.flashes) {
      if (!D.regions[f.rid]) continue;
      const [x, y] = this.proj.apply(this, D.regions[f.rid].capPos);
      const k = (now - f.t) / 2600;
      ctx.strokeStyle = f.good ? 'rgba(47,179,68,' + (1 - k) + ')' : 'rgba(250,178,25,' + (1 - k) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 4 + k * 30 * (f.sev || 1) / 1.5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.lineWidth = 1;
    // Rahmen
    ctx.strokeStyle = 'rgba(201,165,92,0.35)';
    const cs = 10;
    [[0, 0, 1, 1], [this.w, 0, -1, 1], [0, this.h, 1, -1], [this.w, this.h, -1, -1]].forEach(([x, y, sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(x + sx * 0.5, y + sy * cs); ctx.lineTo(x + sx * 0.5, y + sy * 0.5); ctx.lineTo(x + sx * cs, y + sy * 0.5); ctx.stroke();
    });
  };

  // Schiffsposition auf Route (Echtzeit-Takt)
  KY.Map.shipPos = function (id, t) {
    const def = KY.data.ships.find(s => s.id === id);
    const pts = KY.data.routes[def.route];
    let len = 0;
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      segs.push(d); len += d;
    }
    let pos = ((t * def.speed * 40) % len + len) % len;
    for (let i = 0; i < segs.length; i++) {
      if (pos <= segs[i]) {
        const f = pos / segs[i];
        return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
      }
      pos -= segs[i];
    }
    return pts[0];
  };
})();

    if (id === 'krise') { UI.openCrisis(true); return; }
    if (!KY.mod[id]) id = 'lage';
    if (!UI.allowed(id)) {
      if (id === 'sitz0') UI.denied();
      return;
    }
    UI.closeNav();
    if (UI.cur === id && KY.mod[id].arg) { KY.mod[id].arg(arg); return; }
    if (UI.cur && KY.mod[UI.cur].unmount) { try { KY.mod[UI.cur].unmount(); } catch (e) { console.error(e); } }
    UI.cur = id;
    const work = document.getElementById('work');
    work.innerHTML = '';
    work.scrollTop = 0;
    const el = document.createElement('div');
    el.className = 'mod';
    el.dataset.mod = id;
    work.appendChild(el);
    try { KY.mod[id].mount(el, arg); } catch (e) { console.error(e); el.innerHTML = '<div class="empty"><b>Modul konnte nicht geladen werden</b>' + U.esc(e.message) + '</div>'; }
    U.$$('.ni').forEach(n => n.classList.toggle('on', n.dataset.mod === id));
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* Rahmen erlaubt keine Adressänderung */ }
    if (KY.audio) KY.audio.play('nav');
    S.lastMod = id;
  };

    let clicks = 0, ct;
    document.getElementById('brand').onclick = () => {
      clicks++; clearTimeout(ct); ct = setTimeout(() => { clicks = 0; }, 1600);

    U.on(document.getElementById('resBar2'), 'click', '.rc', (e, el) => UI.resJump(el.dataset.rk));
    // Tooltips
    const tip = document.getElementById('tip');
    let tipT = null;
    document.addEventListener('mouseover', e => {
      const t = e.target.closest('[data-tip]');
      if (!t) { tip.classList.remove('on'); return; }
      clearTimeout(tipT);
      tipT = setTimeout(() => {
        tip.innerHTML = t.dataset.tip.indexOf('<b>') === 0 ? t.dataset.tip : U.esc(t.dataset.tip);
        const r = t.getBoundingClientRect();
        tip.classList.add('on');
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        let x = r.left + r.width / 2 - tw / 2, y = r.bottom + 8;
        if (y + th > window.innerHeight - 8) y = r.top - th - 8;
        tip.style.left = U.clamp(x, 8, window.innerWidth - tw - 8) + 'px';
        tip.style.top = Math.max(8, y) + 'px';
      }, 280);
    });
    document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) { clearTimeout(tipT); tip.classList.remove('on'); } });
    document.addEventListener('click', () => { tip.classList.remove('on'); }, true);
    // Tastatur
    document.addEventListener('keydown', e => {
      UI.lastAct = Date.now();
      const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) || e.target.isContentEditable;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); UI.palette(); return; }
      if (e.key === 'Escape') { if (UI.closeTop()) e.preventDefault(); return; }
      if (typing) return;
      if (e.key === '`' || e.key === '^') { e.preventDefault(); UI.go('terminal'); return; }
      if (e.key === '?') { UI.help(); return; }
      if (e.key === '/') { e.preventDefault(); UI.palette(); return; }
      if (/^[1-9]$/.test(e.key) && e.altKey) {
        const flat = []; UI.NAV.forEach(g => g.items.forEach(i => { if (UI.allowed(i.id)) flat.push(i.id); }));
        const id = flat[+e.key - 1]; if (id) UI.go(id);
      }
    });
    ['pointerdown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { UI.lastAct = Date.now(); }, { passive: true }));
    document.addEventListener('visibilitychange', () => { if (document.hidden) KY.save(); });
    window.addEventListener('beforeunload', () => KY.save());
  };

      (o.title ? '<div class="mdl-h">' + (o.lbl ? '<div class="lbl">' + U.esc(o.lbl) + '</div>' : '') + '<h2>' + U.esc(o.title) + '</h2></div>' : '') +
      '<div class="mdl-b"></div>' + (o.actions && o.actions.length ? '<div class="mdl-f"></div>' : '') + '</div>';
    const body = ov.querySelector('.mdl-b');
    if (typeof o.body === 'string') body.innerHTML = o.body; else if (o.body) body.appendChild(o.body);
    const close = () => { ov.remove(); UI.stack = UI.stack.filter(x => x !== api); if (o.onClose) o.onClose(); };
    const api = { el: ov, body, close, noEsc: o.noClose };
    if (o.actions) {
      const f = ov.querySelector('.mdl-f');
      o.actions.forEach(a => {
        const b = document.createElement('button');
        b.className = 'btn ' + (a.cls || '');
        b.textContent = a.label;
        if (a.disabled) b.disabled = true;
        b.onclick = () => { if (a.fn && a.fn(api) === false) return; close(); };
        f.appendChild(b);
      });
    }
    if (!o.noClose) {
      ov.querySelector('.x').onclick = close;
      ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });
    }
    document.body.appendChild(ov);
    UI.stack.push(api);
    const first = ov.querySelector('input, .btn.pri, .btn');
    if (first && o.focus !== false) setTimeout(() => first.focus(), 30);
    return api;
  };

  UI.palette = function () {
    if (document.querySelector('.cmdk-ovl')) return;
    const S = KY.S, D = KY.data;
    const items = [];
    UI.NAV.forEach(g => g.items.forEach(i => { if (UI.allowed(i.id)) items.push({ k: 'Bereich', t: i.n, s: i.d, go: () => UI.go(i.id) }); }));

    D.companies.forEach(c => items.push({ k: 'Unternehmen', t: c.n, s: c.t, go: () => UI.go('kapital', c.t) }));
    D.people.forEach(p => items.push({ k: 'Person', t: p.n, s: p.role, go: () => UI.go('netzwerk', p.id) }));
    D.council.forEach(m => items.push({ k: 'Sitz', t: m.id, s: 'Sitz ' + m.seat + ' · ' + m.role, go: () => UI.go('kuratorium', m.id) }));
    D.archive.forEach(a => { if (a.clr <= S.user.clr) items.push({ k: 'Dokument', t: a.id + ' ' + a.title, s: a.date, go: () => UI.go('archiv', a.id) }); });
    Object.keys(D.projectTypes).forEach(t => { if (KY.proj.available(t)) items.push({ k: 'Vorhaben', t: D.projectTypes[t].name + ' planen', s: 'Neues Vorhaben', go: () => UI.go('vorhaben', { plan: { type: t } }) }); });
    items.push({ k: 'Befehl', t: 'Sitzung sperren', s: '', go: () => UI.lock() });
    items.push({ k: 'Befehl', t: 'Ton umschalten', s: '', go: () => { S.user.prefs.sound = !S.user.prefs.sound; UI.applyPrefs(); } });
    items.push({ k: 'Befehl', t: 'Tastaturkürzel anzeigen', s: '?', go: () => UI.help() });
    items.push({ k: 'Befehl', t: 'PYTHIA: Empfehlungen anfordern', s: '', go: () => UI.go('pythia', { ask: 'Was empfiehlst du?' }) });
    const ov = document.createElement('div');
    ov.className = 'ovl cmdk-ovl';
    ov.innerHTML = '<div class="cmdk" role="dialog" aria-label="Schnellzugriff"><input id="cmdkIn" placeholder="Bereich, Region, Person, Unternehmen, Dokument …" autocomplete="off" spellcheck="false"><div class="res-l" id="cmdkL"></div><div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> wählen</span><span><kbd>↵</kbd> öffnen</span><span><kbd>Esc</kbd> schließen</span></div></div>';
    document.body.appendChild(ov);
    const inp = ov.querySelector('input'), list = ov.querySelector('#cmdkL');
    let sel = 0, shown = [];
    const render = () => {
      const q = U.norm(inp.value.trim());
      shown = (q ? items.filter(i => U.norm(i.t + ' ' + i.s + ' ' + i.k).indexOf(q) >= 0) : items.filter(i => i.k === 'Bereich' || i.k === 'Befehl')).slice(0, 40);
      sel = Math.min(sel, Math.max(0, shown.length - 1));
      list.innerHTML = shown.length ? shown.map((i, n) => '<div class="it' + (n === sel ? ' on' : '') + '" data-i="' + n + '"><span class="k">' + i.k + '</span><span class="ell">' + U.esc(i.t) + '</span><span class="s ell">' + U.esc(i.s) + '</span></div>').join('') : '<div class="empty">Keine Treffer</div>';
      const on = list.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    };
    const run = i => { ov.remove(); if (shown[i]) shown[i].go(); };
    inp.addEventListener('input', () => { sel = 0; render(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { sel = Math.min(shown.length - 1, sel + 1); render(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
      if (e.key === 'Enter') run(sel);
      if (e.key === 'Escape') ov.remove();
    });
    U.on(list, 'click', '.it', (e, el) => run(+el.dataset.i));

        '<div class="kpi"><span class="lbl">Plenarbeschlüsse</span><span class="v">' + sum.votes + '</span></div><div class="kpi"><span class="lbl">Neue Nachrichten</span><span class="v">' + sum.msgs + '</span></div><div class="kpi"><span class="lbl">Betriebsregel 7</span><span class="v">' + sum.regel7 + '</span></div></div>' +
        (sum.regel7 ? '<p class="fg2 mt12">In Ihrer Abwesenheit hat PYTHIA ' + (sum.regel7 === 1 ? 'eine Krisenentscheidung' : sum.regel7 + ' Krisenentscheidungen') + ' nach Betriebsregel 7 getroffen.</p>' : '') +
        '<div class="lbl mt16">Letzte Einträge</div><div class="mono small fg2 mt8" style="line-height:1.7">' + sum.lines.map(l => '› ' + U.esc(l)).join('<br>') + '</div>',
      actions: [{ label: 'Protokoll öffnen', cls: 'ghost', fn: () => UI.go('protokoll') }, { label: 'Zur Lage', cls: 'pri' }],
    });
  };

  /* ================= Sperre ================= */
  UI.idleWatch = function () {
    UI.lastAct = Date.now();
    setInterval(() => {
      if (!document.querySelector('.lockscreen') && Date.now() - UI.lastAct > 6 * 60 * 1000 && !document.hidden) UI.lock(true);
    }, 15000);
  };
  UI.lock = function (auto) {
    if (document.querySelector('.lockscreen')) return;
    const S = KY.S;
    KY.log('sys', auto ? 'Sitzung nach Inaktivität gesperrt' : 'Sitzung manuell gesperrt');
    KY.save();
    const el = document.createElement('div');
    el.className = 'lockscreen';
    el.innerHTML = '<canvas width="640" height="640"></canvas><div class="lbl" style="letter-spacing:.3em">Sitzung gesperrt</div><div class="serif" style="font-size:22px">' + U.esc(S.user.codename) + ' · Sitz IX</div><p class="mut small">Die Simulation läuft im Hintergrund weiter.</p><button class="btn pri lg" id="unlockBtn">Entsperren</button>';
    document.body.appendChild(el);
    const cv = el.querySelector('canvas'), ctx = cv.getContext('2d');
    let alive = true;
    const draw = now => {
      if (!alive) return;
      ctx.clearRect(0, 0, 640, 640);
      ctx.save(); ctx.translate(320, 320);
      const rings = [[60, 1, 6], [105, -0.6, 9], [150, 0.35, 12], [200, -0.22, 18], [255, 0.12, 27]];
      rings.forEach(([r, sp, n], k) => {
        ctx.strokeStyle = 'rgba(201,165,92,' + (0.12 + k * 0.03) + ')'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < n; i++) {
          const a = now / 1000 * sp * 0.4 + i / n * Math.PI * 2;
          ctx.fillStyle = i === 0 ? 'rgba(236,208,150,0.95)' : 'rgba(201,165,92,0.35)';
          ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, i === 0 ? 4 : 1.5, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.fillStyle = 'rgba(236,208,150,0.9)'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
    el.querySelector('#unlockBtn').onclick = () => {
      alive = false; el.remove(); UI.lastAct = Date.now();
      KY.log('sys', 'Sitzung entsperrt');
      if (KY.audio) KY.audio.play('grant');
    };
  };
})();

/* KYTHERA · Startsequenz, Authentifizierung, Ernennung */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U;
  const B = KY.boot = {};
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let root, skip = false;

  const LOG = [
    ['KY-SECURE BOOT 4.11 · Kap Orsa Systemfertigung', ''],
    ['TPM 2.0 ........................................ ', 'ok', 'VERIFIZIERT'],
    ['Messkette PCR[0–7] ............................. ', 'ok', 'KONSISTENT'],
    ['Speicherprüfung 512 GiB ECC .................... ', 'ok', 'FEHLERFREI'],
    ['Verschlüsselter Datenträger (XTS-AES-512) ...... ', 'ok', 'ENTSPERRT'],
    ['Tunnel KY-N1 Kap Orsa ⇄ KY-N3 Kaldfjord ........ ', 'ok', '23 ms'],
    ['Zertifikatskette Kuratorium-Wurzel-CA 1987 ..... ', 'ok', 'GÜLTIG'],
    ['PYTHIA Kern 31.0 Handshake ..................... ', 'ok', 'BEREIT'],
    ['Mechanismus-Emulation KY-3 ..................... ', 'a', 'SYNCHRON'],
    ['Lagedaten: 12 Regionen, 24 Emittenten, 9 Sitze . ', 'ok', 'GELADEN'],
    ['Sitzkennung IX ................................. ', 'w', 'NEU ZUGEORDNET'],
  ];

  B.run = function (returning, done) {
    root = document.createElement('div');
    root.className = 'boot';
    root.innerHTML = '<div class="boot-log" id="bootLog"></div><div class="boot-stage" id="bootStage"></div>';
    document.body.appendChild(root);
    const onKey = e => { if (e.key === 'Escape' && returning) skip = true; };
    document.addEventListener('keydown', onKey);
    B.sequence(returning).then(() => {
      document.removeEventListener('keydown', onKey);
      root.style.transition = 'opacity .6s';
      root.style.opacity = '0';
      setTimeout(() => root.remove(), 650);
      done();
    });
  };

  B.sequence = async function (returning) {
    const S = KY.S;
    const log = root.querySelector('#bootLog'), stage = root.querySelector('#bootStage');
    if (returning) {
      stage.innerHTML = '<p class="fine">ESC · Schnellstart</p>';
    }
    for (const l of LOG) {
      if (skip) break;
      const line = document.createElement('div');
      line.textContent = l[0];
      log.appendChild(line);
      await wait(returning ? 60 : 110 + Math.random() * 120);
      if (l[1]) {
        const s = document.createElement('span');
        s.className = l[1];
        s.textContent = (l[2] || 'OK') + (returning && l[2] === 'NEU ZUGEORDNET' ? '' : '');
        if (returning && l[2] === 'NEU ZUGEORDNET') { s.className = 'ok'; s.textContent = S.user.codename; }
        line.appendChild(s);
      }
    }
    await wait(skip ? 0 : 300);
    log.style.transition = 'opacity .8s'; log.style.opacity = '.18';
    stage.innerHTML = KY.seal(150, true) + '<h1>KYTHERA</h1><p class="tagline">Wir bewahren, was kommt.</p><p class="fine">KURATORIALES LAGE- UND STEUERUNGSSYSTEM · VERSION 7.4.2<br>UNBEFUGTER ZUGRIFF IST UNTERSAGT UND WIRD VERFOLGT</p>';
    stage.style.animation = 'fadeIn 1s';
    await wait(skip ? 200 : 1400);
    await B.auth(stage, returning);
    if (!returning) {
      await B.certificate(stage);
      await B.codename(stage);
      await B.oath(stage);
    }
    stage.innerHTML = KY.seal(110) + '<div class="lbl" style="color:var(--ok);letter-spacing:.3em">Zugang gewährt</div><div class="serif" style="font-size:26px">' + (returning ? 'Willkommen zurück, ' : 'Willkommen, ') + U.esc(S.user.codename) + '.</div><p class="fine">SITZ IX · FREIGABESTUFE ' + S.user.clr + ' · ' + U.longDate(new Date()).toUpperCase() + '</p>';
    KY.audio.play('grant');
    await wait(skip ? 500 : 1500);
  };

  B.auth = function (stage, returning) {
    return new Promise(resolve => {
      const box = document.createElement('div');
      box.className = 'col';
      box.style.alignItems = 'center';
      box.style.gap = '14px';
      box.innerHTML = '<div class="lbl">Hardware-Token KY-HT-09 erkannt · Sitz IX</div>' +
        '<button class="scan-btn" id="scanBtn" aria-label="Zur Authentifizierung gedrückt halten"><span class="fill"></span><span class="beam"></span>' +
        '<svg viewBox="0 0 62 78" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">' +
        '<path d="M31 6c-13 0-23 10-23 23v10"/><path d="M54 39V29C54 16 44 6 31 6"/><path d="M15 50V29c0-9 7-16 16-16s16 7 16 16v21"/><path d="M22 60V29c0-5 4-9 9-9s9 4 9 9v33"/><path d="M31 29v40"/><path d="M8 47c0 10 3 18 8 24"/><path d="M54 47c0 9-2 16-5 21"/></svg></button>' +
        '<div class="fine" id="scanMsg">Zur biometrischen Bestätigung gedrückt halten</div>';
      stage.appendChild(box);
      const btn = box.querySelector('#scanBtn'), fill = btn.querySelector('.fill'), msg = box.querySelector('#scanMsg');
      let t0 = 0, raf = 0, done = false;
      const HOLD = skip ? 250 : 1300;
      const step = () => {
        const k = Math.min(1, (performance.now() - t0) / HOLD);
        fill.style.height = (k * 100) + '%';
        if (k >= 1) { finish(); return; }
        raf = requestAnimationFrame(step);
      };
      const start = e => {
        if (done) return;
        if (e) e.preventDefault();
        KY.audio.unlock();
        KY.audio.play('scan');
        t0 = performance.now();
        btn.classList.add('on');
        msg.textContent = 'Abgleich läuft …';
        raf = requestAnimationFrame(step);
      };
      const stop = () => {
        if (done) return;
        cancelAnimationFrame(raf);
        btn.classList.remove('on');
        fill.style.height = '0';
        msg.textContent = 'Abgleich abgebrochen. Bitte länger gedrückt halten.';
      };
      const finish = () => {
        done = true;
        btn.classList.remove('on');
        btn.classList.add('ok');
        msg.innerHTML = '<span style="color:var(--ok)">Biometrie bestätigt · Übereinstimmung 99,7 %</span>';
        KY.audio.play('ok');
        setTimeout(() => { box.remove(); resolve(); }, skip ? 150 : 700);
      };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointerleave', stop);
      btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
      btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
      setTimeout(() => btn.focus(), 50);
      if (skip) start();
    });
  };

  B.certificate = function (stage) {
    return new Promise(resolve => {
      const d = new Date();
      stage.innerHTML = '<div class="lbl" style="color:var(--warn)">Neuer Sitzinhaber · Ernennungsurkunde wird geladen</div>' +
        '<div class="cert"><div class="h">Das Kuratorium</div><h2>Ernennung zum Inhaber<br>des Sitzes IX</h2>' +
        '<p>Das Plenum hat in seiner Sitzung vom ' + U.longDate(d) + ' beschlossen, Ihnen den neunten Sitz zu übertragen, der seit dem Rücktritt des bisherigen Inhabers unbesetzt ist.</p>' +
        '<p>Mit diesem Sitz verbunden sind eine Stimme im Plenum, die Verfügung über ein eigenes Budget, Flotte und Satelliten, sowie der Zugang zu PYTHIA.</p>' +
        '<div class="sig"><span>Für den Vorsitz: A.</span><span>Beglaubigt: B. Aurel, Notar</span></div></div>' +
        '<button class="btn pri lg" id="certOk">Ernennung annehmen</button>';
      stage.querySelector('#certOk').onclick = () => { KY.audio.play('click'); resolve(); };
      stage.querySelector('#certOk').focus();
    });
  };

  B.codename = function (stage) {
    return new Promise(resolve => {
      const names = ['SIRIUS', 'ALTAIR', 'POLARIS', 'ANTARES', 'DENEB', 'CAPELLA', 'RIGEL', 'ARCTURUS', 'MIRA'];
      let pick = null;
      stage.innerHTML = '<div class="lbl">Rufname festlegen</div><p class="serif" style="font-size:19px;color:var(--fg2);max-width:42ch">Im Kuratorium trägt niemand seinen Namen. Wählen Sie den Rufnamen, unter dem Sie geführt werden.</p>' +
        '<div class="cn-grid">' + names.map(n => '<button data-n="' + n + '">' + n + '</button>').join('') + '</div>' +
        '<div class="fld" style="width:100%"><label for="cnIn">Oder eigener Rufname (3–12 Buchstaben)</label><input class="inp mono" id="cnIn" maxlength="12" autocomplete="off" spellcheck="false" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"></div>' +
        '<button class="btn pri lg" id="cnOk" disabled>Rufname bestätigen</button>';
      const ok = stage.querySelector('#cnOk'), inp = stage.querySelector('#cnIn');
      const valid = v => /^[A-ZÄÖÜ]{3,12}$/.test(v) && v !== 'VESPER' && !KY.data.council.some(m => m.id === v);
      U.on(stage, 'click', '[data-n]', (e, b) => {
        pick = b.dataset.n; inp.value = '';
        U.$$('[data-n]', stage).forEach(x => x.classList.toggle('on', x === b));
        ok.disabled = false; KY.audio.play('click');
      });
      inp.addEventListener('input', () => {
        const v = inp.value.toUpperCase().replace(/[^A-ZÄÖÜ]/g, '');
        inp.value = v;
        U.$$('[data-n]', stage).forEach(x => x.classList.remove('on'));
        pick = valid(v) ? v : null;
        ok.disabled = !pick;
        if (v === 'VESPER') { ok.disabled = true; KY.audio.play('deny'); }
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && pick) ok.click(); });
      ok.onclick = () => { KY.S.user.codename = pick; KY.audio.play('ok'); resolve(); };
    });
  };

  B.oath = function (stage) {
    return new Promise(resolve => {
      const S = KY.S;
      stage.innerHTML = '<div class="lbl">Verschwiegenheitsgelöbnis · Charta, Artikel IX</div>' +
        '<div class="cert" style="text-align:left"><p style="margin:0 0 10px">Ich gelobe, über die Existenz des Kuratoriums, über seine Beschlüsse und über den Mechanismus Stillschweigen zu bewahren, auch über meinen Rücktritt hinaus.</p>' +
        '<p style="margin:0">Ich gelobe, meine Stimme nach bestem Wissen abzugeben und die Mittel des Sitzes IX zur Erhaltung der Ordnung, zur Linderung von Not und zum Fortschritt der Wissenschaften einzusetzen.</p></div>' +
        '<label class="chk" style="text-align:left;width:100%"><input type="checkbox" id="oathChk"><span class="fg2 small">Ich habe das Gelöbnis gelesen und leiste es. Mir ist bewusst, dass alle Handlungen in KYTHERA protokolliert werden.</span></label>' +
        '<div class="fld" style="width:100%"><label for="oathSig">Unterschrift: Rufname eingeben (' + U.esc(S.user.codename) + ')</label><input class="inp mono" id="oathSig" autocomplete="off" spellcheck="false" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"></div>' +
        '<button class="btn pri lg" id="oathOk" disabled>Gelöbnis leisten</button>';
      const chk = stage.querySelector('#oathChk'), sig = stage.querySelector('#oathSig'), ok = stage.querySelector('#oathOk');
      const upd = () => { ok.disabled = !(chk.checked && sig.value.trim().toUpperCase() === S.user.codename); };
      chk.onchange = upd; sig.oninput = upd;
      sig.addEventListener('keydown', e => { if (e.key === 'Enter' && !ok.disabled) ok.click(); });
      ok.onclick = () => { S.user.sworn = true; KY.audio.play('grant'); resolve(); };
    });
  };
})();

        { l: 'Ansehen im Plenum', v: U.n(S.res.ans), s: '/100', d: '<span class="mut">Freigabe ' + S.user.clr + '</span>', tip: '<b>Ansehen</b>Ihr Gewicht unter den Sitzen. Ab 50 und zwei erfolgreichen Vorhaben prüft der Vorsitz eine Erweiterung Ihrer Freigabe.' },
      ];
      const box = this.el.querySelector('#lgKpi');
      if (!box.children.length) {
        box.innerHTML = k.map((x, i) => '<div class="kpi" data-tip="' + U.esc(x.tip) + '"><span class="lbl">' + x.l + '</span><span class="v" data-k="' + i + '"></span><span class="dl" data-d="' + i + '"></span>' + (x.sp ? '<div class="sp-wrap" data-s="' + i + '"></div>' : '') + '</div>').join('');

        const done = KY.ONB.filter(t => S.onb.tasks[t.id]).length;
        h += '<section class="pn onb"><div class="pn-h"><h3>Einweisung Sitz IX</h3><div class="tools"><span class="meta">' + done + '/' + KY.ONB.length + '</span><button class="btn sm ghost" id="onbHide">Ausblenden</button></div></div><div class="pn-b">' +
          '<p class="small fg2" style="margin-bottom:8px">Sieben Schritte, um sich zurechtzufinden. Abschluss wird vom Plenum mit Einfluss honoriert.</p>' +
          KY.ONB.map(t => '<div class="step' + (S.onb.tasks[t.id] ? ' done' : '') + '"><span class="bx"></span><div><div class="tt small bold">' + t.t + '</div><div class="xs mut">' + t.d + '</div></div></div>').join('') + '</div></section>';
      }
      // Offene Vorgänge
      const items = [];
      if (S.crisis) items.push({ c: 'crit', t: S.crisis.title, m: 'Entscheidung · Frist ' + U.dur(KY.crisis.remaining()), act: { mod: 'krise' } });
      if (S.council.open && !S.council.open.mine) items.push({ c: 'warn', t: 'Abstimmung ' + S.council.open.no, m: S.council.open.title, act: { mod: 'kuratorium' } });
      const unread = S.msgs.filter(m => !m.read).length;
      if (unread) items.push({ c: 'info', t: unread + ' ungelesene Nachricht' + (unread > 1 ? 'en' : ''), m: S.msgs.find(m => !m.read).subj, act: { mod: 'komm' } });
      const fl = S.dsp.list.filter(d => d.enc && !d.decT && (d.flag || d.story)).length;
      if (fl) items.push({ c: 'acc', t: fl + ' markierte Depesche' + (fl > 1 ? 'n' : ''), m: 'verschlüsselt', act: { mod: 'depeschen' } });
      const an = S.integ.anomalies.filter(a => a.state === 'offen');
      if (an.length) items.push({ c: an.some(a => a.sev >= 3) ? 'crit' : 'ser', t: an.length + ' offene Anomalie' + (an.length > 1 ? 'n' : ''), m: an[0].t, act: { mod: 'integritaet' } });
      if (!S.research.active) items.push({ c: 'plain', t: 'Kein Forschungsprogramm aktiv', m: 'Forschung ruht', act: { mod: 'forschung' } });
      h += '<section class="pn"><div class="pn-h"><h3>Offene Vorgänge</h3><div class="tools"><span class="meta">' + items.length + '</span></div></div><div class="pn-b flush">' +
        (items.length ? items.map(i => '<div class="li" data-act=\'' + JSON.stringify(i.act) + '\'><span class="pill ' + i.c + '" style="margin-top:1px">&nbsp;</span><div class="body"><div class="t">' + U.esc(i.t) + '</div><div class="m ell">' + U.esc(i.m) + '</div></div></div>').join('') : '<div class="empty"><b>Keine offenen Vorgänge</b>Alles ist entschieden.</div>') + '</div></section>';
      // Empfehlungen
      const recs = KY.pythia.recommend(3);
      h += '<section class="pn"><div class="pn-h"><h3>PYTHIA · Empfehlungen</h3><div class="tools"><button class="btn sm ghost" data-go="pythia">Fragen</button></div></div><div class="pn-b flush">' +
        recs.map((r, i) => '<div class="li" data-act=\'' + JSON.stringify(r.act).replace(/'/g, '&#39;') + '\'><div class="ic mono">' + (i + 1) + '</div><div class="body"><div class="t">' + U.esc(r.t) + '</div><div class="small mut mt4" style="line-height:1.4">' + U.esc(r.d) + '</div></div></div>').join('') + '</div></section>';
      U.setHTML(this.el.querySelector('#lgSide'), h);
    },
    rReg() {
      const S = KY.S, D = KY.data, W = KY.wsim;
      const ord = D.regionOrder.slice().sort((a, b) => W.score(a) - W.score(b));
      U.setHTML(this.el.querySelector('#lgReg'), '<table class="tbl"><thead><tr><th>Region</th><th>Status</th><th class="num">Stab.</th><th class="num">Span.</th><th class="num">Trend</th></tr></thead><tbody>' +
        ord.map(id => {
          const R = S.regions[id], st = W.status(id), tr = U.slope(R.h.stab, 12) * 10;
          return '<tr class="click" data-region="' + id + '"><td>' + U.esc(D.regions[id].name) + (R.warn ? ' <span class="tag" style="color:var(--warn)">WARNUNG</span>' : '') + '</td><td>' + C.pill(st.t, st.c) + '</td><td class="num">' + U.n(R.m.stab) + '</td><td class="num">' + U.n(R.m.span) + '</td><td class="num">' + C.delta(tr, 1) + '</td></tr>';
        }).join('') + '</tbody></table>');
    },
    rProj() {
      const S = KY.S, D = KY.data;
      const box = this.el.querySelector('#lgProj');
      if (!S.projects.active.length) {
        U.setHTML(box, '<div class="empty"><b>Keine laufenden Vorhaben</b>PYTHIA empfiehlt, mit einer Bildungsstiftung oder einem Infrastrukturprogramm zu beginnen.</div>');
        return;
      }
      U.setHTML(box, S.projects.active.map(pr => {
        const T = D.projectTypes[pr.type], k = KY.proj.progress(pr);
        return '<div class="li" data-proj="' + pr.id + '"><div class="body"><div class="row"><span class="t bold ell" style="color:var(--fg)">' + pr.code + '</span><span class="sp"></span><span class="mono xs mut">' + U.dur(KY.proj.remaining(pr)) + '</span></div>' +
          '<div class="m">' + T.name + ' · ' + D.regions[pr.rid].name + ' · ' + pr.p + ' %</div><div class="mt8">' + C.meter(k * 100, 100, 'prog') + '</div><div class="xs mut mt4">Phase ' + (pr.phase + 1) + '/' + T.phases.length + ': ' + T.phases[Math.max(0, pr.phase)] + '</div></div></div>';
      }).join(''));
    },
    rFeed() {
      const S = KY.S;
      const items = S.log.filter(l => l.cat === 'welt' || l.cat === 'vor' || l.cat === 'kur' || l.cat === 'kri').slice(-18).reverse();
      U.setHTML(this.el.querySelector('#lgFeed'), items.map(l => '<div class="li" style="cursor:default"><div class="body"><div class="m" style="margin:0 0 3px">' + U.clock(new Date(l.ts)) + ' · ' + (KY.CATS[l.cat] || '').toUpperCase() + '</div><div class="small fg2">' + U.esc(l.text) + '</div></div></div>').join('') || '<div class="empty">Noch keine Meldungen.</div>');
    },
  };
})();

/* js/mod/atlas.js */
/* KYTHERA · Modul Atlas */
(function () {
  'use strict';
  const KY = window.KY, U = KY.U, C = KY.C;

  KY.mod.atlas = {
    mount(el, arg) {
      const S = KY.S;
      this.el = el;
      this.n = 0;
      this.sel = (arg && KY.data.regions[arg]) ? arg : (S.atlasSel || 'MER');
      this.metric = 'stab';
      this.layers = S.atlasLayers || { projects: true, sats: true, ships: true, pois: true, labels: true };
      el.innerHTML = KY.ui.head({
        crumb: 'Lage', code: 'AT-02', title: 'Atlas',
        sub: 'Zwölf Regionen, ihre Lage und Ihre Präsenz. Wählen Sie eine Region für das Dossier. Mausrad oder Doppelklick zoomt.',
        act: '<div class="seg" id="atLayers">' + [['projects', 'Vorhaben'], ['sats', 'Satelliten'], ['ships', 'Flotte'], ['pois', 'Orte']].map(([k, n]) => '<button data-l="' + k + '"' + (this.layers[k] ? ' class="on"' : '') + '>' + n + '</button>').join('') + '</div>',
      }) +
        '<div class="g g-main"><div class="col gap12"><section class="pn tick"><div class="pn-b flush" id="atMap"></div></section>' +
        '<section class="pn"><div class="pn-h"><h3 id="atHistT">Verlauf</h3><div class="tools"><select class="inp" id="atMetric" style="height:26px;width:auto">' + Object.keys(KY.data.metricInfo).map(k => '<option value="' + k + '">' + KY.data.metricInfo[k].name + '</option>').join('') + '</select></div></div><div class="pn-b" id="atHist"></div></section></div>' +
        '<aside class="col gap12" id="atDos"></aside></div>';
      this.map = new KY.Map(el.querySelector('#atMap'), {
        height: Math.max(420, Math.min(620, window.innerHeight - 330)), overlay: S.atlasOv || 'lage', select: this.sel,
        layers: this.layers,
        onSelect: rid => this.select(rid),
        onPoi: id => this.poi(id),
      });
      const origSet = this.map.setOverlay.bind(this.map);
      this.map.setOverlay = k => { origSet(k); S.atlasOv = k; };
      el.querySelector('#atMetric').onchange = e => { this.metric = e.target.value; this.rHist(); };
      U.on(el, 'click', '[data-l]', (e, b) => {
        const k = b.dataset.l;
        this.layers[k] = !this.layers[k];
        b.classList.toggle('on', this.layers[k]);
        S.atlasLayers = this.layers;
        this.map.dirty = true;
      });
      U.on(el, 'click', '[data-plan]', (e, b) => KY.ui.go('vorhaben', { plan: { type: b.dataset.plan, rid: this.sel } }));
      U.on(el, 'click', '[data-go]', (e, b) => KY.ui.go(b.dataset.go, b.dataset.arg));
      U.on(el, 'click', '#atAsk', () => KY.ui.go('pythia', { ask: 'Wie steht es um ' + KY.data.regions[this.sel].name + '?' }));
      U.on(el, 'click', '#atSat', () => this.satDialog());
      U.on(el, 'click', '#atImg', () => KY.ui.go('orbit', { img: [34.2, 21.4] }));
      this.subs = ['regions', 'projects', 'infra'].map(ev => KY.bus.on(ev, () => { this.dirty = true; }));
      this.select(this.sel);
    },
    arg(a) { if (a && KY.data.regions[a]) this.select(a); },
    unmount() { this.map.destroy(); this.subs.forEach(f => f()); },
    tick() {
      this.n++;
      if (this.n % 3 === 0 || this.dirty) { this.dirty = false; if (this.poiMode) return; this.rDos(); }
      if (this.n % 10 === 0 && !this.poiMode) this.rHist();
    },
    select(rid) {
      this.sel = rid;
      this.poiMode = null;
      KY.S.atlasSel = rid;
      this.map.select(rid);
      KY.onb('atlas');
      this.rDos(true);
      this.rHist();
    },
    poi(id) {
      const S = KY.S, p = KY.data.pois.find(x => x.id === id);
      this.poiMode = id;
      this.map.select(null);
      const known = S.user.clr >= 4 || KY.flag('history');
      U.setHTML(this.el.querySelector('#atDos'), '<section class="pn tick"><div class="pn-h"><h3>Ort · Sperrgebiet</h3></div><div class="pn-b"><div class="serif" style="font-size:28px;line-height:1.1">Kythera</div><div class="mono xs mut mt4">34,20° N · 21,40° O</div>' +
        '<p class="fg2 mt12">' + U.esc(p.text) + '</p>' +
        '<dl class="kv mt12"><dt>Status</dt><dd>Sperrgebiet, Zugang nur mit Genehmigung des Vorsitzes</dd><dt>Bauwerke</dt><dd>Leuchtturm Nordspitze (1912, außer Betrieb seit 1988)</dd><dt>Letzter Besuch</dt><dd>' + (known ? '10.09.2026 · FS HALVORSEN' : '<span class="redact">██.██.████ · ██ ██████████</span>') + '</dd></dl>' +
        (S.user.clr >= 4 ? '<button class="btn pri block mt16" id="atImg">' + KY.I('sat') + 'Bildaufklärung anfordern</button>' : '<p class="xs mut mt16">Bildaufklärung erfordert Freigabestufe 4.</p>') +
        '</div></section>');
      U.setHTML(this.el.querySelector('#atHist'), '<div class="empty">Für Sperrgebiete werden keine Lagedaten geführt.</div>');
      U.setText(this.el.querySelector('#atHistT'), 'Verlauf');
      if (KY.audio) KY.audio.play('click');
    },
    rDos(force) {
      const S = KY.S, D = KY.data, id = this.sel, R = S.regions[id], info = D.regions[id], m = R.m;
      const st = KY.wsim.status(id);
      const projs = S.projects.active.filter(p => p.rid === id || p.rid2 === id);
      const sats = S.infra.sats.filter(s => s.focus === id);
      const cos = D.companies.filter(c => c.r === id);
      const ppl = D.people.filter(p => p.r === id);
      const tr = k => U.slope(R.h[k], 15) * 10;
      const metrics = Object.keys(D.metricInfo).map(k => {
        const mi = D.metricInfo[k];
        return '<div class="mrow" data-tip="<b>' + mi.name + '</b>' + U.esc(mi.text) + '"><span class="k">' + mi.name + '</span>' + C.meter(m[k], 100, C.lvlCls(m[k], mi.good === 'lo')) + '<span class="v">' + U.n(m[k]) + ' <span class="xs">' + C.delta(tr(k), 0, '', mi.good === 'lo') + '</span></span></div>';
      }).join('');
      const html =
        '<section class="pn tick"><div class="pn-h"><h3>Regionsdossier</h3><div class="tools">' + C.pill(st.t, st.c, st.c === 'crit') + '</div></div><div class="pn-b">' +
        '<div class="row" style="align-items:flex-start"><div style="min-width:0;flex:1"><div class="serif" style="font-size:28px;line-height:1.05">' + U.esc(info.name) + '</div><div class="mono xs mut mt4">' + id + ' · ' + U.esc(info.kont) + ' · ' + info.pop + ' Mio. Einw.</div></div></div>' +
        '<p class="fg2 small mt8" style="line-height:1.5">' + U.esc(info.text) + '</p>' +
        '<dl class="kv mt12"><dt>Hauptstadt</dt><dd>' + U.esc(info.cap) + '</dd><dt>Branchen</dt><dd>' + info.branchen.join(', ') + '</dd><dt>Klima</dt><dd>' + info.klima + '</dd><dt>Risiken</dt><dd>' + info.risiken.join(', ') + '</dd>' +
        '<dt>Resilienz</dt><dd>' + U.n(R.res * 100) + ' %</dd><dt>Abdeckung</dt><dd>' + (sats.length ? sats.map(s => s.id).join(', ') : '<span class="mut">keine</span> <button class="lnk small" id="atSat">ausrichten</button>') + '</dd></dl>' +
        (R.warn ? '<div class="pill warn mt12" style="white-space:normal">' + (R.warn.type === 'STURM' ? 'Sturmwarnung aktiv' : 'Energieengpass droht') + '</div>' : '') +
        (R.mora > 0 ? '<div class="pill info mt12">Moratorium für Großvorhaben · ' + U.dur(R.mora) + '</div>' : '') +
        '</div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Profil</h3><div class="tools"><span class="meta">— Ausgangslage</span></div></div><div class="pn-b">' + C.radar(m, R.base) + '<div class="mt8">' + metrics + '</div></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Handeln</h3></div><div class="pn-b"><div class="g g2" style="gap:6px">' +
        ['INF', 'ENE', 'HUM', 'VER', 'BIL', 'KLI', 'GES', 'INV'].map(t => '<button class="btn sm ghost" data-plan="' + t + '">' + D.projectTypes[t].name + '</button>').join('') +
        '</div><div class="row mt8"><button class="btn sm block" id="atAsk">' + KY.I('pythia') + 'PYTHIA-Analyse</button></div></div></section>' +
        '<section class="pn"><div class="pn-h"><h3>Vor Ort</h3></div><div class="pn-b flush">' +
        (projs.length ? projs.map(p => '<div class="li" data-go="vorhaben" data-arg="' + p.id + '"><div class="body"><div class="t">' + p.code + ' · ' + D.projectTypes[p.type].name + '</div><div class="mt4">' + C.meter(KY.proj.progress(p) * 100, 100, 'prog') + '</div></div></div>').join('') : '') +
        cos.map(c => { const ch = KY.market.change(c.t, 60); return '<div class="li" data-go="kapital" data-arg="' + c.t + '"><div class="ic mono">' + c.t + '</div><div class="body"><div class="t">' + U.esc(c.n) + '</div><div class="m">' + D.sectors[c.s] + ' · ' + U.n(S.market.c[c.t].p, 2) + ' ¤ · ' + C.delta(ch, 1, ' %') + '</div></div></div>'; }).join('') +
        ppl.map(p => '<div class="li" data-go="netzwerk" data-arg="' + p.id + '">' + C.avatar(p.id, 28) + '<div class="body"><div class="t">' + U.esc(p.n) + '</div><div class="m ell">' + U.esc(p.role) + '</div></div></div>').join('') +
        '</div></section>';
      U.setHTML(this.el.querySelector('#atDos'), html);
    },
    rHist() {
      const S = KY.S, D = KY.data, R = S.regions[this.sel];
      if (!R) return;
      const mi = D.metricInfo[this.metric];
      U.setText(this.el.querySelector('#atHistT'), mi.name + ' · ' + D.regions[this.sel].name + ' · letzte 15 min');
      const vals = R.h[this.metric];
      C.line(this.el.querySelector('#atHist'), {
        vals, h: 180, ref: R.base[this.metric], fmt: v => U.n(v, 1),
        label: i => 'vor ' + U.dur((vals.length - 1 - i) * 10),
        xlabels: [[0, '−' + Math.round((vals.length - 1) * 10 / 60) + ' min'], [vals.length - 1, 'jetzt']],
      });
    },
    satDialog() {
      const S = KY.S, D = KY.data, rid = this.sel;
      KY.ui.modal({
        lbl: 'Flotte & Orbit', title: 'Satellit auf ' + D.regions[rid].name + ' ausrichten',
        body: '<p class="fg2 small">Abgedeckte Regionen erhalten +3 Punkte Erfolg für Vorhaben und mit dem Frühwarnsystem mehr Zeit bei Krisen. Ausrichtung kostet 4 EF Rechenzeit.</p><div class="col mt12" id="satList">' +
          S.infra.sats.map(s => '<button class="opt" data-s="' + s.id + '"><span class="on">' + KY.I('sat') + '</span><span><span class="t">' + s.id + '</span> <span class="tag">' + KY.infra.satDef(s.id).fn + '</span><div class="d">Aktuell: ' + (s.focus ? D.regions[s.focus].name : 'Bereitschaft') + '</div></span></button>').join('') + '</div>',
        actions: [{ label: 'Abbrechen', cls: 'ghost' }],
      });
      U.on(document.getElementById('satList'), 'click', '[data-s]', (e, b) => {
        const r = KY.infra.retask(b.dataset.s, rid);
        if (!r.ok) { KY.ui.flashMsg(r.err, 'crit'); return; }
        KY.ui.closeTop();
        KY.ui.flashMsg(b.dataset.s + ' auf ' + D.regions[rid].name + ' ausgerichtet', 'ok');
        this.rDos();
      });
    },
  };
})();

/* KYTHERA · Modul Nachrichtenlage */
(function () {

  const KY = window.KY, U = KY.U, C = KY.C;

  const PR = [
    { id: 'bericht', t: 'Jahresbericht der Stiftung Serrano vorziehen', d: 'Transparenz an der Oberfläche. Beruhigt Redaktionen, die nach anonymen Geldgebern fragen.', cost: { kap: 1.5 }, fx: { disk: 5 }, cd: 300 },
    { id: 'kultur', t: 'Kulturförderung öffentlich ankündigen', d: 'Ein Stipendienprogramm mit Namen und Gesichtern. Lenkt Aufmerksamkeit auf das Sichtbare.', cost: { kap: 3 }, fx: { disk: 3 }, cd: 420, news: true },

  KY.mod.news = {
    mount(el) {
