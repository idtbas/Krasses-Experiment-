<title>KYTHERA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kuratoriales Lage- und Steuerungssystem">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* KYTHERA · Gestaltungssystem
   Leitstand: Klassifizierungsband · Kopfzeile · Navigationsschiene · Arbeitsfläche · Statusleiste
   Bewusst einheitlich dunkel (eine visuelle Welt); Akzent Messing nach dem Mechanismus von 1901. */
:root {
  color-scheme: dark;
  --bg: #07090b;
  --s1: #0c0f12;
  --s2: #11151a;
  --s3: #171c22;
  --s4: #1e242b;
  --line: #1c2229;
  --line2: #29313a;
  --line3: #3a434d;
  --fg: #e2ddd1;
  --fg2: #b4ae9f;
  --mut: #7c8086;
  --dim: #50565c;
  --acc: #c9a55c;
  --acc2: #ecd096;
  --acc3: #8a7140;
  --acc-bg: rgba(201, 165, 92, 0.09);
  --acc-bg2: rgba(201, 165, 92, 0.16);
  --ok: #2fb344;
  --warn: #fab219;
  --ser: #ec835a;
  --crit: #e04848;
  --info: #3987e5;
  --ok-bg: rgba(47, 179, 68, 0.12);
  --warn-bg: rgba(250, 178, 25, 0.12);
  --ser-bg: rgba(236, 131, 90, 0.13);
  --crit-bg: rgba(224, 72, 72, 0.14);
  --info-bg: rgba(57, 135, 229, 0.13);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  --cls: #6e1d1b;
  --cls-fg: #f4e8d4;
  --paper: #121110;
  --paper-fg: #d9d2c2;
  --font-ui: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-cond: 'IBM Plex Sans Condensed', 'Arial Narrow', 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --font-serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --fs-xs: 10.5px; --fs-s: 11.5px; --fs: 13px; --fs-m: 15px; --fs-l: 19px; --fs-xl: 26px; --fs-xxl: 38px;
  --nav-w: 218px;
  --hdr-h: 48px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2, .7, .2, 1);
}
:root[data-accent="eis"] { --acc: #8fbcd0; --acc2: #c4e2ee; --acc3: #4d6f7e; --acc-bg: rgba(143, 188, 208, .09); --acc-bg2: rgba(143, 188, 208, .16); }
:root[data-accent="signal"] { --acc: #e8913a; --acc2: #ffc285; --acc3: #8a5523; --acc-bg: rgba(232, 145, 58, .09); --acc-bg2: rgba(232, 145, 58, .16); }
:root[data-accent="archon"] { --acc: #f0e2b6; --acc2: #fffbea; --acc3: #9b8c62; --acc-bg: rgba(240, 226, 182, .08); --acc-bg2: rgba(240, 226, 182, .15); --cls: #3b3424; --cls-fg: #fff5da; }
:root[data-accent="symbiose"] { --acc: #6fc8b6; --acc2: #b5f0e3; --acc3: #3c7a6d; --acc-bg: rgba(111, 200, 182, .09); --acc-bg2: rgba(111, 200, 182, .16); }
:root[data-density="kompakt"] { --fs: 12px; --fs-s: 11px; --fs-m: 14px; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
}
::selection { background: var(--acc-bg2); color: var(--acc2); }
:focus-visible { outline: 1px solid var(--acc); outline-offset: 1px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); text-decoration: none; }
a:hover { color: var(--acc2); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line2); border: 2px solid var(--bg); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--line3); }
* { scrollbar-color: var(--line2) transparent; scrollbar-width: thin; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }

/* ---------- Typografische Hilfen ---------- */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cond { font-family: var(--font-cond); }
.serif { font-family: var(--font-serif); }
.lbl { font: 500 var(--fs-xs)/1.2 var(--font-cond); text-transform: uppercase; letter-spacing: .09em; color: var(--mut); }
.mut { color: var(--mut); }
.dim { color: var(--dim); }
.fg2 { color: var(--fg2); }
.acc { color: var(--acc); }
.up { color: var(--ok); }
.dn { color: var(--crit); }
.r { text-align: right; }
.c { text-align: center; }
.nowrap { white-space: nowrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.small { font-size: var(--fs-s); }
.xs { font-size: var(--fs-xs); }
.big { font-size: var(--fs-l); }
.bold { font-weight: 600; }
.hidden { display: none !important; }
.sp { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gap4 { gap: 4px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }

/* ---------- Anwendungsrahmen ---------- */
#app {
  height: 100%; display: grid;
  grid-template-rows: auto var(--hdr-h) minmax(0, 1fr) 26px auto;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
  grid-template-areas: "cls cls" "hdr hdr" "nav work" "sbar sbar" "cls2 cls2";
}
.cls-bar {
  grid-area: cls; background: var(--cls); color: var(--cls-fg); text-align: center;
  font: 600 10px/18px var(--font-cond); letter-spacing: .22em; text-transform: uppercase;
  padding-inline: var(--gut) var(--gut-r); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cls-bar.bot { grid-area: cls2; }

/* Kopfzeile */
.hdr {
  grid-area: hdr; display: flex; align-items: stretch; background: var(--s1); border-bottom: 1px solid var(--line);
  padding-inline: 0 var(--gut-r); min-width: 0; position: relative; z-index: 30;
}
.brand {
  width: var(--nav-w); flex: none; display: flex; align-items: center; gap: 10px; padding-inline: max(14px, env(safe-area-inset-left, 0px)) 12px;
  border-right: 1px solid var(--line); cursor: default; user-select: none;
}
.brand svg { width: 26px; height: 26px; flex: none; }
.brand .wm { font: 600 15px/1 var(--font-cond); letter-spacing: .32em; color: var(--fg); }
.brand .ver { font: 400 9.5px/1 var(--font-mono); color: var(--mut); margin-top: 4px; letter-spacing: .04em; }
.menu-btn { display: none; }
.res { display: flex; align-items: stretch; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; }
.res::-webkit-scrollbar { display: none; }
.rc {
  display: flex; flex-direction: column; justify-content: center; padding: 0 16px; border-right: 1px solid var(--line);
  min-width: 0; flex: none; cursor: help; position: relative;
}
.rc .v { font: 500 14px/1.15 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); white-space: nowrap; }
.rc .v small { font-size: 10.5px; color: var(--mut); margin-left: 3px; }
.rc .d { font: 400 10px/1 var(--font-mono); margin-left: 6px; }
.rc .bar { position: absolute; left: 16px; right: 16px; bottom: 6px; height: 2px; background: var(--line2); }
.rc .bar i { display: block; height: 100%; background: var(--acc); }
.hdr-r { display: flex; align-items: stretch; flex: none; }
.ls {
  display: flex; align-items: center; gap: 8px; padding: 0 14px; border-left: 1px solid var(--line); cursor: help;
}
.ls .boxes { display: flex; gap: 2px; }
.ls .boxes i { width: 7px; height: 16px; background: var(--line2); display: block; }
.ls .boxes i.on { background: var(--ok); }
.ls[data-l="3"] .boxes i.on { background: var(--warn); }
.ls[data-l="4"] .boxes i.on { background: var(--ser); }
.ls[data-l="5"] .boxes i.on { background: var(--crit); animation: blink 1s steps(2) infinite; }
.clock { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; border-left: 1px solid var(--line); }
.clock .t { font: 500 14px/1.15 var(--font-mono); letter-spacing: .02em; }
.user { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-left: 1px solid var(--line); }
.user .seat { width: 28px; height: 28px; border: 1px solid var(--acc3); display: grid; place-items: center; font: 600 11px/1 var(--font-cond); color: var(--acc); letter-spacing: .04em; }
.user .nm { font: 600 12px/1.2 var(--font-cond); letter-spacing: .14em; }
.ib {
  width: 44px; display: grid; place-items: center; background: none; border: 0; border-left: 1px solid var(--line); color: var(--fg2); position: relative;
}
.ib:hover { background: var(--s2); color: var(--fg); }
.ib svg { width: 17px; height: 17px; }
.ib .badge, .ni .badge {
  position: absolute; top: 9px; right: 7px; min-width: 15px; height: 15px; padding: 0 4px; background: var(--acc); color: #0b0b0b;
  font: 600 9.5px/15px var(--font-mono); text-align: center; border-radius: 8px;
}
.ib .badge.crit { background: var(--crit); color: #fff; }

/* Navigation */
.nav {
  grid-area: nav; background: var(--s1); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column;
  padding: 10px 0 10px env(safe-area-inset-left, 0px);
}
.nav .grp-l { padding: 14px 18px 6px; }
.nav .grp-l:first-child { padding-top: 6px; }
.ni {
  display: flex; align-items: center; gap: 11px; padding: 7px 14px 7px 18px; color: var(--fg2); position: relative;
  font: 500 13px/1.25 var(--font-ui); border-left: 2px solid transparent; cursor: pointer; user-select: none;
}
.ni svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.ni:hover { background: var(--s2); color: var(--fg); }
.ni.on { background: var(--acc-bg); color: var(--acc2); border-left-color: var(--acc); }
.ni.on svg { opacity: 1; }
.ni .badge { position: static; margin-left: auto; }
.ni .lock { margin-left: auto; width: 12px; height: 12px; color: var(--dim); }
.ni.locked { color: var(--dim); }
.ni.new::after { content: ''; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; background: var(--acc); border-radius: 50%; animation: pulse 1.6s infinite; }
.nav-f { margin-top: auto; padding: 14px 18px 4px; border-top: 1px solid var(--line); }
.nav-f .mono { font-size: 10px; color: var(--dim); line-height: 1.6; }

/* Arbeitsfläche */
.work { grid-area: work; overflow-y: auto; overflow-x: hidden; position: relative; background: var(--bg); }
.work::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(ellipse at 60% 0%, #000 0%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at 60% 0%, #000 0%, transparent 70%);
}
.mod { position: relative; z-index: 1; padding: 18px var(--gut-r) 32px max(20px, env(safe-area-inset-left, 0px)); max-width: 1680px; animation: modIn .28s var(--ease); }
.mh { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.mh .crumb { font: 500 10px/1 var(--font-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
.mh .crumb b { color: var(--acc); font-weight: 600; }
.mh h1 { font: 600 var(--fs-xl)/1.05 var(--font-cond); letter-spacing: .02em; display: flex; align-items: baseline; gap: 12px; }
.mh h1 .code { font: 500 11px/1 var(--font-mono); color: var(--acc); border: 1px solid var(--acc3); padding: 3px 6px; letter-spacing: .06em; }
.mh .sub { color: var(--fg2); margin-top: 6px; max-width: 72ch; font-size: var(--fs); }
.mh .act { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Raster */
.g { display: grid; gap: 12px; min-width: 0; }
.g > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1fr) 360px; }
.g-main2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g-side { grid-template-columns: 320px minmax(0, 1fr); }
.span2 { grid-column: span 2; }
.span3 { grid-column: span 3; }
.spanall { grid-column: 1 / -1; }

/* Paneele */
.pn { background: var(--s1); border: 1px solid var(--line); position: relative; min-width: 0; display: flex; flex-direction: column; }
.pn.raised { background: var(--s2); }
.pn-h {
  display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); flex: none; min-width: 0;
}
.pn-h h3 { font: 600 11px/1 var(--font-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pn-h .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.pn-h .meta { font: 400 10.5px/1 var(--font-mono); color: var(--mut); white-space: nowrap; }
.pn-b { padding: 12px; min-width: 0; flex: 1; }
.pn-b.flush { padding: 0; }
.pn-b.scroll { overflow-y: auto; }
.pn-f { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pn.tick::before, .pn.tick::after { content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--acc3); border-style: solid; pointer-events: none; }
.pn.tick::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.pn.tick::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.pn.alert { border-color: var(--crit); box-shadow: 0 0 0 1px var(--crit-bg) inset; }
.empty { padding: 28px 16px; text-align: center; color: var(--mut); font-size: var(--fs-s); }
.empty b { display: block; color: var(--fg2); font-weight: 500; margin-bottom: 4px; font-size: var(--fs); }

/* Kennzahlen */
.kpi { padding: 12px 14px; background: var(--s1); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 6px; position: relative; }
.kpi .v { font: 500 23px/1.05 var(--font-ui); letter-spacing: -.01em; white-space: nowrap; }
.kpi .v small { font-size: 12px; color: var(--mut); font-weight: 400; margin-left: 2px; }
.kpi .dl { font: 400 11px/1 var(--font-mono); }
.kpi .sp-wrap { height: 28px; margin-top: 2px; }
.kpi .sp-wrap svg { width: 100%; height: 28px; display: block; }

/* Tabellen */
.tbl-w { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs); font-variant-numeric: tabular-nums; }
.tbl th {
  text-align: left; font: 500 10px/1.2 var(--font-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut);
  padding: 8px 10px; border-bottom: 1px solid var(--line2); position: sticky; top: 0; background: var(--s1); z-index: 1; white-space: nowrap;
}
.tbl th.sortable { cursor: pointer; }
.tbl th.sortable:hover { color: var(--fg); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover td { background: var(--s2); }
.tbl tr.on td { background: var(--acc-bg); }
.tbl tr.click { cursor: pointer; }
.tbl .num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.tbl td.k { color: var(--fg2); }

/* Statuskennzeichen */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 7px 2px 6px; border: 1px solid var(--line2); background: var(--s2);
  font: 500 10px/1.4 var(--font-cond); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; color: var(--fg);
}
.pill::before { content: ''; width: 6px; height: 6px; background: var(--mut); flex: none; }
.pill.ok { border-color: rgba(47, 179, 68, .4); background: var(--ok-bg); } .pill.ok::before { background: var(--ok); }
.pill.warn { border-color: rgba(250, 178, 25, .4); background: var(--warn-bg); } .pill.warn::before { background: var(--warn); }
.pill.ser { border-color: rgba(236, 131, 90, .4); background: var(--ser-bg); } .pill.ser::before { background: var(--ser); }
.pill.crit { border-color: rgba(224, 72, 72, .5); background: var(--crit-bg); } .pill.crit::before { background: var(--crit); transform: rotate(45deg); }
.pill.info { border-color: rgba(57, 135, 229, .4); background: var(--info-bg); } .pill.info::before { background: var(--info); border-radius: 50%; }
.pill.acc { border-color: var(--acc3); background: var(--acc-bg); color: var(--acc2); } .pill.acc::before { background: var(--acc); }
.pill.plain::before { display: none; }
.pill.live::before { animation: pulse 1.4s infinite; }
.tag { display: inline-block; font: 500 10px/1.3 var(--font-mono); padding: 1px 5px; border: 1px solid var(--line2); color: var(--fg2); white-space: nowrap; }
.tag.acc { border-color: var(--acc3); color: var(--acc); }

/* Schaltflächen */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border: 1px solid var(--line3);
  background: var(--s2); color: var(--fg); font: 500 12px/1 var(--font-cond); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--s3); border-color: var(--mut); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 14px; height: 14px; }
.btn.pri { background: var(--acc); border-color: var(--acc); color: #0d0b07; }
.btn.pri:hover { background: var(--acc2); border-color: var(--acc2); }
.btn.ghost { background: transparent; border-color: var(--line2); }
.btn.ghost:hover { border-color: var(--line3); background: var(--s2); }
.btn.dan { border-color: rgba(224, 72, 72, .6); color: #ffb1a8; background: var(--crit-bg); }
.btn.dan:hover { background: rgba(224, 72, 72, .25); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 11px; }
.btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .42; cursor: not-allowed; transform: none; }
.lnk { background: none; border: 0; padding: 0; color: var(--acc); font: inherit; cursor: pointer; }
.lnk:hover { color: var(--acc2); text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line2); background: var(--s1); }
.seg button { background: none; border: 0; padding: 0 10px; height: 26px; font: 500 11px/1 var(--font-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); border-right: 1px solid var(--line2); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--fg); background: var(--s2); }
.seg button.on { background: var(--acc-bg2); color: var(--acc2); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; font: 500 12px/1 var(--font-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); white-space: nowrap; margin-bottom: -1px; }
.tabs button:hover { color: var(--fg); }
.tabs button.on { color: var(--acc2); border-bottom-color: var(--acc); }
.tabs button .n { font-family: var(--font-mono); color: var(--dim); margin-left: 6px; }

/* Formulare */
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .fld > .lbl { font: 500 10px/1.2 var(--font-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.inp, select.inp, textarea.inp {
  height: 32px; padding: 0 10px; background: var(--bg); border: 1px solid var(--line2); color: var(--fg); width: 100%; min-width: 0; border-radius: 0;
}
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc-bg2); }
.inp.mono { font-family: var(--font-mono); }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--mut) 50%), linear-gradient(135deg, var(--mut) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input[type="range"] { width: 100%; accent-color: var(--acc); }
input[type="checkbox"] { accent-color: var(--acc); width: 15px; height: 15px; }
.chk { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }

/* Messbalken */
.meter { height: 4px; background: var(--line2); position: relative; overflow: hidden; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); transition: width .5s var(--ease); }
.meter.ok > i { background: var(--ok); } .meter.warn > i { background: var(--warn); } .meter.ser > i { background: var(--ser); } .meter.crit > i { background: var(--crit); }
.meter.tall { height: 6px; }
.meter.prog > i { background: linear-gradient(90deg, var(--acc3), var(--acc)); }
.meter.stripes > i::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 12px); animation: stripes 1s linear infinite; }
.mrow { display: grid; grid-template-columns: 108px minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 3px 0; }
.mrow .k { color: var(--fg2); font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .v { font: 500 12px/1 var(--font-mono); text-align: right; }

/* Listen */
.li { display: flex; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; align-items: flex-start; }
.li:hover { background: var(--s2); }
.li.on { background: var(--acc-bg); box-shadow: inset 2px 0 0 var(--acc); }
.li.unread .t { color: var(--fg); font-weight: 600; }
.li.unread::before { content: ''; width: 6px; height: 6px; background: var(--acc); flex: none; margin-top: 6px; margin-left: -4px; }
.li .t { color: var(--fg2); font-size: var(--fs); line-height: 1.3; }
.li .m { font: 400 10.5px/1.3 var(--font-mono); color: var(--mut); margin-top: 3px; }
.li .body { min-width: 0; flex: 1; }
.li .ic svg { width: 15px; height: 15px; }
.li .ic { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 1px solid var(--line2); color: var(--fg2); font: 600 10px/1 var(--font-cond); letter-spacing: .04em; }

/* Kennwert-Paare */
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; font-size: var(--fs-s); }
.kv dt { color: var(--mut); white-space: nowrap; }
.kv dd { margin: 0; color: var(--fg); min-width: 0; overflow-wrap: anywhere; }

/* Benachrichtigungen */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  pointer-events: auto; background: var(--s2); border: 1px solid var(--line2); border-left: 3px solid var(--acc); padding: 10px 12px; display: flex; gap: 10px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .55); animation: toastIn .3s var(--ease); cursor: pointer;
}
.toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.crit { border-left-color: var(--crit); }
.toast .tt { font-weight: 600; font-size: 12.5px; }
.toast .tx { color: var(--fg2); font-size: 12px; margin-top: 2px; }
.toast .tc { font: 500 9.5px/1 var(--font-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin-bottom: 4px; }
.toast.out { animation: toastOut .25s var(--ease) forwards; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); background: var(--s1); border-left: 1px solid var(--line2); z-index: 70;
  transform: translateX(100%); transition: transform .28s var(--ease); display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0, 0, 0, .5);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.open { transform: none; }
.drawer .pn-h { height: 48px; }
.drawer .list { overflow-y: auto; flex: 1; }
.scrim { position: fixed; inset: 0; background: rgba(2, 3, 4, .55); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }

/* Dialoge */
.ovl { position: fixed; inset: 0; z-index: 90; background: rgba(3, 4, 5, .72); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.mdl { width: min(620px, 100%); max-height: calc(100% - 16px); background: var(--s1); border: 1px solid var(--line2); display: flex; flex-direction: column; box-shadow: 0 30px 90px rgba(0, 0, 0, .7); animation: mdlIn .3s var(--ease); position: relative; }
.mdl.wide { width: min(900px, 100%); }
.mdl-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.mdl-h .lbl { margin-bottom: 6px; }
.mdl-h h2 { font: 600 20px/1.2 var(--font-cond); letter-spacing: .01em; }
.mdl-b { padding: 16px 18px; overflow-y: auto; min-height: 0; }
.mdl-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mdl .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; background: none; border: 0; color: var(--mut); display: grid; place-items: center; }
.mdl .x:hover { color: var(--fg); }
.mdl.crisis { border-color: var(--crit); }
.mdl.crisis::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: repeating-linear-gradient(-45deg, var(--crit) 0 10px, #2a0d0d 10px 20px); }
.cr-head { display: flex; gap: 16px; align-items: center; }
.cr-ring { width: 64px; height: 64px; flex: none; position: relative; }
.cr-ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.cr-ring .n { position: absolute; inset: 0; display: grid; place-items: center; font: 600 16px/1 var(--font-mono); }
.opt { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line2); background: var(--s2); cursor: pointer; text-align: left; width: 100%; align-items: flex-start; }
.opt:hover { border-color: var(--acc3); background: var(--s3); }
.opt .on { flex: none; width: 22px; height: 22px; border: 1px solid var(--line3); display: grid; place-items: center; font: 600 11px/1 var(--font-mono); color: var(--fg2); }
.opt.py { border-color: var(--acc3); }
.opt.dis { opacity: .45; cursor: not-allowed; }
.opt .t { font-weight: 600; }
.opt .d { color: var(--fg2); font-size: var(--fs-s); margin-top: 3px; }
.opt .c { font: 400 11px/1.3 var(--font-mono); color: var(--mut); margin-top: 6px; }
.crisis-strip svg { width: 15px; height: 15px; flex: none; }
.crisis-strip {
  position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,.5); background: var(--crit); color: #fff; border: 0;
  font: 600 11px/1 var(--font-cond); letter-spacing: .12em; text-transform: uppercase; padding: 0 12px; height: 34px; display: flex; align-items: center; gap: 10px;
  animation: critPulse 1.2s infinite;
}

/* Schnellzugriff */
.cmdk { width: min(640px, 100%); background: var(--s1); border: 1px solid var(--line3); box-shadow: 0 30px 90px rgba(0, 0, 0, .7); align-self: start; margin-top: 10vh; animation: mdlIn .2s var(--ease); }
.cmdk input { width: 100%; height: 50px; padding: 0 16px; background: transparent; border: 0; border-bottom: 1px solid var(--line2); font-size: 16px; outline: none; }
.cmdk .res-l { max-height: 52vh; overflow-y: auto; }
.cmdk .it { display: flex; gap: 12px; padding: 9px 16px; cursor: pointer; align-items: center; }
.cmdk .it.on { background: var(--acc-bg); }
.cmdk .it .k { font: 500 9.5px/1 var(--font-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); width: 84px; flex: none; }
.cmdk .it .s { color: var(--mut); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
.cmdk .foot { padding: 8px 16px; border-top: 1px solid var(--line); font: 400 10.5px/1 var(--font-mono); color: var(--dim); display: flex; gap: 14px; }
kbd { font: 500 10px/1 var(--font-mono); padding: 2px 5px; border: 1px solid var(--line3); border-bottom-width: 2px; color: var(--fg2); background: var(--s2); }

/* Tooltip */
.tip {
  position: fixed; z-index: 100; max-width: 300px; background: #1b2026; border: 1px solid var(--line3); padding: 8px 10px; font-size: 12px; line-height: 1.45;
  color: var(--fg); pointer-events: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); opacity: 0; transition: opacity .1s;
}
.tip.on { opacity: 1; }
.tip b { color: var(--acc2); font-weight: 600; display: block; margin-bottom: 2px; font-family: var(--font-cond); letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
.chart-tip { position: absolute; pointer-events: none; background: #1b2026; border: 1px solid var(--line3); padding: 6px 8px; font: 400 11px/1.4 var(--font-mono); color: var(--fg); white-space: nowrap; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.5); }

/* Statusleiste */
.sbar {
  grid-area: sbar; display: flex; align-items: center; background: var(--s1); border-top: 1px solid var(--line); font: 400 10.5px/1 var(--font-mono);
  color: var(--mut); padding-inline: var(--gut) var(--gut-r); gap: 0; min-width: 0; overflow: hidden;
}
.sbar .seg-i { padding: 0 12px; border-right: 1px solid var(--line); white-space: nowrap; display: flex; align-items: center; gap: 6px; height: 100%; }
.sbar .seg-i:first-child { padding-left: 0; }
.sbar .dot { width: 6px; height: 6px; background: var(--ok); border-radius: 50%; animation: pulse 2s infinite; }
.ticker { flex: 1; overflow: hidden; position: relative; height: 100%; min-width: 0; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker .tr { position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%); display: flex; gap: 40px; will-change: transform; }
.ticker .tr span { color: var(--fg2); }
.ticker .tr span b { color: var(--acc); font-weight: 500; margin-right: 8px; }

/* Anmeldung */
.boot { position: fixed; inset: 0; z-index: 200; background: #040506; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: env(safe-area-inset-top, 0px) var(--gut-r) env(safe-area-inset-bottom, 0px) var(--gut); }
.boot::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
.boot-log { position: absolute; left: var(--gut); top: max(18px, env(safe-area-inset-top, 0px)); right: var(--gut-r); font: 400 11.5px/1.65 var(--font-mono); color: #8d9690; white-space: pre-wrap; max-height: 48vh; overflow: hidden; }
.boot-log .ok { color: var(--ok); } .boot-log .w { color: var(--warn); } .boot-log .a { color: var(--acc); }
.boot-stage { position: relative; z-index: 2; width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; }
.seal { width: 150px; height: 150px; color: var(--acc); }
.seal.spin .ring { animation: spin 60s linear infinite; transform-origin: 50% 50%; }
.boot h1 { font: 500 34px/1 var(--font-cond); letter-spacing: .5em; margin-right: -.5em; color: var(--fg); }
.boot .tagline { font: italic 500 17px/1.35 var(--font-serif); color: var(--fg2); }
.boot .fine { font: 400 10.5px/1.6 var(--font-mono); color: var(--dim); letter-spacing: .04em; }
.scan-btn { width: 108px; height: 132px; border: 1px solid var(--acc3); background: radial-gradient(circle at 50% 45%, var(--acc-bg2), transparent 70%); position: relative; display: grid; place-items: center; color: var(--acc); touch-action: none; user-select: none; -webkit-user-select: none; }
.scan-btn svg { width: 62px; height: 78px; }
.scan-btn .beam { position: absolute; left: 8px; right: 8px; height: 2px; background: var(--acc2); box-shadow: 0 0 12px var(--acc); top: 10%; opacity: 0; }
.scan-btn.on .beam { opacity: 1; animation: beam .9s ease-in-out infinite alternate; }
.scan-btn .fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: var(--acc-bg2); }
.scan-btn.ok { border-color: var(--ok); color: var(--ok); }
.cert { background: #11100d; border: 1px solid #3a3222; padding: 34px 34px 28px; font-family: var(--font-serif); color: #e6dcc6; text-align: center; position: relative; width: min(560px, 100%); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.cert::before { content: ''; position: absolute; inset: 6px; border: 1px solid #2c261a; pointer-events: none; }
.cert .h { font-size: 12px; letter-spacing: .4em; text-transform: uppercase; color: var(--acc); font-family: var(--font-cond); }
.cert h2 { font: 500 30px/1.15 var(--font-serif); margin: 12px 0 14px; color: #f2e9d6; }
.cert p { font-size: 17.5px; line-height: 1.5; color: #d8ccb3; margin: 0 auto 12px; max-width: 46ch; }
.cert .sig { display: flex; justify-content: space-between; margin-top: 22px; font-size: 13px; color: #a69a80; font-style: italic; gap: 16px; }
.cn-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
.cn-grid button { height: 40px; background: var(--s1); border: 1px solid var(--line2); font: 600 13px/1 var(--font-cond); letter-spacing: .2em; color: var(--fg2); }
.cn-grid button:hover { border-color: var(--acc3); color: var(--fg); }
.cn-grid button.on { border-color: var(--acc); background: var(--acc-bg2); color: var(--acc2); }

/* Sperrbildschirm */
.lockscreen { position: fixed; inset: 0; z-index: 150; background: rgba(4, 5, 6, .97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; animation: fadeIn .5s; padding: var(--gut); text-align: center; }
.lockscreen canvas { width: min(320px, 70vw); height: min(320px, 70vw); }

/* Weltkarte */
.map-wrap { position: relative; width: 100%; background: radial-gradient(ellipse at 50% 40%, #0b1117 0%, #06080a 75%); overflow: hidden; user-select: none; touch-action: none; }
.map-wrap canvas { display: block; width: 100%; height: 100%; }
.map-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 20px); }
.map-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.map-zoom button { width: 28px; height: 28px; background: rgba(12, 15, 18, .9); border: 1px solid var(--line2); color: var(--fg2); font: 500 14px/1 var(--font-mono); }
.map-legend { position: absolute; left: 10px; bottom: 10px; background: rgba(12, 15, 18, .92); border: 1px solid var(--line2); padding: 8px 10px; font: 400 10.5px/1.4 var(--font-mono); color: var(--fg2); z-index: 2; }
.map-legend .grad { width: 160px; height: 6px; margin: 5px 0 3px; }
.map-hover { position: absolute; pointer-events: none; z-index: 3; background: rgba(17, 21, 26, .96); border: 1px solid var(--line3); padding: 8px 10px; font-size: 12px; min-width: 170px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.map-hover .n { font: 600 12px/1.2 var(--font-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--acc2); margin-bottom: 4px; }

/* Rat */
.seats svg { width: 100%; height: auto; display: block; }
.member { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.member .sn { width: 40px; height: 40px; border: 1px solid var(--line3); display: grid; place-items: center; font: 500 15px/1 var(--font-serif); color: var(--acc); }
.member.proxy .sn { border-style: dashed; color: var(--dim); }
.vote-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.vote-btns .btn { height: 40px; }
.vote-btns .btn.on.ja { background: var(--ok-bg); border-color: var(--ok); color: #bff0c6; }
.vote-btns .btn.on.nein { background: var(--crit-bg); border-color: var(--crit); color: #ffc9c2; }
.vote-btns .btn.on.enth { background: var(--s3); border-color: var(--fg2); }

/* PYTHIA */
.chat { display: flex; flex-direction: column; gap: 14px; padding: 16px; overflow-y: auto; min-height: 0; flex: 1; }
.msg { max-width: 78ch; display: flex; gap: 12px; animation: modIn .25s var(--ease); }
.msg .av { width: 30px; height: 30px; flex: none; border: 1px solid var(--line3); display: grid; place-items: center; font: 600 10px/1 var(--font-cond); color: var(--fg2); }
.msg.py .av { border-color: var(--acc3); color: var(--acc); }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg .bub { padding: 10px 13px; background: var(--s2); border: 1px solid var(--line); white-space: pre-wrap; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.msg.me .bub { background: var(--acc-bg); border-color: var(--acc3); }
.msg.py .bub { font-size: 13.5px; }
.msg .foot { font: 400 10.5px/1.4 var(--font-mono); color: var(--mut); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
.msg .acts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; align-items: flex-start; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--line2); background: var(--s1); color: var(--fg2); font-size: 12px; white-space: nowrap; }
.chip:hover { border-color: var(--acc3); color: var(--fg); }
.caret::after { content: '▍'; animation: blink 1s steps(2) infinite; color: var(--acc); margin-left: 1px; }
.glitch { animation: glitch .35s steps(3) 4; color: #f2c6c6; }

/* Terminal */
.term { background: #050607; border: 1px solid var(--line); font: 400 13px/1.55 var(--font-mono); color: #c9d1c7; padding: 14px 16px; height: calc(100vh - 230px); min-height: 360px; overflow-y: auto; cursor: text; position: relative; }
.term .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: var(--acc); }
.term .e { color: #ff8f84; } .term .o { color: #7fd38d; } .term .w { color: #f4c76a; } .term .d { color: #6c7470; } .term .h { color: #e9e4d8; font-weight: 500; }
.term .in-row { display: flex; gap: 8px; }
.term input { flex: 1; background: transparent; border: 0; outline: none; font: inherit; color: #e9e4d8; caret-color: var(--acc); min-width: 0; padding: 0; }

/* Archiv */
.doc { background: var(--paper); border: 1px solid #262320; color: var(--paper-fg); padding: 28px 32px 36px; font: 400 15.5px/1.7 var(--font-serif); position: relative; }
.doc .dh { border-bottom: 1px solid #2d2a25; padding-bottom: 14px; margin-bottom: 18px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.doc .dh h2 { font: 600 25px/1.15 var(--font-serif); color: #efe6d3; }
.doc .stamp { margin-left: auto; border: 2px solid #8f2a26; color: #c3473f; font: 700 11px/1 var(--font-cond); letter-spacing: .2em; padding: 6px 9px; transform: rotate(-4deg); opacity: .85; text-transform: uppercase; white-space: nowrap; }
.doc p { margin: 0 0 14px; max-width: 68ch; }
.doc h4 { font: 600 12px/1 var(--font-cond); letter-spacing: .2em; text-transform: uppercase; color: var(--acc); margin: 22px 0 10px; }
.redact { background: #000; color: transparent; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 2px; user-select: none; position: relative; }
.redact.scan { background: linear-gradient(90deg, #000 0%, #000 40%, #3a2a10 50%, #000 60%); background-size: 300% 100%; animation: scanline 1.1s linear infinite; }
.redact.lock { background: repeating-linear-gradient(-45deg, #000 0 5px, #120d0c 5px 10px); }
.revealed { background: rgba(201, 165, 92, .14); color: #f6e7c4; box-shadow: inset 0 -1px 0 var(--acc3); padding: 0 2px; animation: reveal .8s var(--ease); }
.frag-card { border: 1px solid var(--line2); background: var(--s1); padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
.frag-card .L { font: 500 36px/1 var(--font-serif); color: var(--dim); }
.frag-card .code { font: 600 18px/1 var(--font-mono); letter-spacing: .2em; color: var(--dim); }
.frag-card.got { border-color: var(--acc3); background: var(--acc-bg); }
.frag-card.got .L, .frag-card.got .code { color: var(--acc2); }

/* Mechanismus / Sitz 0 */
.mech-wrap { position: relative; background: radial-gradient(circle at 50% 45%, #15120c 0%, #050505 70%); border: 1px solid var(--line); }
.mech-wrap canvas { display: block; width: 100%; }
.null-ovl { position: fixed; inset: 0; z-index: 180; background: #000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px; padding: var(--gut); text-align: center; overflow-y: auto; }
.null-ovl .ln { font: 400 13px/1.7 var(--font-mono); color: #9aa39c; max-width: 640px; text-align: left; white-space: pre-wrap; }
.null-ovl h2 { font: 500 34px/1.15 var(--font-serif); color: #f1e7cf; max-width: 26ch; }
.null-ovl p { font: 400 18px/1.55 var(--font-serif); color: #cfc3a8; max-width: 52ch; }
.end-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: min(900px, 100%); }

    return { lon: b[0], lat: b[1], rx: b[2], ry: b[3], c: Math.cos(r), s: Math.sin(r), w: b[5] };
  });

  function bump(p, lon, lat) {
    const dx = lon - p.lon, dy = lat - p.lat;
    const u = (dx * p.c + dy * p.s) / p.rx, v = (-dx * p.s + dy * p.c) / p.ry;
    return Math.exp(-(u * u + v * v));

  function field(lon, lat, detail) {
    // Domänenverzerrung für organische Küstenlinien
    const wl = lon + (fbm(lon / 26 + 3, lat / 26 + 9, SEED + 3, 3) - 0.5) * 26;
    const wb = lat + (fbm(lon / 26 + 21, lat / 26 + 5, SEED + 4, 3) - 0.5) * 18;
    let v = 0, best = 0, k = null;
    for (let i = 0; i < PREP.length; i++) {
      const p = PREP[i];
      if (p.k === 'KYT') continue;
      const b = bump(p, wl, wb) * p.w;
      v += b;
      if (b > best) { best = b; k = p.k; }
    }
    for (let i = 0; i < PSINK.length; i++) v -= bump(PSINK[i], wl, wb) * PSINK[i].w;

    const n = fbm(lon / 15 + 100, lat / 15 + 100, SEED, oct) - 0.5;
    const n2 = fbm(lon / 5 + 50, lat / 5 + 50, SEED + 7, detail ? 5 : 3) - 0.5;

    if (lat < -63) v += (-63 - lat) * 0.16;
    if (lat > 74) v += (lat - 74) * 0.05;
    // Kythera: kleine Insel, unabhängig von Verzerrung
    const ky = PREP[PREP.length - 1];
    const kb = bump(ky, lon, lat) * 2.2;
    if (kb > 0.25) { v = Math.max(v, kb - 0.1 + n2 * 0.6); k = 'KYT'; best = 1; }
    return { h: v - 0.45, k: best > 0.12 ? k : null };
  }

  const REGION_SEEDS = {

  };
  const KONT_REGIONS = {};
  for (const id in REGION_SEEDS) {
    const r = REGION_SEEDS[id];
    (KONT_REGIONS[r.k] = KONT_REGIONS[r.k] || []).push(id);
  }

  let cache = null;
  function build() {
    if (cache) return cache;
    const land = new Uint8Array(W * H);
    const height = new Float32Array(W * H);
    const region = new Array(W * H).fill(null);
    const ids = Object.keys(REGION_SEEDS);
    for (let j = 0; j < H; j++) {

        if (f.h > 0) {
          land[idx] = 1;

          if (f.k === 'KYT') { region[idx] = 'KYT'; continue; }
          if (!cands) cands = ids;
          // verzerrte Distanz für organische Grenzen
          const wx = lon + (fbm(lon / 9, lat / 9, 77, 3) - 0.5) * 18;
          const wy = lat + (fbm(lon / 9 + 40, lat / 9 + 40, 78, 3) - 0.5) * 14;
          let bd = 1e9, br = null;
          for (const id of cands) {
            const s = REGION_SEEDS[id].seed;
            const dx = wx - s[0], dy = wy - s[1];
            const d = dx * dx + dy * dy;
            if (d < bd) { bd = d; br = id; }
          }

        }
      }

  }

    if (i < 0 || i >= W || j < 0 || j >= H) return -1;
    return j * W + i;
  }
  function regionAt(lon, lat) {
    const idx = cellAt(lon, lat);
    if (idx < 0) return null;
    return build().region[idx];
  }

      id: 'KY-0001', title: 'Charta des Kuratoriums', date: '14.03.1902', clr: 3, kind: 'Charta', src: 'Original: Gotthelm, Tresor 1 · Abschrift 1957',
      body: `## Präambel

Wir, die Unterzeichnenden, im Besitz eines Werkes, das älter ist als jede Krone und genauer als jede Uhr, verpflichten uns und unsere Nachfolger, es zu bewahren, zu verstehen und seinem Rat mit Vernunft zu folgen.

## Artikel 0

{{r1:Der Mechanismus selbst hält den nullten Sitz. Seine Stimme wird nicht gezählt, sondern befolgt.}}

## Artikel I

Das Kuratorium besteht aus neun Sitzen. Jeder Sitz hat eine Stimme. Beschlüsse bedürfen der Mehrheit der abgegebenen Stimmen.

## Artikel II

Ein Sitz wird auf Lebenszeit oder bis zum Rücktritt gehalten. Der Nachfolger wird vom Vorsitz vorgeschlagen und vom Plenum bestätigt. {{r2:Der Mechanismus ist vor jeder Ernennung zu befragen.}}

## Artikel III

Das Kuratorium tritt nicht in Erscheinung. Es handelt durch Stiftungen, Häuser und Gesellschaften, deren Verbindung untereinander nicht offenbart wird.

## Artikel IV

Die Mittel des Kuratoriums dienen der Erhaltung der Ordnung, der Linderung von Not und dem Fortschritt der Wissenschaften. In dieser Reihenfolge.

## Artikel IX

Wer einen Sitz hält, schwört Verschwiegenheit über die Existenz des Kuratoriums, über seine Beschlüsse und über den Mechanismus. Der Eid gilt über den Rücktritt hinaus.

Gezeichnet zu Kap Orsa, am vierzehnten Tag des März im Jahre neunzehnhundertzwei. Neun Unterschriften. {{r3:Eine zehnte Zeile ohne Namen, nur ein Kreis.}}`,
      red: { r1: { perm: true }, r2: { clr: 4, cost: 18 }, r3: { clr: 3, cost: 10 } },

    {
      id: 'KY-0007', title: 'Fundbericht der Schwammtaucher von Symi', date: '04.04.1901', clr: 3, kind: 'Bericht', src: 'Übersetzung aus dem Griechischen, Bibliotheca Alamarensis',
      body: `Am dritten Tag nach Ostern tauchten wir vor der Nordküste der Insel Kythera in einer Tiefe von etwa 45 Metern. Wir fanden das Wrack eines großen Schiffes, beladen mit Statuen aus Bronze und Marmor, Amphoren und Glas.

Unter den Funden war ein Kasten aus Holz, so groß wie zwei Hände, der beim Heben zerfiel. Darin Zahnräder aus Bronze, grün vom Meer, sehr fein gearbeitet, mit Schrift, die keiner von uns lesen konnte.

Wir übergaben alles den Behörden. {{r1:Bis auf ein zweites Stück, kleiner, rund, mit einem Zeiger und einem Ring aus Zeichen. Der Kapitän sagte, ein Herr aus Kap Orsa zahle dafür mehr als das Museum für alles andere.}}

Der Taucher Elias Stadiatis kam aus der Tiefe und sprach von Toten, die auf dem Grund lägen und ihn ansähen. Wir glaubten ihm nicht. Später sagte er, er habe nur die Statuen gesehen. {{r2:Er sagte auch, das runde Stück habe sich bewegt, als er es berührte. Langsam, wie ein Herzschlag.}}`,
      red: { r1: { clr: 3, cost: 8 }, r2: { clr: 3, cost: 12 } },
    },
    {
      id: 'KY-0031', title: 'Protokoll der Gründungssitzung', date: '14.03.1902', clr: 3, kind: 'Protokoll', src: 'Gotthelm, Bestand A',
      body: `Anwesend: neun Herren und Damen, deren Namen in Anlage 1 verzeichnet sind. Ort: Villa Serrano, Kap Orsa. Beginn: 21 Uhr.

Der Gastgeber legt das Fundstück vor, das in dieser Niederschrift „der Mechanismus“ genannt wird. Er berichtet, dass er es seit elf Monaten studiert und dass es die Stellung der Gestirne für jedes beliebige Datum mit einer Genauigkeit wiedergibt, die die Sternwarte von Alamar übertrifft.

Er berichtet ferner, dass der äußere Ring nicht den Gestirnen folgt. Er zeigt neun Zeichen und ein zehntes. Die Zeiger, so der Gastgeber, bewegen sich in Abständen, die mit keinem bekannten Himmelskörper übereinstimmen, wohl aber mit den Preisen für Getreide in Alamar, den Pegelständen des Meridianflusses und den Daten dreier Regierungsstürze der letzten zwanzig Jahre.

Heftige Aussprache. Ein Teilnehmer nennt dies Aberglauben. Der Gastgeber antwortet, er habe auch daran geglaubt, bis er auf Grundlage der Zeiger im Herbst Getreide gekauft habe.

Beschluss: Die Anwesenden gründen das Kuratorium. Der Mechanismus wird in Verwahrung genommen. Seine Anzeigen werden fortan protokolliert. {{r1:Abstimmung 9:0. Der Gastgeber vermerkt, der zehnte Zeiger habe während der Abstimmung auf Zustimmung gestanden.}}

Ende der Sitzung: 3 Uhr 12.`,

      id: 'KY-0114', title: 'Abschlussbericht Rechenwerk KY-1', date: '30.11.1957', clr: 3, kind: 'Bericht', src: 'Technische Kommission, Kaldfjord',
      body: `Das elektromechanische Rechenwerk KY-1 bildet die 37 bekannten Zahnräder des Mechanismus und die Bewegung des äußeren Rings nach. Bauzeit: vier Jahre. Relais: 11.400.

Ergebnis: KY-1 reproduziert die historischen Anzeigen des Mechanismus seit 1902 mit einer Übereinstimmung von 99,2 %. Die verbleibenden Abweichungen sind auf Messfehler bei der Protokollierung zurückzuführen.

KY-1 erlaubt erstmals, die Anzeigen für beliebige zukünftige Daten zu berechnen, ohne den Mechanismus zu bewegen. Die Kommission empfiehlt, den Mechanismus selbst nicht mehr zu berühren.

In 14 Testfällen hat KY-1 Ereignisse angezeigt, die zum Zeitpunkt der Rechnung noch nicht eingetreten waren. In 11 Fällen trafen sie ein. {{r1:In allen 11 Fällen hatte das Kuratorium zuvor auf Grundlage der Anzeige gehandelt. In den 3 übrigen Fällen nicht.}}

Die Kommission empfiehlt, diesen Umstand nicht weiter zu untersuchen.`,

      body: `Mit dem heutigen Tag übernimmt das digitale System PYTHIA die Funktionen von KY-1. PYTHIA rechnet nicht mehr nur die Zeiger nach. Es verknüpft sie mit Marktdaten, Wetterdaten, Bevölkerungsstatistiken und den Protokollen sämtlicher Plenarsitzungen seit 1902.

PYTHIA gibt Empfehlungen in natürlicher Sprache aus. Es bewertet Beschlussvorlagen und prognostiziert deren Folgen. Es lernt aus jeder Entscheidung des Plenums.

      body: `Der Inhaber von Sitz VIII erklärt seinen Rückzug aus der persönlichen Teilnahme am Plenum. Der Sitz bleibt besetzt. Die Stimme wird künftig über einen beglaubigten Proxy abgegeben.

      id: 'KY-0409', title: 'Persönliche Aufzeichnungen VESPER', date: '09.09.2026', clr: 4, kind: 'Notiz', src: 'Arbeitsbereich Sitz IX, gesichert nach Rücktritt',
      body: `Ich habe die Stimmen von HYDRA seit 1988 mit den Empfehlungen von PYTHIA verglichen. 1.412 Abstimmungen. Keine einzige Abweichung.

(function () {
  'use strict';
  const KY = window.KY;
  const U = KY.U;
  const SAVE_KEY = 'kythera.sitz9.v3';

  KY.newState = function () {
    const D = KY.data;
    const now = Date.now();
    const S = {
      v: 3,
      meta: { created: now, saved: now, lastSeen: now, sessions: 0, boots: 0 },
      user: {
        codename: null, clr: 3, sworn: false,
        prefs: { sound: true, vol: 0.45, motion: true, accent: 'messing', density: 'normal', scan: true, hints: true },
      },
      res: { kap: 184.6, ein: 120, rech: 260, disk: 86, ans: 46 },
      regions: {},
      lagestufe: 2,
      market: { c: {}, com: {}, idx: { v: 1000, h: [] }, nw: [], fees: 0 },
      projects: { active: [], done: [], seq: 0 },
      research: { done: {}, active: null, queue: [], stations: 0 },
      council: { att: {}, open: null, past: [], seq: 114, hydraAudit: false, freigabeTries: 0, proposalQueue: [], promises: [] },
      people: {},
      infra: { sats: [], ships: [], dcs: [], imgs: [], extraSats: 0 },
      dsp: { list: [], seq: 1300, filters: ['Kythera', 'Sturm'], autoFlag: true },
      archive: { rev: {}, unlocked: {}, read: {}, analysing: null },
      msgs: [],
      news: [],
      log: [],
      notifs: [],
      integ: { nodes: {}, anomalies: [], level: 97 },
      story: { flags: {}, frags: {}, ending: null, shownMsgs: {} },
      pythia: [],
      term: { hist: [] },
      onb: { tasks: {}, done: false, hidden: false },
      crisis: null,
      buffs: [],
      timers: {},
      t: 0,
      stats: { proj: 0, projOk: 0, trades: 0, votes: 0, crises: 0, crisesAuto: 0, profit: 0, decrypted: 0 },
    };
    for (const id of D.regionOrder) {
      const r = D.regions[id];
      const m = Object.assign({}, r.m);
      const h = {};
      for (const k in m) h[k] = Array.from({ length: 40 }, (_, i) => U.clamp(m[k] + Math.sin(i / 5 + id.charCodeAt(0)) * 1.5 + (Math.random() - 0.5) * 2, 0, 100));
      S.regions[id] = { m, base: Object.assign({}, r.m), h, res: 0, mora: 0, warn: null, crisisT: 0 };
    }
    for (const c of D.companies) {
      const hist = [];
      let p = c.p * (1 + (Math.random() - 0.5) * 0.08);
      for (let i = 0; i < 180; i++) { p *= 1 + U.gauss() * c.v * 0.0035 + (c.p - p) / c.p * 0.02; hist.push(+p.toFixed(4)); }
      S.market.c[c.t] = { p: c.p, f: c.p, h: hist, u: c.hold / c.p, cost: c.hold, mu: 0, muT: 0 };
    }
    for (const c of D.commodities) {
      const hist = [];
      let p = c.p;
      for (let i = 0; i < 120; i++) { p *= 1 + U.gauss() * c.v * 0.003 + (c.p - p) / c.p * 0.03; hist.push(+p.toFixed(3)); }
      S.market.com[c.id] = { p: c.p, h: hist };
    }
    for (const m of D.council) S.council.att[m.id] = m.att;
    for (const p of D.people) S.people[p.id] = { trust: p.trust, busy: null, last: -999, brief: 0 };
    for (const s of D.sats) if (!s.extra) S.infra.sats.push({ id: s.id, focus: s.focus });
    for (const s of D.ships) S.infra.ships.push({ id: s.id, task: null });
    for (const d of D.dcs) S.infra.dcs.push({ id: d.id, lvl: d.lvl, oc: false, up: null });
    for (const n of D.nodes) S.integ.nodes[n.id] = { up: true, integ: n.hidden ? 100 : U.ri(96, 100), lat: U.ri(8, 60), iso: 0 };
    S.timers = { event: 40, news: 8, dsp: 25, council: 70, internal: 260, anomaly: 140, msgCheck: 0, cycle: 180 };
    return S;
  };

  KY.save = function () {
    const S = KY.S;
    if (!S || !S.user.sworn) return false;
    S.meta.saved = Date.now();
    S.meta.lastSeen = Date.now();
    return U.store.set(SAVE_KEY, JSON.stringify(S));
  };
  KY.load = function () {
    const raw = U.store.get(SAVE_KEY);
    if (!raw) return null;
    try {
      const S = JSON.parse(raw);
      if (!S || S.v !== 3) return null;
      return S;
    } catch (e) { return null; }
  };
  KY.wipe = function () { U.store.del(SAVE_KEY); };
  KY.exportState = () => JSON.stringify(KY.S);
  KY.importState = function (txt) {
    const S = JSON.parse(txt);
    if (!S || S.v !== 3 || !S.regions) throw new Error('Kein gültiger KYTHERA-Sitzungsstand.');
    U.store.set(SAVE_KEY, JSON.stringify(S));
    return true;
  };

  /* ---------- Protokoll ---------- */
  KY.CATS = {
    sys: 'System', vor: 'Vorhaben', kap: 'Kapital', kur: 'Kuratorium', net: 'Netzwerk', for: 'Forschung',
    orb: 'Flotte & Orbit', dsp: 'Depeschen', arc: 'Archiv', kri: 'Krise', int: 'Integrität', py: 'PYTHIA', welt: 'Weltlage', msg: 'Kommunikation',
  };
  KY.log = function (cat, text, extra) {
    const S = KY.S;
    const e = { ts: Date.now(), t: S.t, cat, text };
    if (extra) e.x = extra;
    S.log.push(e);
    if (S.log.length > 600) S.log.splice(0, S.log.length - 600);
    KY.bus.emit('log', e);
    return e;
  };

  /* ---------- Benachrichtigungen ---------- */
  KY.silent = false;
  KY.notify = function (o) {
    const S = KY.S;
    const n = { id: U.uid('n'), ts: Date.now(), cat: o.cat || 'sys', lvl: o.lvl || 'info', title: o.title, text: o.text || '', link: o.link || null, read: false };
    S.notifs.unshift(n);
    if (S.notifs.length > 80) S.notifs.length = 80;
    if (!KY.silent) {
      KY.bus.emit('notify', n);
      if (KY.audio) KY.audio.play(n.lvl === 'crit' ? 'alert' : n.lvl === 'ok' ? 'ok' : 'note');
    }
    KY.bus.emit('notifs');
    return n;
  };

  /* ---------- Ressourcen ---------- */
  KY.canPay = function (c) {
    const r = KY.S.res;
    return (!c.kap || r.kap >= c.kap - 1e-9) && (!c.ein || r.ein >= c.ein - 1e-9) && (!c.rech || r.rech >= c.rech - 1e-9);
  };
  KY.pay = function (c) {
    if (!KY.canPay(c)) return false;
    const r = KY.S.res;
    if (c.kap) r.kap -= c.kap;
    if (c.ein) r.ein -= c.ein;
    if (c.rech) r.rech -= c.rech;
    KY.bus.emit('res');
    return true;
  };
  KY.missing = function (c) {
    const r = KY.S.res, out = [];
    if (c.kap && r.kap < c.kap) out.push('Kapital');
    if (c.ein && r.ein < c.ein) out.push('Einfluss');
    if (c.rech && r.rech < c.rech) out.push('Rechenkontingent');
    return out;
  };
  KY.costText = function (c) {
    const p = [];
    if (c.kap) p.push(U.money(c.kap));
    if (c.ein) p.push(U.n(c.ein) + ' Einfluss');
    if (c.rech) p.push(U.n(c.rech) + ' EF Rechenzeit');
    return p.length ? p.join(' · ') : 'kostenfrei';
  };
  KY.adj = function (key, d) {
    const r = KY.S.res;
    r[key] += d;
    if (key === 'disk' || key === 'ans') r[key] = U.clamp(r[key], 0, 100);
    if (key === 'ein') r.ein = Math.max(0, r.ein);
    KY.bus.emit('res');
  };
  KY.regAdj = function (rid, fx, mult) {
    const R = KY.S.regions[rid];
    if (!R) return;
    mult = mult === undefined ? 1 : mult;
    for (const k in fx) {
      if (R.m[k] === undefined) continue;
      R.m[k] = U.clamp(R.m[k] + fx[k] * mult, 0, 100);
    }
    KY.bus.emit('regions');
  };
  KY.seatAdj = function (seat, d) {
    const A = KY.S.council.att;
    if (A[seat] === undefined) return;
    A[seat] = U.clamp(A[seat] + d, -100, 100);
    KY.bus.emit('council');
  };
  KY.trustAdj = function (pid, d) {
    const P = KY.S.people[pid];
    if (!P) return;
    P.trust = U.clamp(P.trust + d, 0, 100);
    KY.bus.emit('people');
  };

  /* ---------- Zeitlich begrenzte Effekte ---------- */
  KY.addBuff = function (b) {
    b.until = KY.S.t + (b.ttl || 300);
    b.id = U.uid('b');
    KY.S.buffs.push(b);
    KY.bus.emit('buffs');
    return b;
  };
  KY.buffs = function (kind) { return KY.S.buffs.filter(b => b.kind === kind && b.until > KY.S.t); };
  KY.hasRes = id => !!KY.S.research.done[id];
  KY.flag = function (f, v) {
    if (v === undefined) return KY.S.story.flags[f];
    KY.S.story.flags[f] = v;
    KY.bus.emit('story', f);
    return v;
  };

  /* ---------- Einweisung ---------- */
  KY.ONB = [
    { id: 'atlas', t: 'Lagebild verstehen', d: 'Öffnen Sie den Atlas und wählen Sie eine Region aus.' },
    { id: 'projekt', t: 'Erstes Vorhaben genehmigen', d: 'Planen und genehmigen Sie unter „Vorhaben“ ein Projekt.' },
    { id: 'pythia', t: 'PYTHIA befragen', d: 'Stellen Sie dem Analysesystem eine Frage.' },
    { id: 'handel', t: 'Kapital bewegen', d: 'Kaufen oder verkaufen Sie eine Beteiligung.' },
    { id: 'stimme', t: 'Im Plenum abstimmen', d: 'Geben Sie im Kuratorium Ihre Stimme zu einer Vorlage ab.' },
    { id: 'depesche', t: 'Eine Depesche entschlüsseln', d: 'Entschlüsseln Sie eine interne Meldung.' },
    { id: 'post', t: 'Post des Sekretariats lesen', d: 'Lesen Sie Ihre Nachrichten unter „Kommunikation“.' },
  ];
  KY.onb = function (id) {
    const S = KY.S;
    if (!S || S.onb.tasks[id]) return;
    S.onb.tasks[id] = Date.now();
    KY.bus.emit('onb');
    if (!S.onb.done && KY.ONB.every(t => S.onb.tasks[t.id])) {
      S.onb.done = true;
      KY.adj('ein', 30);
      if (KY.story) KY.story.send('SEK_EINW');
      KY.notify({ cat: 'sys', lvl: 'ok', title: 'Einweisung abgeschlossen', text: '+30 Einfluss', link: { mod: 'komm' } });
    }
  };
})();

/* KYTHERA · Akustische Signale (synthetisch, ohne Audiodateien) */
(function () {
  'use strict';
  const KY = window.KY;
  let ctx = null, master = null, last = {};

  function init() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.45;
      master.connect(ctx.destination);
    } catch (e) { ctx = null; }
    return ctx;
  }
  function tone(f, t0, dur, type, vol, f2) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(t0, dur, vol, hp) {
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 2000;
    const g = ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0);
  }

  const SOUNDS = {
    click(t) { tone(2400, t, 0.03, 'sine', 0.05); },
    key(t) { noise(t, 0.02, 0.05, 3500); },
    nav(t) { tone(1320, t, 0.05, 'sine', 0.05); tone(1760, t + 0.03, 0.05, 'sine', 0.04); },
    note(t) { tone(880, t, 0.12, 'sine', 0.07); tone(1320, t + 0.09, 0.16, 'sine', 0.06); },
    ok(t) { tone(660, t, 0.12, 'triangle', 0.07); tone(990, t + 0.08, 0.14, 'triangle', 0.07); tone(1320, t + 0.16, 0.22, 'triangle', 0.06); },
    err(t) { tone(220, t, 0.16, 'square', 0.04); tone(180, t + 0.12, 0.2, 'square', 0.04); },
    alert(t) { for (let i = 0; i < 3; i++) { tone(988, t + i * 0.22, 0.12, 'square', 0.035); tone(740, t + i * 0.22 + 0.11, 0.1, 'square', 0.03); } },
    vote(t) { tone(523, t, 0.25, 'sine', 0.06); tone(784, t + 0.05, 0.3, 'sine', 0.04); },
    gavel(t) { noise(t, 0.08, 0.2, 400); tone(140, t, 0.2, 'sine', 0.12, 80); },
    boot(t) { tone(55, t, 1.6, 'sine', 0.12, 110); tone(220, t + 0.4, 1.2, 'sine', 0.03, 440); },
    scan(t) { tone(400, t, 0.9, 'sawtooth', 0.015, 1600); },
    grant(t) { tone(392, t, 0.4, 'sine', 0.07); tone(523, t + 0.12, 0.4, 'sine', 0.06); tone(784, t + 0.26, 0.7, 'sine', 0.06); },
    deny(t) { tone(160, t, 0.35, 'sawtooth', 0.05); },
    glitch(t) { for (let i = 0; i < 6; i++) tone(200 + Math.random() * 2000, t + i * 0.04, 0.04, 'square', 0.03); noise(t, 0.3, 0.06, 800); },
    deep(t) { tone(41, t, 3.2, 'sine', 0.18, 38); tone(82, t + 0.2, 2.8, 'triangle', 0.04, 80); },
    type(t) { tone(1900 + Math.random() * 300, t, 0.015, 'square', 0.012); },
  };

  KY.audio = {
    unlock() { if (init() && ctx.state === 'suspended') ctx.resume(); },
    play(name) {
      const S = KY.S;
      if (S && !S.user.prefs.sound) return;
      if (!init() || !SOUNDS[name]) return;
      const now = ctx.currentTime;
      if (last[name] && now - last[name] < 0.06) return;
      last[name] = now;
      if (S) master.gain.value = S.user.prefs.vol;
      try { SOUNDS[name](now + 0.01); } catch (e) { /* stumm */ }
    },
  };
})();
